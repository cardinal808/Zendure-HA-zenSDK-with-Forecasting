                show:
                  in_header: false
            grid_options:
              columns: full
          - type: heading
            icon: ''
            heading: Besparing per maand
            heading_style: title
          - type: custom:apexcharts-card
            graph_span: 12month
            span:
              start: month
              offset: -11month
            cache: false
            header:
              show: false
            apex_config:
              chart:
                height: 160px
              legend:
                show: false
              tooltip:
                x:
                  format: MM-yyyy
                  show: true
                'y':
                  formatter: |
                    EVAL: (val) => val === null ? '-' : `€ ${val.toFixed(2)}`
              grid:
                show: true
                borderColor: color-mix(in srgb, var(--divider-color) 50%, transparent)
                strokeDashArray: 0
                padding:
                  top: -10
