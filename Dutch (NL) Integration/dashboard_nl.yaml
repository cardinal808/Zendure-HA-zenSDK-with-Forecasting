      - type: grid
        visibility:
          - condition: state
            entity: input_number.besparing_vast_leveringsprijs
            state_not: unavailable
        cards:
          - type: tile
            entity: sensor.zendure_accu_terugverdientijd
            name: Accu terugverdientijd
            icon: mdi:cash-clock
            color: green
            vertical: false
            grid_options:
              columns: full
          - type: markdown
            title: Terugverdienen
            text_only: false
            content: |
              {%- set s = 'sensor.zendure_accu_terugverdientijd' -%}
              {%- set prijs = states('input_number.besparing_accu_aanschafprijs') | float(0) -%}
              {%- macro eur(x, d=2) -%}{%- set x = x | float(0) -%}{{ ('-' if x < 0 else '') ~ '€ ' ~ (('%.' ~ d ~ 'f') | format(x | abs)) | replace('.', ',') }}{%- endmacro -%}
              {%- set terug = state_attr(s, 'terugverdiend') | float(0) -%}
              {%- set pct = [[state_attr(s, 'terugverdiend_pct') | float(0), 0] | max, 100] | min -%}
              {%- set n = (pct / 5) | round(0) | int -%}
              {% if prijs <= 0 -%}
              Vul de aanschafprijs van de accu in onder Forecasting Configuratie (Besparing).
              {%- else -%}
              {% if has_value(s) %}**{{ states(s) | replace('.', ',') }} jaar** in totaal{% if state_attr(s, 'nog_te_gaan') | float(0) > 0 %}, nog **{{ state_attr(s, 'nog_jaren') | string | replace('.', ',') }} jaar** (rond {{ state_attr(s, 'terugverdiend_rond') }}){% else %}, **terugverdiend**{% endif %}{% else %}Nog te weinig gegevens: na een volle dag meten volgt de eerste schatting.{% endif %}

              <font color="#01a180">{{ '█' * n }}</font><font color="#5a5a5c">{{ '█' * (20 - n) }}</font> {{ pct | round(1) | string | replace('.', ',') }}%

              | | |
              |:---|---:|
              | <ha-icon icon="mdi:cash"></ha-icon>Aanschafprijs | {{ eur(prijs, 0) }} |
              | <ha-icon icon="mdi:cash-check"></ha-icon>Terugverdiend | {% if terug < 0 %}<font color="#c53b2c">{{ eur(terug) }}</font>{% else %}<font color="#01a180">{{ eur(terug) }}</font>{% endif %} |
              | <ha-icon icon="mdi:cash-clock"></ha-icon>Nog te gaan | {{ eur(state_attr(s, 'nog_te_gaan') if state_attr(s, 'nog_te_gaan') is not none else prijs - terug) }} |
              {% if has_value(s) %}| <ha-icon icon="mdi:calendar-sync"></ha-icon>Besparing door de accu per jaar | {{ eur(state_attr(s, 'besparing_per_jaar'), 0) }} |
              {% endif %}
              {% if (state_attr(s, 'gemeten_dagen') | float(0)) < 365 %}
              <small>Indicatie op basis van {{ state_attr(s, 'gemeten_dagen') | float(0) | round(0) | int }} dag(en) meting. Zomer en winter verschillen sterk (in de winter minder zon, maar vaak meer prijsverschil); na een jaar meten is de schatting het betrouwbaarst. Tarieven en accuprijs: tab Configuratie, blok Forecasting Configuratie (Besparing).</small>
              {%- endif %}
              {%- endif %}
            grid_options:
              columns: full
            card_mod:
              style:
                ha-markdown$: |
                  table { width: 100%; border-collapse: collapse; table-layout: fixed; margin: 2px 0 6px; }
                  th, td { border: none !important; padding: 6px 6px !important; }
                  th { font-size: 0.72em; font-weight: 500; text-transform: uppercase; letter-spacing: .02em; color: var(--secondary-text-color); border-bottom: 1px solid var(--divider-color) !important; }
                  td { border-bottom: 1px solid color-mix(in srgb, var(--divider-color) 45%, transparent) !important; }
                  tr:last-child td { border-bottom: none !important; }
                  th:not(:first-child), td:not(:first-child) { text-align: right !important; white-space: nowrap; font-variant-numeric: tabular-nums; }
                  th:first-child, td:first-child { width: 60%; }
                  ha-icon { --mdc-icon-size: 18px; color: var(--secondary-text-color); margin-right: 6px; vertical-align: -3px; }
                  small { color: var(--secondary-text-color); }
                  thead { display: none; }
    cards: []
  - type: sections
    max_columns: 4
