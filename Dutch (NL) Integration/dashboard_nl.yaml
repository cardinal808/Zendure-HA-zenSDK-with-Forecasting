                labels:
                  show: false
                axisTicks:
                  show: false
                axisBorder:
                  color: color-mix(in srgb, var(--divider-color) 50%, transparent)
              yaxis:
                - decimalsInFloat: 0
                  labels:
                    style:
                      colors: >-
                        color-mix(in srgb, var(--primary-text-color) 75%,
                        transparent)
            series:
              - entity: sensor.zendure_besparing
                name: Bespaard
                type: column
                color: '#01a180'
                float_precision: 2
                statistics:
                  type: change
                  period: month
                  align: start
                show:
                  in_header: false
            grid_options:
              columns: full
          - type: markdown
            content: >-
              <ha-alert alert-type="info">Helptekst</ha-alert>De grafieken komen uit
