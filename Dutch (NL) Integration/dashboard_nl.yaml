          - type: markdown
            content: >-
              <ha-alert alert-type="info">Helptekst</ha-alert>Is de
              terugleverprijs negatief, dan levert de installatie niet terug.
              Terugleverprijs = marktprijs + bonus % (alleen bij een positieve
              marktprijs) + opslag teruglevering, met de waarden uit
              **Forecasting Configuratie (Besparing)**.


              **Zendure Pro:** staat **Zendure Pro PV-export uitschakelen** aan,
              dan gaat PV Export Uitgeschakeld automatisch aan en daarna weer uit.
              Hij gaat vanzelf aan als je Niet terugleveren aanzet. Zet hem uit als je
              Zendure geen zonnepanelen heeft of als je alleen externe omvormers
              wilt begrenzen. Laden uit zon en ontladen naar het huis blijven werken.


              **Externe omvormer (optioneel):** kies het **type begrenzing** en
              vul de limiter-entiteit in.

              - *Productielimiet* (SolarEdge, OpenDTU/Hoymiles, APsystems,
              Fronius Modbus): een number.* zoals
              number.solaredge_modbus_active_power_limit. De module regelt op de
              P1-meter, zodat de omvormer het huis blijft voeden maar niet
              teruglevert. Vul ook de **vermogenssensor** in (W, bij voorkeur
              AC, bv. sensor.solaredge_modbus_ac_power); zonder sensor regelt hij
              in stappen van 5%.

              - *Exportlimiet* (GoodWe, Growatt): een number.* met de
              exportlimiet. Die gaat op 0; de omvormer regelt zelf op zijn eigen
              meter.

              - Een **switch.*** (bv. Enphase Production) gaat uit en daarna weer
              aan. Een **script.*** (bv. voor Huawei of Sofar) wordt gestart met
              de variabele blokkeren: true of false; een voorbeeld staat
              bovenin zendure_negatieve_prijs.yaml.


              De productielimiet knijpt pas als de Zendure het overschot niet
              kan opnemen (accu vol of laden op maximaal vermogen) en laat een
              kleine export staan (25 W, tijdens laden 50 W onder de oplaadmarge)
              om pendelen rond 0 W te voorkomen. De andere typen grijpen pas in
              als de accu vol is en heffen pas op als de prijs weer positief is.
              Na afloop zet hij alles terug zoals het was.


              **Twee omvormers:** kies als **primair** de omvormer met een
              productielimiet (bv. SolarEdge); die regelt op de P1-meter. De
              **secundaire** gaat helemaal naar 0 (number op 0, switch uit of
              script met blokkeren: true) zodra de Zendure het overschot niet
              kan opnemen, en gaat terug als de prijs weer positief is. Dat de
              zon van de secundaire dan niet gebruikt wordt kost niets: bij een
              negatieve prijs is stroom uit het net gratis of levert zelfs geld
              op.
