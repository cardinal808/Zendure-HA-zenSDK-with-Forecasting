              - type: conditional
                conditions:
                  - entity: input_select.negatieve_prijs_omvormer_aantal
                    state_not: '0'
                  - entity: input_select.negatieve_prijs_omvormer_type
                    state: Productielimiet (SolarEdge, Hoymiles, APsystems, Fronius)
                row:
                  entity: input_text.negatieve_prijs_omvormer_vermogen_sensor
                  name: Vermogenssensor externe omvormer (W)
              - type: conditional
                conditions:
                  - entity: input_select.negatieve_prijs_omvormer_aantal
                    state: '2'
                row:
                  type: section
                  label: Secundaire omvormer (gaat uit)
              - type: conditional
                conditions:
                  - entity: input_select.negatieve_prijs_omvormer_aantal
                    state: '2'
                row:
                  entity: input_text.negatieve_prijs_omvormer_limiet_secundair
                  name: Omvormer limiter entiteit (number.*, switch.* of script.*)
            visibility:
              - condition: state
                entity: input_boolean.negatieve_prijs_export_blokkeren
                state_not: unavailable
              - condition: state
                entity: input_boolean.pv_tonen_op_dashboard
                state: 'on'
          - type: heading
            icon: ''
            heading: Forecasting Configuratie (Besparing)
            heading_style: title
            visibility:
              - condition: state
                entity: input_number.besparing_vast_leveringsprijs
                state_not: unavailable
              - condition: state
                entity: input_boolean.forecast_tonen_op_dashboard
                state: 'on'
          - type: markdown
            content: >-
              <ha-alert alert-type="info">Helptekst</ha-alert>Vul de
              all-in prijzen per kWh in (inclusief energiebelasting en btw).
              **Vast tarief levering** en **teruglevering** komen van je
              vaste of variabele contract; bij volledige saldering is
              teruglevering gelijk aan levering. Bij dynamisch wordt de prijs
              uit de Nordpool-sensor gebruikt plus de **opslag**: is je sensor
              al all-in, laat de opslag levering op 0 staan. Teruglevering
              dynamisch = marktprijs + **bonus %** over de marktprijs (alleen
              als die positief is) + **opslag teruglevering** per kWh. Houdt de
              leverancier iets in, maak de opslag dan negatief. Met de knop
              begint alleen het totaal opnieuw.


              **Accu aanschafprijs**: wat de accu (met omvormer en installatie)
              kostte. **Accu al terugverdiend**: wat de accu opbracht vóórdat
              deze meting begon (optioneel). De terugverdientijd gebruikt de
              besparing door accu en slim laden bij een dynamisch contract.
            text_only: true
            visibility:
              - condition: state
                entity: input_number.besparing_vast_leveringsprijs
                state_not: unavailable
              - condition: state
                entity: input_boolean.help_tonen_op_dashboard
