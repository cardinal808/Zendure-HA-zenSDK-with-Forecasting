              states('input_select.zendure_2400_ac_modus_selecteren') !=
              'Dynamisch NOM + Forecasting' %} <ha-alert alert-type="info">Modus
              **Dynamisch NOM + Forecasting** is niet actief. Onderstaand plan
              is een simulatie.</ha-alert> {% endif %} {% if
              a.zon_resterend_vandaag_sensor_ok == false or
              a.zon_morgen_sensor_ok == false %} <ha-alert
              alert-type="warning">Een zon-forecast sensor is niet ingevuld of
              niet beschikbaar. Die zon wordt als 0 kWh gerekend (er wordt dan
              meer uit het net gepland).</ha-alert> {% endif %} **Status:** {{
              states(p) }}  

              **Scenario:** {{ a.scenario }}


              **Plan:** {{ a.plan_uitleg }}


              ### Vandaag

              - Batterij nu: **{{ a.batterij_nu_kwh }}** van {{
              a.batterij_max_kwh }} kWh bruikbaar

              - Overbruggen tot **{{ a.overbruggen_tot }}** ({{
              a.overbruggen_uren }} uur)

              - Verwacht batterijgebruik: **{{ a.verwacht_batterijgebruik_kwh }}
              kWh**

              - Verwachte zon naar batterij: **{{
              a.verwachte_zon_naar_batterij_kwh }} kWh** (zon nog te verwachten:
              {{ a.zon_resterend_vandaag_kwh }} kWh, {{ a.zelfverbruik_pct }}%
              direct verbruikt)

              - Laadvermogen in planning: {{ a.laadvermogen_gebruikt_kw }} kW{% if a.laadvermogen_gemeten_w %} (gemeten {{ (a.laadvermogen_gemeten_w / 1000) | round(2) }} kW){% endif %}, prijs nu {{ a.prijs_nu }}{% if a.in_dal %} (goedkoop dal){% endif %}

              - **Nog uit het net laden: {{ a.netladen_vandaag_kwh }} kWh**{% if
              a.geplande_slots | length > 0 %} in {% for s in a.geplande_slots
              %}{{ s.start }}-{{ s.eind }} (€{{ '%.3f' | format(s.prijs) }}){{
              ', ' if not loop.last }}{% endfor %}, geschatte kosten €{{ '%.2f'
              | format(a.geschatte_kosten) }}{% elif a.netladen_vandaag_kwh |
              float(0) >= 0.3 %} (laden loont nu niet, zie Plan){% endif %}

              {% if a.padcheck_gat_uren | float(0) > 0 %}{% set vd = now().strftime('%Y-%m-%d') %}- Pad-check: accu leeg rond **{{ ('morgen ' if (a.padcheck_accu_leeg_om or '')[:10] != vd else '') ~ (a.padcheck_accu_leeg_om or '')[11:] }}**, gat tot **{{ ('morgen ' if (a.padcheck_gat_eind or '')[:10] != vd else '') ~ (a.padcheck_gat_eind or '')[11:] }}** (zon dekt het verbruik vanaf {{ ('morgen ' if (a.padcheck_zon_dekt_vanaf or '')[:10] != vd else '') ~ (a.padcheck_zon_dekt_vanaf or '')[11:] }}, {{ a.padcheck_zon_bron }}). Gat {{ a.padcheck_gat_uren }} uur, {{ a.padcheck_tekort_kwh }} kWh inkoop, waarvan {{ a.padcheck_tekort_dure_slots_kwh }} kWh in dure slots{% if a.padcheck_gat_prijs | float(0) > 0 %} (gemiddeld €{{ '%.3f' | format(a.padcheck_gat_prijs | float(0)) }}){% endif %}{% if a.padcheck_extra_slots | int(0) > 0 %}: {{ a.padcheck_extra_slots }} extra laadslot(s) gepland{% endif %}{% endif %}


              ### Morgen

              - Prijzen morgen bekend: {{ 'ja' if a.morgen_prijzen_bekend else
              'nee (patroon van vandaag aangehouden)' }}

              - Goedkoopste laadmoment start om {{ a.morgen_goedkoopste_start
              }}, prijsverschil t.o.v. vandaag {{ a.spread_morgen_pct }}%

              - Zon morgen: {{ a.zon_morgen_kwh }} kWh, direct verbruikt {{
