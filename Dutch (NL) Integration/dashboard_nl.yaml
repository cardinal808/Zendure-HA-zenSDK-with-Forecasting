                  - 'y': 55
                    borderColor: var(--accent-color)
                    strokeDashArray: 4
                    borderWidth: 2
              yaxis:
                - decimalsInFloat: 0
                  min: 0
                  max: 80
                  tickAmount: 4
                  labels:
                    show: true
                    style:
                      colors: >-
                        color-mix(in srgb, var(--primary-text-color) 75%,
                        transparent)
              tooltip:
                x:
