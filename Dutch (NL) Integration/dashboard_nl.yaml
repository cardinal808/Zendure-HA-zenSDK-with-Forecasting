                    entity_id: input_button.forecast_herberekenen
                  data: {}
                color: '#01a180'
                text: Herberekenen
          - type: markdown
            content: |-
              {% set p = 'sensor.zendure_forecast_plan' %}{% set a = states[p].attributes %}{% if states('input_select.zendure_2400_ac_modus_selecteren') != 'Dynamisch NOM + Forecasting' %}<ha-alert alert-type="info">Modus **Dynamisch NOM + Forecasting** is niet actief. Onderstaand plan is een simulatie.</ha-alert>{% endif %}{% if a.zon_resterend_vandaag_sensor_ok == false or a.zon_morgen_sensor_ok == false %}<ha-alert alert-type="warning">Een zon-forecast sensor is niet ingevuld of niet beschikbaar. Die zon wordt als 0 kWh gerekend (er wordt dan meer uit het net gepland).</ha-alert>{% endif %}
              **Status:** {{ states(p) }}

              **Scenario:** {{ a.scenario }}

              **Plan:** {{ a.plan_uitleg }}

              ### Vandaag

              - Batterij nu: **{{ a.batterij_nu_kwh }}** van {{ a.batterij_max_kwh }} kWh bruikbaar
              {% set lb = a.laadblokken | default([]) %}{% set vd = now().strftime('%Y-%m-%d') %}- Plan van vandaag loopt tot **{{ ('morgen ' if (a.overbruggen_tot or '')[:10] != vd else '') ~ (a.overbruggen_tot or '')[11:] }}** ({{ a.overbruggen_uren }} uur), het begin van de goedkope uren van morgen; daarna plant hij opnieuw met de prijzen van morgen
              {% set lb = a.laadblokken | default([]) %}- Verwacht verbruik tot einde overbrugging (na directe zon): **{{ '%.1f' | format(a.verwacht_batterijgebruik_kwh | float(0)) }} kWh**, gedekt door de accu{% if lb | length > 0 %} en het geplande laden{% endif %}{% if a.padcheck_dal_blokkade %} (buiten de goedkope dalen){% endif %}, de rest direct uit het net
              - Verwachte zon naar batterij: **{{ a.verwachte_zon_naar_batterij_kwh }} kWh** (zon nog te verwachten: {{ a.zon_resterend_vandaag_kwh }} kWh, {{ a.zelfverbruik_pct }}% direct verbruikt){% if a.get('ev_overdag_van_zon_kwh', 0) | float(0) > 0 %}; de auto laadt overdag nog {{ '%.1f' | format(a.get('ev_overdag_van_zon_kwh', 0) | float(0)) }} kWh, die gaat eerst van het zon-overschot af{% endif %}
              - Prijs nu: €{{ '%.3f' | format(a.prijs_nu | float(0)) }}{% if a.slim_vasthouden %}: de accu wordt bewaard voor de duurste kwartieren (€{{ '%.3f' | format(a.vasthouden_grensprijs | float(0)) }} en hoger), want hij houdt het niet vol tot het einde van de overbrugging; tot dan koopt het huis direct in{% elif a.in_dal %}, goedkoop dal{% if a.ontladen_vasthouden %}: de accu wordt nu gespaard en het huis koopt direct in, omdat dat goedkoper is dan stroom uit de accu{% endif %}{% endif %}
              {% set lb = a.laadblokken | default([]) %}- **Uit het net laden: {% if lb | length > 0 %}{{ '%.1f' | format(a.gepland_netladen_kwh | float(0)) }} kWh gepland met {{ a.laadvermogen_gebruikt_kw }} kW, geschatte kosten €{{ '%.2f' | format(a.geschatte_kosten) }}**{% else %}niets gepland**{% endif %}{% set rest = (a.netladen_vandaag_kwh | float(0)) - (a.gepland_netladen_kwh | float(0)) %}{% if rest >= 0.3 %} (energiebalans {{ '%.1f' | format(a.netladen_vandaag_kwh | float(0)) }} kWh; de rest wordt niet opgeslagen, want direct uit het net kopen is dan na laad- en ontlaadverlies goedkoper){% endif %}
              {% if a.padcheck_gat_uren | float(0) > 0 %}{% set vd = now().strftime('%Y-%m-%d') %}- Pad-check: accu leeg rond **{{ ('morgen ' if (a.padcheck_accu_leeg_om or '')[:10] != vd else '') ~ (a.padcheck_accu_leeg_om or '')[11:] }}**{% if a.padcheck_dal_blokkade %} (accu levert niet in goedkope dalen){% endif %}, bekeken tot **{{ ('morgen ' if (a.padcheck_gat_eind or '')[:10] != vd else '') ~ (a.padcheck_gat_eind or '')[11:] }}** {% if (a.padcheck_zon_bron or '') is search('niet meer|Geen') %}(zon dekt het verbruik niet vóór het einde van de overbrugging){% else %}(zon dekt het verbruik vanaf {{ ('morgen ' if (a.padcheck_zon_dekt_vanaf or '')[:10] != vd else '') ~ (a.padcheck_zon_dekt_vanaf or '')[11:] }}, {{ a.padcheck_zon_bron }}){% endif %}. {{ a.padcheck_gat_uren }} uur, {{ a.padcheck_tekort_kwh }} kWh inkoop, waarvan {{ a.padcheck_tekort_dure_slots_kwh }} kWh in dure slots{% if a.padcheck_gat_prijs | float(0) > 0 %} (gemiddeld €{{ '%.3f' | format(a.padcheck_gat_prijs | float(0)) }}){% endif %}{% if a.padcheck_extra_slots | int(0) > 0 %}: {{ a.padcheck_extra_slots }} laadslot(s) daarvoor gepland{% endif %}{% endif %}
              {% for b in lb %}- Laden {{ b.dag }} {{ b.start }}–{{ b.eind }}: {{ b.minuten }} minuten, ongeveer {{ '%.1f' | format(b.kwh) }} kWh, gemiddeld €{{ '%.3f' | format(b.prijs) }}
              {% endfor %}

              ### Morgen

              - Prijzen morgen bekend: {{ 'ja' if a.morgen_prijzen_bekend else 'nee (patroon van vandaag aangehouden)' }}
              - Goedkoopste uren morgen t.o.v. vandaag: {{ a.spread_morgen_pct }}% (bepaalt scenario A of B)
              - Zon morgen: {{ a.zon_morgen_kwh }} kWh, waarvan {{ a.morgen_zon_direct_kwh }} kWh direct verbruikt{% if a.morgen_zon_naar_batterij_kwh | float(0) > 0 %} en {{ a.morgen_zon_naar_batterij_kwh }} kWh naar de accu{% endif %}
              - Verwacht verbruik morgen (na directe zon): **{{ '%.1f' | format(a.morgen_batterijgebruik_kwh | float(0)) }} kWh**. Daarvan komt ongeveer **{{ '%.1f' | format(a.morgen_uit_accu_kwh | float(0)) }} kWh uit de accu**, in de dure kwartieren. De rest, {{ '%.1f' | format(a.morgen_direct_net_kwh | float(0)) }} kWh, koopt het huis direct uit het net, omdat dat in die uren goedkoper is dan eerst opslaan
              {% set mb = a.morgen_laadmomenten | default([]) %}- Indicatie netladen morgen: **{% if mb | length > 0 %}{{ '%.1f' | format(a.morgen_netladen_indicatie_kwh | float(0)) }} kWh**, voor de dure kwartieren, zonder laadmarge. Na middernacht wordt dit definitief gepland, met de marge van {{ '%.1f' | format(a.marge_kwh | float(0)) }} kWh erbij als er genoeg goedkope kwartieren zijn{% else %}niets**, laden loont naar verwachting niet{% endif %}
              {% for b in mb %}- Laden morgen {{ b.start }}–{{ b.eind }}: {{ b.minuten | default('-') }} minuten, ongeveer {{ '%.1f' | format(b.kwh | default(0)) }} kWh, gemiddeld €{{ '%.3f' | format(b.prijs) }}
              {% endfor %}
            text_only: true
          - type: markdown
            title: Verzamelde gegevens (afgelopen 7 dagen)
            content: >-
              {%- set a = states['sensor.zendure_forecast_plan'].attributes -%}
              {%- set prod = states('sensor.forecast_zon_productie_7_dagen') | float(0) -%}
              {%- set exp_zon = states('sensor.forecast_p1_export_uit_zon_7_dagen') | float(0) -%}
              {%- set laden_zon = states('sensor.forecast_zendure_laden_uit_zon_7_dagen') | float(0) -%}
              {%- set direct = [prod - exp_zon - laden_zon, 0] | max -%}
              - Historie beschikbaar: **{{ a.historie_dagen }}** van 7 dagen

              - Zonproductie: **{{ prod | round(1) }} kWh**, waarvan direct verbruikt **{{ direct | round(1) }} kWh** ({{ ((direct / prod * 100) | round(1)) if prod > 0 else '-' }}%), naar de accu **{{ laden_zon | round(1) }} kWh**, teruggeleverd **{{ exp_zon | round(1) }} kWh**

              - Net: import {{ states('sensor.forecast_p1_import_7_dagen') | float(0) | round(1) }} kWh, export {{ states('sensor.forecast_p1_export_7_dagen') | float(0) | round(1) }} kWh ({{ state_attr('sensor.forecast_teller_p1_import', 'bron') or 'bron onbekend' }})

              - Accu: geladen {{ states('sensor.forecast_zendure_laden_7_dagen') | float(0) | round(1) }} kWh, ontladen {{ states('sensor.forecast_zendure_ontladen_7_dagen') | float(0) | round(1) }} kWh

              - Gemiddeld gebruik: **{{ a.gebruik_dag_kwh }} kWh per dag** ({{ a.gebruik_bron }})

              - Direct zonverbruik: **{{ a.direct_verbruik_dag_kwh if a.direct_verbruik_dag_kwh is not none else '-' }} kWh per dag**; toegepast zelfverbruik vandaag {{ a.zelfverbruik_vandaag_pct }}%, morgen {{ a.zelfverbruik_morgen_pct }}% ({{ a.zelfverbruik_bron }})

              - Rendement: laden {{ a.efficientie_laden_pct }}%, ontladen {{ a.efficientie_ontladen_pct }}%, samen {{ a.rendement_round_trip_pct }}% ({{ a.rendement_bron }})

              - Verbruik per uur: **{{ a.verbruik_per_uur_bron }}**, komende 24 uur {{ a.verbruik_komende_24u_kwh }} kWh. Profiel geleerd: {{ states('sensor.forecast_verbruiksprofiel') }} van 48 uren (werkdag + weekend){% if state_attr('sensor.forecast_verbruiksprofiel', 'laatste_uur') %}, laatste meting {{ state_attr('sensor.forecast_verbruiksprofiel', 'laatste_uur') }}: {{ state_attr('sensor.forecast_verbruiksprofiel', 'laatste_uur_kwh') }} kWh{% endif %}

              - Verbruik per kwartier: **{{ a.verbruik_per_kwartier_bron }}**{% if state_attr('sensor.forecast_verbruiksprofiel', 'laatste_kwartier_kwh') is not none %}, laatste kwartier {{ state_attr('sensor.forecast_verbruiksprofiel', 'laatste_kwartier_kwh') }} kWh{% endif %}
            text_only: false
        visibility:
          - condition: state
            entity: input_boolean.forecast_tonen_op_dashboard
            state: 'on'
      - column_span: 2
        cards: []
        visibility:
          - condition: state
            entity: input_boolean.forecast_tonen_op_dashboard
            state: 'on'
    cards: []
    icon: mdi:battery
    dense_section_placement: false
  - type: sections
    max_columns: 3
    title: Besparing
    path: besparing
    icon: mdi:currency-eur
    sections:
      - type: grid
        column_span: 3
        visibility:
          - condition: state
            entity: input_number.besparing_vast_leveringsprijs
            state: unavailable
        cards:
          - type: markdown
            text_only: true
            content: >-
              <ha-alert alert-type="info">Het pakket <b>zendure_besparing.yaml</b> is niet geladen.</ha-alert>Zet het bestand in je map <code>packages</code> en herstart Home Assistant om de besparing en de terugverdientijd van de accu te zien.
            grid_options:
              columns: full
      - type: grid
        visibility:
          - condition: state
            entity: input_number.besparing_vast_leveringsprijs
            state_not: unavailable
        column_span: 3
        cards:
          - type: markdown
            content: >-
              <ha-alert alert-type="info">Dit tabblad is <b>work-in-progress</b>, verwacht verbeteringen in de volgende release.</ha-alert>
            text_only: true
            grid_options:
              columns: full
          - type: heading
            icon: ''
            heading: Besparing
            heading_style: title
          - type: grid
            columns: 4
            square: false
            cards:
              - type: tile
                entity: sensor.zendure_besparing_vandaag
                name: Vandaag
                icon: mdi:calendar-today
                color: green
                vertical: false
              - type: tile
                entity: sensor.zendure_besparing_deze_maand
                name: Deze maand
                icon: mdi:calendar-month
                color: green
                vertical: false
              - type: tile
                entity: sensor.zendure_besparing_dit_jaar
                name: Dit jaar
                icon: mdi:calendar-blank-multiple
                color: green
                vertical: false
              - type: tile
                entity: sensor.zendure_besparing
                name: Totaal
                icon: mdi:piggy-bank-outline
                color: green
                vertical: false
            grid_options:
              columns: full
          - type: markdown
            content: >-
              <ha-alert alert-type="info">Helptekst</ha-alert>Elk kwartier
              wordt je verbruik verrekend tegen het vaste tarief en tegen de
              dynamische prijs van dat moment, met en zonder zon en accu.
              Teruglevering telt tegen de (lagere) terugleverprijs.
              **Bespaard** is het verschil tussen een vast contract zonder zon
              en accu en wat je met zon, accu en dynamisch contract betaalt.
              Vaste kosten (vastrecht, netbeheer, heffingskorting) zitten er
              niet in; die zijn in alle situaties gelijk.
            text_only: true
            visibility:
              - condition: state
                entity: input_boolean.help_tonen_op_dashboard
                state: 'on'
            grid_options:
              columns: full
      - type: grid
        visibility:
          - condition: state
            entity: input_number.besparing_vast_leveringsprijs
            state_not: unavailable
        cards:
          - type: markdown
            title: Overzicht
            text_only: false
            content: |
              {%- set e = state_attr('sensor.zendure_besparing', 'emmers') or {} -%}
              {%- set P = [('dag', 'Vandaag'), ('maand', 'Maand'), ('jaar', 'Jaar'), ('totaal', 'Totaal')] -%}
              {%- macro eur(x) -%}{%- set x = x | float(0) | round(2) -%}{{ ('-' if x < 0 else '') ~ '€ ' ~ ('%.2f' | format(x | abs)) | replace('.', ',') }}{%- endmacro -%}
              {%- macro kleur(x) -%}{%- set x = x | float(0) | round(2) -%}{% if x > 0 %}<font color="#01a180">{{ eur(x) }}</font>{% elif x < 0 %}<font color="#c53b2c">{{ eur(x) }}</font>{% else %}{{ eur(x) }}{% endif %}{%- endmacro -%}
              {%- macro kwh(x) -%}{{ ('%.1f' | format(x | float(0))) | replace('.', ',') }}{%- endmacro -%}
              {%- macro w(b, k) -%}{{ ((e.get(b) or {}).get(k, 0)) | float(0) }}{%- endmacro -%}
              {% if states('input_number.besparing_vast_leveringsprijs') | float(0) <= 0 %}
              <ha-alert alert-type="warning">Vul het vaste tarief in onder Forecasting Configuratie (Besparing).</ha-alert>
              {% endif %}
              | | {% for k, n in P %}{{ n }} | {% endfor %}
              |:---|{% for k, n in P %}---:|{% endfor %}
              | **Bespaard** | {% for k, n in P %}**{{ kleur(w(k, 'geen_vast') | float - w(k, 'nu_dyn') | float) }}** | {% endfor %}
              | <ha-icon icon="mdi:solar-power-variant"></ha-icon>door zon | {% for k, n in P %}{{ kleur(w(k, 'geen_vast') | float - w(k, 'zon_vast') | float) }} | {% endfor %}
              | <ha-icon icon="mdi:chart-bell-curve-cumulative"></ha-icon>door dynamisch tarief | {% for k, n in P %}{{ kleur(w(k, 'zon_vast') | float - w(k, 'zon_dyn') | float) }} | {% endfor %}
              | <ha-icon icon="mdi:battery-charging"></ha-icon>door accu en slim laden | {% for k, n in P %}{{ kleur(w(k, 'zon_dyn') | float - w(k, 'nu_dyn') | float) }} | {% endfor %}
              | <ha-icon icon="mdi:cash-remove"></ha-icon>Vast contract, zonder zon en accu | {% for k, n in P %}{{ eur(w(k, 'geen_vast')) }} | {% endfor %}
              | <ha-icon icon="mdi:cash-check"></ha-icon>Werkelijk betaald | {% for k, n in P %}{{ eur(w(k, 'nu_dyn')) }} | {% endfor %}

              | Energie (kWh) | {% for k, n in P %}{{ n }} | {% endfor %}
              |:---|{% for k, n in P %}---:|{% endfor %}
              | <ha-icon icon="mdi:home-lightning-bolt-outline"></ha-icon>Verbruik | {% for k, n in P %}{{ kwh(w(k, 'verbruik')) }} | {% endfor %}
              | <ha-icon icon="mdi:solar-power"></ha-icon>Zon | {% for k, n in P %}{{ kwh(w(k, 'zon')) }} | {% endfor %}
              | <ha-icon icon="mdi:transmission-tower-import"></ha-icon>Import | {% for k, n in P %}{{ kwh(w(k, 'imp')) }} | {% endfor %}
