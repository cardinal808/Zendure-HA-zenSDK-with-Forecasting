                  td { border-bottom: 1px solid color-mix(in srgb, var(--divider-color) 45%, transparent) !important; }
                  tr:last-child td { border-bottom: none !important; }
                  th:not(:first-child), td:not(:first-child) { text-align: right !important; white-space: nowrap; font-variant-numeric: tabular-nums; }
                  th:first-child, td:first-child { width: 42%; }
                  ha-icon { --mdc-icon-size: 18px; color: var(--secondary-text-color); margin-right: 6px; vertical-align: -3px; }
                  small { color: var(--secondary-text-color); }
          - type: markdown
            title: Kosten per situatie
            text_only: false
            content: |
              {%- set e = state_attr('sensor.zendure_besparing', 'emmers') or {} -%}
              {%- set P = [('maand', 'Maand'), ('jaar', 'Jaar'), ('totaal', 'Totaal')] -%}
              {%- macro eur(x) -%}{%- set x = x | float(0) | round(2) -%}{{ ('-' if x < 0 else '') ~ '€ ' ~ ('%.2f' | format(x | abs)) | replace('.', ',') }}{%- endmacro -%}
              {%- macro w(b, k) -%}{{ ((e.get(b) or {}).get(k, 0)) | float(0) }}{%- endmacro -%}
              {%- set S = [('geen_vast', 'mdi:home-outline', 'Geen zon, geen accu', 'vast'), ('geen_dyn', 'mdi:home-outline', 'Geen zon, geen accu', 'dynamisch'), ('zon_vast', 'mdi:solar-power-variant', 'Alleen zon', 'vast'), ('zon_dyn', 'mdi:solar-power-variant', 'Alleen zon', 'dynamisch'), ('nu_vast', 'mdi:home-battery', 'Zon + accu', 'vast'), ('nu_dyn', 'mdi:home-battery', 'Zon + accu', 'dynamisch')] -%}
              | Wat had je betaald? | {% for k, n in P %}{{ n }} | {% endfor %}
              |:---|{% for k, n in P %}---:|{% endfor %}
              {% for key, icon, naam, contract in S %}| <ha-icon icon="{{ icon }}"></ha-icon>{% if key == 'nu_dyn' %}**{{ naam }}, {{ contract }}** <small>(jouw situatie)</small>{% else %}{{ naam }}, {{ contract }}{% endif %} | {% for k, n in P %}{% if key == 'nu_dyn' %}**<font color="#01a180">{{ eur(w(k, key)) }}</font>**{% else %}{{ eur(w(k, key)) }}{% endif %} | {% endfor %}
              {% endfor %}
            grid_options:
              columns: full
            card_mod:
              style:
                ha-markdown$: |
                  table { width: 100%; border-collapse: collapse; table-layout: fixed; margin: 2px 0 6px; }
                  th, td { border: none !important; padding: 6px 6px !important; }
                  th { font-size: 0.72em; font-weight: 500; text-transform: uppercase; letter-spacing: .02em; color: var(--secondary-text-color); border-bottom: 1px solid var(--divider-color) !important; }
                  td { border-bottom: 1px solid color-mix(in srgb, var(--divider-color) 45%, transparent) !important; }
                  tr:last-child td { border-bottom: none !important; }
                  th:not(:first-child), td:not(:first-child) { text-align: right !important; white-space: nowrap; font-variant-numeric: tabular-nums; }
                  th:first-child, td:first-child { width: 55%; }
                  ha-icon { --mdc-icon-size: 18px; color: var(--secondary-text-color); margin-right: 6px; vertical-align: -3px; }
                  small { color: var(--secondary-text-color); }
      - type: grid
        visibility:
