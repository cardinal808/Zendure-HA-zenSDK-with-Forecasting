              - type: entity
                show_state: true
                show_icon: true
                entity: sensor.zendure_2400_ac_laatste_kalibratie_dagen
                color: '#01a180'
          - type: markdown
            content: >-
              <ha-alert alert-type="info">Helptekst</ha-alert>Het aantal
              kalibraties aangegeven met een groene kleur deze maand en de
              vorige maand. De batterij kalibratie vind plaats wanneer de
              batterij tot 100% is opgeladen. Zodra er langer dan 1 maand geen
