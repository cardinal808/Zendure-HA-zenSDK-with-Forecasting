                    color_threshold:
                      - value: 0
                        opacity: 0.2
                      - value: 30
                        opacity: 0.35
                      - value: 40
                        opacity: 0.5
                      - value: 50
                        opacity: 0.65
                      - value: 60
                        opacity: 0.8
                  - entity: sensor.zendure_2400_ac_vermogen_aansturing
                    name: Batterij
                    transform: return Math.abs(x)
                    statistics:
                      period: 5minute
                      type: max
                      align: start
                    type: line
                    curve: smooth
                    stroke_width: 0
                    opacity: 1
                    extend_to: now
                    color: var(--accent-color)
                    float_precision: 0
                    yaxis_id: percentage
                    show:
                      in_header: false
                      in_legend: false
            grid_options:
              columns: 36
              rows: auto
        column_span: 3
    cards: []
  - type: sections
    max_columns: 4
    title: Configuratie
    path: configuratie
    icon: mdi:cog
    sections:
      - type: grid
        cards:
          - type: heading
            icon: ''
            heading: Gekoppelde Zendure
            heading_style: title
          - type: markdown
            text_only: true
            content: >-
              {% set product = states('sensor.zendure_2400_ac_productserie') %}
              {% set last =
              states('input_datetime.zendure_gielz_automatisering_laatste_keer_uitgevoerd')
              %}

              {% set base =
              'https://cdn.jsdelivr.net/gh/Gielz1986/Zendure-HA-zenSDK@main/Devices/'
              %}

              {% set images = {
                'solarFlow2400AC': 'V2_SF_2400_AC.png',
                'solarFlow2400AC+': 'V2_SF_2400_AC_Plus_Pro.png',
                'Hyper2000': 'V2_Hyper_2000.png',
                'solarFlow2400Pro': 'V2_SF_2400_AC_Plus_Pro.png',
                'solarFlow1600AC+': 'V2_SF_1600_AC_Plus.png',
                'solarFlow800Pro': 'V2_SF_800_Pro.png',
                'solarFlow800Pro2': 'V2_SF_800_Pro.png',
                'solarFlow4000MixAC+': 'V2_SF_3000_4000_Mix.png',
                'solarFlow4000MixPro': 'V2_SF_3000_4000_Mix.png',
                'solarFlow3000MixAC+': 'V2_SF_3000_4000_Mix.png',
                'solarFlow800Plus': 'V2_SF_800_Plus.png'
              } %}

              {% if last in ['unknown', 'unavailable', '', None] %}
                {% set img = 'Inactive.png' %}
              {% else %}
                {% set diff = as_timestamp(now()) - as_timestamp(last) %}
                {% if diff >= 120 %}
                  {% set img = 'Inactive.png' %}
                {% else %}
                  {% set img = images.get(product, 'sf_2400_ac.png') %}
                {% endif %}
              {% endif %}

              <img src="{{ base ~ img }}">
            grid_options:
              columns: 3
              rows: auto
          - type: markdown
            content: >-
              {% set product = states('sensor.zendure_2400_ac_productserie') %}


              {% set names = {
                'solarFlow2400AC': 'Solarflow 2400 AC',
                'solarFlow2400AC+': 'Solarflow 2400 AC+',
                'solarFlow4000MixAC+': 'SolarFlow 4000 Mix AC+',
                'solarFlow4000MixPro': 'SolarFlow 4000 Mix Pro',
                'solarFlow3000MixAC+': 'SolarFlow 3000 Mix AC+',
                'solarFlow2400Pro': 'Solarflow 2400 Pro',
                'solarFlow1600AC+': 'Solarflow 1600 AC+',
                'Hyper2000': 'Hyper 2000',
                'solarFlow800Pro': 'Solarflow 800 Pro',
                'solarFlow800Pro2': 'Solarflow 800 Pro 2',
                'solarFlow800Plus': 'Solarflow 800 Plus'
              } %}


              **{{ names.get(product, 'Onbekend') }}** ({{
              states('sensor.zendure_2400_ac_totale_capaciteit') }} kWh)  

              {{ states('sensor.zendure_2400_ac_serienummer') }}


              {% set last =
              states('input_datetime.zendure_gielz_automatisering_laatste_keer_uitgevoerd')
              %}


              {% if last not in ['unknown', 'unavailable', '', None] %}

              {% set diff = as_timestamp(now()) - as_timestamp(last) %}


              **Automatisering Hartslag**  

              {% if diff > 120 %} Automatisering Offline

              {% else %} {{ as_timestamp(last) | timestamp_custom('%Y-%m-%d
              %H:%M') }} (laatste controle)

              {% endif %}


              {% else %}

              **Verkeerde entiteiten controleer package**

              {% endif %}
            grid_options:
              columns: 9
              rows: auto
          - type: heading
            icon: ''
            heading: Configuratie (Basis)
            heading_style: title
            badges:
              - type: button
                icon: mdi:mouse
                tap_action:
                  action: perform-action
                  perform_action: input_button.press
                  target:
                    entity_id: input_button.zendure_2400_ac_advies_instellingen_overnemen
                  data: {}
                  confirmation:
                    title: Standaardinstellingen herstellen ?
                    text: >-
                      Je huidige instellingen gaan verloren en worden vervangen
                      door de standaardinstellingen. Weet je het zeker?
                    confirm_text: Herstellen
                    dismiss_text: Annuleren
                color: '#01a180'
                text: Standaardinstellingen
          - type: markdown
            content: >-
              <ha-alert alert-type="info">Helptekst</ha-alert>Vul hier het
              IP-adres van je Zendure in onder **Zendure 2400 AC IP-adres⚙️** en
              van je HomeWizard P1 (lokale API moet aanstaan) onder **Homewizard
              P1 IP-adres⚙️**. Gebruik je een afwijkende P1-sensor, dan kun je
              deze instellen via **Afwijkende P1 Sensor⚙️**.


              Hier stel je ook de **Standby Vertraging⚙️** in. Wanneer de
              Zendure geen actieve taak heeft, gaat hij na de ingestelde periode
              volledig in standby. Het verbruik bedraagt dan ongeveer 0,2 kWh
              per dag.


              Wil je niet te veel gedoe neem dan in eerste instantie de **Advies
              Instellingen⚙️** voor het gedrag in één keer over. Pas het daarna
              na eigen smaak aan.
            text_only: true
            visibility:
              - condition: state
                entity: input_boolean.help_tonen_op_dashboard
                state: 'on'
          - type: entities
            entities:
              - entity: input_text.zendure_2400_ac_ip_adres
              - entity: input_text.homewizard_p1_ip_adres
              - entity: input_number.zendure_2400_ac_standby_vertraging
                name: Standby Vertraging
          - type: heading
            icon: ''
            heading: Configuratie (Opladen)
            heading_style: title
            badges:
              - type: entity
                show_state: true
                show_icon: true
                entity: sensor.zendure_2400_ac_omvormer_max_oplaadvermogen
                icon: mdi:api
                color: '#01a180'
                tap_action:
                  action: more-info
          - type: markdown
            content: >-
              <ha-alert alert-type="info">Helptekst</ha-alert>Stel hier het
              maximaal oplaadvermogen van je Zendure in en maak de keuze wanneer
              jij wilt dat hij tijdens de **Nul op de meter** modus gaat starten
              met opladen en hoeveel marge hij moet houden tussen terugleveren
              en nul op de meter.
            text_only: true
            visibility:
              - condition: state
                entity: input_boolean.help_tonen_op_dashboard
                state: 'on'
          - type: entities
            entities:
              - entity: input_number.zendure_2400_ac_max_oplaadvermogen
                name: Max. Oplaadvermogen
              - entity: input_number.zendure_2400_ac_opladen_starten_bij
                name: Opladen Starten Bij
              - entity: input_number.zendure_2400_ac_oplaadmarge
                name: Oplaadmarge
          - type: heading
            icon: ''
            heading: Configuratie (Ontladen)
            heading_style: title
            badges:
              - type: entity
                show_state: true
                show_icon: true
                entity: sensor.zendure_2400_ac_omvormer_max_ontlaadvermogen
                color: '#01a180'
                icon: mdi:api
                tap_action:
                  action: more-info
          - type: markdown
            content: >-
              <ha-alert alert-type="info">Helptekst</ha-alert>Stel hier het
              maximaal ontlaadvermogen van je Zendure in en maak de keuze
              wanneer jij wilt dat hij tijdens de **Nul op de meter** modus gaat
              starten met ontladen en hoeveel extra hij moet ontladen dan nul op
              de meter.
            text_only: true
            visibility:
              - condition: state
                entity: input_boolean.help_tonen_op_dashboard
                state: 'on'
          - type: entities
            entities:
              - entity: input_number.zendure_2400_ac_max_ontlaadvermogen
                name: Max. Ontlaadvermogen
              - entity: input_number.zendure_2400_ac_ontladen_starten_bij
                name: Ontladen Starten Bij
              - entity: input_number.zendure_2400_ac_ontlaadmarge
                name: Ontlaadmarge
      - type: grid
        cards:
          - type: heading
            icon: ''
            heading_style: title
            heading: Configuratie (Laadpercentage)
            badges:
              - type: entity
                show_state: true
                show_icon: true
                entity: sensor.zendure_2400_ac_minimale_laadpercentage
                icon: mdi:api
                color: '#01a180'
                tap_action:
                  action: more-info
              - type: entity
                show_state: true
                show_icon: false
                entity: sensor.zendure_2400_ac_maximale_laadpercentage
                icon: mdi:api
                color: '#01a180'
                tap_action:
                  action: more-info
          - type: markdown
            content: >-
              <ha-alert alert-type="error">Waarschuwing</ha-alert>Minimaal
              toegestaan laadpercentage is ingesteld onder de 10% dit wordt
              afgeraden door Zendure.
            text_only: true
            visibility:
              - condition: numeric_state
                entity: sensor.zendure_2400_ac_minimale_laadpercentage
                below: 10
          - type: markdown
            content: >-
              <ha-alert alert-type="info">Helptekst</ha-alert>Stel hier het
              minimaal en maximaal toegestaan laadpercentage in.


              Ook kun je de SOC bescherming van deze integratie uitschakelen.
              Wanneer de batterij onder het minimaal toegestaan laadpercentage
              zakt zal er niet meer automatisch bijgeladen worden. Er word
              gewacht tot de BMS (batterij management systeem) zelf actie
              onderneemt.
            text_only: true
            visibility:
              - condition: state
                entity: input_boolean.help_tonen_op_dashboard
                state: 'on'
          - type: entities
            entities:
              - entity: input_boolean.zendure_2400_ac_soc_bescherming_uitgeschakeld
                name: SOC Bescherming Uitgeschakeld
              - entity: input_number.zendure_2400_ac_minimaal_toegestaan_laadpercentage
                name: Min. Laadpercentage
              - entity: input_number.zendure_2400_ac_maximaal_toegestaan_laadpercentage
                name: Max. Laadpercentage
          - type: heading
            icon: ''
            heading: Configuratie (PV)
            heading_style: title
            badges:
              - type: entity
                show_state: true
                show_icon: true
                entity: sensor.zendure_2400_ac_pv_export_modus
                icon: mdi:api
                color: '#01a180'
                tap_action:
                  action: more-info
            visibility:
              - condition: state
                entity: input_boolean.pv_tonen_op_dashboard
                state: 'on'
          - type: entities
            entities:
              - entity: input_boolean.zendure_2400_ac_pv_export_uitgeschakeld
                name: PV Export Uitgeschakeld
            visibility:
              - condition: state
                entity: input_boolean.pv_tonen_op_dashboard
                state: 'on'
          - type: heading
            icon: ''
            heading: Configuratie (Optioneel)
            heading_style: title
          - type: markdown
            content: >-
              <ha-alert alert-type="info">Helptekst</ha-alert>Maak je geen
              gebruik van een Homewizard P1 maar heb je wel een P1/CT sensor
              waarbij -watt teruglevering is en +watt import per seconden is vul
              deze dan hier in onder **Afwijkende P1 Sensor⚙️**.


              Ook kun je hier een afwijkende batterij volgorde instellen onder
              **Batterij Volgorde⚙️**. Hiermee bepaal je zelf een afwijkende
              volgorde van de batterijen. De juiste volgorde bepaal je mede aan
              de hand van **sensor.zendure_2400_ac_batterij_serienummers** en de
              sticker op de batterij(en). Op deze manier zullen de
              batterijtemperaturen en het laadpercentage de juiste volgorde
              hanteren zoals die van de batterij(en) in de stapel.
            text_only: true
            visibility:
              - condition: state
                entity: input_boolean.help_tonen_op_dashboard
                state: 'on'
          - type: entities
            entities:
              - entity: input_text.afwijkende_p1_sensor
              - entity: input_text.zendure_2400_ac_batterij_volgorde
                name: Batterij Volgorde
          - type: heading
            icon: ''
            heading: Configuratie (Dynamisch)
            heading_style: title
            badges: []
            visibility:
              - condition: state
                entity: input_boolean.dynamisch_tonen_op_dashboard
                state: 'on'
          - type: markdown
            content: >-
              <ha-alert alert-type="info">Helptekst</ha-alert>Heb je een
              dynamisch contract dan kun je hier de Nordpool HACS sensor
              invullen en aangeven wat de minimale spread moet zijn om gebruik
              te maken van het laden en ontladen op lage en hoge tarieven.


              Heb je een 15 minuten contract vink dit dan aan zodat de grafieken
              en de prijzen goed gezet worden.
            text_only: true
            visibility:
              - condition: state
                entity: input_boolean.help_tonen_op_dashboard
                state: 'on'
              - condition: state
                entity: input_boolean.dynamisch_tonen_op_dashboard
                state: 'on'
          - type: entities
            entities:
              - entity: input_text.dynamisch_nordpool_sensor
              - entity: input_number.dynamisch_export_correctie
                name: Export Correctie
              - entity: input_number.dynamisch_minimale_spread
                name: Minimale Spread
              - entity: input_boolean.dynamisch_15_minuten
                name: 15 Minuten Tarieven Actief
            visibility:
              - condition: state
                entity: input_boolean.dynamisch_tonen_op_dashboard
                state: 'on'
          - type: heading
            icon: ''
            heading: Configuratie (Forecasting)
            heading_style: title
            visibility:
              - condition: state
                entity: input_boolean.forecast_tonen_op_dashboard
                state: 'on'
          - type: markdown
            content: >-
              <ha-alert alert-type="info">Helptekst</ha-alert>Voor de modus
              **Dynamisch NOM + Forecasting**. Vul de entity_id in van je
              zon-forecast sensors (kWh, bv. Forecast.Solar of Solcast) en van
              een totaalteller (kWh) van je zonnepanelen. Zelfverbruik zon en
              dagverbruik worden vanaf dag 1 automatisch berekend uit je eigen
              metingen en worden elke dag nauwkeuriger (tot 7 dagen). De laadmarge is een extra buffer als percentage van de
              batterijcapaciteit.
            text_only: true
            visibility:
              - condition: state
                entity: input_boolean.help_tonen_op_dashboard
                state: 'on'
              - condition: state
                entity: input_boolean.forecast_tonen_op_dashboard
                state: 'on'
          - type: entities
            entities:
              - entity: input_text.forecast_zon_resterend_vandaag_sensor
                name: Zon resterend vandaag sensor
              - entity: input_text.forecast_zon_morgen_sensor
                name: Zon morgen sensor
              - entity: input_text.forecast_zon_productie_sensor
                name: Zonnepanelen productie sensor (totaal kWh)
              - entity: input_number.forecast_laad_marge
                name: Batterij laadmarge %
              - entity: input_number.forecast_betrouwbaarheid
                name: Betrouwbaarheid zonvoorspelling % (0 = 100%)
              - entity: input_boolean.forecast_dal_ontladen_blokkeren
                name: Niet ontladen in goedkoop dal (accu sparen)
            visibility:
              - condition: state
                entity: input_boolean.forecast_tonen_op_dashboard
                state: 'on'
          - type: heading
            icon: ''
            heading_style: title
            heading: Configuratie (Dashboard)
          - type: markdown
            content: >-
              <ha-alert alert-type="info">Helptekst</ha-alert>Hier stel je in of
              je de Dynamische informatie wilt verbergen of tonen op het eerste
              tabblad via **Dynamisch Tonen Op Dashboard⚙️**. Met **Forecasting Tonen Op Dashboard** toon of verberg je de Forecasting-sectie en de Forecasting-instellingen.
            text_only: true
            visibility:
              - condition: state
                entity: input_boolean.help_tonen_op_dashboard
                state: 'on'
          - type: entities
            entities:
              - entity: input_boolean.help_tonen_op_dashboard
              - entity: input_boolean.pv_tonen_op_dashboard
              - entity: input_boolean.dynamisch_tonen_op_dashboard
              - entity: input_boolean.forecast_tonen_op_dashboard
                name: Forecasting Tonen Op Dashboard
      - type: grid
        cards:
          - type: heading
            heading: Logboek (afgelopen 4 uur)
            heading_style: title
            badges:
              - type: button
                icon: mdi:information
                tap_action:
                  action: navigate
                  navigation_path: /logbook
                color: '#01a180'
                text: Meer
          - type: logbook
            target:
              entity_id:
                - input_select.zendure_2400_ac_modus_selecteren
            grid_options:
              columns: 12
              rows: 12
            hours_to_show: 4
          - type: heading
            icon: ''
            heading: Versiebeheer
            heading_style: title
            badges:
              - type: button
                icon: mdi:information
                text: Toon laatste releasenotes
                color: '#01a180'
                tap_action:
                  action: navigate
                  navigation_path: releasenotes
            visibility:
              - condition: state
                entity: sensor.zendure_ha_zensdk_github_releasecheck
                state_not: Pre-release actief
          - type: heading
            icon: ''
            heading: Versiebeheer
            heading_style: title
            badges:
              - type: button
                icon: mdi:information
                text: Toon pre-releasenotes
                color: '#01a180'
                tap_action:
                  action: url
                  url_path: https://github.com/Gielz1986/Zendure-HA-zenSDK/pulls
            visibility:
              - condition: state
                entity: sensor.zendure_ha_zensdk_github_releasecheck
                state: Pre-release actief
          - type: markdown
            content: >-
              <ha-alert alert-type="info">Helptekst</ha-alert>Hier kun je zien
              welke package versie je gebruikt en wat de nieuwste versie is op
              GitHub. Ook zie je meteen hoeveel problemen er openstaan en kun je
              hier op doorklikken naar GitHub.
            text_only: true
            visibility:
              - condition: state
                entity: input_boolean.help_tonen_op_dashboard
                state: 'on'
          - type: entities
            entities:
              - entity: sensor.zendure_2400_ac_configuratie_versie
                name: Versie in gebruik
              - entity: sensor.github_zendure_ha_zensdk_gielz1986
                name: Versie op GitHub
              - entity: sensor.zendure_ha_zensdk_github_releasecheck
                name: Releasecheck
              - type: section
                label: Forecasting
              - entity: sensor.forecasting_versie
                name: Versie in gebruik
              - entity: sensor.github_zendure_forecasting
                name: Versie op GitHub
              - entity: sensor.forecasting_releasecheck
                name: Releasecheck
          - type: markdown
            content: >
              &nbsp;&nbsp;[![Open
              Issues](https://img.shields.io/github/issues/Gielz1986/Zendure-HA-zenSDK?style=for-the-badge&label=Openstaande%20Problemen&labelColor=029c7b&color=0d2e2b)](https://github.com/Gielz1986/Zendure-HA-zenSDK/issues)
            grid_options:
              columns: 12
              rows: auto
            text_only: true
    cards: []
    dense_section_placement: false
  - type: sections
    max_columns: 2
    subview: true
    path: releasenotes
    title: Releasenotes
    icon: mdi:github
    sections:
      - type: grid
        cards:
          - type: markdown
            content: >
              &nbsp;&nbsp;[![Laatste
              release](https://img.shields.io/github/v/release/Gielz1986/Zendure-HA-zenSDK?style=for-the-badge&label=Download&color=01a180&logo=github)](https://github.com/Gielz1986/Zendure-HA-zenSDK/releases/latest)


              {{ state_attr('sensor.github_zendure_ha_zensdk_gielz1986',
              'body')}}
            grid_options:
              columns: 24
              rows: auto
            text_only: true
          - type: markdown
            content: >
              &nbsp;&nbsp;[![Forecasting
              release](https://img.shields.io/github/v/release/cardinal808/Zendure-HA-zenSDK-with-Forecasting?style=for-the-badge&label=Forecasting&color=01a180&logo=github)](https://github.com/cardinal808/Zendure-HA-zenSDK-with-Forecasting/releases/latest)


              {{ state_attr('sensor.github_zendure_forecasting', 'body') }}
            grid_options:
              columns: 24
              rows: auto
            text_only: true
        column_span: 2
    cards: []
