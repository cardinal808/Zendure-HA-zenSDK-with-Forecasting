          - type: custom:mod-card
            card_mod:
              style: |
                ha-card {
                  --vertical-stack-card-gap: 0px;
                  --stack-card-gap: 0px;
                  background: var(--ha-card-background, var(--card-background-color, white)) !important;
                  border: var(--ha-card-border-width, 1px) solid var(--ha-card-border-color, var(--divider-color, #e0e0e0)) !important;
                  border-radius: var(--ha-card-border-radius, 12px) !important;
                  padding: 4px 6px 2px 6px;
                  overflow: hidden;
                }
            card:
              type: vertical-stack
              cards:
                - type: custom:apexcharts-card
                  graph_span: 36h
                  span:
                    start: hour
                  now:
                    show: true
                    color: var(--primary-text-color)
                  update_interval: 5min
                  header:
                    show: false
                  apex_config:
                    yaxis:
                      - show: false
                    chart:
                      height: 80px
                      sparkline:
                        enabled: false
                    legend:
                      show: false
                    plotOptions:
                      bar:
                        columnWidth: 100%
                    dataLabels:
                      enabled: false
                    annotations:
                      texts:
                        - x: 4
                          'y': 11
                          text: 'Prijs €/kWh'
                          fontSize: 10px
                          foreColor: grey
                          textAnchor: start
                    grid:
                      show: true
                      borderColor: color-mix(in srgb, var(--divider-color) 40%, transparent)
                      strokeDashArray: 0
                      padding:
                        top: -10
                        bottom: -28
                        left: 6
                        right: 4
                    tooltip:
                      shared: true
                      intersect: false
                      followCursor: true
                      custom: >-
                        EVAL:function({ series, dataPointIndex, w }) {
                          const t = w.globals.seriesX[0][dataPointIndex];
                          const d = new Date(t);
                          const tijd = d.toLocaleString(navigator.language, { weekday: 'short', hour: '2-digit', minute: '2-digit' });
                          const delen = [];
                          w.globals.seriesNames.forEach((naam, i) => {
                            const v = series[i] ? series[i][dataPointIndex] : null;
                            if (v === null || v === undefined || Number.isNaN(v)) return;
                            const n = naam.toLowerCase();
                            const txt = (n.startsWith('prijs') || n.startsWith('price')) ? v.toFixed(3) + ' €'
                              : ((n.startsWith('laadperc') || n.startsWith('state')) ? Math.round(v) + '%' : v.toFixed(2) + ' kW');
                            delen.push('<span style="color:' + w.globals.colors[i] + '">●</span> ' + naam + ' ' + txt);
                          });
                          return '<div style="padding:1px 6px;font-size:11px;line-height:16px;white-space:nowrap;background:var(--card-background-color,#1c1f26);color:var(--primary-text-color,#e1e1e1);border:1px solid var(--divider-color,#444);border-radius:4px">' + tijd + ' · ' + delen.join(' · ') + '</div>';
                        }
                    xaxis:
                      tooltip:
                        enabled: false
                      labels:
                        show: false
                        datetimeUTC: false
                        format: HH:mm
                        style:
                          fontSize: 10px
                          colors: grey
                      axisTicks:
                        show: false
                      axisBorder:
                        show: false
                  series:
                    - entity: sensor.zendure_forecast_grafiek
                      name: Prijs
                      type: column
                      color: '#01a180'
                      float_precision: 3
                      show:
                        in_header: false
                      data_generator: |
                        const d = entity.attributes.tijdlijn;
                        if (!d || !d.t) return [];
                        // Kleuren zoals Gielz (Dynamisch Vandaag/Morgen): groen = laden (hier: gepland
                        // door de planner), rood = duur (de duurste periodes van Gielz), grijs = overig.
                        // Lichtgrijs = prijs nog onbekend (patroon van vandaag aangehouden).
                        const g = hass.states['sensor.dynamisch_goedkoopste_periode'];
                        const duur = new Set();
                        if (g) {
