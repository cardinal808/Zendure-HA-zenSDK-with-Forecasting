                name: Laadplan
                state_content:
                  - name
                  - state
                color: '#01a180'
                tap_action:
                  action: more-info
              - type: entity
                show_state: true
                show_icon: true
                entity: sensor.ev_laadvermogen
                name: Auto
                state_content:
                  - name
                  - state
                color: '#01a180'
                tap_action:
                  action: more-info
                visibility:
                  - condition: numeric_state
                    entity: sensor.ev_laadvermogen
                    above: 0
            visibility:
              - condition: state
                entity: input_select.ev_laadmoment
                state_not: unavailable
          - type: markdown
            content: >-
              <ha-alert alert-type="info">Helptekst</ha-alert>Voor een lader
              zonder eigen aansturing (grannylader, of een wallbox achter een
              slimme schakelaar). Vul de **vermogenssensor** van de lader in
              (W of kW, bv. van een Shelly 1PM in de groep van de lader). Vanaf
              dan ontlaadt de accu niet meer in de auto: de NOM-modussen trekken
              het laadvermogen van de auto af van de P1-meter. Het laden van de
              auto telt ook niet mee in het verbruiksprofiel en het dagverbruik
              van de planner.


              **Laadsessie** (alleen met een ingevulde **schakelaar**): kies het
              **laadmoment** en de **benodigde energie** (kWh aan het
              stopcontact). *Nacht* laadt in de goedkoopste prijsslots tot
              **Klaar om** (00:00 = 07:00). *Overdag* laadt zolang de zon op is;
              de planner haalt die kWh van het zon-overschot voor de accu af en
              laadt het tekort op het goedkoopste moment uit het net. Is de
              energie geladen of de tijd voorbij, dan gaat het laadmoment terug
              naar Uit en de lader weer aan. Let op: niet elke auto hervat het
              laden vanzelf als de stroom terugkomt.
            text_only: true
            visibility:
              - condition: state
                entity: input_boolean.help_tonen_op_dashboard
                state: 'on'
              - condition: state
                entity: input_select.ev_laadmoment
                state_not: unavailable
          - type: entities
            entities:
              - entity: input_select.ev_laadmoment
                name: Laadmoment
              - entity: input_number.ev_benodigde_kwh
                name: Benodigde energie (kWh aan het stopcontact)
              - type: conditional
                conditions:
                  - entity: input_select.ev_laadmoment
                    state: Nacht (goedkoopste uren)
                row:
                  entity: input_datetime.ev_klaar_om
                  name: Klaar om (00:00 = 07:00)
              - type: section
                label: Lader
              - entity: input_text.ev_vermogen_sensor
                name: Vermogenssensor lader (W of kW)
              - entity: input_text.ev_schakelaar
                name: Schakelaar lader (optioneel, bv. switch.shelly_lader)
              - entity: input_number.ev_laadvermogen_kw
                name: Laadvermogen kW (0 = 2,3 kW)
              - entity: input_number.ev_drempel_vermogen
                name: Drempel W (0 = 300 W)
            visibility:
              - condition: state
                entity: input_select.ev_laadmoment
                state_not: unavailable
          - type: markdown
            text_only: true
            content: |-
              {%- set p = 'sensor.ev_laadplan' -%}
              {%- set c = states('sensor.ev_ontlaad_correctie') | float(0) -%}
              {% if not is_state('input_select.ev_laadmoment', 'Uit') %}**Laadsessie:** {{ states(p) }} · geladen {{ '%.1f' | format(state_attr(p, 'geladen_kwh') | float(0)) }} van {{ states('input_number.ev_benodigde_kwh') | float(0) | round(0) | int }} kWh{% if state_attr(p, 'eind') %} · tot {{ (state_attr(p, 'eind') or '')[11:] }}{% endif %}
              {% for b in state_attr(p, 'laadblokken') or [] %}
              - Laden {{ b.dag }} {{ b.start }}–{{ b.eind }}: ongeveer {{ '%.1f' | format(b.kwh) }} kWh, gemiddeld €{{ '%.3f' | format(b.prijs) }}
              {%- endfor %}
              {% if is_state('input_select.ev_laadmoment', 'Nacht (goedkoopste uren)') and not state_attr(p, 'prijzen_morgen_bekend') %}
              <small>Prijzen van morgen nog niet bekend: gepland met het patroon van vandaag, rond 14:00 opnieuw.</small>
              {% endif %}{% if states('input_text.ev_schakelaar') | trim == '' %}
              <ha-alert alert-type="warning">Geen schakelaar ingevuld: de lader wordt niet aan- en uitgezet, alleen het plan wordt berekend.</ha-alert>
              {% endif %}{% else %}Geen laadsessie. Kies een laadmoment om de auto gepland te laden.{% endif %}
              {% if c > 0 %}
              De auto laadt met {{ c | round(0) | int }} W: de accu ontlaadt daar niet in.{% endif %}
            visibility:
              - condition: state
                entity: input_select.ev_laadmoment
                state_not: unavailable
          - type: heading
            icon: ''
            heading_style: title
            heading: Forecasting Configuratie (HVAC)
            visibility:
              - condition: state
                entity: input_text.hvac_sensor
                state_not: unavailable
          - type: markdown
            content: >-
              <ha-alert alert-type="info">Helptekst</ha-alert>Zolang de airco
              draait, ontladen de NOM-modussen niet (laden uit zon of net blijft
              werken). Vul de entiteit van je airco in (bv.
              climate.airco_woonkamer; een vermogenssensor in W kan ook). Bij
              een climate-entiteit zie je de modus en zet je per modus aan of
              ontladen toch mag, bv. **Koelen** aan (zomer, zon genoeg) en
              **Verwarmen** uit (winter, geen zon). Staat de airco op
              temperatuur (stand-by), dan ontlaadt de accu gewoon. Bij een
              vermogenssensor of schakelaar is de modus onbekend en geldt de
              blokkade altijd. Laat de sensor leeg om de functie uit te zetten.
            text_only: true
            visibility:
              - condition: state
                entity: input_boolean.help_tonen_op_dashboard
                state: 'on'
              - condition: state
                entity: input_text.hvac_sensor
                state_not: unavailable
          - type: entities
            entities:
              - entity: input_text.hvac_sensor
                name: HVAC sensor (bv. climate.airco_woonkamer)
              - entity: input_number.hvac_drempel_vermogen
                name: Drempel vermogen W (alleen bij vermogenssensor, 0 = 50 W)
              - type: section
                label: Ontladen toestaan bij
              - entity: input_boolean.hvac_ontladen_bij_verwarmen
                name: Verwarmen
              - entity: input_boolean.hvac_ontladen_bij_koelen
                name: Koelen
              - entity: input_boolean.hvac_ontladen_bij_drogen
                name: Drogen
              - entity: input_boolean.hvac_ontladen_bij_ventileren
                name: Ventileren
              - entity: input_boolean.hvac_ontladen_bij_auto
                name: Auto
              - entity: input_boolean.hvac_ontladen_bij_duur_uur
                name: Duur uur (in elke modus)
              - type: section
                label: Status
              - entity: sensor.hvac_modus
                name: Airco modus
              - entity: binary_sensor.hvac_actief
                name: Airco actief
              - entity: binary_sensor.hvac_ontladen_geblokkeerd
                name: Ontladen geblokkeerd
              - type: attribute
                entity: binary_sensor.hvac_ontladen_geblokkeerd
                attribute: reden
                name: Reden
                icon: mdi:information-outline
            visibility:
              - condition: state
                entity: input_text.hvac_sensor
                state_not: unavailable
      - type: grid
        cards:
          - type: heading
            icon: ''
            heading_style: title
            heading: Configuratie (Dashboard)
          - type: markdown
            content: >-
              <ha-alert alert-type="info">Helptekst</ha-alert>Hier stel je in of
              je de Dynamische informatie wilt verbergen of tonen op het eerste
              tabblad via **Dynamisch Tonen Op Dashboard⚙️**. Met **Forecasting Tonen Op Dashboard** toon of verberg je de Forecasting-sectie en de Forecasting-instellingen.
            text_only: true
            visibility:
              - condition: state
                entity: input_boolean.help_tonen_op_dashboard
                state: 'on'
          - type: entities
            entities:
              - entity: input_boolean.help_tonen_op_dashboard
              - entity: input_boolean.pv_tonen_op_dashboard
              - entity: input_boolean.dynamisch_tonen_op_dashboard
              - entity: input_boolean.forecast_tonen_op_dashboard
                name: Forecasting Tonen Op Dashboard
          - type: heading
            heading: Logboek (afgelopen 4 uur)
            heading_style: title
            badges:
              - type: button
                icon: mdi:information
                tap_action:
                  action: navigate
                  navigation_path: /logbook
                color: '#01a180'
                text: Meer
          - type: logbook
            target:
              entity_id:
                - input_select.zendure_2400_ac_modus_selecteren
            grid_options:
              columns: 12
              rows: 12
            hours_to_show: 4
          - type: heading
            icon: ''
            heading: Diagnose-export
            heading_style: title
            visibility:
              - condition: state
                entity: script.zendure_diagnose_export
                state_not: unavailable
          - type: markdown
            content: >-
              <ha-alert alert-type="info">Helptekst</ha-alert>Met **Export maken**
              schrijf je één bestand met je instellingen, de stand van alle
              sensoren, de details van de planner en de logs van de afgelopen 24
              uur. Je krijgt een melding met een downloadlink; stuur het bestand
              mee met je vraag of GitHub-issue. IP-adressen en serienummers worden
              weggelaten. Het bestand wordt na 1 uur vanzelf verwijderd.
              Beslissingen, momentopnames en foutmeldingen worden verzameld vanaf
              het moment dat dit pakket geladen is.
            text_only: true
            visibility:
              - condition: state
                entity: input_boolean.help_tonen_op_dashboard
                state: 'on'
              - condition: state
                entity: script.zendure_diagnose_export
                state_not: unavailable
          - type: entities
            entities:
              - entity: script.zendure_diagnose_export
                name: Export maken
              - entity: script.zendure_diagnose_export_wissen
                name: Export verwijderen
              - type: section
                label: Verzameld
              - entity: sensor.zendure_diagnose_beslissingen
                name: Beslissingen (laatste 50)
              - entity: sensor.zendure_diagnose_momentopnames
                name: Momentopnames (laatste 24 uur)
              - entity: sensor.zendure_diagnose_fouten
                name: Foutmeldingen (laatste 20)
            visibility:
              - condition: state
                entity: script.zendure_diagnose_export
                state_not: unavailable
          - type: heading
            icon: ''
            heading: Versiebeheer
            heading_style: title
            badges:
              - type: button
                icon: mdi:information
                text: Toon laatste releasenotes
                color: '#01a180'
                tap_action:
                  action: navigate
                  navigation_path: releasenotes
            visibility:
              - condition: state
                entity: sensor.zendure_ha_zensdk_github_releasecheck
                state_not: Pre-release actief
          - type: heading
            icon: ''
            heading: Versiebeheer
            heading_style: title
            badges:
              - type: button
                icon: mdi:information
                text: Toon pre-releasenotes
                color: '#01a180'
                tap_action:
                  action: url
                  url_path: https://github.com/Gielz1986/Zendure-HA-zenSDK/pulls
            visibility:
              - condition: state
                entity: sensor.zendure_ha_zensdk_github_releasecheck
                state: Pre-release actief
          - type: markdown
            content: >-
              <ha-alert alert-type="info">Helptekst</ha-alert>Hier kun je zien
              welke package versie je gebruikt en wat de nieuwste versie is op
              GitHub. Ook zie je meteen hoeveel problemen er openstaan en kun je
              hier op doorklikken naar GitHub.
            text_only: true
            visibility:
              - condition: state
                entity: input_boolean.help_tonen_op_dashboard
                state: 'on'
          - type: entities
            entities:
              - entity: sensor.zendure_2400_ac_configuratie_versie
                name: Versie in gebruik
              - entity: sensor.github_zendure_ha_zensdk_gielz1986
                name: Versie op GitHub
              - entity: sensor.zendure_ha_zensdk_github_releasecheck
                name: Releasecheck
              - type: section
                label: Forecasting
              - entity: sensor.forecasting_versie
                name: Versie in gebruik
              - entity: sensor.github_zendure_forecasting
                name: Versie op GitHub
              - entity: sensor.forecasting_releasecheck
                name: Releasecheck
          - type: markdown
            content: >
              &nbsp;&nbsp;[![Open
              Issues](https://img.shields.io/github/issues/Gielz1986/Zendure-HA-zenSDK?style=for-the-badge&label=Openstaande%20Problemen&labelColor=029c7b&color=0d2e2b)](https://github.com/Gielz1986/Zendure-HA-zenSDK/issues)
            grid_options:
              columns: 12
              rows: auto
            text_only: true
    cards: []
    dense_section_placement: false
  - type: sections
    max_columns: 2
    subview: true
    path: releasenotes
    title: Releasenotes
    icon: mdi:github
    sections:
      - type: grid
        cards:
          - type: markdown
            content: >
              &nbsp;&nbsp;[![Laatste
              release](https://img.shields.io/github/v/release/Gielz1986/Zendure-HA-zenSDK?style=for-the-badge&label=Download&color=01a180&logo=github)](https://github.com/Gielz1986/Zendure-HA-zenSDK/releases/latest)


              {{ state_attr('sensor.github_zendure_ha_zensdk_gielz1986',
              'body')}}
            grid_options:
              columns: 24
              rows: auto
            text_only: true
          - type: markdown
            content: >
              &nbsp;&nbsp;[![Forecasting
              release](https://img.shields.io/github/v/release/cardinal808/Zendure-HA-zenSDK-with-Forecasting?style=for-the-badge&label=Forecasting&color=01a180&logo=github)](https://github.com/cardinal808/Zendure-HA-zenSDK-with-Forecasting/releases/latest)


              {{ state_attr('sensor.github_zendure_forecasting', 'body') }}
            grid_options:
              columns: 24
              rows: auto
            text_only: true
        column_span: 2
    cards: []
