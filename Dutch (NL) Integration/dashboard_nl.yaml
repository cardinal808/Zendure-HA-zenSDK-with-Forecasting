                show:
                  in_header: false
                  extremas: false
              - entity: sensor.zendure_2400_ac_laadpercentage
                name: Geen Kalibratie
                transform: |
                  return x < 100 ? x : null;
                statistics:
                  period: day
                  type: max
                  align: middle
                type: column
                color: '#a2a2a3'
                show:
                  in_header: false
                  extremas: false
      - type: grid
