                  action: more-info
          - type: markdown
            content: >-
              <ha-alert alert-type="info">Helptekst</ha-alert>Het aantal
              relaisschakelingen per dag van deze maand en de vorige maand. De
              stippellijn geeft de grens aan waarop het aantal schakelingen als
              verhoogd wordt beschouwd. Alles onder de 100 schakelingen per dag
              is normaal op een deels bewolkte dag.


              Deze gegevens komen uit de statistics (LTS). Hierdoor loopt de
              grafiek gemiddeld 1 uur achter.
            text_only: true
            visibility:
              - condition: state
                entity: input_boolean.help_tonen_op_dashboard
                state: 'on'
          - type: custom:apexcharts-card
            stacked: true
            header:
              show: true
              title: ''
            graph_span: 2month
            span:
              start: month
              offset: -1month
            cache: false
            apex_config:
              annotations:
                yaxis:
                  - 'y': 100
                    borderColor: var(--accent-color)
                    strokeDashArray: 4
                    borderWidth: 2
              yaxis:
                - decimalsInFloat: 0
                  labels:
                    show: true
                    style:
                      colors: >-
                        color-mix(in srgb, var(--primary-text-color) 75%,
                        transparent)
              tooltip:
                x:
                  format: d/MM
                  show: false
              grid:
                show: true
                borderColor: color-mix(in srgb, var(--divider-color) 50%, transparent)
                strokeDashArray: 0
                padding:
                  top: -10
              chart:
                height: 150px
              legend:
                show: false
              xaxis:
                labels:
                  show: false
                axisTicks:
                  show: false
                axisBorder:
                  color: color-mix(in srgb, var(--divider-color) 50%, transparent)
            series:
              - entity: sensor.zendure_2400_ac_relais_schakelingen_opladen_vandaag
                name: Relais Schakelingen Opladen
                transform: 'return x > 0 ? x - 1 : 0;'
                statistics:
                  period: day
                  type: max
                  align: middle
                type: column
                color: '#01a180'
                show:
                  in_header: false
                  extremas: false
              - entity: sensor.zendure_2400_ac_relais_schakelingen_ontladen_vandaag
                name: Relais Schakelingen Ontladen
                statistics:
                  period: day
                  type: max
                  align: middle
                type: column
                color: '#01a180'
                show:
                  in_header: false
                  extremas: false
          - type: heading
