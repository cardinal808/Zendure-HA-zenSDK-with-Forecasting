              - entity: input_number.besparing_accu_aanschafprijs
                name: Accu aanschafprijs
              - entity: input_number.besparing_accu_al_terugverdiend
                name: Accu al terugverdiend (vóór de meting)
              - entity: input_button.besparing_totaal_reset
                name: Totaal opnieuw beginnen
            visibility:
              - condition: state
                entity: input_number.besparing_vast_leveringsprijs
                state_not: unavailable
              - condition: state
                entity: input_boolean.forecast_tonen_op_dashboard
                state: 'on'
          - type: heading
            icon: ''
