# Zendure zenSDK (Gielz) + Forecasting | set: publiek (zonder HVAC) | referentie: FC-20261027
# Gebaseerd op Gielz1986/Zendure-HA-zenSDK (Michiel Hofker). Zie README.md voor licentie en wijzigingen.
# =====================================================================
# Zendure Forecasting (aanvulling op zendure_gielz1986_nl.yaml)
# Modus: "Dynamisch NOM + Forecasting"
#
# Plaats dit bestand naast zendure_gielz1986_nl.yaml (zelfde packages-map).
# Dit bestand bevat:
#   1. Invoervelden (helpers) voor de forecast-instellingen
#   2. Vermogenssensoren + integratiesensoren (kWh-tellers)
#   3. Statistieken: 7 dagen (zelfverbruik zon, gemiddeld gebruik) en gemeten laadvermogen
#   4. De planner: sensor.zendure_forecast_plan (+ sensor.zendure_forecast_grafiek)
#      met o.a. scenario A/B, pad-check (tot zon-dekking), efficiencyfilter en goedkoop-dal-blokkade
#
# Vaste waarden (drempels, terugvalwaarden) staan bovenaan de planner onder
# "Instellingen (vaste waarden)" met het voorvoegsel c_.
# =====================================================================

# ---------------------------------------------------------------------
# 1. Invoervelden
# ---------------------------------------------------------------------
input_text:
  forecast_zon_resterend_vandaag_sensor:
    name: Forecast Zon Resterend Vandaag Sensor
    icon: mdi:solar-power-variant
    max: 250
    mode: text

  forecast_zon_morgen_sensor:
    name: Forecast Zon Morgen Sensor
    icon: mdi:solar-power-variant-outline
    max: 250
    mode: text

  forecast_zon_productie_sensor:
    name: Forecast Zonnepanelen Productie Sensor (totaal kWh)
    icon: mdi:solar-panel
    max: 250
    mode: text

input_number:
  forecast_zelfverbruik_overwrite:
    name: Forecast Zelfverbruik Zon (alleen invullen indien overwrite)
    icon: mdi:home-lightning-bolt
    min: 0
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"

  forecast_laad_marge:
    name: Forecast Batterij Laadmarge
    icon: mdi:battery-plus-variant
    min: 0
    max: 50
    step: 1
    mode: box
    unit_of_measurement: "%"

  forecast_gebruik_standaard:
    name: Forecast Standaard Dagverbruik (tot er historie is)
    icon: mdi:home-lightning-bolt-outline
    min: 0
    max: 50
    step: 0.5
    mode: box
    unit_of_measurement: "kWh"

  forecast_betrouwbaarheid:
    name: Forecast Betrouwbaarheid Zonvoorspelling
    icon: mdi:weather-partly-cloudy
    min: 0
    max: 100
    step: 5
    mode: box
    unit_of_measurement: "%"

input_boolean:
  forecast_dal_ontladen_blokkeren:
    name: Forecast Niet Ontladen In Goedkoop Dal
    icon: mdi:battery-lock
  forecast_tonen_op_dashboard:
    name: Forecasting Tonen Op Dashboard
    icon: mdi:calendar-clock

input_button:
  forecast_herberekenen:
    name: Forecast Herberekenen
    icon: mdi:calculator-variant

# ---------------------------------------------------------------------
# 2. Integratiesensoren (kWh-tellers, afgeleid van vermogens-sensoren)
# ---------------------------------------------------------------------
sensor:
  - platform: integration
    name: "Forecast P1 Import Totaal"
    unique_id: forecast_p1_import_totaal
    source: sensor.forecast_p1_import_vermogen
    unit_prefix: k
    round: 3
    method: trapezoidal

  - platform: integration
    name: "Forecast P1 Export Totaal"
    unique_id: forecast_p1_export_totaal
    source: sensor.forecast_p1_export_vermogen
    unit_prefix: k
    round: 3
    method: trapezoidal

  - platform: integration
    name: "Forecast P1 Export Uit Zon Totaal"
    unique_id: forecast_p1_export_uit_zon_totaal
    source: sensor.forecast_p1_export_uit_zon_vermogen
    unit_prefix: k
    round: 3
    method: trapezoidal

  - platform: integration
    name: "Forecast Zendure Laden Totaal"
    unique_id: forecast_zendure_laden_totaal
    source: sensor.forecast_zendure_laden_vermogen
    unit_prefix: k
    round: 3
    method: trapezoidal

  - platform: integration
    name: "Forecast Zendure Ontladen Totaal"
    unique_id: forecast_zendure_ontladen_totaal
    source: sensor.forecast_zendure_ontladen_vermogen
    unit_prefix: k
    round: 3
    method: trapezoidal

  - platform: integration
    name: "Forecast Zendure Laden Uit Zon Totaal"
    unique_id: forecast_zendure_laden_uit_zon_totaal
    source: sensor.forecast_zendure_laden_uit_zon_vermogen
    unit_prefix: k
    round: 3
    method: trapezoidal

  # -------------------------------------------------------------------
  # 3. Statistieken over de afgelopen 7 dagen (rollend)
  #    Op de tellers uit "Forecast Teller ..." (zie template-sectie)
  # -------------------------------------------------------------------
  # Gemiddeld werkelijk netlaadvermogen over de recente laadsessies
  - platform: statistics
    name: "Forecast Gemeten Laadvermogen"
    unique_id: forecast_gemeten_laadvermogen
    entity_id: sensor.forecast_netladen_vermogen
    state_characteristic: mean
    max_age:
      days: 14
    sampling_size: 3000
    precision: 0

  - platform: statistics
    name: "Forecast Zon Productie 7 Dagen"
    unique_id: forecast_zon_productie_7_dagen
    entity_id: sensor.forecast_teller_zon_productie
    state_characteristic: change
    max_age:
      days: 7
    sampling_size: 1500
    precision: 2

  - platform: statistics
    name: "Forecast P1 Import 7 Dagen"
    unique_id: forecast_p1_import_7_dagen
    entity_id: sensor.forecast_teller_p1_import
    state_characteristic: change
    max_age:
      days: 7
    sampling_size: 1500
    precision: 2

  - platform: statistics
    name: "Forecast P1 Export 7 Dagen"
    unique_id: forecast_p1_export_7_dagen
    entity_id: sensor.forecast_teller_p1_export
    state_characteristic: change
    max_age:
      days: 7
    sampling_size: 1500
    precision: 2

  - platform: statistics
    name: "Forecast P1 Export Uit Zon 7 Dagen"
    unique_id: forecast_p1_export_uit_zon_7_dagen
    entity_id: sensor.forecast_teller_p1_export_uit_zon
    state_characteristic: change
    max_age:
      days: 7
    sampling_size: 1500
    precision: 2

  - platform: statistics
    name: "Forecast Zendure Laden 7 Dagen"
    unique_id: forecast_zendure_laden_7_dagen
    entity_id: sensor.forecast_teller_zendure_laden
    state_characteristic: change
    max_age:
      days: 7
    sampling_size: 1500
    precision: 2

  - platform: statistics
    name: "Forecast Zendure Ontladen 7 Dagen"
    unique_id: forecast_zendure_ontladen_7_dagen
    entity_id: sensor.forecast_teller_zendure_ontladen
    state_characteristic: change
    max_age:
      days: 7
    sampling_size: 1500
    precision: 2

  - platform: statistics
    name: "Forecast Zendure Laden Uit Zon 7 Dagen"
    unique_id: forecast_zendure_laden_uit_zon_7_dagen
    entity_id: sensor.forecast_teller_zendure_laden_uit_zon
    state_characteristic: change
    max_age:
      days: 7
    sampling_size: 1500
    precision: 2

template:
  # Ontladen vasthouden in een goedkoop dal (alleen modus Dynamisch NOM + Forecasting)
  - binary_sensor:
      - name: "Forecast Dal Ontladen Geblokkeerd"
        unique_id: forecast_dal_ontladen_geblokkeerd
        icon: mdi:battery-lock
        state: >
          {{ is_state('input_select.zendure_2400_ac_modus_selecteren', 'Dynamisch NOM + Forecasting')
             and is_state_attr('sensor.zendure_forecast_plan', 'ontladen_vasthouden', true) }}

  # -------------------------------------------------------------------
  # Vermogenssensoren (bron voor de integratiesensoren hierboven)
  #   P1:      positief = import, negatief = export
  #   Zendure: sensor.zendure_2400_ac_vermogen_aansturing
  #            positief = laden, negatief = ontladen
  # -------------------------------------------------------------------
  - sensor:
      - name: "Forecast P1 Import Vermogen"
        unique_id: forecast_p1_import_vermogen
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: "{{ has_value('sensor.p1_aansturing_vermogen') }}"
        state: "{{ [states('sensor.p1_aansturing_vermogen') | float(0), 0] | max }}"

      - name: "Forecast P1 Export Vermogen"
        unique_id: forecast_p1_export_vermogen
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: "{{ has_value('sensor.p1_aansturing_vermogen') }}"
        state: "{{ [0 - states('sensor.p1_aansturing_vermogen') | float(0), 0] | max }}"

      # Teruglevering die uit zon komt: P1-export min wat de batterij op dat moment ontlaadt
      # (anders telt export uit de batterij, bv. bij Dynamisch Handelen, als zonne-export)
      - name: "Forecast P1 Export Uit Zon Vermogen"
        unique_id: forecast_p1_export_uit_zon_vermogen
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: >
          {{ has_value('sensor.p1_aansturing_vermogen')
             and has_value('sensor.zendure_2400_ac_vermogen_aansturing') }}
        state: >
          {% set export_w = [0 - states('sensor.p1_aansturing_vermogen') | float(0), 0] | max %}
          {% set ontladen = [0 - states('sensor.zendure_2400_ac_vermogen_aansturing') | float(0), 0] | max %}
          {{ ([export_w - ontladen, 0] | max) | round(0) }}

      - name: "Forecast Zendure Laden Vermogen"
        unique_id: forecast_zendure_laden_vermogen
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: "{{ has_value('sensor.zendure_2400_ac_vermogen_aansturing') }}"
        state: "{{ [states('sensor.zendure_2400_ac_vermogen_aansturing') | float(0), 0] | max }}"

      - name: "Forecast Zendure Ontladen Vermogen"
        unique_id: forecast_zendure_ontladen_vermogen
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: "{{ has_value('sensor.zendure_2400_ac_vermogen_aansturing') }}"
        state: "{{ [0 - states('sensor.zendure_2400_ac_vermogen_aansturing') | float(0), 0] | max }}"

      # Het deel van het laadvermogen dat NIET uit het net komt (dus uit zon-overschot).
      # Het netdeel is de P1-import, begrensd op het laadvermogen.
      # Laadvermogen uit het net zoals de accu het echt haalt. Alleen beschikbaar tijdens
      # netladen (> 300 W), zodat de statistiek hieronder alleen echte laadsessies meetelt.
      - name: "Forecast Netladen Vermogen"
        unique_id: forecast_netladen_vermogen
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: >
          {% set laden = [states('sensor.zendure_2400_ac_vermogen_aansturing') | float(0), 0] | max %}
          {% set import_w = [states('sensor.p1_aansturing_vermogen') | float(0), 0] | max %}
          {{ has_value('sensor.p1_aansturing_vermogen')
             and has_value('sensor.zendure_2400_ac_vermogen_aansturing')
             and ([import_w, laden] | min) > 300 }}
        state: >
          {% set laden = [states('sensor.zendure_2400_ac_vermogen_aansturing') | float(0), 0] | max %}
          {% set import_w = [states('sensor.p1_aansturing_vermogen') | float(0), 0] | max %}
          {{ [import_w, laden] | min | round(0) }}

      - name: "Forecast Zendure Laden Uit Zon Vermogen"
        unique_id: forecast_zendure_laden_uit_zon_vermogen
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: >
          {{ has_value('sensor.p1_aansturing_vermogen')
             and has_value('sensor.zendure_2400_ac_vermogen_aansturing') }}
        state: >
          {% set laden = [states('sensor.zendure_2400_ac_vermogen_aansturing') | float(0), 0] | max %}
          {% set import_w = [states('sensor.p1_aansturing_vermogen') | float(0), 0] | max %}
          {{ (laden - [import_w, laden] | min) | round(0) }}

  # -------------------------------------------------------------------
  # Tellers elke 10 minuten "bevriezen" zodat de 7-daagse statistiek
  # niet duizenden samples per uur hoeft te verwerken.
  # -------------------------------------------------------------------
  - trigger:
      - platform: time_pattern
        minutes: "/10"
      - platform: homeassistant
        event: start
    sensor:
      - name: "Forecast Teller Zon Productie"
        unique_id: forecast_teller_zon_productie
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        availability: >
          {% set e = states('input_text.forecast_zon_productie_sensor') %}
          {{ e | lower | regex_match('^sensor\\..+') and has_value(e) }}
        state: >
          {% set e = states('input_text.forecast_zon_productie_sensor') %}
          {% set u = state_attr(e, 'unit_of_measurement') %}
          {% set v = states(e) | float(0) %}
          {% if u == 'Wh' %}
            {{ (v / 1000) | round(3) }}
          {% elif u == 'MWh' %}
            {{ (v * 1000) | round(3) }}
          {% else %}
            {{ v | round(3) }}
          {% endif %}

      - name: "Forecast Teller P1 Import"
        unique_id: forecast_teller_p1_import
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        availability: "{{ has_value('sensor.forecast_p1_import_totaal') }}"
        state: "{{ states('sensor.forecast_p1_import_totaal') | float(0) }}"

      - name: "Forecast Teller P1 Export"
        unique_id: forecast_teller_p1_export
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        availability: "{{ has_value('sensor.forecast_p1_export_totaal') }}"
        state: "{{ states('sensor.forecast_p1_export_totaal') | float(0) }}"

      - name: "Forecast Teller P1 Export Uit Zon"
        unique_id: forecast_teller_p1_export_uit_zon
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        availability: "{{ has_value('sensor.forecast_p1_export_uit_zon_totaal') }}"
        state: "{{ states('sensor.forecast_p1_export_uit_zon_totaal') | float(0) }}"

      - name: "Forecast Teller Zendure Laden"
        unique_id: forecast_teller_zendure_laden
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        availability: "{{ has_value('sensor.forecast_zendure_laden_totaal') }}"
        state: "{{ states('sensor.forecast_zendure_laden_totaal') | float(0) }}"

      - name: "Forecast Teller Zendure Ontladen"
        unique_id: forecast_teller_zendure_ontladen
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        availability: "{{ has_value('sensor.forecast_zendure_ontladen_totaal') }}"
        state: "{{ states('sensor.forecast_zendure_ontladen_totaal') | float(0) }}"

      - name: "Forecast Teller Zendure Laden Uit Zon"
        unique_id: forecast_teller_zendure_laden_uit_zon
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        availability: "{{ has_value('sensor.forecast_zendure_laden_uit_zon_totaal') }}"
        state: "{{ states('sensor.forecast_zendure_laden_uit_zon_totaal') | float(0) }}"

  # -------------------------------------------------------------------
  # 3b. Verbruiksprofiel per uur (werkdag en weekend)
  #     Elk heel uur: het huisverbruik van het afgelopen uur
  #     (import - export + zon - accu laden + accu ontladen) wordt verwerkt in een
  #     voortschrijdend gemiddelde voor dat uur van de dag, apart voor werkdag en weekend.
  #     Feestdagen: is binary_sensor.workday_sensor (Workday-integratie) aanwezig,
  #     dan bepaalt die of het een werkdag is. Anders geldt ma-vr als werkdag.
  #     De waarden blijven bewaard na een herstart.
  #     Let op: de entiteit moet sensor.forecast_verbruiksprofiel heten (leest zijn eigen vorige waarden).
  # -------------------------------------------------------------------
  - trigger:
      - platform: time_pattern
        minutes: 0
        seconds: 5
    variables:
      c_alpha_min: 0.2                   # gewicht van een nieuwe meting zodra er genoeg metingen zijn
      c_max_uur_kwh: 15                  # hoger uurverbruik geldt als meetfout
      nu_ts: "{{ as_timestamp(now()) }}"
      # Huidige tellerstanden (kWh); -1 = niet beschikbaar
      t_imp: "{{ states('sensor.forecast_p1_import_totaal') | float(-1) }}"
      t_exp: "{{ states('sensor.forecast_p1_export_totaal') | float(-1) }}"
      t_laden: "{{ states('sensor.forecast_zendure_laden_totaal') | float(-1) }}"
      t_ontl: "{{ states('sensor.forecast_zendure_ontladen_totaal') | float(-1) }}"
      t_prod: >
        {% set e = states('input_text.forecast_zon_productie_sensor') %}
        {% if e | lower | regex_match('^sensor\\..+') and has_value(e) %}
          {% set u = state_attr(e, 'unit_of_measurement') %}
          {% set v = states(e) | float(-1) %}
          {% if v < 0 %}-1{% elif u == 'Wh' %}{{ v / 1000 }}{% elif u == 'MWh' %}{{ v * 1000 }}{% else %}{{ v }}{% endif %}
        {% else %}-1{% endif %}
      vorige: "{{ state_attr('sensor.forecast_verbruiksprofiel', 'meting') }}"
      # 's Nachts mag de omvormer offline zijn: dan geldt de vorige stand (geen productie)
      prod_nu: >
        {% if t_prod >= 0 %}{{ t_prod }}
        {% elif vorige is mapping and not is_state('sun.sun', 'above_horizon') %}{{ vorige.prod }}
        {% else %}-1{% endif %}
      meting_ok: "{{ t_imp >= 0 and t_exp >= 0 and t_laden >= 0 and t_ontl >= 0 and prod_nu >= 0 }}"
      dagtype_nu: >
        {% if has_value('binary_sensor.workday_sensor') %}{{ 'werkdag' if is_state('binary_sensor.workday_sensor', 'on') else 'weekend' }}
        {% else %}{{ 'werkdag' if now().weekday() < 5 else 'weekend' }}{% endif %}
      # Verbruik van het afgelopen uur (alleen als de vorige meting ongeveer een uur oud is)
      uur_kwh: >
        {% if meting_ok and vorige is mapping and 3000 <= nu_ts - (vorige.ts | float(0)) <= 4200 %}
          {% set d = (t_imp - vorige.imp) - (t_exp - vorige.exp) + (prod_nu - vorige.prod) - (t_laden - vorige.laden) + (t_ontl - vorige.ontl) %}
          {{ (d | round(3)) if 0 <= d <= c_max_uur_kwh else -1 }}
        {% else %}-1{% endif %}
      uur_idx: "{{ ((vorige.ts | float(0)) | timestamp_custom('%H', true) | int) if vorige is mapping else -1 }}"
      uur_type: "{{ (vorige.dagtype if vorige is mapping and vorige.dagtype is defined else 'werkdag') }}"
    sensor:
      - name: "Forecast Verbruiksprofiel"
        unique_id: forecast_verbruiksprofiel
        icon: mdi:chart-timeline-variant
        unit_of_measurement: "uur"
        state: >
          {% set n1 = state_attr('sensor.forecast_verbruiksprofiel', 'n_werkdag') or [0] * 24 %}
          {% set n2 = state_attr('sensor.forecast_verbruiksprofiel', 'n_weekend') or [0] * 24 %}
          {% set ns = namespace(k=0) %}
          {% for i in range(24) %}{% if n1[i] | int(0) >= 3 %}{% set ns.k = ns.k + 1 %}{% endif %}{% if n2[i] | int(0) >= 2 %}{% set ns.k = ns.k + 1 %}{% endif %}{% endfor %}
          {{ ns.k }}
        attributes:
          # Gemiddeld verbruik (kWh) per uur van de dag, index 0 = 00:00-01:00
          werkdag: >
            {% set oud = state_attr('sensor.forecast_verbruiksprofiel', 'werkdag') or [none] * 24 %}
            {% set n = state_attr('sensor.forecast_verbruiksprofiel', 'n_werkdag') or [0] * 24 %}
            {% set ns = namespace(l=[]) %}
            {% for i in range(24) %}
              {% set w = oud[i] if oud | length == 24 else none %}
              {% if uur_kwh >= 0 and uur_type == 'werkdag' and uur_idx == i %}
                {% set a = [1 / ((n[i] | int(0)) + 1), c_alpha_min] | max %}
                {% set w = uur_kwh if w is none else (w * (1 - a) + uur_kwh * a) %}
                {% set w = w | round(3) %}
              {% endif %}
              {% set ns.l = ns.l + [w] %}
            {% endfor %}
            {{ ns.l }}
          weekend: >
            {% set oud = state_attr('sensor.forecast_verbruiksprofiel', 'weekend') or [none] * 24 %}
            {% set n = state_attr('sensor.forecast_verbruiksprofiel', 'n_weekend') or [0] * 24 %}
            {% set ns = namespace(l=[]) %}
            {% for i in range(24) %}
              {% set w = oud[i] if oud | length == 24 else none %}
              {% if uur_kwh >= 0 and uur_type == 'weekend' and uur_idx == i %}
                {% set a = [1 / ((n[i] | int(0)) + 1), c_alpha_min] | max %}
                {% set w = uur_kwh if w is none else (w * (1 - a) + uur_kwh * a) %}
                {% set w = w | round(3) %}
              {% endif %}
              {% set ns.l = ns.l + [w] %}
            {% endfor %}
            {{ ns.l }}
          # Aantal metingen per uur
          n_werkdag: >
            {% set n = state_attr('sensor.forecast_verbruiksprofiel', 'n_werkdag') or [0] * 24 %}
            {% set ns = namespace(l=[]) %}
            {% for i in range(24) %}
              {% set k = (n[i] | int(0)) if n | length == 24 else 0 %}
              {% set ns.l = ns.l + [k + 1 if (uur_kwh >= 0 and uur_type == 'werkdag' and uur_idx == i) else k] %}
            {% endfor %}
            {{ ns.l }}
          n_weekend: >
            {% set n = state_attr('sensor.forecast_verbruiksprofiel', 'n_weekend') or [0] * 24 %}
            {% set ns = namespace(l=[]) %}
            {% for i in range(24) %}
              {% set k = (n[i] | int(0)) if n | length == 24 else 0 %}
              {% set ns.l = ns.l + [k + 1 if (uur_kwh >= 0 and uur_type == 'weekend' and uur_idx == i) else k] %}
            {% endfor %}
            {{ ns.l }}
          laatste_uur_kwh: "{{ uur_kwh if uur_kwh >= 0 else none }}"
          laatste_uur: "{{ ('%02d:00 (%s)' | format(uur_idx, uur_type)) if uur_idx >= 0 and uur_kwh >= 0 else none }}"
          # Tellerstand van nu, voor de berekening over een uur
          meting: >
            {% if meting_ok %}{{ {'ts': nu_ts | round(0), 'imp': t_imp, 'exp': t_exp, 'prod': prod_nu, 'laden': t_laden, 'ontl': t_ontl, 'dagtype': dagtype_nu} }}{% else %}{{ none }}{% endif %}

  # -------------------------------------------------------------------
  # 4. DE PLANNER
  #    Alle berekeningen staan in "variables" (eenmalig per berekening)
  #    en worden door de state en de attributes hergebruikt.
  #
  #    State:  Laden | Wachten | Niet nodig | Niet gunstig |
  #            Geen prijzen | Geen batterijdata
  #    De automation laadt alleen als de state "Laden" is.
  # -------------------------------------------------------------------
  - trigger:
      - platform: time_pattern
        minutes: "/1"
      - platform: homeassistant
        event: start
      - platform: state
        entity_id:
          - input_button.forecast_herberekenen
          - input_text.forecast_zon_resterend_vandaag_sensor
          - input_text.forecast_zon_morgen_sensor
          - input_text.forecast_zon_productie_sensor
          - input_number.forecast_zelfverbruik_overwrite
          - input_number.forecast_laad_marge
          - input_number.forecast_betrouwbaarheid
          - input_number.forecast_gebruik_standaard
          - input_boolean.forecast_dal_ontladen_blokkeren
          - sensor.forecast_gemeten_laadvermogen
          - input_number.dynamisch_minimale_spread
          - input_number.zendure_2400_ac_max_oplaadvermogen
          - input_boolean.dynamisch_15_minuten
          - sensor.dynamisch_nordpool
          - sensor.zendure_2400_ac_laadpercentage
          - sensor.zendure_2400_ac_minimale_laadpercentage
          - sensor.zendure_2400_ac_maximale_laadpercentage
    variables:
      # ---- Instellingen (vaste waarden, hier aan te passen) ------------
      c_zelfverbruik_standaard_pct: 30   # zelfverbruik zolang er nog geen historie is
      c_min_productie_kwh: 2             # minimale zonproductie in 7 dagen voor een berekening
      c_min_gebruik_kwh: 1               # lager berekend dagverbruik wordt genegeerd
      c_zon_offset_s: 7200               # zon geldt als "voldoende" 2 uur na zonsopkomst
      c_min_overbrugging_s: 1800         # overbrugging is minstens 30 minuten
      c_laden_start_kwh: 0.3             # vanaf dit netladen (kWh) begint een laadronde
      c_laden_stop_kwh: 0.05             # onder dit restant (kWh) stopt een laadronde
      c_laden_min_w: 500                 # gemeten laadvermogen onder dit niveau wordt genegeerd
      c_prijs_noemer: 0.02               # ondergrens in prijsvergelijkingen (EUR/kWh)
      c_pad_min_uren: 0.25               # pad-check pas bij een gat van minstens 15 minuten
      c_pad_min_tekort_kwh: 0.2          # en een tekort van minstens 0,2 kWh
      c_detail_periode_s: 1800           # lengte van een periode in de detailvoorspelling (Solcast: 30 min)
      c_dek_offset_s: 10800              # zonder detailvoorspelling: zon dekt het verbruik 3 uur na zonsopkomst
      c_dek_min_kwh: 2                   # en alleen als er die dag minstens zoveel zon verwacht wordt

      # ---- Tijd -------------------------------------------------------
      nu_ts: "{{ as_timestamp(now()) }}"
      eind_vandaag_ts: "{{ as_timestamp(today_at('00:00') + timedelta(days=1)) }}"
      # Werkelijke lengte van vandaag (25 of 23 uur op de dag van de zomer-/wintertijdwissel)
      dag_lengte: "{{ eind_vandaag_ts - as_timestamp(today_at('00:00')) }}"
      dt_h: "{{ 0.25 if is_state('input_boolean.dynamisch_15_minuten', 'on') else 1.0 }}"

      # ---- Batterij ---------------------------------------------------
      p_set_kw: "{{ [states('input_number.zendure_2400_ac_max_oplaadvermogen') | float(2400), 100] | max / 1000 }}"
      # Gemeten gemiddeld netlaadvermogen (W); onbekend of onder c_laden_min_w = nog niet bruikbaar
      p_gemeten_w: "{{ states('sensor.forecast_gemeten_laadvermogen') | float(0) }}"
      # Rekenen met wat de accu echt haalt, nooit meer dan de ingestelde maximum
      p_max_kw: "{{ ([p_set_kw, p_gemeten_w / 1000] | min) if p_gemeten_w >= c_laden_min_w else p_set_kw }}"
      e_slot: "{{ (p_max_kw * dt_h) | round(4) }}"
      cap: "{{ states('sensor.zendure_2400_ac_totale_capaciteit') | float(0) }}"
      soc: "{{ states('sensor.zendure_2400_ac_laadpercentage') | float(0) }}"
      soc_min: "{{ states('sensor.zendure_2400_ac_minimale_laadpercentage') | float(0) }}"
      soc_max: "{{ states('sensor.zendure_2400_ac_maximale_laadpercentage') | float(100) }}"
      s_max: "{{ ([soc_max - soc_min, 0] | max / 100 * cap) | round(3) }}"
      s_nu: "{{ ([[soc, soc_max] | min - soc_min, 0] | max / 100 * cap) | round(3) }}"
      room: "{{ ([soc_max - soc, 0] | max / 100 * cap) | round(3) }}"
      # Efficiëntie (zelfde regels als de bestaande sensoren Beschikbare/Benodigde Energie)
      # Rendement uit het gemeten 24-uurs gemiddelde (>= 70%), anders uit het totale RTE
      eff_rte_basis: "{{ (states('sensor.zendure_2400_ac_rte_totaal') | float(0) / 100) ** 0.5 * 100 }}"
      eff_in: >
        {% set m = states('sensor.zendure_2400_ac_efficientie_import_24u_gemiddelde') | float(0) %}
        {% set e = m if m >= 70 else eff_rte_basis %}
        {{ (e if 50 <= e <= 100 else 92) / 100 }}
      eff_out: >
        {% set m = states('sensor.zendure_2400_ac_efficientie_export_24u_gemiddelde') | float(0) %}
        {% set e = m if m >= 70 else eff_rte_basis %}
        {{ (e if 50 <= e <= 100 else 92) / 100 }}
      eff_rt: "{{ (eff_in * eff_out) | round(4) }}"

      # ---- Zonne-energie (kWh) ----------------------------------------
      # -1 = sensor niet ingevuld of niet beschikbaar
      zon_rest_raw: >
        {% set e = states('input_text.forecast_zon_resterend_vandaag_sensor') %}
        {% if e | lower | regex_match('^sensor\\..+') and has_value(e) %}
          {% set u = state_attr(e, 'unit_of_measurement') %}
          {% set v = states(e) | float(0) %}
          {% if u == 'Wh' %}{{ v / 1000 }}{% elif u == 'MWh' %}{{ v * 1000 }}{% else %}{{ v }}{% endif %}
        {% else %}-1{% endif %}
      zon_morgen_raw: >
        {% set e = states('input_text.forecast_zon_morgen_sensor') %}
        {% if e | lower | regex_match('^sensor\\..+') and has_value(e) %}
          {% set u = state_attr(e, 'unit_of_measurement') %}
          {% set v = states(e) | float(0) %}
          {% if u == 'Wh' %}{{ v / 1000 }}{% elif u == 'MWh' %}{{ v * 1000 }}{% else %}{{ v }}{% endif %}
        {% else %}-1{% endif %}
      # 0 = niet gebruiken (=100%)
      betr: >
        {% set b = states('input_number.forecast_betrouwbaarheid') | float(0) %}
        {{ (b if b > 0 else 100) / 100 }}
      zon_rest: "{{ ([zon_rest_raw, 0] | max * betr) | round(2) }}"
      zon_morgen: "{{ ([zon_morgen_raw, 0] | max * betr) | round(2) }}"

      # ---- Historie over 7 dagen --------------------------------------
      prod7: "{{ states('sensor.forecast_zon_productie_7_dagen') | float(0) }}"
      imp7: "{{ states('sensor.forecast_p1_import_7_dagen') | float(0) }}"
      exp7: "{{ states('sensor.forecast_p1_export_7_dagen') | float(0) }}"
      exp_zon7: "{{ states('sensor.forecast_p1_export_uit_zon_7_dagen') | float(0) }}"
      laden7: "{{ states('sensor.forecast_zendure_laden_7_dagen') | float(0) }}"
      ontladen7: "{{ states('sensor.forecast_zendure_ontladen_7_dagen') | float(0) }}"
      laden_zon7: "{{ states('sensor.forecast_zendure_laden_uit_zon_7_dagen') | float(0) }}"
      hist_dagen: >
        {% set c = state_attr('sensor.forecast_zon_productie_7_dagen', 'age_coverage_ratio') %}
        {{ (7 * (c | float(1) if c is not none else 1)) | round(2) }}

      # Direct verbruikte zon in 7 dagen = productie - teruglevering uit zon - laden uit zon
      direct_7_kwh: "{{ [prod7 - exp_zon7 - laden_zon7, 0] | max }}"
      # Zelfverbruik zon (%) = direct verbruikte zon / productie
      zelfverbruik_berekend: >
        {% if prod7 >= c_min_productie_kwh %}
          {{ ([direct_7_kwh / prod7 * 100, 100] | min) | round(1) }}
        {% else %}-1{% endif %}
      zelfverbruik_overwrite: "{{ states('input_number.forecast_zelfverbruik_overwrite') | float(0) }}"
      zelfverbruik_pct: >
        {% if zelfverbruik_overwrite > 0 %}{{ zelfverbruik_overwrite }}
        {% elif zelfverbruik_berekend >= 0 %}{{ zelfverbruik_berekend }}
        {% else %}{{ c_zelfverbruik_standaard_pct }}{% endif %}
      zelfverbruik_bron: >
        {% if zelfverbruik_overwrite > 0 %}Overwrite
        {% elif zelfverbruik_berekend >= 0 %}Berekend (7 dagen, kWh per dag)
        {% else %}Standaard (nog geen historie){% endif %}
      direct: "{{ zelfverbruik_pct / 100 }}"
      # Direct zonneverbruik in kWh per dag (7-daags gemiddelde). Dit is vrijwel constant,
      # dus op een sombere dag is het percentage hoog en op een zonnige dag laag.
      direct_dag_kwh: >
        {% if prod7 >= c_min_productie_kwh and hist_dagen >= 0.5 %}
          {{ (direct_7_kwh / hist_dagen) | round(2) }}
        {% else %}-1{% endif %}
      # kWh-model alleen als er historie is en er geen overwrite is ingevuld
      direct_model_kwh: "{{ zelfverbruik_overwrite <= 0 and direct_dag_kwh >= 0 }}"

      # Gemiddeld gebruik per dag = import - export + productie - laden + ontladen
      gebruik_dag_berekend: >
        {% if hist_dagen >= 0.5 and (imp7 + prod7) > 0 %}
          {{ (([imp7 - exp7 + prod7 - laden7 + ontladen7, 0] | max) / hist_dagen) | round(2) }}
        {% else %}-1{% endif %}
      # Standaard dagverbruik (invoerveld); 0 = interne fallback van 8 kWh
      gebruik_standaard: >
        {% set g = states('input_number.forecast_gebruik_standaard') | float(0) %}
        {{ g if g > 0 else 8 }}
      gebruik_dag: "{{ gebruik_dag_berekend if gebruik_dag_berekend >= c_min_gebruik_kwh else gebruik_standaard }}"
      gebruik_bron: "{{ 'Berekend (7 dagen)' if gebruik_dag_berekend >= c_min_gebruik_kwh else 'Standaard (invoerveld, nog geen historie)' }}"
      l_uur: "{{ gebruik_dag / 24 }}"

      # ---- Verbruiksprofiel per uur (werkdag / weekend) ----------------
      # Per uur van de dag geldt het geleerde verbruik zodra er genoeg metingen zijn
      # (werkdag 3, weekend 2), anders het daggemiddelde / 24.
      prof_wd: "{{ state_attr('sensor.forecast_verbruiksprofiel', 'werkdag') or [] }}"
      prof_we: "{{ state_attr('sensor.forecast_verbruiksprofiel', 'weekend') or [] }}"
      prof_n_wd: "{{ state_attr('sensor.forecast_verbruiksprofiel', 'n_werkdag') or [] }}"
      prof_n_we: "{{ state_attr('sensor.forecast_verbruiksprofiel', 'n_weekend') or [] }}"
      vandaag_werkdag: >
        {% if has_value('binary_sensor.workday_sensor') %}{{ is_state('binary_sensor.workday_sensor', 'on') }}
        {% else %}{{ now().weekday() < 5 }}{% endif %}
      # 52 uurblokken vanaf het huidige hele uur: {'s': start, 'kw': kWh per uur, 'p': uit profiel}
      uur_last: >
        {%- set ns = namespace(l=[]) -%}
        {%- set h0 = (nu_ts // 3600) * 3600 -%}
        {%- set vandaag = now().date() | string -%}
        {%- for i in range(52) -%}
          {%- set st = h0 + i * 3600 -%}
          {%- set h = st | timestamp_custom('%H', true) | int -%}
          {%- set dag = st | timestamp_custom('%Y-%m-%d', true) -%}
          {%- set wd = vandaag_werkdag if dag == vandaag else (st | timestamp_custom('%w', true) | int) not in [0, 6] -%}
          {%- set prof = prof_wd if wd else prof_we -%}
          {%- set pn = prof_n_wd if wd else prof_n_we -%}
          {%- set nmin = 3 if wd else 2 -%}
          {%- set ok = prof | length == 24 and pn | length == 24 and prof[h] is not none and (pn[h] | int(0)) >= nmin -%}
          {%- set ns.l = ns.l + [{'s': st, 'kw': ((prof[h] | float(l_uur)) if ok else l_uur) | round(4), 'p': ok}] -%}
        {%- endfor -%}
        {{ ns.l }}
      uur_last_eind_ts: "{{ (nu_ts // 3600) * 3600 + 52 * 3600 }}"
      profiel_aandeel: "{{ (uur_last[:24] | selectattr('p') | list | length / 24 * 100) | round(0) }}"
      verbruik_bron_uur: >
        {% if profiel_aandeel >= 100 %}Profiel per uur ({{ 'werkdag' if vandaag_werkdag else 'weekend' }})
        {% elif profiel_aandeel > 0 %}Deels profiel ({{ profiel_aandeel | int }}% van de komende 24 uur), rest daggemiddelde
        {% else %}Daggemiddelde (profiel wordt nog geleerd){% endif %}

      # ---- Marge ------------------------------------------------------
      marge_pct: "{{ states('input_number.forecast_laad_marge') | float(0) }}"
      marge_dc: "{{ (marge_pct / 100 * cap) | round(3) }}"

      # ---- Zon (opkomst) ----------------------------------------------
      volgende_zon_ts: "{{ as_timestamp(state_attr('sun.sun', 'next_rising'), nu_ts + 43200) }}"
      zon_dag_is_vandaag: "{{ volgende_zon_ts < eind_vandaag_ts }}"
      zon_forecast_volgende: "{{ zon_rest if zon_dag_is_vandaag else zon_morgen }}"
      zon_voldoende: >
        {% set raw = zon_rest_raw if zon_dag_is_vandaag else zon_morgen_raw %}
        {{ raw >= 0 and zon_forecast_volgende >= gebruik_dag }}
      t_zon_ts: "{{ volgende_zon_ts + c_zon_offset_s }}"

      # ---- Prijsslots -------------------------------------------------
      raw_vandaag: "{{ state_attr('sensor.dynamisch_nordpool', 'raw_today') or [] }}"
      raw_morgen: "{{ state_attr('sensor.dynamisch_nordpool', 'raw_tomorrow') or [] }}"
      prijzen_ok: "{{ raw_vandaag | length > 0 }}"
      morgen_bekend: "{{ raw_morgen | length > 0 }}"
      # Slots van vandaag die nog (deels) in de toekomst liggen
      kand: >
        {%- set ns = namespace(l=[]) -%}
        {%- for p in raw_vandaag -%}
          {%- set e = as_timestamp(p.end) -%}
          {%- if e > nu_ts -%}
            {%- set ns.l = ns.l + [{'s': as_timestamp(p.start), 'e': e, 'v': p.value | float(0)}] -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.l }}
      # Slots van morgen (of, als de prijzen nog niet bekend zijn: het patroon van vandaag +24u)
      morg: >
        {%- set ns = namespace(l=[]) -%}
        {%- if morgen_bekend -%}
          {%- for p in raw_morgen -%}
            {%- set ns.l = ns.l + [{'s': as_timestamp(p.start), 'e': as_timestamp(p.end), 'v': p.value | float(0)}] -%}
          {%- endfor -%}
        {%- else -%}
          {%- for p in raw_vandaag -%}
            {%- set ns.l = ns.l + [{'s': as_timestamp(p.start) + dag_lengte, 'e': as_timestamp(p.end) + dag_lengte, 'v': p.value | float(0)}] -%}
          {%- endfor -%}
        {%- endif -%}
        {{ ns.l }}
      # Prijsstatistiek van de hele dag en de prijs van nu (voor dal-herkenning)
      p_dag_gem: >
        {% set v = raw_vandaag | map(attribute='value') | list %}
        {% if v | length > 0 %}{{ (v | sum / (v | length)) | round(5) }}{% else %}0{% endif %}
      p_dag_min: >
        {% set v = raw_vandaag | map(attribute='value') | list %}
        {% if v | length > 0 %}{{ v | min }}{% else %}0{% endif %}
      prijs_nu: >
        {%- set ns = namespace(p=none) -%}
        {%- for p in raw_vandaag -%}
          {%- if as_timestamp(p.start) <= nu_ts < as_timestamp(p.end) -%}{%- set ns.p = p.value | float(0) -%}{%- endif -%}
        {%- endfor -%}
        {{ ns.p if ns.p is not none else 999 }}
      # Aantal slots dat nodig is om de batterij volledig te vullen
      n_ref: >
        {% if e_slot > 0 and s_max > 0 %}
          {{ [(s_max / eff_in / e_slot) | round(0, 'ceil') | int, 1] | max }}
        {% else %}1{% endif %}
      p_vandaag_ref: >
        {% set s = kand | sort(attribute='v') %}
        {% set n = [n_ref, s | length] | min %}
        {% if n > 0 %}{{ (s[:n] | map(attribute='v') | sum / n) | round(5) }}{% else %}0{% endif %}
      p_morgen_ref: >
        {% set s = morg | sort(attribute='v') %}
        {% set n = [n_ref, s | length] | min %}
        {% if n > 0 %}{{ (s[:n] | map(attribute='v') | sum / n) | round(5) }}{% else %}0{% endif %}
      t_cheap_morgen_ts: >
        {% set s = morg | sort(attribute='v') %}
        {% set n = [n_ref, s | length] | min %}
        {% if n > 0 %}{{ s[:n] | map(attribute='s') | min }}{% else %}{{ eind_vandaag_ts }}{% endif %}
      spread_min: "{{ states('input_number.dynamisch_minimale_spread') | float(0) }}"
      spread_morgen: >
        {{ ((p_morgen_ref - p_vandaag_ref) / ([p_vandaag_ref | abs, c_prijs_noemer] | max) * 100) | round(1) }}
      # A = morgen goedkoper/gelijk (of onbekend): alleen overbruggen
      # B = morgen duurder: zo vol mogelijk laden
      scenario: "{{ 'B' if (morgen_bekend and spread_morgen > 0 and spread_morgen >= spread_min) else 'A' }}"

      # ---- Direct zonneverbruik per forecast --------------------------
      # Aandeel van de zonuren dat nog komt (voor het directe verbruik van vandaag)
      dag_fractie: >
        {% if is_state('sun.sun', 'above_horizon') %}
          {% set sets = as_timestamp(state_attr('sun.sun', 'next_setting'), nu_ts) %}
          {% set rise = volgende_zon_ts - 86400 %}
          {{ ([[(sets - nu_ts) / ([sets - rise, 3600] | max), 0] | max, 1] | min) | round(3) }}
        {% else %}1{% endif %}
      direct_rest_kwh: >
        {% if direct_model_kwh %}{{ ([zon_rest, direct_dag_kwh * dag_fractie] | min) | round(3) }}
        {% else %}{{ (zon_rest * direct) | round(3) }}{% endif %}
      direct_morgen_kwh: >
        {% if direct_model_kwh %}{{ ([zon_morgen, direct_dag_kwh] | min) | round(3) }}
        {% else %}{{ (zon_morgen * direct) | round(3) }}{% endif %}
      direct_rest_pct: "{{ (direct_rest_kwh / zon_rest * 100) | round(1) if zon_rest > 0 else zelfverbruik_pct }}"
      direct_morgen_pct: "{{ (direct_morgen_kwh / zon_morgen * 100) | round(1) if zon_morgen > 0 else zelfverbruik_pct }}"

      # ---- Overbruggingsperiode ---------------------------------------
      t_end_ts: >
        {% set t = [t_cheap_morgen_ts, t_zon_ts] | min if zon_voldoende else t_cheap_morgen_ts %}
        {{ [t, nu_ts + c_min_overbrugging_s] | max }}
      uren_bridge: "{{ ((t_end_ts - nu_ts) / 3600) | round(2) }}"
      # Zon van vandaag valt in de overbrugging, behalve als de overbrugging vóór zonsopkomst stopt
      zon_in_bridge: "{{ (not zon_dag_is_vandaag) or (t_end_ts > t_zon_ts) }}"
      last_bridge: >
        {%- set ns = namespace(k=0) -%}
        {%- for u in uur_last -%}
          {%- set a = [u.s, nu_ts] | max -%}{%- set b = [u.s + 3600, t_end_ts] | min -%}
          {%- if b > a -%}{%- set ns.k = ns.k + u.kw * (b - a) / 3600 -%}{%- endif -%}
        {%- endfor -%}
        {%- if t_end_ts > uur_last_eind_ts -%}{%- set ns.k = ns.k + l_uur * (t_end_ts - uur_last_eind_ts) / 3600 -%}{%- endif -%}
        {{ ns.k | round(3) }}
      direct_bridge: "{{ direct_rest_kwh if zon_in_bridge else 0 }}"
      # Wat de batterij (of het net) moet leveren tijdens de overbrugging
      need_bridge_ac: "{{ ([last_bridge - direct_bridge, 0] | max) | round(3) }}"
      need_bridge_dc: "{{ (need_bridge_ac / eff_out) | round(3) }}"
      # Zon-overschot dat naar de batterij kan
      zon_overschot_ac: "{{ ([zon_rest - direct_rest_kwh, 0] | max) | round(3) if zon_in_bridge else 0 }}"
      zon_dc: "{{ ([zon_overschot_ac * eff_in, room] | min) | round(3) }}"

      # ---- Doel en netladen -------------------------------------------
      target_dc: "{{ s_max if scenario == 'B' else ([need_bridge_dc + marge_dc, s_max] | min) | round(3) }}"
      grid_dc: "{{ ([[target_dc - s_nu - zon_dc, 0] | max, room] | min) | round(3) }}"
      grid_ac: "{{ (grid_dc / eff_in) | round(3) }}"
      n_slots: >
        {% if grid_ac >= c_laden_stop_kwh and e_slot > 0 %}{{ (grid_ac / e_slot) | round(0, 'ceil') | int }}{% else %}0{% endif %}
      # Gemiddelde prijs van alle slots in de overbruggingsperiode
      p_bridge_avg: >
        {% set ns = namespace(som=0, n=0) %}
        {% for x in kand %}{% if x.s < t_end_ts %}{% set ns.som = ns.som + x.v %}{% set ns.n = ns.n + 1 %}{% endif %}{% endfor %}
        {% for x in morg %}{% if x.s < t_end_ts %}{% set ns.som = ns.som + x.v %}{% set ns.n = ns.n + 1 %}{% endif %}{% endfor %}
        {% if ns.n > 0 %}{{ (ns.som / ns.n) | round(5) }}{% else %}{{ p_vandaag_ref }}{% endif %}
      # Vergelijkingsprijs: bij B de goedkoopste laadprijs van morgen, bij A het gemiddelde van de overbrugging
      p_vergelijk: "{{ p_morgen_ref if scenario == 'B' else p_bridge_avg }}"
      # Opgeslagen energie levert door het round-trip-verlies minder op: reken de waarde ervan terug
      p_vergelijk_eff: "{{ (p_vergelijk * eff_rt) if p_vergelijk > 0 else p_vergelijk }}"
      gekozen_basis: >
        {%- set ns = namespace(l=[]) -%}
        {%- for x in kand | sort(attribute='v') -%}
          {%- set sp = (p_vergelijk_eff - x.v) / ([x.v | abs, c_prijs_noemer] | max) * 100 -%}
          {#- Scenario A: ook onder het daggemiddelde (op een vlakke dag is er geen dal) -#}
          {%- set dal_ok = scenario == 'B' or x.v <= p_dag_gem -%}
          {%- if ns.l | length < n_slots and sp >= spread_min and sp > 0 and dal_ok -%}
            {%- set ns.l = ns.l + [x] -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.l | sort(attribute='s') }}
      # ---- Pad-check: haalt de accu het moment dat er weer energie bijkomt? ----
      # Een totale energiebalans zegt niets over het moment: de accu kan 's ochtends
      # leeg zijn terwijl de zon het verbruik pas uren later dekt. Dan koopt het huis
      # in dat gat in, vaak tegen de ochtendpiek. De pad-check rekent dat gat uit en
      # plant extra laadslots ervoor, maar alleen als die (na round-trip-verlies)
      # goedkoper zijn dan de inkoop in het gat. Hij werkt ook als er nog geen enkel
      # gewoon laadslot gepland is, en gebruikt ook de prijzen van morgen zodra die bekend zijn.

      # Zon-dekking: vanaf wanneer dekt de zon het verbruik?
      # Uit de detailvoorspelling (Solcast: attribuut detailedForecast, kW per half uur)
      # van de ingevulde sensoren en van de "_today"-variant van de resterend-vandaag-sensor.
      # Alleen de eerstvolgende zondag telt (tot de volgende zonsondergang).
      zon_ondergang_ts: "{{ as_timestamp(state_attr('sun.sun', 'next_setting'), nu_ts + 43200) }}"
      zon_detail: >
        {%- set e1 = states('input_text.forecast_zon_resterend_vandaag_sensor') | trim -%}
        {%- set e2 = states('input_text.forecast_zon_morgen_sensor') | trim -%}
        {%- set ns = namespace(l=[], ts=[], ids=[]) -%}
        {%- for e in [e1, e1 | replace('_remaining_today', '_today'), e2] -%}
          {%- if e | lower | regex_match('^sensor\\..+') and e not in ns.ids -%}
            {%- set ns.ids = ns.ids + [e] -%}
            {%- set d = state_attr(e, 'detailedForecast') or state_attr(e, 'detailed_forecast') or [] -%}
            {%- for p in d -%}
              {%- if p is mapping and p.period_start is defined -%}
                {%- set ps = as_timestamp(p.period_start, 0) -%}
                {%- if ps > nu_ts - c_detail_periode_s and ps < zon_ondergang_ts and ps not in ns.ts -%}
                  {%- set ns.ts = ns.ts + [ps] -%}
                  {%- set kw = (uur_last | selectattr('s', 'le', ps) | map(attribute='kw') | list | last) if (uur_last | selectattr('s', 'le', ps) | list | length) > 0 else l_uur -%}
                  {%- set ns.l = ns.l + [{'s': ps, 'pv': ((p.pv_estimate | float(0)) * betr) | round(3), 'kw': kw}] -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.l | sort(attribute='s') }}
      t_zon_dek_detail: >
        {%- set ns = namespace(t=0) -%}
        {%- for p in zon_detail -%}
          {%- if ns.t == 0 and p.pv >= p.kw -%}{%- set ns.t = [p.s, nu_ts] | max -%}{%- endif -%}
        {%- endfor -%}
        {{ ns.t }}
      zon_dek_bron: >
        {%- if zon_detail | length > 0 and t_zon_dek_detail > 0 -%}Detailvoorspelling
        {%- elif zon_detail | length > 0 -%}Detailvoorspelling: zon dekt het verbruik niet meer, tot einde overbrugging
        {%- elif is_state('sun.sun', 'above_horizon') or zon_forecast_volgende >= c_dek_min_kwh -%}Zonsopkomst + {{ (c_dek_offset_s / 3600) | round(1) }} uur
        {%- else -%}Geen (te weinig zon verwacht){%- endif -%}
      t_zon_dek_ts: >
        {%- if zon_detail | length > 0 -%}{{ t_zon_dek_detail if t_zon_dek_detail > 0 else t_end_ts }}
        {%- elif is_state('sun.sun', 'above_horizon') -%}{{ [volgende_zon_ts - 86400 + c_dek_offset_s, nu_ts] | max }}
        {%- elif zon_forecast_volgende >= c_dek_min_kwh -%}{{ volgende_zon_ts + c_dek_offset_s }}
        {%- else -%}{{ t_end_ts }}{%- endif -%}

      # Het gat: van "accu leeg" tot het eerste van: gewoon laadslot, zon-dekking, einde overbrugging
      t_leeg_ts: >
        {%- set ns = namespace(e=s_nu * eff_out, t=0) -%}
        {%- for u in uur_last -%}
          {%- if ns.t == 0 -%}
            {%- set a = [u.s, nu_ts] | max -%}{%- set b = u.s + 3600 -%}
            {%- set nodig = u.kw * (b - a) / 3600 -%}
            {%- if nodig >= ns.e and u.kw > 0 -%}{%- set ns.t = a + ns.e / u.kw * 3600 -%}
            {%- else -%}{%- set ns.e = ns.e - nodig -%}{%- endif -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.t if ns.t > 0 else (uur_last_eind_ts + (ns.e / l_uur * 3600 if l_uur > 0 else 172800)) }}
      t_eerste_slot_ts: "{{ (gekozen_basis | map(attribute='s') | min) if gekozen_basis | length > 0 else t_end_ts }}"
      t_gap_eind_ts: "{{ [t_eerste_slot_ts, t_zon_dek_ts, t_end_ts] | min }}"
      t_gap_start_ts: "{{ [t_leeg_ts, nu_ts] | max }}"
      gap_uren: "{{ ([t_gap_eind_ts - t_gap_start_ts, 0] | max / 3600) | round(2) }}"
      gap_last: >
        {%- set ns = namespace(k=0) -%}
        {%- for u in uur_last -%}
          {%- set a = [u.s, t_gap_start_ts] | max -%}{%- set b = [u.s + 3600, t_gap_eind_ts] | min -%}
          {%- if b > a -%}{%- set ns.k = ns.k + u.kw * (b - a) / 3600 -%}{%- endif -%}
        {%- endfor -%}
        {{ ns.k | round(3) }}
      # Kandidaat-slots: de rest van vandaag, plus morgen als die prijzen echt bekend zijn
      pad_kand: "{{ kand + (morg if morgen_bekend else []) }}"
      # Per prijsslot in het gat: verbruik min de zon die daar al direct verbruikt wordt
      # (zon alleen bekend met detailvoorspelling)
      gap_kwartieren: >
        {%- set ns = namespace(l=[]) -%}
        {%- for x in pad_kand -%}
          {%- set a = [x.s, t_gap_start_ts] | max -%}
          {%- set b = [x.e, t_gap_eind_ts] | min -%}
          {%- if b > a -%}
            {%- set nz = namespace(k=0) -%}
            {%- for p in zon_detail -%}
              {%- set pa = [p.s, a] | max -%}
              {%- set pb = [p.s + c_detail_periode_s, b] | min -%}
              {%- if pb > pa -%}{%- set nz.k = nz.k + ([p.pv, p.kw] | min) * (pb - pa) / 3600 -%}{%- endif -%}
            {%- endfor -%}
            {%- set uu = uur_last | selectattr('s', 'le', a) | list -%}
            {%- set kw = (uu | last).kw if uu | length > 0 else l_uur -%}
            {%- set ns.l = ns.l + [{'s': x.s, 'v': x.v, 'kwh': ([kw * (b - a) / 3600 - nz.k, 0] | max) | round(4)}] -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.l }}
      gap_tekort_ac: "{{ (gap_kwartieren | map(attribute='kwh') | sum) | round(3) }}"
      gap_zon_direct: "{{ ([gap_last - gap_tekort_ac, 0] | max) | round(3) }}"
      # Goedkoopste laadmoment dat het gat nog kan helpen
      p_laad_min: >
        {% set v = pad_kand | selectattr('s', 'lt', t_gap_eind_ts) | map(attribute='v') | list %}
        {% if v | length > 0 %}{{ v | min }}{% else %}0{% endif %}
      # Alleen de slots in het gat die duurder zijn dan dat laadmoment na round-trip-verlies tellen mee:
      # inkopen in een goedkoop deel van het gat is goedkoper dan eerst opslaan.
      gap_waardevol: >
        {%- set ns = namespace(l=[]) -%}
        {%- for q in gap_kwartieren -%}
          {%- set sp = (q.v * eff_rt - p_laad_min) / ([p_laad_min | abs, c_prijs_noemer] | max) * 100 -%}
          {%- if q.kwh > 0 and sp > 0 and sp >= spread_min -%}{%- set ns.l = ns.l + [q] -%}{%- endif -%}
        {%- endfor -%}
        {{ ns.l }}
      gap_waardevol_ac: "{{ (gap_waardevol | map(attribute='kwh') | sum) | round(3) }}"
      # Gewogen gemiddelde inkoopprijs in die dure slots
      p_gap_avg: >
        {% set ns = namespace(som=0, kwh=0) %}
        {% for q in gap_waardevol %}{% set ns.som = ns.som + q.v * q.kwh %}{% set ns.kwh = ns.kwh + q.kwh %}{% endfor %}
        {% if ns.kwh > 0 %}{{ (ns.som / ns.kwh) | round(5) }}{% else %}0{% endif %}
      pad_actief: "{{ gap_uren >= c_pad_min_uren and gap_waardevol_ac >= c_pad_min_tekort_kwh and p_gap_avg > 0 }}"
      # Toewijzing: elk duur slot in het gat (duurste eerst) krijgt de goedkoopste laadslots
      # die vóór dat dure slot eindigen. Een laadslot dat pas na de piek valt, helpt de piek niet.
      # Een laadslot levert maximaal e_slot kWh (AC) en kan meerdere dure slots bedienen.
      # Begrensd op de ruimte in de accu.
      pad_toewijzing: >
        {%- set ns = namespace(l=[], totaal=0) -%}
        {%- set max_ac = (room / eff_in) if eff_in > 0 else 0 -%}
        {%- if pad_actief and e_slot > 0 and eff_rt > 0 -%}
          {%- set laad_kand = pad_kand | sort(attribute='v') -%}
          {%- for q in gap_waardevol | sort(attribute='v', reverse=true) -%}
            {%- set nq = namespace(nodig=q.kwh / eff_rt) -%}
            {%- for x in laad_kand -%}
              {%- if nq.nodig > 0.001 and ns.totaal < max_ac and x.e <= q.s and x.e > nu_ts -%}
                {%- set sp = (q.v * eff_rt - x.v) / ([x.v | abs, c_prijs_noemer] | max) * 100 -%}
                {%- if sp > 0 and sp >= spread_min -%}
                  {%- set gebruikt = ns.l | selectattr('s', 'eq', x.s) | map(attribute='k') | sum -%}
                  {%- set neem = [e_slot - gebruikt, nq.nodig, max_ac - ns.totaal] | min -%}
                  {%- if neem > 0.001 -%}
                    {%- set ns.l = ns.l + [{'s': x.s, 'k': neem | round(4)}] -%}
                    {%- set ns.totaal = ns.totaal + neem -%}
                    {%- set nq.nodig = nq.nodig - neem -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endfor -%}
        {%- endif -%}
        {{ ns.l }}
      pad_netladen_ac: "{{ (pad_toewijzing | map(attribute='k') | sum) | round(3) }}"
      extra_slots: >
        {%- set ss = pad_toewijzing | map(attribute='s') | list -%}
        {{ pad_kand | selectattr('s', 'in', ss) | list }}

      # ---- Totaal netladen en definitieve slots ------------------------------
      # Het gewone plan en de pad-check overlappen: het gat zit al in de totale energiebalans.
      # Daarom telt het grootste van de twee, niet de som.
      netladen_ac: "{{ ([grid_ac, pad_netladen_ac if extra_slots | length > 0 else 0] | max) | round(3) }}"
      n_totaal: >
        {% if netladen_ac >= c_laden_stop_kwh and e_slot > 0 %}{{ (netladen_ac / e_slot) | round(0, 'ceil') | int }}{% else %}0{% endif %}
      gekozen: >
        {%- set extra_s = extra_slots | map(attribute='s') | list -%}
        {%- set ns = namespace(l=extra_slots) -%}
        {%- for x in gekozen_basis | sort(attribute='v') -%}
          {%- if x.s not in extra_s and ns.l | length < n_totaal -%}
            {%- set ns.l = ns.l + [x] -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.l | sort(attribute='s') }}
      slot_nu: >
        {% set ns = namespace(a=false) %}
        {% for x in gekozen %}{% if x.s <= nu_ts < x.e %}{% set ns.a = true %}{% endif %}{% endfor %}
        {{ ns.a }}
      gepland_ac: "{{ ([gekozen | length * e_slot, netladen_ac] | min) | round(3) }}"
      p_gekozen_avg: >
        {% if gekozen | length > 0 %}{{ (gekozen | map(attribute='v') | sum / (gekozen | length)) | round(5) }}{% else %}0{% endif %}
      kosten: "{{ (gepland_ac * p_gekozen_avg) | round(2) }}"

      # ---- Goedkoop dal: accu niet ontladen --------------------------------
      # Dal = prijs nu onder (laagste dagprijs / rendement) en onder het daggemiddelde.
      dal_drempel: "{{ (p_dag_min + (p_dag_min | abs) * (1 / eff_rt - 1)) | round(5) if eff_rt > 0 else p_dag_min }}"
      in_dal: "{{ prijzen_ok and prijs_nu < 999 and prijs_nu <= dal_drempel and prijs_nu < p_dag_gem }}"
      # Alleen vasthouden als er nog uit het net bijgeladen moet worden (accu komt niet vol uit zon)
      ontladen_vasthouden: >
        {{ is_state('input_boolean.forecast_dal_ontladen_blokkeren', 'on') and in_dal and netladen_ac >= c_laden_stop_kwh }}

      # ---- Overzicht voor morgen --------------------------------------
      morgen_direct: "{{ direct_morgen_kwh | round(2) }}"
      morgen_gebruik_batterij: "{{ ([gebruik_dag - morgen_direct, 0] | max) | round(2) }}"
      morgen_zon_overschot: "{{ ([zon_morgen - direct_morgen_kwh, 0] | max) | round(2) }}"
      morgen_zon_dc: "{{ ([morgen_zon_overschot * eff_in, s_max] | min) | round(2) }}"
      morgen_netladen: >
        {% set doel = [morgen_gebruik_batterij / eff_out + marge_dc, s_max] | min %}
        {{ (([doel - morgen_zon_dc, 0] | max) / eff_in) | round(2) }}
      n_morgen: >
        {% if e_slot > 0 and morgen_netladen >= c_laden_stop_kwh %}{{ (morgen_netladen / e_slot) | round(0, 'ceil') | int }}{% else %}0{% endif %}
      morgen_laadslots: >
        {%- set ns = namespace(l=[]) -%}
        {%- for x in (morg | sort(attribute='v'))[:n_morgen] -%}
          {%- set ns.l = ns.l + [x.s] -%}
        {%- endfor -%}
        {{ ns.l }}

      # ---- Tijdlijn (voorspelling per prijsslot, voor de dashboardgrafiek) ----
      # Simuleert per slot: verbruik (profiel), zon (detailvoorspelling), laden uit het net
      # in de geplande slots (vandaag) en de indicatieve laadslots van morgen, en verder
      # nul-op-de-meter: tekort uit de accu, overschot in de accu. Indicatief: HVAC en
      # dal-blokkade worden hier niet meegenomen.
      tl_slots: "{{ (kand + morg) | sort(attribute='s') | selectattr('e', 'gt', nu_ts) | list }}"
      tl_eind_ts: "{{ (tl_slots | map(attribute='e') | max) if tl_slots | length > 0 else nu_ts }}"
      tl_zon: >
        {%- set e1 = states('input_text.forecast_zon_resterend_vandaag_sensor') | trim -%}
        {%- set e2 = states('input_text.forecast_zon_morgen_sensor') | trim -%}
        {%- set ns = namespace(l=[], ts=[], ids=[]) -%}
        {%- for e in [e1, e1 | replace('_remaining_today', '_today'), e2] -%}
          {%- if e | lower | regex_match('^sensor\\..+') and e not in ns.ids -%}
            {%- set ns.ids = ns.ids + [e] -%}
            {%- set d = state_attr(e, 'detailedForecast') or state_attr(e, 'detailed_forecast') or [] -%}
            {%- for q in d -%}
              {%- if q is mapping and q.period_start is defined -%}
                {%- set ps = as_timestamp(q.period_start, 0) -%}
                {%- if ps > nu_ts - c_detail_periode_s and ps < tl_eind_ts and ps not in ns.ts -%}
                  {%- set ns.ts = ns.ts + [ps] -%}
                  {%- set ns.l = ns.l + [{'s': ps, 'pv': ((q.pv_estimate | float(0)) * betr) | round(3)}] -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.l | sort(attribute='s') }}
      tl_laad_s: "{{ (gekozen | map(attribute='s') | list) + morgen_laadslots }}"
      p_ontl_kw: "{{ [states('input_number.zendure_2400_ac_max_ontlaadvermogen') | float(2400), 100] | max / 1000 }}"
      tijdlijn: >
        {%- set ns = namespace(soc=s_nu, t=[], p=[], bek=[], laad=[], pv=[], last=[], accu=[], soc_l=[], net=[]) -%}
        {%- set bekend_tot = eind_vandaag_ts + (dag_lengte if morgen_bekend else 0) -%}
        {%- for x in tl_slots -%}
          {%- set a = [x.s, nu_ts] | max -%}
          {%- set dur = (x.e - a) / 3600 -%}
          {%- if dur > 0 -%}
            {%- set uu = uur_last | selectattr('s', 'le', a) | list -%}
            {%- set last = ((uu | last).kw if uu | length > 0 else l_uur) * dur -%}
            {%- set nz = namespace(k=0) -%}
            {%- for q in tl_zon | selectattr('s', 'gt', a - c_detail_periode_s) | selectattr('s', 'lt', x.e) -%}
              {%- set ov = [q.s + c_detail_periode_s, x.e] | min - [q.s, a] | max -%}
              {%- if ov > 0 -%}{%- set nz.k = nz.k + q.pv * ov / 3600 -%}{%- endif -%}
            {%- endfor -%}
            {%- set pv = nz.k -%}
            {%- set ruimte_ac = ([s_max - ns.soc, 0] | max) / eff_in -%}
            {%- set laden = x.s in tl_laad_s -%}
            {%- if laden -%}
              {%- set accu = [p_max_kw * dur, ruimte_ac] | min -%}
              {%- set net = last - pv + accu -%}
            {%- elif last >= pv -%}
              {%- set accu = 0 - ([last - pv, ns.soc * eff_out, p_ontl_kw * dur] | min) -%}
              {%- set net = last - pv + accu -%}
            {%- else -%}
              {%- set accu = [pv - last, ruimte_ac, p_set_kw * dur] | min -%}
              {%- set net = last - pv + accu -%}
            {%- endif -%}
            {%- set ns.soc = ns.soc + (accu * eff_in if accu > 0 else accu / eff_out) -%}
            {%- set ns.soc = [[ns.soc, 0] | max, s_max] | min -%}
            {%- set ns.t = ns.t + [x.s | int] -%}
            {%- set ns.p = ns.p + [x.v | round(4)] -%}
            {%- set ns.bek = ns.bek + [1 if x.s < bekend_tot else 0] -%}
            {%- set ns.laad = ns.laad + [1 if laden else 0] -%}
            {%- set ns.pv = ns.pv + [(pv / dur) | round(2)] -%}
            {%- set ns.last = ns.last + [(last / dur) | round(2)] -%}
            {%- set ns.accu = ns.accu + [(accu / dur) | round(2)] -%}
            {%- set ns.soc_l = ns.soc_l + [((soc_min + ns.soc / cap * 100) if cap > 0 else 0) | round(1)] -%}
            {%- set ns.net = ns.net + [(net / dur) | round(2)] -%}
          {%- endif -%}
        {%- endfor -%}
        {{ {'t': ns.t, 'prijs': ns.p, 'bekend': ns.bek, 'laden': ns.laad, 'zon_kw': ns.pv, 'verbruik_kw': ns.last,
            'accu_kw': ns.accu, 'soc_pct': ns.soc_l, 'net_kw': ns.net, 'soc_nu_pct': soc} }}
    sensor:
      - name: "Zendure Forecast Plan"
        unique_id: zendure_forecast_plan
        icon: mdi:calendar-clock
        state: >
          {% if not prijzen_ok %}
            Geen prijzen
          {% elif cap <= 0 or not has_value('sensor.zendure_2400_ac_laadpercentage') %}
            Geen batterijdata
          {% else %}
            {% set drempel = c_laden_stop_kwh if this.state == 'Laden' else c_laden_start_kwh %}
            {% if netladen_ac < drempel %}
              Niet nodig
            {% elif gekozen | length == 0 %}
              Niet gunstig
            {% elif slot_nu %}
              Laden
            {% else %}
              Wachten
            {% endif %}
          {% endif %}
        attributes:
          # --- Plan vandaag ---
          scenario: >
            {% if not morgen_bekend %}A (prijzen morgen nog onbekend, patroon van vandaag aangehouden)
            {% elif scenario == 'B' %}B (morgen duurder: zo vol mogelijk laden)
            {% else %}A (morgen goedkoper of gelijk: alleen overbruggen){% endif %}
          morgen_prijzen_bekend: "{{ morgen_bekend }}"
          netladen_vandaag_kwh: "{{ netladen_ac }}"
          netladen_energiebalans_kwh: "{{ grid_ac }}"
          gepland_netladen_kwh: "{{ gepland_ac }}"
          doel_opgeslagen_kwh: "{{ target_dc }}"
          batterij_nu_kwh: "{{ s_nu }}"
          batterij_max_kwh: "{{ s_max }}"
          verwacht_batterijgebruik_kwh: "{{ need_bridge_ac }}"
          verwachte_zon_naar_batterij_kwh: "{{ zon_dc }}"
          zon_overschot_kwh: "{{ zon_overschot_ac }}"
          overbruggen_tot: "{{ (t_end_ts | timestamp_custom('%Y-%m-%d %H:%M', true)) }}"
          overbruggen_uren: "{{ uren_bridge }}"
          zon_voldoende_volgende_dag: "{{ zon_voldoende }}"
          prijs_vandaag_ref: "{{ p_vandaag_ref }}"
          prijs_morgen_ref: "{{ p_morgen_ref }}"
          spread_morgen_pct: "{{ spread_morgen }}"
          gemiddelde_laadprijs: "{{ p_gekozen_avg }}"
          geschatte_kosten: "{{ kosten }}"
          geplande_slots: >
            {%- set ns = namespace(l=[]) -%}
            {%- for x in gekozen -%}
              {%- set ns.l = ns.l + [{'start': x.s | timestamp_custom('%H:%M', true), 'eind': x.e | timestamp_custom('%H:%M', true), 'prijs': x.v}] -%}
            {%- endfor -%}
            {{ ns.l }}
          # --- Uitleg van het plan in gewone taal (voor het dashboard) ---
          plan_uitleg: >
            {%- macro tijd(ts) -%}{{ ('morgen ' if (ts | timestamp_custom('%Y-%m-%d', true)) != (nu_ts | timestamp_custom('%Y-%m-%d', true)) else '') ~ (ts | timestamp_custom('%H:%M', true)) }}{%- endmacro -%}
            {%- set drempel = c_laden_stop_kwh if this.state == 'Laden' else c_laden_start_kwh -%}
            {%- set leeg = s_nu <= 0.05 -%}
            {%- if not prijzen_ok -%}Geen prijzen beschikbaar, er wordt niets gepland.
            {%- elif netladen_ac < drempel -%}Geen netladen nodig: accu en verwachte zon zijn genoeg tot {{ tijd(t_end_ts) }}.
            {%- elif gekozen | length == 0 -%}
              {%- if leeg -%}De accu is leeg. Het huis neemt nu direct stroom uit het net{% if gap_kwartieren | length > 0 %}, tot {{ tijd(t_gap_eind_ts) }} voor maximaal €{{ '%.3f' | format(gap_kwartieren | map(attribute='v') | max) }}{% endif %}. Er is daarvoor geen laadmoment meer dat na {{ ((1 - eff_rt) * 100) | round(0) | int }}% laad- en ontlaadverlies goedkoper is dan direct inkopen.
              {%- else -%}De accu levert tot ongeveer {{ tijd(t_leeg_ts) }}. Bijladen uit het net loont nu niet: geen enkel slot is na verlies goedkoper dan de inkoop die het zou vervangen.
              {%- endif -%}
              {%- if not morgen_bekend %} Rond 14:00 komen de prijzen van morgen, dan wordt opnieuw gepland.
              {%- elif (t_cheap_morgen_ts | timestamp_custom('%Y-%m-%d', true)) != (nu_ts | timestamp_custom('%Y-%m-%d', true)) %} Na middernacht neemt hij de prijzen van morgen mee en plant hij het laden voor de ochtend (goedkoopste moment vanaf {{ t_cheap_morgen_ts | timestamp_custom('%H:%M', true) }}).
              {%- endif -%}
            {%- else -%}
              {%- set eerste = gekozen | first -%}
              {%- if slot_nu -%}Nu aan het laden uit het net{% if prijs_nu < 999 %} (€{{ '%.3f' | format(prijs_nu) }}){% endif %}.
              {%- else -%}Volgende laadmoment: {{ tijd(eerste.s) }} (€{{ '%.3f' | format(eerste.v) }}).{%- endif %} In totaal {{ gekozen | length }} laadslot(s), samen ongeveer {{ gepland_ac | round(1) }} kWh voor €{{ '%.2f' | format(kosten) }}{% if extra_slots | length > 0 %}, waarvan {{ extra_slots | length }} voor het dure gat tot {{ tijd(t_gap_eind_ts) }} (gemiddeld €{{ '%.3f' | format(p_gap_avg) }}){% endif %}.
              {%- if leeg and not slot_nu %} Tot dan neemt het huis direct stroom uit het net.{% endif -%}
            {%- endif -%}
          # --- Pad-check (haalt de accu het moment dat er weer energie bijkomt?) ---
          padcheck_accu_leeg_om: "{{ (t_leeg_ts | timestamp_custom('%Y-%m-%d %H:%M', true)) if t_leeg_ts < nu_ts + 172800 else none }}"
          padcheck_zon_dekt_vanaf: "{{ t_zon_dek_ts | timestamp_custom('%Y-%m-%d %H:%M', true) }}"
          padcheck_zon_bron: "{{ zon_dek_bron }}"
          padcheck_gat_eind: "{{ t_gap_eind_ts | timestamp_custom('%Y-%m-%d %H:%M', true) }}"
          padcheck_gat_uren: "{{ gap_uren }}"
          padcheck_zon_in_gat_kwh: "{{ gap_zon_direct }}"
          padcheck_tekort_kwh: "{{ gap_tekort_ac }}"
          padcheck_tekort_dure_slots_kwh: "{{ gap_waardevol_ac }}"
          padcheck_gat_prijs: "{{ p_gap_avg }}"
          padcheck_netladen_kwh: "{{ pad_netladen_ac }}"
          padcheck_extra_slots: "{{ extra_slots | length }}"
          # --- Dal en laadvermogen ---
          prijs_nu: "{{ prijs_nu if prijs_nu < 999 else none }}"
          dal_drempel: "{{ dal_drempel }}"
          in_dal: "{{ in_dal }}"
          ontladen_vasthouden: "{{ ontladen_vasthouden }}"
          laadvermogen_gebruikt_kw: "{{ p_max_kw | round(2) }}"
          laadvermogen_gemeten_w: "{{ p_gemeten_w if p_gemeten_w >= c_laden_min_w else none }}"
          laadvermogen_ingesteld_kw: "{{ p_set_kw }}"
          rendement_round_trip_pct: "{{ (eff_rt * 100) | round(1) }}"
          # --- Invoer zoals gebruikt ---
          zon_resterend_vandaag_kwh: "{{ zon_rest }}"
          zon_morgen_kwh: "{{ zon_morgen }}"
          zon_resterend_vandaag_sensor_ok: "{{ zon_rest_raw >= 0 }}"
          zon_morgen_sensor_ok: "{{ zon_morgen_raw >= 0 }}"
          betrouwbaarheid_pct: "{{ (betr * 100) | round(0) }}"
          zelfverbruik_pct: "{{ direct_rest_pct if zon_rest > 0 else direct_morgen_pct }}"
          zelfverbruik_vandaag_pct: "{{ direct_rest_pct }}"
          zelfverbruik_morgen_pct: "{{ direct_morgen_pct }}"
          direct_verbruik_dag_kwh: "{{ direct_dag_kwh if direct_dag_kwh >= 0 else none }}"
          zelfverbruik_bron: "{{ zelfverbruik_bron }}"
          zelfverbruik_berekend_pct: "{{ zelfverbruik_berekend if zelfverbruik_berekend >= 0 else none }}"
          gebruik_dag_kwh: "{{ gebruik_dag }}"
          gebruik_bron: "{{ gebruik_bron }}"
          verbruik_per_uur_bron: "{{ verbruik_bron_uur }}"
          verbruik_komende_24u_kwh: "{{ (uur_last[:24] | map(attribute='kw') | sum) | round(2) }}"
          historie_dagen: "{{ hist_dagen }}"
          marge_pct: "{{ marge_pct }}"
          marge_kwh: "{{ marge_dc }}"
          efficientie_laden_pct: "{{ (eff_in * 100) | round(1) }}"
          efficientie_ontladen_pct: "{{ (eff_out * 100) | round(1) }}"
          # --- Morgen ---
          morgen_zon_direct_kwh: "{{ morgen_direct }}"
          morgen_batterijgebruik_kwh: "{{ morgen_gebruik_batterij }}"
          morgen_zon_naar_batterij_kwh: "{{ morgen_zon_dc }}"
          morgen_netladen_indicatie_kwh: "{{ morgen_netladen }}"
          morgen_goedkoopste_start: >
            {% if morgen_bekend %}{{ t_cheap_morgen_ts | timestamp_custom('%H:%M', true) }}{% else %}onbekend{% endif %}

      # Grafiekdata staat in een apart sensor-object: samen zijn de attributen groter dan
      # de 16 kB-limiet van de recorder, en zo blijft de geschiedenis van het plan zelf bewaard.
      # Tip: sluit dit object uit van de recorder (recorder: exclude: entities).
      - name: "Zendure Forecast Grafiek"
        unique_id: zendure_forecast_grafiek
        icon: mdi:chart-bar
        state: "{{ raw_vandaag | length }}"
        attributes:
          # Voorspelling per prijsslot: t (start, unix), prijs, bekend (0 = patroon van vandaag),
          # laden (1 = gepland netladen), zon_kw, verbruik_kw, accu_kw (+ laden / - ontladen),
          # soc_pct (laadpercentage aan het eind van het slot), net_kw (+ import / - export)
          tijdlijn: "{{ tijdlijn }}"
          # Zelfde opbouw als sensor.dynamisch_goedkoopste_periode (raw_today / raw_tomorrow)
          raw_today: >
            {%- set gekozen_s = gekozen | map(attribute='s') | list -%}
            [
            {%- for p in raw_vandaag -%}
              {%- set s = as_timestamp(p.start) -%}
              {"start": "{{ p.start }}", "end": "{{ p.end }}", "value": {{ p.value }},
               "goedkoop": "{{ 'ja' if s in gekozen_s else 'nee' }}", "duur": "nee"}{{ ',' if not loop.last }}
            {%- endfor -%}
            ]
          raw_tomorrow: >
            {%- set gekozen_s = gekozen | map(attribute='s') | list -%}
            [
            {%- for p in raw_morgen -%}
              {%- set s = as_timestamp(p.start) -%}
              {"start": "{{ p.start }}", "end": "{{ p.end }}", "value": {{ p.value }},
               "goedkoop": "{{ 'ja' if s in morgen_laadslots or s in gekozen_s else 'nee' }}", "duur": "nee"}{{ ',' if not loop.last }}
            {%- endfor -%}
            ]

      # --- Afgeleide sensoren (met eenheid) voor dashboard en historie ---
      - name: "Forecast Zon Resterend Vandaag"
        unique_id: forecast_zon_resterend_vandaag
        unit_of_measurement: "kWh"
        device_class: energy
        icon: mdi:solar-power-variant
        availability: "{{ zon_rest_raw >= 0 }}"
        state: "{{ zon_rest_raw | round(2) }}"
        attributes:
          na_betrouwbaarheid_kwh: "{{ zon_rest }}"

      - name: "Forecast Zon Morgen"
        unique_id: forecast_zon_morgen
        unit_of_measurement: "kWh"
        device_class: energy
        icon: mdi:solar-power-variant-outline
        availability: "{{ zon_morgen_raw >= 0 }}"
        state: "{{ zon_morgen_raw | round(2) }}"
        attributes:
          na_betrouwbaarheid_kwh: "{{ zon_morgen }}"

      - name: "Forecast Zelfverbruik Zon"
        unique_id: forecast_zelfverbruik_zon
        unit_of_measurement: "%"
        icon: mdi:home-lightning-bolt
        state: "{{ direct_morgen_pct if zon_morgen > 0 else zelfverbruik_pct }}"
        attributes:
          bron: "{{ zelfverbruik_bron }}"
          direct_verbruik_dag_kwh: "{{ direct_dag_kwh if direct_dag_kwh >= 0 else none }}"
          vandaag_pct: "{{ direct_rest_pct }}"
          gemiddeld_7_dagen_pct: "{{ zelfverbruik_berekend if zelfverbruik_berekend >= 0 else none }}"
          historie_dagen: "{{ hist_dagen }}"

      - name: "Forecast Laadmarge"
        unique_id: forecast_laadmarge
        unit_of_measurement: "kWh"
        device_class: energy
        icon: mdi:battery-plus-variant
        state: "{{ marge_dc }}"
        attributes:
          percentage: "{{ marge_pct }}"

      - name: "Forecast Gemiddeld Gebruik Per Dag"
        unique_id: forecast_gemiddeld_gebruik_per_dag
        unit_of_measurement: "kWh"
        device_class: energy
        icon: mdi:home-lightning-bolt-outline
        state: "{{ gebruik_dag }}"
        attributes:
          bron: "{{ gebruik_bron }}"

      - name: "Forecast Netladen Vandaag"
        unique_id: forecast_netladen_vandaag
        unit_of_measurement: "kWh"
        device_class: energy
        icon: mdi:transmission-tower-import
        state: "{{ netladen_ac }}"

      - name: "Forecast Verwacht Batterijgebruik"
        unique_id: forecast_verwacht_batterijgebruik
        unit_of_measurement: "kWh"
        device_class: energy
        icon: mdi:battery-arrow-down
        state: "{{ need_bridge_ac }}"

      - name: "Forecast Verwachte Zon Naar Batterij"
        unique_id: forecast_verwachte_zon_naar_batterij
        unit_of_measurement: "kWh"
        device_class: energy
        icon: mdi:battery-arrow-up
        state: "{{ zon_dc }}"
