    icon: mdi:weather-partly-cloudy
    min: 0
    max: 150
    step: 1
    mode: box
    unit_of_measurement: "%"
  forecast_betrouwbaarheid_apr:
    name: Forecast Betrouwbaarheid April
    icon: mdi:weather-partly-cloudy
    min: 0
    max: 150
    step: 1
    mode: box
    unit_of_measurement: "%"
  forecast_betrouwbaarheid_mei:
    name: Forecast Betrouwbaarheid Mei
    icon: mdi:weather-partly-cloudy
    min: 0
    max: 150
    step: 1
    mode: box
    unit_of_measurement: "%"
  forecast_betrouwbaarheid_jun:
    name: Forecast Betrouwbaarheid Juni
    icon: mdi:weather-partly-cloudy
    min: 0
    max: 150
    step: 1
    mode: box
    unit_of_measurement: "%"
  forecast_betrouwbaarheid_jul:
    name: Forecast Betrouwbaarheid Juli
    icon: mdi:weather-partly-cloudy
    min: 0
    max: 150
    step: 1
    mode: box
    unit_of_measurement: "%"
  forecast_betrouwbaarheid_aug:
    name: Forecast Betrouwbaarheid Augustus
    icon: mdi:weather-partly-cloudy
    min: 0
    max: 150
    step: 1
