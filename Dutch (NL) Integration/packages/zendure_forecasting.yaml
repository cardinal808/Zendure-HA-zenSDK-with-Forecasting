input_boolean:
  forecast_dal_ontladen_blokkeren:
    name: Forecast Niet Ontladen In Goedkoop Dal
    icon: mdi:battery-lock
  # Slim vasthouden: haalt de accu het niet, dan krijgt de lading de duurste kwartieren.
  # Staat standaard aan (eenmalig gezet door de automatisering onderaan).
  forecast_slim_vasthouden:
    name: Forecast Slim Vasthouden
    icon: mdi:battery-clock
  # Intern: slim vasthouden is al eens standaard aangezet
  forecast_slim_vasthouden_ingesteld:
    name: Forecast Slim Vasthouden Ingesteld
    icon: mdi:robot
  # Toont de 12 maandvelden van de betrouwbaarheid op het dashboard
  # Kalibratieladen uitzetten (standaard aan)
  forecast_kalibratie_uit:
    name: Forecast Kalibratieladen Uit
    icon: mdi:battery-sync-outline
  forecast_betrouwbaarheid_per_maand_tonen:
    name: Forecast Betrouwbaarheid Per Maand Tonen
    icon: mdi:calendar-month
  # Aan = de gemeten maandwaarde niet automatisch invullen
  forecast_betrouwbaarheid_niet_automatisch:
    name: Forecast Betrouwbaarheid Niet Automatisch Invullen
    icon: mdi:calendar-lock
  forecast_tonen_op_dashboard:
    name: Forecasting Tonen Op Dashboard
    icon: mdi:calendar-clock

input_button:
  forecast_herberekenen:
    name: Forecast Herberekenen
    icon: mdi:calculator-variant
  # Wist het geleerde verbruiksprofiel en de historie van 7 dagen (zie de automation onderaan)
  forecast_verbruiksgegevens_resetten:
    name: Forecast Verbruiksgegevens Resetten
    icon: mdi:restore-alert

# ---------------------------------------------------------------------
# 2. Integratiesensoren (kWh-tellers, afgeleid van vermogens-sensoren)
#    Methode "left": de vermogens krijgen alleen bij een wijziging een nieuwe waarde
#    (stapsgewijs). Trapezium zou tussen twee metingen een schuine lijn trekken en
#    energie meetellen die er niet was. Voor net-import en -export worden bij voorkeur
#    de kWh-tellers van de P1-meter gebruikt (zie "Forecast Teller P1 ...").
# ---------------------------------------------------------------------
sensor:
  # Nieuwste release van deze uitbreiding op GitHub (voor de releasecheck)
  - platform: rest
    name: "GitHub Zendure Forecasting"
    unique_id: github_zendure_forecasting
    resource: "https://api.github.com/repos/cardinal808/Zendure-HA-zenSDK-with-Forecasting/releases/latest"
    headers:
      User-Agent: "HomeAssistant"
    scan_interval: 3600
    json_attributes:
      - tag_name
      - name
      - published_at
      - body
    value_template: "{{ (value_json.tag_name | default('onbekend')) | replace('v', '') }}"

  - platform: integration
    name: "Forecast P1 Import Totaal"
    unique_id: forecast_p1_import_totaal
    source: sensor.forecast_p1_import_vermogen
    unit_prefix: k
    round: 3
    method: left

  - platform: integration
    name: "Forecast P1 Export Totaal"
    unique_id: forecast_p1_export_totaal
    source: sensor.forecast_p1_export_vermogen
    unit_prefix: k
    round: 3
    method: left

  - platform: integration
    name: "Forecast P1 Export Uit Zon Totaal"
    unique_id: forecast_p1_export_uit_zon_totaal
    source: sensor.forecast_p1_export_uit_zon_vermogen
    unit_prefix: k
    round: 3
    method: left

  - platform: integration
    name: "Forecast Zendure Laden Totaal"
    unique_id: forecast_zendure_laden_totaal
    source: sensor.forecast_zendure_laden_vermogen
    unit_prefix: k
    round: 3
    method: left

  - platform: integration
    name: "Forecast Zendure Ontladen Totaal"
    unique_id: forecast_zendure_ontladen_totaal
    source: sensor.forecast_zendure_ontladen_vermogen
    unit_prefix: k
    round: 3
    method: left

  - platform: integration
    name: "Forecast Zendure Laden Uit Zon Totaal"
    unique_id: forecast_zendure_laden_uit_zon_totaal
    source: sensor.forecast_zendure_laden_uit_zon_vermogen
    unit_prefix: k
    round: 3
    method: left

  # -------------------------------------------------------------------
  # 3. Statistieken over de afgelopen 7 dagen (rollend)
  #    Op de tellers uit "Forecast Teller ..." (zie template-sectie)
  # -------------------------------------------------------------------
  # Gemiddeld werkelijk netlaadvermogen over de recente laadsessies
  - platform: statistics
    name: "Forecast Gemeten Laadvermogen"
    unique_id: forecast_gemeten_laadvermogen
    entity_id: sensor.forecast_netladen_vermogen
    # Mediaan: een paar lage metingen (bv. aan het eind van een lading) trekken hem niet omlaag
    state_characteristic: median
    max_age:
      days: 14
    sampling_size: 3000
    precision: 0

  - platform: statistics
    name: "Forecast Zon Productie 7 Dagen"
    unique_id: forecast_zon_productie_7_dagen
    entity_id: sensor.forecast_teller_zon_productie
    state_characteristic: change
    max_age:
      days: 7
    sampling_size: 1500
    precision: 2

  - platform: statistics
    name: "Forecast P1 Import 7 Dagen"
    unique_id: forecast_p1_import_7_dagen
    entity_id: sensor.forecast_teller_p1_import
    state_characteristic: change
    max_age:
      days: 7
    sampling_size: 1500
    precision: 2

  - platform: statistics
    name: "Forecast P1 Export 7 Dagen"
    unique_id: forecast_p1_export_7_dagen
    entity_id: sensor.forecast_teller_p1_export
    state_characteristic: change
    max_age:
      days: 7
    sampling_size: 1500
    precision: 2

  - platform: statistics
    name: "Forecast P1 Export Uit Zon 7 Dagen"
    unique_id: forecast_p1_export_uit_zon_7_dagen
    entity_id: sensor.forecast_teller_p1_export_uit_zon
    state_characteristic: change
    max_age:
      days: 7
    sampling_size: 1500
    precision: 2

  - platform: statistics
    name: "Forecast Zendure Laden 7 Dagen"
    unique_id: forecast_zendure_laden_7_dagen
    entity_id: sensor.forecast_teller_zendure_laden
    state_characteristic: change
    max_age:
      days: 7
    sampling_size: 1500
    precision: 2

  - platform: statistics
    name: "Forecast Zendure Ontladen 7 Dagen"
    unique_id: forecast_zendure_ontladen_7_dagen
    entity_id: sensor.forecast_teller_zendure_ontladen
    state_characteristic: change
    max_age:
      days: 7
    sampling_size: 1500
    precision: 2

  - platform: statistics
    name: "Forecast Zendure Laden Uit Zon 7 Dagen"
    unique_id: forecast_zendure_laden_uit_zon_7_dagen
    entity_id: sensor.forecast_teller_zendure_laden_uit_zon
    state_characteristic: change
    max_age:
      days: 7
    sampling_size: 1500
    precision: 2

template:
  # Betrouwbaarheid zonvoorspelling die nu geldt: de maandwaarde, anders de algemene, anders 100%.
  # De binary sensor bepaalt op het dashboard welke rij zichtbaar is.
  - binary_sensor:
      - name: "Forecast Betrouwbaarheid Maand Ingevuld"
        unique_id: forecast_betrouwbaarheid_maand_ingevuld
        icon: mdi:calendar-check
        state: "{{ states('input_number.forecast_betrouwbaarheid_' ~ ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'][now().month - 1]) | float(0) > 0 }}"
    sensor:
      - name: "Forecast Betrouwbaarheid Nu"
        unique_id: forecast_betrouwbaarheid_nu
        icon: mdi:weather-partly-cloudy
        unit_of_measurement: "%"
        state: >
          {% set m = states('input_number.forecast_betrouwbaarheid_' ~ ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'][now().month - 1]) | float(0) %}
          {% set g = states('input_number.forecast_betrouwbaarheid') | float(0) %}
          {{ (m if m > 0 else (g if g > 0 else 100)) | round(0) }}
        attributes:
          bron: >
            {% set m = states('input_number.forecast_betrouwbaarheid_' ~ ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'][now().month - 1]) | float(0) %}
            {{ ('maandwaarde ' ~ ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'][now().month - 1]) if m > 0 else ('algemene waarde' if states('input_number.forecast_betrouwbaarheid') | float(0) > 0 else 'niet ingevuld (100%)') }}
  # Laadvermogen tijdens netladen zoals de accu het echt haalt (> 300 W), alleen tot 10% onder het
  # maximale laadpercentage: aan het eind van een lading zakt het vermogen (balanceren), en dat
  # zegt niets over wat een laadslot oplevert. Gemeten aan de Zendure, alleen als Dynamisch laden
  # loopt (Forecasting of Gielz). Was (t/m 2026.11.4): het laagste van P1-import en laden, maar
  # met zon van een andere omvormer is de import lager dan het laadvermogen en kwam de mediaan
  # te laag uit (bv. 1,3 kW bij 2,4 kW echt). Buiten het netladen houdt de
  # sensor zijn laatste meting (ook na een herstart), zodat de statistiek Gemeten Laadvermogen
  # beschikbaar blijft en alleen echte laadsessies meetelt. Was: niet beschikbaar buiten het
  # netladen, waardoor de planner bijna altijd met het ingestelde vermogen rekende.
  - trigger:
      - trigger: state
        entity_id:
          - sensor.zendure_2400_ac_vermogen_aansturing
          - input_boolean.dynamisch_laden_loopt
    sensor:
      - name: "Forecast Netladen Vermogen"
        unique_id: forecast_netladen_vermogen
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: >
          {% set laden = [states('sensor.zendure_2400_ac_vermogen_aansturing') | float(0), 0] | max %}
          {% set onder_staart = states('sensor.zendure_2400_ac_laadpercentage') | float(100) <= states('sensor.zendure_2400_ac_maximale_laadpercentage') | float(100) - 10 %}
          {{ (is_state('input_boolean.dynamisch_laden_loopt', 'on') and has_value('sensor.zendure_2400_ac_vermogen_aansturing') and laden > 300 and onder_staart)
             or this.state | is_number }}
        state: >
          {% set laden = [states('sensor.zendure_2400_ac_vermogen_aansturing') | float(0), 0] | max %}
          {% set onder_staart = states('sensor.zendure_2400_ac_laadpercentage') | float(100) <= states('sensor.zendure_2400_ac_maximale_laadpercentage') | float(100) - 10 %}
          {% if is_state('input_boolean.dynamisch_laden_loopt', 'on') and has_value('sensor.zendure_2400_ac_vermogen_aansturing') and laden > 300 and onder_staart %}
            {{ laden | round(0) }}
          {% else %}
            {{ this.state }}
          {% endif %}

  # Versie van deze uitbreiding: jaar.maand.volgnummer (volgnummer begint elke maand bij 1)
  - sensor:
      - name: "Forecasting Versie"
        unique_id: forecasting_versie
        icon: mdi:one-up
        state: "2026.11.5"
        attributes:
          gielz_basis: "v20261113"
          # Optionele pakketten die geladen zijn
          pakketten: >
            {% set ns = namespace(l=[]) %}
            {% if states.sensor.zendure_besparing is not none %}{% set ns.l = ns.l + ['Besparing'] %}{% endif %}
            {% if states.sensor.zendure_terugleverprijs_nu is not none %}{% set ns.l = ns.l + ['Negatieve Prijs'] %}{% endif %}
            {% if states.binary_sensor.hvac_actief is not none %}{% set ns.l = ns.l + ['HVAC'] %}{% endif %}
            {% if states.sensor.ev_laadplan is not none %}{% set ns.l = ns.l + ['EV'] %}{% endif %}
            {% if states.script.zendure_diagnose_export is not none %}{% set ns.l = ns.l + ['Export'] %}{% endif %}
            {% if states.input_number.nordpool_energiebelasting is not none %}{% set ns.l = ns.l + ['Nordpool'] %}{% endif %}
            {{ ns.l }}
          github: "https://github.com/cardinal808/Zendure-HA-zenSDK-with-Forecasting"

      - name: "Forecasting Releasecheck"
        unique_id: forecasting_releasecheck
        state: >
          {% macro num(x) %}{% set p = (x | string | replace('v', '')).split('.') %}{% if p | length == 3 %}{{ '%04d%02d%03d' | format(p[0] | int(0), p[1] | int(0), p[2] | int(0)) }}{% endif %}{% endmacro %}
          {% set g = state_attr('sensor.github_zendure_forecasting', 'tag_name') %}
          {% set a = num(states('sensor.forecasting_versie')) %}
          {% set b = num(g) if g not in [none, 'unknown', 'unavailable'] else '' %}
          {% if a and b %}
            {% if a > b %}Pre-release actief{% elif a < b %}Nieuwe release op GitHub{% else %}Up-to-date{% endif %}
          {% else %}Onbekend{% endif %}
        icon: >
          {% if this.state == 'Up-to-date' %}mdi:emoticon-happy-outline
          {% elif this.state == 'Pre-release actief' %}mdi:test-tube
          {% else %}mdi:emoticon-sad-outline{% endif %}

  # Ontladen vasthouden in een goedkoop dal (alleen modus Dynamisch NOM + Forecasting)
  - binary_sensor:
      - name: "Forecast Dal Ontladen Geblokkeerd"
        unique_id: forecast_dal_ontladen_geblokkeerd
        icon: mdi:battery-lock
        state: >
          {{ is_state('input_select.zendure_2400_ac_modus_selecteren', 'Dynamisch NOM + Forecasting')
             and is_state_attr('sensor.zendure_forecast_plan', 'ontladen_vasthouden', true) }}

  # -------------------------------------------------------------------
  # Vermogenssensoren (bron voor de integratiesensoren hierboven)
  #   P1:      positief = import, negatief = export
  #   Zendure: sensor.zendure_2400_ac_vermogen_aansturing
  #            positief = laden, negatief = ontladen
  # -------------------------------------------------------------------
  - sensor:
      - name: "Forecast P1 Import Vermogen"
        unique_id: forecast_p1_import_vermogen
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: "{{ has_value('sensor.p1_aansturing_vermogen') }}"
        state: "{{ [states('sensor.p1_aansturing_vermogen') | float(0), 0] | max }}"

      - name: "Forecast P1 Export Vermogen"
        unique_id: forecast_p1_export_vermogen
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: "{{ has_value('sensor.p1_aansturing_vermogen') }}"
        state: "{{ [0 - states('sensor.p1_aansturing_vermogen') | float(0), 0] | max }}"

      # Teruglevering die uit zon komt: P1-export min wat de batterij op dat moment ontlaadt
      # (anders telt export uit de batterij, bv. bij Dynamisch Handelen, als zonne-export)
      - name: "Forecast P1 Export Uit Zon Vermogen"
        unique_id: forecast_p1_export_uit_zon_vermogen
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: >
          {{ has_value('sensor.p1_aansturing_vermogen')
             and has_value('sensor.zendure_2400_ac_vermogen_aansturing') }}
        state: >
          {% set export_w = [0 - states('sensor.p1_aansturing_vermogen') | float(0), 0] | max %}
          {% set ontladen = [0 - states('sensor.zendure_2400_ac_vermogen_aansturing') | float(0), 0] | max %}
          {{ ([export_w - ontladen, 0] | max) | round(0) }}

      - name: "Forecast Zendure Laden Vermogen"
        unique_id: forecast_zendure_laden_vermogen
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: "{{ has_value('sensor.zendure_2400_ac_vermogen_aansturing') }}"
        state: "{{ [states('sensor.zendure_2400_ac_vermogen_aansturing') | float(0), 0] | max }}"

      - name: "Forecast Zendure Ontladen Vermogen"
        unique_id: forecast_zendure_ontladen_vermogen
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: "{{ has_value('sensor.zendure_2400_ac_vermogen_aansturing') }}"
        state: "{{ [0 - states('sensor.zendure_2400_ac_vermogen_aansturing') | float(0), 0] | max }}"

      # Het deel van het laadvermogen dat NIET uit het net komt (dus uit zon-overschot).
      # Het netdeel is de P1-import, begrensd op het laadvermogen.
      - name: "Forecast Zendure Laden Uit Zon Vermogen"
        unique_id: forecast_zendure_laden_uit_zon_vermogen
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: >
          {{ has_value('sensor.p1_aansturing_vermogen')
             and has_value('sensor.zendure_2400_ac_vermogen_aansturing') }}
        state: >
          {% set laden = [states('sensor.zendure_2400_ac_vermogen_aansturing') | float(0), 0] | max %}
          {% set import_w = [states('sensor.p1_aansturing_vermogen') | float(0), 0] | max %}
          {{ (laden - [import_w, laden] | min) | round(0) }}

  # -------------------------------------------------------------------
  # Tellers elk kwartier (:00, :15, :30, :45) "bevriezen", gelijk met de
  # 15-minutenprijzen (nodig voor zendure_besparing.yaml), en zodat de 7-daagse statistiek
  # niet duizenden samples per uur hoeft te verwerken.
  # -------------------------------------------------------------------
  - trigger:
      - platform: time_pattern
        minutes: "/15"
      - platform: homeassistant
        event: start
    variables:
      c_max_kwh_per_uur: 15              # grotere toename per uur geldt als meterwissel of fout
      c_max_zon_kwh_per_uur: 50          # zon: grotere toename per uur geldt als sprong (andere sensor, reset)
      c_meter_max_weg_s: 21600           # meter langer dan 6 uur weg: terug naar berekening uit vermogen
      nu_ts: "{{ as_timestamp(now()) }}"
      # kWh-tellers van de netmeter. Zelf ingevuld in Forecasting Configuratie (Basis) gaat voor;
      # anders automatisch herkend (eerste groep waarvan alle sensoren een waarde hebben):
      # SlimmeLezer/ESPHome DSMR, HomeWizard P1, DSMR-integratie
      p1_import_groepen:
        - ['sensor.energy_consumed_tariff_1', 'sensor.energy_consumed_tariff_2']
        - ['sensor.p1_meter_energy_import']
        - ['sensor.p1_meter_energie_import']
        - ['sensor.electricity_meter_energy_consumption_tarif_1', 'sensor.electricity_meter_energy_consumption_tarif_2']
      p1_export_groepen:
        - ['sensor.energy_produced_tariff_1', 'sensor.energy_produced_tariff_2']
        - ['sensor.p1_meter_energy_export']
        - ['sensor.p1_meter_energie_export']
        - ['sensor.electricity_meter_energy_production_tarif_1', 'sensor.electricity_meter_energy_production_tarif_2']
      p1_import_eigen: >
        {{ (states('input_text.forecast_net_import_teller_sensor') | lower).split(',') | map('trim') | select('match', '^sensor\\.[a-z0-9_]+$') | list }}
      p1_export_eigen: >
        {{ (states('input_text.forecast_net_export_teller_sensor') | lower).split(',') | map('trim') | select('match', '^sensor\\.[a-z0-9_]+$') | list }}
      # Welke sensoren worden gebruikt: de ingevulde (komma-gescheiden), anders de eerste complete groep
      p1_import_ids: >
        {%- set ns = namespace(g=[]) -%}
        {%- if p1_import_eigen | length > 0 -%}{%- set ns.g = p1_import_eigen -%}
        {%- else -%}
          {%- for g in p1_import_groepen -%}
            {%- if ns.g | length == 0 and g | select('has_value') | list | length == g | length -%}{%- set ns.g = g -%}{%- endif -%}
          {%- endfor -%}
        {%- endif -%}
        {{ ns.g }}
      p1_export_ids: >
        {%- set ns = namespace(g=[]) -%}
        {%- if p1_export_eigen | length > 0 -%}{%- set ns.g = p1_export_eigen -%}
        {%- else -%}
          {%- for g in p1_export_groepen -%}
            {%- if ns.g | length == 0 and g | select('has_value') | list | length == g | length -%}{%- set ns.g = g -%}{%- endif -%}
          {%- endfor -%}
        {%- endif -%}
        {{ ns.g }}
      # Som in kWh (Wh en MWh worden omgerekend); -1 = geen meter gevonden of niet beschikbaar
      meter_import: >
        {%- if p1_import_ids | length > 0 and p1_import_ids | select('has_value') | list | length == p1_import_ids | length -%}
          {%- set ns = namespace(v=0) -%}
          {%- for e in p1_import_ids -%}
            {%- set u = state_attr(e, 'unit_of_measurement') -%}
            {%- set v = states(e) | float(0) -%}
            {%- set ns.v = ns.v + (v / 1000 if u == 'Wh' else (v * 1000 if u == 'MWh' else v)) -%}
          {%- endfor -%}
          {{ ns.v | round(3) }}
        {%- else -%}-1{%- endif -%}
      meter_export: >
        {%- if p1_export_ids | length > 0 and p1_export_ids | select('has_value') | list | length == p1_export_ids | length -%}
          {%- set ns = namespace(v=0) -%}
          {%- for e in p1_export_ids -%}
            {%- set u = state_attr(e, 'unit_of_measurement') -%}
            {%- set v = states(e) | float(0) -%}
            {%- set ns.v = ns.v + (v / 1000 if u == 'Wh' else (v * 1000 if u == 'MWh' else v)) -%}
          {%- endfor -%}
          {{ ns.v | round(3) }}
        {%- else -%}-1{%- endif -%}
      int_import: "{{ states('sensor.forecast_p1_import_totaal') | float(-1) }}"
      int_export: "{{ states('sensor.forecast_p1_export_totaal') | float(-1) }}"
      # Zonproductie: ingevulde totaalteller (kWh; Wh en MWh worden omgerekend); -1 = geen waarde
      zon_entiteit: "{{ states('input_text.forecast_zon_productie_sensor') | trim | lower }}"
      zon_bron: >
        {%- if zon_entiteit | regex_match('^sensor\\..+') and has_value(zon_entiteit) -%}
          {%- set u = state_attr(zon_entiteit, 'unit_of_measurement') -%}
          {%- set v = states(zon_entiteit) | float(-1) -%}
          {%- if v < 0 -%}-1{%- elif u == 'Wh' -%}{{ (v / 1000) | round(4) }}{%- elif u == 'MWh' -%}{{ (v * 1000) | round(4) }}{%- else -%}{{ v }}{%- endif -%}
        {%- else -%}-1{%- endif -%}
    sensor:
      # Zonproductie: telt de toename van de ingevulde productiesensor op, in plaats van de stand
      # over te nemen. Een sprong telt zo niet als productie: een andere sensor ingevuld, een teller
      # die even 0 meldt of terugspringt, een vervangen omvormer. Valt de sensor weg (bv. 's nachts),
      # dan wordt het gemiste stuk opgeteld zodra hij terug is. Een genegeerde sprong staat in het
      # attribuut laatste_sprong.
      - name: "Forecast Teller Zon Productie"
        unique_id: forecast_teller_zon_productie
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        # Beschikbaar met een geldige sensor én een waarde: een eigen stand of een stand van de bron.
        # Na een herstart 's nachts (omvormer offline, nog geen stand) wacht hij dus in plaats van
        # bij 0 te beginnen.
        availability: >
          {{ zon_entiteit | regex_match('^sensor\\..+')
             and (this.state | float(-1) >= 0 or zon_bron >= 0) }}
        state: >
          {% set vorig = this.state | float(-1) %}
          {# Nog geen eigen stand (eerste keer): begin bij de stand van de bron. Dat sluit aan op de
             oude meetpunten (die namen de stand over) en voorkomt een negatieve 7-daagse change. #}
          {% set vorig = vorig if vorig >= 0 else ([zon_bron, 0] | max) %}
          {% set b_oud = this.attributes.get('bron') %}
          {% set b_ts = this.attributes.get('bron_ts') | float(0) %}
          {% if zon_bron >= 0 and b_oud is number and this.attributes.get('bron_entiteit') == zon_entiteit %}
            {% set d = zon_bron - b_oud %}
            {% set max_d = c_max_zon_kwh_per_uur * ([(nu_ts - b_ts) / 3600, 1] | max) %}
            {{ (vorig + (d if 0 <= d <= max_d else 0)) | round(3) }}
          {% else %}{{ vorig | round(3) }}{% endif %}
        attributes:
          # Laatste stand van de bronsensor (kWh), het moment daarvan en welke sensor het was
          bron: >
            {% if zon_bron >= 0 %}{{ zon_bron }}
            {% elif this.attributes.get('bron_entiteit') == zon_entiteit %}{{ this.attributes.get('bron') }}
            {% else %}{{ none }}{% endif %}
          bron_ts: >
            {% if zon_bron >= 0 %}{{ nu_ts | round(0) }}
            {% elif this.attributes.get('bron_entiteit') == zon_entiteit %}{{ this.attributes.get('bron_ts') }}
            {% else %}{{ none }}{% endif %}
          bron_entiteit: "{{ zon_entiteit }}"
          laatste_sprong: >
            {% set b_oud = this.attributes.get('bron') %}
            {% set b_ts = this.attributes.get('bron_ts') | float(0) %}
            {% set d = (zon_bron - b_oud) if (zon_bron >= 0 and b_oud is number and this.attributes.get('bron_entiteit') == zon_entiteit) else 0 %}
            {% set max_d = c_max_zon_kwh_per_uur * ([(nu_ts - b_ts) / 3600, 1] | max) %}
            {% if d < 0 or d > max_d %}{{ now().strftime('%Y-%m-%d %H:%M') }}: {{ d | round(1) }} kWh genegeerd
            {% else %}{{ this.attributes.get('laatste_sprong') }}{% endif %}

      # Telt de toename van de P1-meter op (exact, zelfde bron als het energiedashboard).
      # Zonder meter: de toename van de integratie uit het vermogen. Door op te tellen in
      # plaats van de meterstand over te nemen loopt de teller door zonder sprong, ook bij
      # een wissel van bron, en blijft de 7-daagse statistiek kloppen.
      - name: "Forecast Teller P1 Import"
        unique_id: forecast_teller_p1_import
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        availability: "{{ meter_import >= 0 or int_import >= 0 }}"
        # Valt de meter even weg, dan wordt het gemiste stuk opgeteld zodra hij terug is
        # (laatste stand onthouden). Langer dan 6 uur zonder meter: terug naar het vermogen.
        state: >
          {% set vorig = this.state | float(-1) %}
          {% set vorig = vorig if vorig >= 0 else ([int_import, 0] | max) %}
          {% set m_oud = this.attributes.get('meter') %}
          {% set m_ts = this.attributes.get('meter_ts') | float(0) %}
          {% set m_geldig = m_oud is number and (nu_ts - m_ts) <= c_meter_max_weg_s and this.attributes.get('meter_sensoren') in [none, p1_import_ids] %}
          {% set i_oud = this.attributes.get('integratie') %}
          {% if meter_import >= 0 %}
            {% set d = (meter_import - m_oud) if m_geldig else 0 %}
            {% set max_d = c_max_kwh_per_uur * ([(nu_ts - m_ts) / 3600, 1] | max) %}
          {% elif m_geldig %}
            {% set d = 0 %}{% set max_d = 0 %}
          {% elif int_import >= 0 %}
            {% set d = (int_import - i_oud) if i_oud is number else 0 %}
            {% set max_d = c_max_kwh_per_uur %}
          {% else %}
            {% set d = 0 %}{% set max_d = 0 %}
          {% endif %}
          {{ (vorig + (d if 0 <= d <= max_d else 0)) | round(3) }}
        attributes:
          meter: >
            {% set m_oud = this.attributes.get('meter') %}
            {% set m_ts = this.attributes.get('meter_ts') | float(0) %}
            {% if meter_import >= 0 %}{{ meter_import }}
            {% elif m_oud is number and (nu_ts - m_ts) <= c_meter_max_weg_s %}{{ m_oud }}
            {% else %}{{ none }}{% endif %}
          meter_ts: >
            {% set m_ts = this.attributes.get('meter_ts') | float(0) %}
            {% if meter_import >= 0 %}{{ nu_ts | round(0) }}
            {% elif m_ts > 0 and (nu_ts - m_ts) <= c_meter_max_weg_s %}{{ m_ts }}
            {% else %}{{ none }}{% endif %}
          integratie: "{{ int_import if int_import >= 0 else none }}"
          # Welke sensoren de meterstand leveren; een andere bron geeft geen sprong
          meter_sensoren: "{{ p1_import_ids if meter_import >= 0 else this.attributes.get('meter_sensoren') }}"
          bron: >
            {% set m_ts = this.attributes.get('meter_ts') | float(0) %}
            {% if meter_import >= 0 %}{{ 'Ingevulde teller (kWh)' if p1_import_eigen | length > 0 else 'P1-meter (kWh-tellers)' }}
            {% elif m_ts > 0 and (nu_ts - m_ts) <= c_meter_max_weg_s %}Meter even niet bereikbaar (wordt bijgeteld)
            {% else %}Berekend uit vermogen (geen kWh-teller gevonden of ingevuld){% endif %}

      # Telt de toename van de P1-meter op (exact, zelfde bron als het energiedashboard).
      # Zonder meter: de toename van de integratie uit het vermogen. Door op te tellen in
      # plaats van de meterstand over te nemen loopt de teller door zonder sprong, ook bij
      # een wissel van bron, en blijft de 7-daagse statistiek kloppen.
      - name: "Forecast Teller P1 Export"
        unique_id: forecast_teller_p1_export
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        availability: "{{ meter_export >= 0 or int_export >= 0 }}"
        # Valt de meter even weg, dan wordt het gemiste stuk opgeteld zodra hij terug is
        # (laatste stand onthouden). Langer dan 6 uur zonder meter: terug naar het vermogen.
        state: >
          {% set vorig = this.state | float(-1) %}
          {% set vorig = vorig if vorig >= 0 else ([int_export, 0] | max) %}
          {% set m_oud = this.attributes.get('meter') %}
          {% set m_ts = this.attributes.get('meter_ts') | float(0) %}
          {% set m_geldig = m_oud is number and (nu_ts - m_ts) <= c_meter_max_weg_s and this.attributes.get('meter_sensoren') in [none, p1_export_ids] %}
          {% set i_oud = this.attributes.get('integratie') %}
          {% if meter_export >= 0 %}
            {% set d = (meter_export - m_oud) if m_geldig else 0 %}
            {% set max_d = c_max_kwh_per_uur * ([(nu_ts - m_ts) / 3600, 1] | max) %}
          {% elif m_geldig %}
            {% set d = 0 %}{% set max_d = 0 %}
          {% elif int_export >= 0 %}
            {% set d = (int_export - i_oud) if i_oud is number else 0 %}
            {% set max_d = c_max_kwh_per_uur %}
          {% else %}
            {% set d = 0 %}{% set max_d = 0 %}
          {% endif %}
          {{ (vorig + (d if 0 <= d <= max_d else 0)) | round(3) }}
        attributes:
          meter: >
            {% set m_oud = this.attributes.get('meter') %}
            {% set m_ts = this.attributes.get('meter_ts') | float(0) %}
            {% if meter_export >= 0 %}{{ meter_export }}
            {% elif m_oud is number and (nu_ts - m_ts) <= c_meter_max_weg_s %}{{ m_oud }}
            {% else %}{{ none }}{% endif %}
          meter_ts: >
            {% set m_ts = this.attributes.get('meter_ts') | float(0) %}
            {% if meter_export >= 0 %}{{ nu_ts | round(0) }}
            {% elif m_ts > 0 and (nu_ts - m_ts) <= c_meter_max_weg_s %}{{ m_ts }}
            {% else %}{{ none }}{% endif %}
          integratie: "{{ int_export if int_export >= 0 else none }}"
          # Welke sensoren de meterstand leveren; een andere bron geeft geen sprong
          meter_sensoren: "{{ p1_export_ids if meter_export >= 0 else this.attributes.get('meter_sensoren') }}"
          bron: >
            {% set m_ts = this.attributes.get('meter_ts') | float(0) %}
            {% if meter_export >= 0 %}{{ 'Ingevulde teller (kWh)' if p1_export_eigen | length > 0 else 'P1-meter (kWh-tellers)' }}
            {% elif m_ts > 0 and (nu_ts - m_ts) <= c_meter_max_weg_s %}Meter even niet bereikbaar (wordt bijgeteld)
            {% else %}Berekend uit vermogen (geen kWh-teller gevonden of ingevuld){% endif %}

      - name: "Forecast Teller P1 Export Uit Zon"
        unique_id: forecast_teller_p1_export_uit_zon
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        # Bron even weg (bv. net na een herstart): vorige stand houden, niet unavailable
        availability: "{{ has_value('sensor.forecast_p1_export_uit_zon_totaal') or this.state | is_number }}"
        state: "{{ states('sensor.forecast_p1_export_uit_zon_totaal') | float(0) if has_value('sensor.forecast_p1_export_uit_zon_totaal') else this.state }}"

      - name: "Forecast Teller Zendure Laden"
        unique_id: forecast_teller_zendure_laden
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        # Bron even weg (bv. net na een herstart): vorige stand houden, niet unavailable
        availability: "{{ has_value('sensor.forecast_zendure_laden_totaal') or this.state | is_number }}"
        state: "{{ states('sensor.forecast_zendure_laden_totaal') | float(0) if has_value('sensor.forecast_zendure_laden_totaal') else this.state }}"

      - name: "Forecast Teller Zendure Ontladen"
        unique_id: forecast_teller_zendure_ontladen
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        # Bron even weg (bv. net na een herstart): vorige stand houden, niet unavailable
        availability: "{{ has_value('sensor.forecast_zendure_ontladen_totaal') or this.state | is_number }}"
        state: "{{ states('sensor.forecast_zendure_ontladen_totaal') | float(0) if has_value('sensor.forecast_zendure_ontladen_totaal') else this.state }}"

      - name: "Forecast Teller Zendure Laden Uit Zon"
        unique_id: forecast_teller_zendure_laden_uit_zon
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        # Bron even weg (bv. net na een herstart): vorige stand houden, niet unavailable
        availability: "{{ has_value('sensor.forecast_zendure_laden_uit_zon_totaal') or this.state | is_number }}"
        state: "{{ states('sensor.forecast_zendure_laden_uit_zon_totaal') | float(0) if has_value('sensor.forecast_zendure_laden_uit_zon_totaal') else this.state }}"

  # -------------------------------------------------------------------
  # 3b. Verbruiksprofiel per uur (werkdag en weekend) + vorm per kwartier
  #     Elk heel uur: het huisverbruik van het afgelopen uur
  #     (import - export + zon - accu laden + accu ontladen - auto laden) wordt verwerkt in een
  #     voortschrijdend gemiddelde voor dat uur van de dag, apart voor werkdag en weekend.
  #     Elk kwartier wordt ook het verbruik van het afgelopen kwartier gemeten. Zijn alle
  #     vier kwartieren van een uur gemeten, dan leert de sensor hoe het verbruik binnen
  #     dat uur verdeeld is (vormfactor per kwartier, 1 = gelijk verdeeld). Het totaal per
  #     uur blijft uit het uurprofiel komen; de vorm verdeelt dat alleen over de kwartieren.
  #     De vorm leert langzaam (geheugen ongeveer 4 werkweken / 5 weekenden), zodat één
  #     keer koken of wassen hem niet verschuift. Uren met heel weinig verbruik tellen niet mee.
  #     Feestdagen: is binary_sensor.workday_sensor (Workday-integratie) aanwezig,
  #     dan bepaalt die of het een werkdag is. Anders geldt ma-vr als werkdag.
  #     De waarden blijven bewaard na een herstart.
  #     Let op: de entiteit moet sensor.forecast_verbruiksprofiel heten (leest zijn eigen vorige waarden).
  #     Resetten: knop Verbruiksgegevens Resetten (input_button.forecast_verbruiksgegevens_resetten).
  # -------------------------------------------------------------------
  - trigger:
      - platform: time_pattern
        minutes: "/15"
        seconds: 5
      # Knop Verbruiksgegevens Resetten: het profiel begint opnieuw
      - platform: state
        entity_id: input_button.forecast_verbruiksgegevens_resetten
        not_from:
          - unknown
          - unavailable
        id: reset
    variables:
      # Bij een reset leest de sensor zijn eigen vorige waarden niet (een entiteit die niet bestaat),
      # zodat alle waarden terugvallen op leeg / 0 / gelijk verdeeld.
      profiel: "{{ 'sensor.forecast_verbruiksprofiel_gereset' if trigger.id == 'reset' else 'sensor.forecast_verbruiksprofiel' }}"
      # Gewicht van een nieuwe meting zodra er genoeg metingen zijn (geheugen = ongeveer 1 / gewicht metingen):
      c_alpha_min_werkdag: 0.1           # werkdag: ~10 metingen = ongeveer 2 weken
      c_alpha_min_weekend: 0.2           # weekend: ~5 metingen = ongeveer 2,5 week
      c_alpha_min_dag: 0.25              # per weekdag: ~4 metingen = ongeveer 4 weken (één meting per week)
      c_alpha_vorm_werkdag: 0.05         # vorm per kwartier, werkdag: ~20 metingen = ongeveer 4 weken
      c_alpha_vorm_weekend: 0.1          # vorm per kwartier, weekend: ~10 metingen = ongeveer 5 weken
      c_vorm_min_uur_kwh: 0.1            # uren met minder verbruik zeggen niets over de vorm
      c_max_uur_kwh: 15                  # hoger uurverbruik geldt als meetfout
      nu_ts: "{{ as_timestamp(now()) }}"
      heel_uur: "{{ now().minute == 0 }}"
      # Huidige tellerstanden (kWh); -1 = niet beschikbaar
      t_imp: "{{ states('sensor.forecast_teller_p1_import') | float(-1) }}"
      t_exp: "{{ states('sensor.forecast_teller_p1_export') | float(-1) }}"
      t_laden: "{{ states('sensor.forecast_zendure_laden_totaal') | float(-1) }}"
      t_ontl: "{{ states('sensor.forecast_zendure_ontladen_totaal') | float(-1) }}"
      # Energie naar de auto (zendure_ev.yaml) telt niet als huisverbruik. Zonder dat pakket 0.
      t_ev: "{{ states('sensor.ev_geladen_totaal') | float(-1) }}"
      # Airco zolang hij niet uit de accu mag (zendure_hvac.yaml) telt ook niet mee. Zonder pakket 0.
      t_hvac: "{{ states('sensor.hvac_apart_totaal') | float(-1) }}"
      t_prod: >
        {% set e = states('input_text.forecast_zon_productie_sensor') | lower | replace(' ', '') %}
        {% if e | regex_match('^sensor\\..+') and has_value(e) %}
          {% set u = state_attr(e, 'unit_of_measurement') %}
          {% set v = states(e) | float(-1) %}
          {% if v < 0 %}-1{% elif u == 'Wh' %}{{ v / 1000 }}{% elif u == 'MWh' %}{{ v * 1000 }}{% else %}{{ v }}{% endif %}
        {% elif not e | regex_match('^sensor\\..+') or (states(e) == 'unknown' and state_attr(e, 'friendly_name') is none) %}-2
        {% else %}-1{% endif %}
      vorige: "{{ state_attr(profiel, 'meting') }}"
      vorige_k: "{{ state_attr(profiel, 'meting_kwartier') }}"
      # 's Nachts mag de omvormer offline zijn: dan geldt de vorige stand (geen productie)
      prod_nu: >
        {% if t_prod >= 0 %}{{ t_prod }}
        {% elif t_prod == -2 %}0
        {% elif vorige_k is mapping and not is_state('sun.sun', 'above_horizon') %}{{ vorige_k.prod }}
        {% elif vorige is mapping and not is_state('sun.sun', 'above_horizon') %}{{ vorige.prod }}
        {% else %}-1{% endif %}
      ev_nu: >
        {% if t_ev >= 0 %}{{ t_ev }}
        {% elif vorige_k is mapping and vorige_k.ev is defined %}{{ vorige_k.ev }}
        {% else %}0{% endif %}
      hvac_nu: >
        {% if t_hvac >= 0 %}{{ t_hvac }}
        {% elif vorige_k is mapping and vorige_k.hvac is defined %}{{ vorige_k.hvac }}
        {% else %}0{% endif %}
      meting_ok: "{{ t_imp >= 0 and t_exp >= 0 and t_laden >= 0 and t_ontl >= 0 and prod_nu >= 0 }}"
      dagtype_nu: >
        {% if has_value('binary_sensor.workday_sensor') %}{{ 'werkdag' if is_state('binary_sensor.workday_sensor', 'on') else 'weekend' }}
        {% else %}{{ 'werkdag' if now().weekday() < 5 else 'weekend' }}{% endif %}
      # Verbruik van het afgelopen uur (alleen op het hele uur, en als de vorige meting ongeveer een uur oud is)
      uur_kwh: >
        {% if heel_uur and meting_ok and vorige is mapping and 3000 <= nu_ts - (vorige.ts | float(0)) <= 4200 %}
          {% set d = (t_imp - vorige.imp) - (t_exp - vorige.exp) + (prod_nu - vorige.prod) - (t_laden - vorige.laden) + (t_ontl - vorige.ontl) %}
          {% set d_ev = (ev_nu - vorige.ev) if vorige.ev is defined else 0 %}
          {% set d_ev = d_ev if 0 <= d_ev <= c_max_uur_kwh else 0 %}
          {% set d_hvac = (hvac_nu - vorige.hvac) if vorige.hvac is defined else 0 %}
          {% set d_hvac = d_hvac if 0 <= d_hvac <= c_max_uur_kwh else 0 %}
          {{ ([d - d_ev - d_hvac, 0] | max | round(3)) if 0 <= d <= c_max_uur_kwh else -1 }}
        {% else %}-1{% endif %}
      uur_idx: "{{ ((vorige.ts | float(0)) | timestamp_custom('%H', true) | int) if vorige is mapping else -1 }}"
      uur_type: "{{ (vorige.dagtype if vorige is mapping and vorige.dagtype is defined else 'werkdag') }}"
      # Weekdag van die meting (0 = maandag). Feestdagen (werkdag-weekdag die als weekend telt) niet per dag leren.
      uur_wdag: "{{ (((((vorige.ts | float(0)) | timestamp_custom('%w', true) | int) + 6) % 7) if vorige is mapping else -1) }}"
      uur_dag_ok: "{{ uur_kwh >= 0 and uur_wdag >= 0 and uur_type == ('werkdag' if uur_wdag < 5 else 'weekend') }}"
      # Verbruik van het afgelopen kwartier (als de vorige kwartiermeting ongeveer een kwartier oud is).
      # Een klein negatief verschil (tellers die net niet tegelijk bijwerken) telt als 0.
      kwart_kwh: >
        {% if meting_ok and vorige_k is mapping and 600 <= nu_ts - (vorige_k.ts | float(0)) <= 1200 %}
          {% set d = (t_imp - vorige_k.imp) - (t_exp - vorige_k.exp) + (prod_nu - vorige_k.prod) - (t_laden - vorige_k.laden) + (t_ontl - vorige_k.ontl) %}
          {% set d = 0 if -0.05 <= d < 0 else d %}
          {% set d_ev = (ev_nu - vorige_k.ev) if vorige_k.ev is defined else 0 %}
          {% set d_ev = d_ev if 0 <= d_ev <= c_max_uur_kwh / 4 else 0 %}
          {% set d_hvac = (hvac_nu - vorige_k.hvac) if vorige_k.hvac is defined else 0 %}
          {% set d_hvac = d_hvac if 0 <= d_hvac <= c_max_uur_kwh / 4 else 0 %}
          {{ ([d - d_ev - d_hvac, 0] | max | round(4)) if 0 <= d <= c_max_uur_kwh / 4 else -1 }}
        {% else %}-1{% endif %}
      # Bij welk uur (begin, unix) en welk kwartier (0-3) hoort die meting?
      kwart_uur_ts: "{{ ((vorige_k.ts | float(0)) // 3600 * 3600) | int if vorige_k is mapping else 0 }}"
      kwart_idx: "{{ (((vorige_k.ts | float(0)) % 3600) // 900) | int if vorige_k is mapping else 0 }}"
      kwart_type: "{{ (vorige_k.dagtype if vorige_k is mapping and vorige_k.dagtype is defined else dagtype_nu) }}"
      # De kwartieren van het lopende uur, tot ze compleet zijn
      buffer_oud: "{{ state_attr(profiel, 'kwartier_buffer') }}"
      buffer_nieuw: >
        {%- if kwart_kwh >= 0 -%}
          {%- set zelfde = buffer_oud is mapping and (buffer_oud.u | int(0)) == kwart_uur_ts and buffer_oud.k is defined and buffer_oud.k | length == 4 -%}
          {%- set k = buffer_oud.k if zelfde else [none, none, none, none] -%}
          {%- set ns = namespace(l=[]) -%}
          {%- for i in range(4) -%}{%- set ns.l = ns.l + [kwart_kwh if i == kwart_idx else k[i]] -%}{%- endfor -%}
          {{ {'u': kwart_uur_ts, 'type': buffer_oud.type if zelfde else kwart_type, 'k': ns.l} }}
        {%- else -%}{{ buffer_oud if buffer_oud is mapping else none }}{%- endif -%}
      # Op het hele uur: zijn alle vier kwartieren van het vorige uur gemeten, dan de vorm daarvan
      # (vormfactor = kwartier / gemiddeld kwartier; samen 4)
      vorm_meting: >
        {%- set vorig_uur = (nu_ts // 3600 * 3600 - 3600) | int -%}
        {%- if heel_uur and buffer_nieuw is mapping and (buffer_nieuw.u | int(0)) == vorig_uur
              and buffer_nieuw.k | select('number') | list | length == 4 -%}
          {%- set som = buffer_nieuw.k | sum -%}
          {%- if som >= c_vorm_min_uur_kwh -%}
            {{ {'h': vorig_uur | timestamp_custom('%H', true) | int, 'type': buffer_nieuw.type,
                'f': buffer_nieuw.k | map('multiply', 4 / som) | map('round', 3) | list} }}
          {%- else -%}{{ none }}{%- endif -%}
        {%- else -%}{{ none }}{%- endif -%}
    sensor:
      - name: "Forecast Verbruiksprofiel"
        unique_id: forecast_verbruiksprofiel
        icon: mdi:chart-timeline-variant
        unit_of_measurement: "uur"
        state: >
          {% set n1 = state_attr(profiel, 'n_werkdag') or [0] * 24 %}
          {% set n2 = state_attr(profiel, 'n_weekend') or [0] * 24 %}
          {% set ns = namespace(k=0) %}
          {% for i in range(24) %}{% if n1[i] | int(0) >= 3 %}{% set ns.k = ns.k + 1 %}{% endif %}{% if n2[i] | int(0) >= 2 %}{% set ns.k = ns.k + 1 %}{% endif %}{% endfor %}
          {{ ns.k }}
        attributes:
          # Gemiddeld verbruik (kWh) per uur van de dag, index 0 = 00:00-01:00
          werkdag: >
            {% set oud = state_attr(profiel, 'werkdag') or [none] * 24 %}
            {% set n = state_attr(profiel, 'n_werkdag') or [0] * 24 %}
            {% set ns = namespace(l=[]) %}
            {% for i in range(24) %}
              {% set w = oud[i] if oud | length == 24 else none %}
              {% if uur_kwh >= 0 and uur_type == 'werkdag' and uur_idx == i %}
                {% set a = [1 / ((n[i] | int(0)) + 1), c_alpha_min_werkdag] | max %}
                {% set w = uur_kwh if w is none else (w * (1 - a) + uur_kwh * a) %}
                {% set w = w | round(3) %}
              {% endif %}
              {% set ns.l = ns.l + [w] %}
            {% endfor %}
            {{ ns.l }}
          weekend: >
            {% set oud = state_attr(profiel, 'weekend') or [none] * 24 %}
            {% set n = state_attr(profiel, 'n_weekend') or [0] * 24 %}
            {% set ns = namespace(l=[]) %}
            {% for i in range(24) %}
              {% set w = oud[i] if oud | length == 24 else none %}
              {% if uur_kwh >= 0 and uur_type == 'weekend' and uur_idx == i %}
                {% set a = [1 / ((n[i] | int(0)) + 1), c_alpha_min_weekend] | max %}
                {% set w = uur_kwh if w is none else (w * (1 - a) + uur_kwh * a) %}
                {% set w = w | round(3) %}
              {% endif %}
              {% set ns.l = ns.l + [w] %}
            {% endfor %}
            {{ ns.l }}
          # Aantal metingen per uur
          n_werkdag: >
            {% set n = state_attr(profiel, 'n_werkdag') or [0] * 24 %}
            {% set ns = namespace(l=[]) %}
            {% for i in range(24) %}
              {% set k = (n[i] | int(0)) if n | length == 24 else 0 %}
              {% set ns.l = ns.l + [k + 1 if (uur_kwh >= 0 and uur_type == 'werkdag' and uur_idx == i) else k] %}
            {% endfor %}
            {{ ns.l }}
          n_weekend: >
            {% set n = state_attr(profiel, 'n_weekend') or [0] * 24 %}
            {% set ns = namespace(l=[]) %}
            {% for i in range(24) %}
              {% set k = (n[i] | int(0)) if n | length == 24 else 0 %}
              {% set ns.l = ns.l + [k + 1 if (uur_kwh >= 0 and uur_type == 'weekend' and uur_idx == i) else k] %}
            {% endfor %}
            {{ ns.l }}
          # Per weekdag (0 = maandag): gemiddeld verbruik per uur, en het aantal metingen
          per_dag: >
            {% set oud = state_attr(profiel, 'per_dag') or [] %}
            {% set n = state_attr(profiel, 'n_per_dag') or [] %}
            {% set ns = namespace(l=[]) %}
            {% for d in range(7) %}
              {% set rij = oud[d] if oud | length == 7 and oud[d] | length == 24 else [none] * 24 %}
              {% set nr = n[d] if n | length == 7 and n[d] | length == 24 else [0] * 24 %}
              {% set nd = namespace(l=[]) %}
              {% for i in range(24) %}
                {% set w = rij[i] %}
                {% if uur_dag_ok and uur_wdag == d and uur_idx == i %}
                  {% set a = [1 / ((nr[i] | int(0)) + 1), c_alpha_min_dag] | max %}
                  {% set w = (uur_kwh if w is none else (w * (1 - a) + uur_kwh * a)) | round(3) %}
                {% endif %}
                {% set nd.l = nd.l + [w] %}
              {% endfor %}
              {% set ns.l = ns.l + [nd.l] %}
            {% endfor %}
            {{ ns.l }}
          n_per_dag: >
            {% set n = state_attr(profiel, 'n_per_dag') or [] %}
            {% set ns = namespace(l=[]) %}
            {% for d in range(7) %}
              {% set nr = n[d] if n | length == 7 and n[d] | length == 24 else [0] * 24 %}
              {% set nd = namespace(l=[]) %}
              {% for i in range(24) %}
                {% set nd.l = nd.l + [(nr[i] | int(0)) + (1 if (uur_dag_ok and uur_wdag == d and uur_idx == i) else 0)] %}
              {% endfor %}
              {% set ns.l = ns.l + [nd.l] %}
            {% endfor %}
            {{ ns.l }}
          # Vormfactor per kwartier van de dag (96 waarden, index 0 = 00:00-00:15; 1 = gelijk verdeeld,
          # de vier kwartieren van een uur zijn samen 4)
          vorm_werkdag: >
            {% set oud = state_attr(profiel, 'vorm_werkdag') or [] %}
            {% set oud = oud if oud | length == 96 else [1.0] * 96 %}
            {% set n = state_attr(profiel, 'n_vorm_werkdag') or [] %}
            {% set ok = vorm_meting is mapping and vorm_meting.type == 'werkdag' %}
            {% set ns = namespace(l=[]) %}
            {% for i in range(96) %}
              {% set w = oud[i] | float(1) %}
              {% if ok and i // 4 == vorm_meting.h %}
                {% set a = [1 / (((n[vorm_meting.h] | int(0)) if n | length == 24 else 0) + 1), c_alpha_vorm_werkdag] | max %}
                {% set w = w * (1 - a) + vorm_meting.f[i % 4] * a %}
              {% endif %}
              {% set ns.l = ns.l + [w | round(3)] %}
            {% endfor %}
            {{ ns.l }}
          vorm_weekend: >
            {% set oud = state_attr(profiel, 'vorm_weekend') or [] %}
            {% set oud = oud if oud | length == 96 else [1.0] * 96 %}
            {% set n = state_attr(profiel, 'n_vorm_weekend') or [] %}
            {% set ok = vorm_meting is mapping and vorm_meting.type == 'weekend' %}
            {% set ns = namespace(l=[]) %}
            {% for i in range(96) %}
              {% set w = oud[i] | float(1) %}
              {% if ok and i // 4 == vorm_meting.h %}
                {% set a = [1 / (((n[vorm_meting.h] | int(0)) if n | length == 24 else 0) + 1), c_alpha_vorm_weekend] | max %}
                {% set w = w * (1 - a) + vorm_meting.f[i % 4] * a %}
              {% endif %}
              {% set ns.l = ns.l + [w | round(3)] %}
            {% endfor %}
            {{ ns.l }}
          # Aantal complete uren (vier kwartieren gemeten) per uur van de dag
          n_vorm_werkdag: >
            {% set n = state_attr(profiel, 'n_vorm_werkdag') or [] %}
            {% set ns = namespace(l=[]) %}
            {% for i in range(24) %}
              {% set k = (n[i] | int(0)) if n | length == 24 else 0 %}
              {% set ns.l = ns.l + [k + 1 if (vorm_meting is mapping and vorm_meting.type == 'werkdag' and vorm_meting.h == i) else k] %}
            {% endfor %}
            {{ ns.l }}
          n_vorm_weekend: >
            {% set n = state_attr(profiel, 'n_vorm_weekend') or [] %}
            {% set ns = namespace(l=[]) %}
            {% for i in range(24) %}
              {% set k = (n[i] | int(0)) if n | length == 24 else 0 %}
              {% set ns.l = ns.l + [k + 1 if (vorm_meting is mapping and vorm_meting.type == 'weekend' and vorm_meting.h == i) else k] %}
            {% endfor %}
            {{ ns.l }}
          laatste_uur_kwh: >
            {% if heel_uur %}{{ uur_kwh if uur_kwh >= 0 else none }}
            {% else %}{{ state_attr(profiel, 'laatste_uur_kwh') }}{% endif %}
          laatste_uur: >
            {% if heel_uur %}{{ ('%02d:00 (%s)' | format(uur_idx, uur_type)) if uur_idx >= 0 and uur_kwh >= 0 else none }}
            {% else %}{{ state_attr(profiel, 'laatste_uur') }}{% endif %}
          laatste_kwartier_kwh: "{{ kwart_kwh if kwart_kwh >= 0 else none }}"
          kwartier_buffer: "{{ buffer_nieuw }}"
          # Tellerstand voor de berekening over een uur (alleen op het hele uur bijgewerkt)
          meting: >
            {% if heel_uur %}
              {% if meting_ok %}{{ {'ts': nu_ts | round(0), 'imp': t_imp, 'exp': t_exp, 'prod': prod_nu, 'laden': t_laden, 'ontl': t_ontl, 'ev': ev_nu, 'hvac': hvac_nu, 'dagtype': dagtype_nu} }}{% else %}{{ vorige }}{% endif %}
            {% else %}{{ vorige }}{% endif %}
          # Tellerstand voor de berekening over een kwartier
          meting_kwartier: >
            {% if meting_ok %}{{ {'ts': nu_ts | round(0), 'imp': t_imp, 'exp': t_exp, 'prod': prod_nu, 'laden': t_laden, 'ontl': t_ontl, 'ev': ev_nu, 'hvac': hvac_nu, 'dagtype': dagtype_nu} }}{% else %}{{ vorige_k }}{% endif %}

  # -------------------------------------------------------------------
  # Zon per maand: werkelijke zonproductie tegenover de voorspelling (voor de betrouwbaarheid per maand).
  #   Elke dag om 23:58: zonproductie van vandaag (zon-teller) en de voorspelling die gisteren om
  #   23:58 voor vandaag gold ("Zon morgen sensor", zonder betrouwbaarheidscorrectie) optellen.
  #   Bij de eerste meting in een nieuwe maand wordt de vorige maand afgerond (attribuut afgerond);
  #   een automatisering zet die waarde in het maandveld. State = verhouding deze maand (%).
  # -------------------------------------------------------------------
  - trigger:
      - platform: time_pattern
        hours: 23
        minutes: 58
    variables:
      zm_vorig: "{{ states.sensor.forecast_zon_maandmeting.attributes if states.sensor.forecast_zon_maandmeting is not none else {} }}"
      zm_teller: "{{ states('sensor.forecast_teller_zon_productie') | float(-1) }}"
      zm_morgen: >
        {% set e = states('input_text.forecast_zon_morgen_sensor') | lower | replace(' ', '') %}
        {% if e | regex_match('^sensor\\..+') and has_value(e) %}
          {% set u = state_attr(e, 'unit_of_measurement') %}
          {% set v = states(e) | float(-1) %}
          {% if v < 0 %}-1{% elif u == 'Wh' %}{{ v / 1000 }}{% elif u == 'MWh' %}{{ v * 1000 }}{% else %}{{ v }}{% endif %}
        {% else %}-1{% endif %}
      zm_gisteren: "{{ (now() - timedelta(days=1)).strftime('%Y-%m-%d') }}"
      zm_maand: "{{ now().strftime('%Y-%m') }}"
      # Telt vandaag mee? Gisteren een tellerstand en een voorspelling voor vandaag vastgelegd.
      zm_dag_ok: >
        {{ zm_vorig.datum is defined and zm_vorig.datum == zm_gisteren and zm_teller >= 0
           and (zm_vorig.teller_start | float(-1)) >= 0 and (zm_vorig.verwacht_vandaag | float(-1)) > 0
           and 0 <= zm_teller - (zm_vorig.teller_start | float(0)) <= 200 }}
      zm_nieuwe_maand: "{{ zm_vorig.maand is defined and zm_vorig.maand != zm_maand }}"
      zm_w: "{{ ((0 if zm_nieuwe_maand else (zm_vorig.werkelijk_kwh | float(0))) + ((zm_teller - (zm_vorig.teller_start | float(0))) if zm_dag_ok else 0)) | round(3) }}"
      zm_v: "{{ ((0 if zm_nieuwe_maand else (zm_vorig.verwacht_kwh | float(0))) + ((zm_vorig.verwacht_vandaag | float(0)) if zm_dag_ok else 0)) | round(3) }}"
      zm_n: "{{ (0 if zm_nieuwe_maand else (zm_vorig.dagen | int(0))) + (1 if zm_dag_ok else 0) }}"
    sensor:
      - name: "Forecast Zon Maandmeting"
        unique_id: forecast_zon_maandmeting
        icon: mdi:calendar-month
        unit_of_measurement: "%"
        state: "{{ ((zm_w / zm_v * 100) | round(0)) if zm_v >= 1 else none }}"
        attributes:
          maand: "{{ zm_maand }}"
          datum: "{{ now().strftime('%Y-%m-%d') }}"
          werkelijk_kwh: "{{ zm_w }}"
          verwacht_kwh: "{{ zm_v }}"
          dagen: "{{ zm_n }}"
          teller_start: "{{ zm_teller if zm_teller >= 0 else none }}"
          verwacht_vandaag: "{{ zm_morgen if zm_morgen > 0 else none }}"
          # Afgeronde vorige maand: minstens 10 dagen en 5 kWh voorspeld, verhouding 10-150%
          afgerond: >
            {% if zm_nieuwe_maand and (zm_vorig.dagen | int(0)) >= 10 and (zm_vorig.verwacht_kwh | float(0)) >= 5 %}
              {{ {'maand': zm_vorig.maand, 'pct': ([[((zm_vorig.werkelijk_kwh | float(0)) / (zm_vorig.verwacht_kwh | float(1)) * 100) | round(0) | int, 10] | max, 150] | min),
                  'werkelijk_kwh': zm_vorig.werkelijk_kwh, 'verwacht_kwh': zm_vorig.verwacht_kwh, 'dagen': zm_vorig.dagen} }}
            {% else %}{{ zm_vorig.afgerond if zm_vorig.afgerond is defined else none }}{% endif %}

  # -------------------------------------------------------------------
  # 4. DE PLANNER
  #    Alle berekeningen staan in "variables" (eenmalig per berekening)
  #    en worden door de state en de attributes hergebruikt.
  #
  #    State:  Laden | Wachten | Niet nodig | Niet gunstig |
  #            Geen prijzen | Geen batterijdata
  #    De automation laadt alleen als de state "Laden" is.
  # -------------------------------------------------------------------
  - trigger:
      # Elk kwartier, net na de prijswissel (en na het verbruiksprofiel op :05). Daarnaast direct bij
      # wijzigingen in instellingen, prijzen of het laadpercentage (stopt laden op tijd als de accu vol is).
      - platform: time_pattern
        minutes: "/15"
        seconds: 10
      - platform: homeassistant
        event: start
      - platform: state
        entity_id:
          - input_button.forecast_herberekenen
          - input_text.forecast_zon_resterend_vandaag_sensor
          - input_text.forecast_zon_morgen_sensor
          - input_text.forecast_zon_productie_sensor
          - input_number.forecast_laad_marge
          - input_number.forecast_betrouwbaarheid
          - input_number.forecast_betrouwbaarheid_jan
          - input_number.forecast_betrouwbaarheid_feb
          - input_number.forecast_betrouwbaarheid_mrt
          - input_number.forecast_betrouwbaarheid_apr
          - input_number.forecast_betrouwbaarheid_mei
          - input_number.forecast_betrouwbaarheid_jun
          - input_number.forecast_betrouwbaarheid_jul
          - input_number.forecast_betrouwbaarheid_aug
          - input_number.forecast_betrouwbaarheid_sep
          - input_number.forecast_betrouwbaarheid_okt
          - input_number.forecast_betrouwbaarheid_nov
          - input_number.forecast_betrouwbaarheid_dec
          - input_boolean.forecast_dal_ontladen_blokkeren
          - input_boolean.forecast_slim_vasthouden
          - input_boolean.forecast_kalibratie_uit
          - input_number.forecast_kalibratie_dagen
          - sensor.zendure_2400_ac_laatste_kalibratie_dagen
          - sensor.forecast_gemeten_laadvermogen
          - input_number.dynamisch_minimale_spread
          - input_number.zendure_2400_ac_max_oplaadvermogen
          - input_boolean.dynamisch_15_minuten
          - sensor.dynamisch_nordpool
          - sensor.zendure_2400_ac_laadpercentage
          - sensor.zendure_2400_ac_minimale_laadpercentage
          - sensor.zendure_2400_ac_maximale_laadpercentage
    variables:
      # ---- Instellingen (vaste waarden, hier aan te passen) ------------
      c_zelfverbruik_standaard_pct: 30   # startwaarde zelfverbruik tot de eerste zonproductie gemeten is
      c_gebruik_start_kwh: 8             # startwaarde dagverbruik, alleen in de eerste uren na installatie
      c_min_hist_dagen: 0.08             # historie vanaf ongeveer 2 uur wordt al gebruikt (dag 1)
      c_min_productie_kwh: 0.3           # minimale gemeten zonproductie voor een zelfverbruik-berekening
      c_min_gebruik_kwh: 0.2             # lager berekend dagverbruik wordt genegeerd
      c_zon_offset_s: 7200               # zon geldt als "voldoende" 2 uur na zonsopkomst
      c_min_overbrugging_s: 1800         # overbrugging is minstens 30 minuten
      c_laden_start_kwh: 0.3             # vanaf dit netladen (kWh) begint een laadronde
      c_laden_stop_kwh: 0.05             # onder dit restant (kWh) stopt een laadronde
      c_vasthouden_min_verschil: 0.01    # slim vasthouden: prijs nu minstens zoveel (€/kWh) onder de grensprijs
      c_vasthouden_laden_min_kwh: 0.5    # slim vasthouden: pas uit bij minstens zoveel gepland netladen (kWh) vóór het einde van het gat
      c_laden_min_w: 500                 # gemeten laadvermogen onder dit niveau wordt genegeerd
      c_prijs_noemer: 0.02               # ondergrens in prijsvergelijkingen (EUR/kWh)
      c_pad_min_uren: 0.25               # pad-check pas bij een gat van minstens 15 minuten
      c_pad_min_tekort_kwh: 0.2          # en een tekort van minstens 0,2 kWh
      c_detail_periode_s: 1800           # lengte van een periode in de detailvoorspelling (Solcast: 30 min)
      c_dek_offset_s: 10800              # zonder detailvoorspelling: zon dekt het verbruik 3 uur na zonsopkomst
      c_dek_min_kwh: 2                   # en alleen als er die dag minstens zoveel zon verwacht wordt
      c_zon_krediet: 0.75                # vooraf ontladen: verwacht zon-overschot telt maar voor 75% (forecast kan te optimistisch zijn)
      c_vo_min_kwh: 0.5                  # vooraf ontladen: pas vanaf zoveel verwacht zon-overschot in een negatief venster
      c_vorm_n_vol_werkdag: 10           # vorm per kwartier telt volledig mee na zoveel complete uren (werkdag)
      c_kalibratie_dagen: 14             # kalibratieladen: standaard na zoveel dagen zonder 100% netladen
      c_dag_n_vol: 3                     # profiel per weekdag telt volledig mee na zoveel metingen (weken) van dat uur
      c_vorm_n_vol_weekend: 5            # idem weekend; daarvoor geleidelijk (minder metingen = dichter bij gelijk verdeeld)

      # ---- Tijd -------------------------------------------------------
      nu_ts: "{{ as_timestamp(now()) }}"
      eind_vandaag_ts: "{{ as_timestamp(today_at('00:00') + timedelta(days=1)) }}"
      # Werkelijke lengte van vandaag (25 of 23 uur op de dag van de zomer-/wintertijdwissel)
      dag_lengte: "{{ eind_vandaag_ts - as_timestamp(today_at('00:00')) }}"
      dt_h: "{{ 0.25 if is_state('input_boolean.dynamisch_15_minuten', 'on') else 1.0 }}"

      # ---- Batterij ---------------------------------------------------
      p_set_kw: "{{ [states('input_number.zendure_2400_ac_max_oplaadvermogen') | float(2400), 100] | max / 1000 }}"
      # Gemeten gemiddeld netlaadvermogen (W); onbekend of onder c_laden_min_w = nog niet bruikbaar
      p_gemeten_w: "{{ states('sensor.forecast_gemeten_laadvermogen') | float(0) }}"
      # Rekenen met wat de accu echt haalt, nooit meer dan de ingestelde maximum
      p_max_kw: "{{ ([p_set_kw, p_gemeten_w / 1000] | min) if p_gemeten_w >= c_laden_min_w else p_set_kw }}"
      e_slot: "{{ (p_max_kw * dt_h) | round(4) }}"
      cap: "{{ states('sensor.zendure_2400_ac_totale_capaciteit') | float(0) }}"
      soc: "{{ states('sensor.zendure_2400_ac_laadpercentage') | float(0) }}"
      soc_min: "{{ states('sensor.zendure_2400_ac_minimale_laadpercentage') | float(0) }}"
      soc_max: "{{ states('sensor.zendure_2400_ac_maximale_laadpercentage') | float(100) }}"
      s_max: "{{ ([soc_max - soc_min, 0] | max / 100 * cap) | round(3) }}"
      s_nu: "{{ ([[soc, soc_max] | min - soc_min, 0] | max / 100 * cap) | round(3) }}"
      room: "{{ ([soc_max - soc, 0] | max / 100 * cap) | round(3) }}"
      # Rendement: uit RTE totaal (alle kWh eruit / alle kWh erin, gewogen naar energie),
      # gelijk verdeeld over laden en ontladen (wortel). De 24-uurs momentmetingen van de
      # efficiëntie zijn ongewogen en tellen elke stop als 0%, waardoor ze te laag uitvallen;
      # die worden alleen gebruikt als RTE totaal (nog) niet bruikbaar is.
      rte_totaal: "{{ states('sensor.zendure_2400_ac_rte_totaal') | float(0) }}"
      rte_ok: "{{ 60 <= rte_totaal <= 100 }}"
      eff_rte_basis: "{{ ((rte_totaal / 100) ** 0.5 * 100) if rte_ok else 0 }}"
      eff_in: >
        {% set m = states('sensor.zendure_2400_ac_efficientie_import_24u_gemiddelde') | float(0) %}
        {% set e = eff_rte_basis if rte_ok else m %}
        {{ (e if 50 <= e <= 100 else 92) / 100 }}
      eff_out: >
        {% set m = states('sensor.zendure_2400_ac_efficientie_export_24u_gemiddelde') | float(0) %}
        {% set e = eff_rte_basis if rte_ok else m %}
        {{ (e if 50 <= e <= 100 else 92) / 100 }}
      rendement_bron: >
        {% if rte_ok %}RTE totaal ({{ rte_totaal | round(1) }}%), gelijk verdeeld over laden en ontladen
        {% elif states('sensor.zendure_2400_ac_efficientie_import_24u_gemiddelde') | float(0) >= 50 %}24-uurs gemiddelde momentmetingen (RTE totaal nog niet bruikbaar)
        {% else %}Standaardwaarde 92% per richting{% endif %}
      eff_rt: "{{ (eff_in * eff_out) | round(4) }}"

      # ---- Zonne-energie (kWh) ----------------------------------------
      # -1 = sensor niet ingevuld of niet beschikbaar
      zon_rest_raw: >
        {% set e = states('input_text.forecast_zon_resterend_vandaag_sensor') %}
        {% if e | lower | regex_match('^sensor\\..+') and has_value(e) %}
          {% set u = state_attr(e, 'unit_of_measurement') %}
          {% set v = states(e) | float(0) %}
          {% if u == 'Wh' %}{{ v / 1000 }}{% elif u == 'MWh' %}{{ v * 1000 }}{% else %}{{ v }}{% endif %}
        {% else %}-1{% endif %}
      zon_morgen_raw: >
        {% set e = states('input_text.forecast_zon_morgen_sensor') %}
        {% if e | lower | regex_match('^sensor\\..+') and has_value(e) %}
          {% set u = state_attr(e, 'unit_of_measurement') %}
          {% set v = states(e) | float(0) %}
          {% if u == 'Wh' %}{{ v / 1000 }}{% elif u == 'MWh' %}{{ v * 1000 }}{% else %}{{ v }}{% endif %}
        {% else %}-1{% endif %}
      # Betrouwbaarheid van deze maand; 0 = niet ingevuld, dan de algemene; ook 0 = 100%
      betr_maand: "{{ states('input_number.forecast_betrouwbaarheid_' ~ ['jan', 'feb', 'mrt', 'apr', 'mei', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'][now().month - 1]) | float(0) }}"
      betr_algemeen: "{{ states('input_number.forecast_betrouwbaarheid') | float(0) }}"
      betr_ingevuld: "{{ betr_maand > 0 or betr_algemeen > 0 }}"
      betr: "{{ (betr_maand if betr_maand > 0 else (betr_algemeen if betr_algemeen > 0 else 100)) / 100 }}"
      betr_bron: "{{ ('Maand (' ~ ['jan', 'feb', 'mrt', 'apr', 'mei', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'][now().month - 1] ~ ')') if betr_maand > 0 else ('Algemeen' if betr_algemeen > 0 else 'Niet ingevuld (100%)') }}"
      zon_rest: "{{ ([zon_rest_raw, 0] | max * betr) | round(2) }}"
      zon_morgen: "{{ ([zon_morgen_raw, 0] | max * betr) | round(2) }}"

      # ---- Historie over 7 dagen --------------------------------------
      # Vorige 7-dagen-waarden (attribuut historie_7_dagen van het plan). Is een 7-dagen-sensor even
      # niet beschikbaar (bv. net na een herstart), dan geldt de vorige waarde in plaats van 0, zodat
      # het dagverbruik en het zelfverbruik niet scheef gaan. Een sensor die niet (meer) bestaat
      # (pakket weggehaald) telt als 0.
      hist_7_vorig: "{{ state_attr('sensor.zendure_forecast_plan', 'historie_7_dagen') or {} }}"
      prod7: >
        {% set e = 'sensor.forecast_zon_productie_7_dagen' %}
        {{ states(e) | float(hist_7_vorig.get('prod7', 0) if states[e] is not none and not state_attr(e, 'restored') else 0) }}
      imp7: >
        {% set e = 'sensor.forecast_p1_import_7_dagen' %}
        {{ states(e) | float(hist_7_vorig.get('imp7', 0) if states[e] is not none and not state_attr(e, 'restored') else 0) }}
      exp7: >
        {% set e = 'sensor.forecast_p1_export_7_dagen' %}
        {{ states(e) | float(hist_7_vorig.get('exp7', 0) if states[e] is not none and not state_attr(e, 'restored') else 0) }}
      exp_zon7: >
        {% set e = 'sensor.forecast_p1_export_uit_zon_7_dagen' %}
        {{ states(e) | float(hist_7_vorig.get('exp_zon7', 0) if states[e] is not none and not state_attr(e, 'restored') else 0) }}
      laden7: >
        {% set e = 'sensor.forecast_zendure_laden_7_dagen' %}
        {{ states(e) | float(hist_7_vorig.get('laden7', 0) if states[e] is not none and not state_attr(e, 'restored') else 0) }}
      ontladen7: >
        {% set e = 'sensor.forecast_zendure_ontladen_7_dagen' %}
        {{ states(e) | float(hist_7_vorig.get('ontladen7', 0) if states[e] is not none and not state_attr(e, 'restored') else 0) }}
      laden_zon7: >
        {% set e = 'sensor.forecast_zendure_laden_uit_zon_7_dagen' %}
        {{ states(e) | float(hist_7_vorig.get('laden_zon7', 0) if states[e] is not none and not state_attr(e, 'restored') else 0) }}
      # Auto (zendure_ev.yaml): telt niet als huisverbruik en niet als direct zonneverbruik. Zonder pakket 0.
      ev7: >
        {% set e = 'sensor.ev_geladen_7_dagen' %}
        {{ states(e) | float(hist_7_vorig.get('ev7', 0) if states[e] is not none and not state_attr(e, 'restored') else 0) }}
      ev_zon7: >
        {% set e = 'sensor.ev_geladen_uit_zon_7_dagen' %}
        {{ states(e) | float(hist_7_vorig.get('ev_zon7', 0) if states[e] is not none and not state_attr(e, 'restored') else 0) }}
      # Airco zolang hij niet uit de accu mag (zendure_hvac.yaml): zelfde behandeling. Zonder pakket 0.
      hvac7: >
        {% set e = 'sensor.hvac_apart_7_dagen' %}
        {{ states(e) | float(hist_7_vorig.get('hvac7', 0) if states[e] is not none and not state_attr(e, 'restored') else 0) }}
      hvac_zon7: >
        {% set e = 'sensor.hvac_apart_uit_zon_7_dagen' %}
        {{ states(e) | float(hist_7_vorig.get('hvac_zon7', 0) if states[e] is not none and not state_attr(e, 'restored') else 0) }}
      # Welke 7-dagen-cijfers nu de vorige waarde gebruiken
      hist_7_ontbreekt: >
        {%- set ns = namespace(l=[]) -%}
        {%- for k, e in [['prod7', 'sensor.forecast_zon_productie_7_dagen'], ['imp7', 'sensor.forecast_p1_import_7_dagen'], ['exp7', 'sensor.forecast_p1_export_7_dagen'], ['exp_zon7', 'sensor.forecast_p1_export_uit_zon_7_dagen'], ['laden7', 'sensor.forecast_zendure_laden_7_dagen'], ['ontladen7', 'sensor.forecast_zendure_ontladen_7_dagen'], ['laden_zon7', 'sensor.forecast_zendure_laden_uit_zon_7_dagen'], ['ev7', 'sensor.ev_geladen_7_dagen'], ['ev_zon7', 'sensor.ev_geladen_uit_zon_7_dagen'], ['hvac7', 'sensor.hvac_apart_7_dagen'], ['hvac_zon7', 'sensor.hvac_apart_uit_zon_7_dagen']] -%}
          {%- if states[e] is not none and not state_attr(e, 'restored') and not has_value(e) -%}{%- set ns.l = ns.l + [k] -%}{%- endif -%}
        {%- endfor -%}
        {{ ns.l }}
      hist_dagen: >
        {# Grootste dekking van zon, net-import en accu laden: zonder zonnepanelen (of als de
           zon-teller tijdelijk ontbreekt) telt de historie van de andere tellers. Geen enkele
           waarde (bv. net na een reset): nog geen historie. #}
        {% set ns = namespace(c=0) %}
        {% for e in ['sensor.forecast_zon_productie_7_dagen', 'sensor.forecast_p1_import_7_dagen', 'sensor.forecast_zendure_laden_7_dagen'] %}
          {% set c = state_attr(e, 'age_coverage_ratio') %}
          {% if c is not none %}{% set ns.c = [ns.c, c | float(0)] | max %}{% endif %}
        {% endfor %}
        {{ (7 * ns.c) | round(2) }}

      # Direct verbruikte zon in 7 dagen = productie - teruglevering uit zon - laden uit zon - auto uit zon
      # - airco uit zon (apart geteld)
      direct_7_kwh: "{{ [prod7 - exp_zon7 - laden_zon7 - ev_zon7 - hvac_zon7, 0] | max }}"
      # Zelfverbruik zon (%) = direct verbruikte zon / productie
      # Wordt vanaf de eerste gemeten zonproductie berekend (dag 1), met de historie die er is.
      zelfverbruik_berekend: >
        {% if prod7 >= c_min_productie_kwh and hist_dagen >= c_min_hist_dagen %}
          {{ ([direct_7_kwh / prod7 * 100, 100] | min) | round(1) }}
        {% else %}-1{% endif %}
      zelfverbruik_pct: "{{ zelfverbruik_berekend if zelfverbruik_berekend >= 0 else c_zelfverbruik_standaard_pct }}"
      direct: "{{ zelfverbruik_pct / 100 }}"
      # Direct zonneverbruik in kWh per dag (gemiddelde over de beschikbare historie, max. 7 dagen).
      # Dit is vrijwel constant, dus op een sombere dag is het percentage hoog en op een zonnige dag laag.
      # Pas vanaf 1 dag historie: een deel van een dag omrekenen naar een hele dag geeft een scheef beeld.
      direct_dag_kwh: >
        {% if prod7 >= c_min_productie_kwh and hist_dagen >= 1 %}
          {{ (direct_7_kwh / hist_dagen) | round(2) }}
        {% else %}-1{% endif %}
      direct_model_kwh: "{{ direct_dag_kwh >= 0 }}"
      zelfverbruik_bron: >
        {% if direct_model_kwh %}Berekend (kWh per dag, {{ [hist_dagen, 7] | min | round(1) }} van 7 dagen{{ ', deels vorige waarden' if hist_7_ontbreekt | length > 0 else '' }})
        {% elif zelfverbruik_berekend >= 0 %}Berekend (% van de productie, dag 1)
        {% else %}Startwaarde {{ c_zelfverbruik_standaard_pct }}% (nog geen zonproductie gemeten){% endif %}

      # Gemiddeld gebruik per dag = import - export + productie - laden + ontladen - auto - airco (apart)
      # Wordt vanaf ongeveer 2 uur historie berekend en omgerekend naar een dag; wordt elke dag nauwkeuriger.
      gebruik_dag_berekend: >
        {% if hist_dagen >= c_min_hist_dagen and (imp7 + prod7) > 0 %}
          {{ (([imp7 - exp7 + prod7 - laden7 + ontladen7 - ev7 - hvac7, 0] | max) / hist_dagen) | round(2) }}
        {% else %}-1{% endif %}
      gebruik_dag: "{{ gebruik_dag_berekend if gebruik_dag_berekend >= c_min_gebruik_kwh else c_gebruik_start_kwh }}"
      gebruik_bron: >
        {% if gebruik_dag_berekend >= c_min_gebruik_kwh %}Berekend ({{ [hist_dagen, 7] | min | round(1) }} van 7 dagen{{ ', dag 1' if hist_dagen < 1 else '' }}{{ ', deels vorige waarden' if hist_7_ontbreekt | length > 0 else '' }})
        {% else %}Startwaarde {{ c_gebruik_start_kwh }} kWh (eerste uren, historie wordt opgebouwd){% endif %}
      l_uur: "{{ gebruik_dag / 24 }}"

      # ---- Verbruiksprofiel per uur (werkdag / weekend) ----------------
      # Per uur van de dag geldt het geleerde verbruik zodra er genoeg metingen zijn
      # (werkdag 3, weekend 2), anders het daggemiddelde / 24.
      prof_wd: "{{ state_attr('sensor.forecast_verbruiksprofiel', 'werkdag') or [] }}"
      prof_we: "{{ state_attr('sensor.forecast_verbruiksprofiel', 'weekend') or [] }}"
      prof_n_wd: "{{ state_attr('sensor.forecast_verbruiksprofiel', 'n_werkdag') or [] }}"
      prof_n_we: "{{ state_attr('sensor.forecast_verbruiksprofiel', 'n_weekend') or [] }}"
      prof_dag: "{{ state_attr('sensor.forecast_verbruiksprofiel', 'per_dag') or [] }}"
      prof_n_dag: "{{ state_attr('sensor.forecast_verbruiksprofiel', 'n_per_dag') or [] }}"
      vandaag_werkdag: >
        {% if has_value('binary_sensor.workday_sensor') %}{{ is_state('binary_sensor.workday_sensor', 'on') }}
        {% else %}{{ now().weekday() < 5 }}{% endif %}
      # 52 uurblokken vanaf het huidige hele uur: {'s': start, 'kw': kWh per uur, 'p': uit profiel}
      uur_last: >
        {%- set ns = namespace(l=[]) -%}
        {%- set h0 = (nu_ts // 3600) * 3600 -%}
        {%- set vandaag = now().date() | string -%}
        {%- for i in range(52) -%}
          {%- set st = h0 + i * 3600 -%}
          {%- set h = st | timestamp_custom('%H', true) | int -%}
          {%- set dag = st | timestamp_custom('%Y-%m-%d', true) -%}
          {%- set wd = vandaag_werkdag if dag == vandaag else (st | timestamp_custom('%w', true) | int) not in [0, 6] -%}
          {%- set prof = prof_wd if wd else prof_we -%}
          {%- set pn = prof_n_wd if wd else prof_n_we -%}
          {%- set nmin = 3 if wd else 2 -%}
          {%- set heeft = prof | length == 24 and pn | length == 24 and prof[h] is not none -%}
          {%- set n = (pn[h] | int(0)) if heeft else 0 -%}
          {%- set ok = heeft and n >= nmin -%}
          {#- Nog niet genoeg metingen: meng de metingen die er zijn met het daggemiddelde
              (1 van 2 metingen = half profiel, half daggemiddelde). Zo telt een duidelijke
              avondpiek al mee terwijl het profiel nog leert. -#}
          {%- set kw = (prof[h] | float(l_uur)) if ok else (((n * (prof[h] | float(l_uur)) + (nmin - n) * l_uur) / nmin) if heeft and n > 0 else l_uur) -%}
          {#- Per weekdag (bv. thuiswerkdagen): meng het profiel van die weekdag erdoor naar het aantal
              metingen (3 = volledig). Niet op een feestdag die als weekend telt. -#}
          {%- set wdag = ((st | timestamp_custom('%w', true) | int) + 6) % 7 -%}
          {%- set normaal = wdag < 5 -%}
          {%- set pd = prof_dag[wdag] if prof_dag | length == 7 and prof_dag[wdag] | length == 24 else [] -%}
          {%- set pdn = ((prof_n_dag[wdag][h] | int(0)) if prof_n_dag | length == 7 and prof_n_dag[wdag] | length == 24 else 0) if pd | length == 24 and pd[h] is not none and wd == normaal else 0 -%}
          {%- set wdg = [pdn / c_dag_n_vol, 1] | min -%}
          {%- set kw = (wdg * (pd[h] | float(kw)) + (1 - wdg) * kw) if pdn > 0 else kw -%}
          {%- set ok = ok or pdn >= c_dag_n_vol -%}
          {%- set ns.l = ns.l + [{'s': st, 'kw': kw | round(4), 'p': ok, 'wd': wd, 'dg': (wdg * 100) | round(0)}] -%}
        {%- endfor -%}
        {{ ns.l }}
      uur_last_eind_ts: "{{ (nu_ts // 3600) * 3600 + 52 * 3600 }}"
      profiel_aandeel: "{{ (uur_last[:24] | selectattr('p') | list | length / 24 * 100) | round(0) }}"
      verbruik_bron_uur: >
        {% if profiel_aandeel >= 100 %}Profiel per uur ({{ 'werkdag' if vandaag_werkdag else 'weekend' }})
        {% elif profiel_aandeel > 0 %}Deels profiel ({{ profiel_aandeel | int }}% van de komende 24 uur), rest daggemiddelde
        {% else %}Daggemiddelde (profiel wordt nog geleerd){% endif %}

      # ---- Verbruik per kwartier (uurprofiel x geleerde vorm) ----------
      # Het uurverbruik hierboven wordt over de vier kwartieren verdeeld met de geleerde vorm.
      # Zolang de vorm nog weinig metingen heeft, schuift hij geleidelijk van gelijk verdeeld
      # naar de geleerde vorm. Het totaal per uur blijft gelijk. Gebruikt waar de planner per
      # prijsslot rekent: zon-dekking, accu leeg, pad-check, slim vasthouden, morgen en tijdlijn.
      vorm_wd: "{{ state_attr('sensor.forecast_verbruiksprofiel', 'vorm_werkdag') or [] }}"
      vorm_we: "{{ state_attr('sensor.forecast_verbruiksprofiel', 'vorm_weekend') or [] }}"
      vorm_n_wd: "{{ state_attr('sensor.forecast_verbruiksprofiel', 'n_vorm_werkdag') or [] }}"
      vorm_n_we: "{{ state_attr('sensor.forecast_verbruiksprofiel', 'n_vorm_weekend') or [] }}"
      kwart_s0: "{{ ((nu_ts // 3600) * 3600) | int }}"
      # Gemiddeld vermogen (kW) per kwartier, 208 kwartieren vanaf het huidige hele uur
      kwart_kw: >
        {%- set ns = namespace(l=[]) -%}
        {%- for u in uur_last -%}
          {%- set h = u.s | timestamp_custom('%H', true) | int -%}
          {%- set v = vorm_wd if u.wd else vorm_we -%}
          {%- set n = vorm_n_wd if u.wd else vorm_n_we -%}
          {%- set nvol = c_vorm_n_vol_werkdag if u.wd else c_vorm_n_vol_weekend -%}
          {%- set w = ([(n[h] | int(0)) / nvol, 1] | min) if (v | length == 96 and n | length == 24) else 0 -%}
          {%- set f = namespace(l=[], som=0) -%}
          {%- for i in range(4) -%}
            {%- set fi = [1 + ((v[h * 4 + i] | float(1)) - 1) * w, 0] | max if w > 0 else 1 -%}
            {%- set f.l = f.l + [fi] -%}{%- set f.som = f.som + fi -%}
          {%- endfor -%}
          {%- for fi in f.l -%}
            {%- set ns.l = ns.l + [(u.kw * fi * 4 / f.som) | round(4) if f.som > 0 else u.kw] -%}
          {%- endfor -%}
        {%- endfor -%}
        {{ ns.l }}
      # Hoe zwaar de geleerde vorm de komende 24 uur meetelt (0% = gelijk verdeeld, 100% = volledig geleerd)
      vorm_aandeel: >
        {%- set ns = namespace(w=0) -%}
        {%- for u in uur_last[:24] -%}
          {%- set h = u.s | timestamp_custom('%H', true) | int -%}
          {%- set n = vorm_n_wd if u.wd else vorm_n_we -%}
          {%- set nvol = c_vorm_n_vol_werkdag if u.wd else c_vorm_n_vol_weekend -%}
          {%- set ns.w = ns.w + (([(n[h] | int(0)) / nvol, 1] | min) if n | length == 24 else 0) -%}
        {%- endfor -%}
        {{ (ns.w / 24 * 100) | round(0) }}
      verbruik_bron_kwartier: >
        {% if vorm_aandeel >= 100 %}Geleerde vorm per kwartier
        {% elif vorm_aandeel > 0 %}Deels geleerde vorm per kwartier ({{ vorm_aandeel | int }}%), rest gelijk verdeeld over het uur
        {% else %}Gelijk verdeeld over het uur (vorm wordt nog geleerd){% endif %}

      # ---- Marge ------------------------------------------------------
      marge_pct: "{{ states('input_number.forecast_laad_marge') | float(0) }}"
      marge_dc: "{{ (marge_pct / 100 * cap) | round(3) }}"

      # ---- Zon (opkomst) ----------------------------------------------
      volgende_zon_ts: "{{ as_timestamp(state_attr('sun.sun', 'next_rising'), nu_ts + 43200) }}"
      zon_dag_is_vandaag: "{{ volgende_zon_ts < eind_vandaag_ts }}"
      zon_forecast_volgende: "{{ zon_rest if zon_dag_is_vandaag else zon_morgen }}"
      zon_voldoende: >
        {% set raw = zon_rest_raw if zon_dag_is_vandaag else zon_morgen_raw %}
        {{ raw >= 0 and zon_forecast_volgende >= gebruik_dag }}
      t_zon_ts: "{{ volgende_zon_ts + c_zon_offset_s }}"

      # ---- Prijsslots -------------------------------------------------
      raw_vandaag: "{{ state_attr('sensor.dynamisch_nordpool', 'raw_today') or [] }}"
      raw_morgen: "{{ state_attr('sensor.dynamisch_nordpool', 'raw_tomorrow') or [] }}"
      prijzen_ok: "{{ raw_vandaag | length > 0 }}"
      morgen_bekend: "{{ raw_morgen | length > 0 }}"
      # Slots van vandaag die nog (deels) in de toekomst liggen
      kand: >
        {%- set ns = namespace(l=[]) -%}
        {%- for p in raw_vandaag -%}
          {%- set e = as_timestamp(p.end) -%}
          {%- if e > nu_ts -%}
            {%- set ns.l = ns.l + [{'s': as_timestamp(p.start), 'e': e, 'v': p.value | float(0)}] -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.l }}
      # Slots van morgen (of, als de prijzen nog niet bekend zijn: het patroon van vandaag +24u)
      morg: >
        {%- set ns = namespace(l=[]) -%}
        {%- if morgen_bekend -%}
          {%- for p in raw_morgen -%}
            {%- set ns.l = ns.l + [{'s': as_timestamp(p.start), 'e': as_timestamp(p.end), 'v': p.value | float(0)}] -%}
          {%- endfor -%}
        {%- else -%}
          {%- for p in raw_vandaag -%}
            {%- set ns.l = ns.l + [{'s': as_timestamp(p.start) + dag_lengte, 'e': as_timestamp(p.end) + dag_lengte, 'v': p.value | float(0)}] -%}
          {%- endfor -%}
        {%- endif -%}
        {{ ns.l }}
      # Prijsstatistiek van de hele dag en de prijs van nu (voor dal-herkenning)
      p_dag_gem: >
        {% set v = raw_vandaag | map(attribute='value') | list %}
        {% if v | length > 0 %}{{ (v | sum / (v | length)) | round(5) }}{% else %}0{% endif %}
      p_dag_min: >
        {% set v = raw_vandaag | map(attribute='value') | list %}
        {% if v | length > 0 %}{{ v | min }}{% else %}0{% endif %}
      prijs_nu: >
        {%- set ns = namespace(p=none) -%}
        {%- for p in raw_vandaag -%}
          {%- if as_timestamp(p.start) <= nu_ts < as_timestamp(p.end) -%}{%- set ns.p = p.value | float(0) -%}{%- endif -%}
        {%- endfor -%}
        {{ ns.p if ns.p is not none else 999 }}
      # Aantal slots dat nodig is om de batterij volledig te vullen
      n_ref: >
        {% if e_slot > 0 and s_max > 0 %}
          {{ [(s_max / eff_in / e_slot) | round(0, 'ceil') | int, 1] | max }}
        {% else %}1{% endif %}
      p_vandaag_ref: >
        {% set s = kand | sort(attribute='v') %}
        {% set n = [n_ref, s | length] | min %}
        {% if n > 0 %}{{ (s[:n] | map(attribute='v') | sum / n) | round(5) }}{% else %}0{% endif %}
      p_morgen_ref: >
        {% set s = morg | sort(attribute='v') %}
        {% set n = [n_ref, s | length] | min %}
        {% if n > 0 %}{{ (s[:n] | map(attribute='v') | sum / n) | round(5) }}{% else %}0{% endif %}
      t_cheap_morgen_ts: >
        {% set s = morg | sort(attribute='v') %}
        {% set n = [n_ref, s | length] | min %}
        {% if n > 0 %}{{ s[:n] | map(attribute='s') | min }}{% else %}{{ eind_vandaag_ts }}{% endif %}
      # Minimale spread van Gielz, net als bij Gielz op het bruto prijsverschil (duur - goedkoop) / goedkoop.
      # Het laad- en ontlaadverlies wordt daarnaast apart getoetst (na verlies moet laden goedkoper blijven),
      # dus het verlies telt niet dubbel.
      spread_min: "{{ states('input_number.dynamisch_minimale_spread') | float(0) }}"
      spread_morgen: >
        {{ ((p_morgen_ref - p_vandaag_ref) / ([p_vandaag_ref | abs, c_prijs_noemer] | max) * 100) | round(1) }}
      # A = morgen goedkoper/gelijk (of onbekend): alleen overbruggen
      # B = morgen duurder: zo vol mogelijk laden
      scenario: "{{ 'B' if (morgen_bekend and spread_morgen > 0 and spread_morgen >= spread_min) else 'A' }}"

      # ---- Direct zonneverbruik per forecast --------------------------
      # Aandeel van de zonuren dat nog komt (voor het directe verbruik van vandaag)
      dag_fractie: >
        {% if is_state('sun.sun', 'above_horizon') %}
          {% set sets = as_timestamp(state_attr('sun.sun', 'next_setting'), nu_ts) %}
          {% set rise = volgende_zon_ts - 86400 %}
          {{ ([[(sets - nu_ts) / ([sets - rise, 3600] | max), 0] | max, 1] | min) | round(3) }}
        {% else %}1{% endif %}
      direct_rest_kwh: >
        {% if direct_model_kwh %}{{ ([zon_rest, direct_dag_kwh * dag_fractie] | min) | round(3) }}
        {% else %}{{ (zon_rest * direct) | round(3) }}{% endif %}
      direct_morgen_kwh: >
        {% if direct_model_kwh %}{{ ([zon_morgen, direct_dag_kwh] | min) | round(3) }}
        {% else %}{{ (zon_morgen * direct) | round(3) }}{% endif %}
      direct_rest_pct: "{{ (direct_rest_kwh / zon_rest * 100) | round(1) if zon_rest > 0 else zelfverbruik_pct }}"
      direct_morgen_pct: "{{ (direct_morgen_kwh / zon_morgen * 100) | round(1) if zon_morgen > 0 else zelfverbruik_pct }}"
      # Auto die overdag op zon laadt (zendure_ev.yaml, Laadmoment Overdag) neemt eerst van het
      # zon-overschot. Vandaag als de zon op is of nog opkomt, anders morgen. Zonder pakket 0.
      ev_overdag_kwh: "{{ state_attr('sensor.ev_laadplan', 'overdag_kwh') | float(0) }}"
      ev_zon_vandaag_kwh: "{{ ev_overdag_kwh if (zon_dag_is_vandaag or is_state('sun.sun', 'above_horizon')) else 0 }}"
      ev_zon_morgen_kwh: "{{ ev_overdag_kwh - ev_zon_vandaag_kwh }}"

      # ---- Overbruggingsperiode ---------------------------------------
      t_end_ts: >
        {% set t = [t_cheap_morgen_ts, t_zon_ts] | min if zon_voldoende else t_cheap_morgen_ts %}
        {{ [t, nu_ts + c_min_overbrugging_s] | max }}
      uren_bridge: "{{ ((t_end_ts - nu_ts) / 3600) | round(2) }}"
      # Zon van vandaag valt in de overbrugging, behalve als de overbrugging vóór zonsopkomst stopt
      zon_in_bridge: "{{ (not zon_dag_is_vandaag) or (t_end_ts > t_zon_ts) }}"
      last_bridge: >
        {%- set ns = namespace(k=0) -%}
        {%- for u in uur_last -%}
          {%- set a = [u.s, nu_ts] | max -%}{%- set b = [u.s + 3600, t_end_ts] | min -%}
          {%- if b > a -%}{%- set ns.k = ns.k + u.kw * (b - a) / 3600 -%}{%- endif -%}
        {%- endfor -%}
        {%- if t_end_ts > uur_last_eind_ts -%}{%- set ns.k = ns.k + l_uur * (t_end_ts - uur_last_eind_ts) / 3600 -%}{%- endif -%}
        {{ ns.k | round(3) }}
      direct_bridge: "{{ direct_rest_kwh if zon_in_bridge else 0 }}"
      # Wat de batterij (of het net) moet leveren tijdens de overbrugging
      need_bridge_ac: "{{ ([last_bridge - direct_bridge, 0] | max) | round(3) }}"
      need_bridge_dc: "{{ (need_bridge_ac / eff_out) | round(3) }}"
      # Zon-overschot dat naar de batterij kan
      zon_overschot_ac: "{{ ([zon_rest - direct_rest_kwh - ev_zon_vandaag_kwh, 0] | max) | round(3) if zon_in_bridge else 0 }}"
      zon_dc: "{{ ([zon_overschot_ac * eff_in, room] | min) | round(3) }}"

      # ---- Doel en netladen -------------------------------------------
      target_dc: "{{ s_max if scenario == 'B' else ([need_bridge_dc + marge_dc, s_max] | min) | round(3) }}"
      grid_dc: "{{ ([[target_dc - s_nu - zon_dc, 0] | max, room] | min) | round(3) }}"
      grid_ac: "{{ (grid_dc / eff_in) | round(3) }}"
      n_slots: >
        {% if grid_ac >= c_laden_stop_kwh and e_slot > 0 %}{{ (grid_ac / e_slot) | round(0, 'ceil') | int }}{% else %}0{% endif %}
      # Gemiddelde prijs van alle slots in de overbruggingsperiode
      p_bridge_avg: >
        {% set ns = namespace(som=0, n=0) %}
        {% for x in kand %}{% if x.s < t_end_ts %}{% set ns.som = ns.som + x.v %}{% set ns.n = ns.n + 1 %}{% endif %}{% endfor %}
        {% for x in morg %}{% if x.s < t_end_ts %}{% set ns.som = ns.som + x.v %}{% set ns.n = ns.n + 1 %}{% endif %}{% endfor %}
        {% if ns.n > 0 %}{{ (ns.som / ns.n) | round(5) }}{% else %}{{ p_vandaag_ref }}{% endif %}
      # Vergelijkingsprijs: bij B de goedkoopste laadprijs van morgen, bij A het gemiddelde van de overbrugging
      p_vergelijk: "{{ p_morgen_ref if scenario == 'B' else p_bridge_avg }}"
      # Opgeslagen energie levert door het round-trip-verlies minder op: reken de waarde ervan terug
      p_vergelijk_eff: "{{ (p_vergelijk * eff_rt) if p_vergelijk > 0 else p_vergelijk }}"
      gekozen_basis: >
        {%- set ns = namespace(l=[]) -%}
        {%- for x in kand | sort(attribute='v') -%}
          {%- set sp = (p_vergelijk_eff - x.v) / ([x.v | abs, c_prijs_noemer] | max) * 100 -%}
          {%- set sp_bruto = (p_vergelijk - x.v) / ([x.v | abs, c_prijs_noemer] | max) * 100 -%}
          {#- Scenario A: ook onder het daggemiddelde (op een vlakke dag is er geen dal) -#}
          {%- set dal_ok = scenario == 'B' or x.v <= p_dag_gem -%}
          {%- if ns.l | length < n_slots and sp_bruto >= spread_min and sp > 0 and dal_ok -%}
            {%- set ns.l = ns.l + [x] -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.l | sort(attribute='s') }}

      # ---- Goedkoop dal (drempels; nodig voor de pad-check en de dal-blokkade) ----
      # Dal = prijs onder (laagste dagprijs / rendement) en onder het daggemiddelde, per dag.
      dal_drempel: "{{ (p_dag_min + (p_dag_min | abs) * (1 / eff_rt - 1)) | round(5) if eff_rt > 0 else p_dag_min }}"
      p_morg_gem: >
        {% set v = morg | map(attribute='v') | list %}
        {% if v | length > 0 %}{{ (v | sum / (v | length)) | round(5) }}{% else %}{{ p_dag_gem }}{% endif %}
      p_morg_min: >
        {% set v = morg | map(attribute='v') | list %}
        {% if v | length > 0 %}{{ v | min }}{% else %}{{ p_dag_min }}{% endif %}
      dal_drempel_morgen: "{{ (p_morg_min + (p_morg_min | abs) * (1 / eff_rt - 1)) | round(5) if eff_rt > 0 else p_morg_min }}"
      # Rekent de pad-check met de dal-blokkade? Alleen als de schakelaar aan staat en er volgens de
      # energiebalans uit het net geladen moet worden (zelfde voorwaarde als de blokkade zelf; de
      # pad-check kan die alleen vergroten, dus dit is hooguit voorzichtig).
      dal_blokkade_plan: "{{ is_state('input_boolean.forecast_dal_ontladen_blokkeren', 'on') and grid_ac >= c_laden_stop_kwh }}"
      # ---- Pad-check: haalt de accu het moment dat er weer energie bijkomt? ----
      # Een totale energiebalans zegt niets over het moment: de accu kan 's ochtends
      # leeg zijn terwijl de zon het verbruik pas uren later dekt. Dan koopt het huis
      # in dat gat in, vaak tegen de ochtendpiek. De pad-check rekent dat gat uit en
      # plant extra laadslots ervoor, maar alleen als die (na round-trip-verlies)
      # goedkoper zijn dan de inkoop in het gat. Hij werkt ook als er nog geen enkel
      # gewoon laadslot gepland is, en gebruikt ook de prijzen van morgen zodra die bekend zijn.

      # Zon-dekking: vanaf wanneer dekt de zon het verbruik?
      # Uit de detailvoorspelling (Solcast: attribuut detailedForecast, kW per half uur)
      # van de ingevulde sensoren en van de "_today"-variant van de resterend-vandaag-sensor.
      # Alleen de eerstvolgende zondag telt (tot de volgende zonsondergang).
      zon_ondergang_ts: "{{ as_timestamp(state_attr('sun.sun', 'next_setting'), nu_ts + 43200) }}"
      zon_detail: >
        {%- set e1 = states('input_text.forecast_zon_resterend_vandaag_sensor') | trim -%}
        {%- set e2 = states('input_text.forecast_zon_morgen_sensor') | trim -%}
        {%- set ns = namespace(l=[], ts=[], ids=[]) -%}
        {%- for e in [e1, e1 | replace('_remaining_today', '_today'), e2] -%}
          {%- if e | lower | regex_match('^sensor\\..+') and e not in ns.ids -%}
            {%- set ns.ids = ns.ids + [e] -%}
            {%- set d = state_attr(e, 'detailedForecast') or state_attr(e, 'detailed_forecast') or [] -%}
            {%- for p in d -%}
              {%- if p is mapping and p.period_start is defined -%}
                {%- set ps = as_timestamp(p.period_start, 0) -%}
                {%- if ps > nu_ts - c_detail_periode_s and ps < zon_ondergang_ts and ps not in ns.ts -%}
                  {%- set ns.ts = ns.ts + [ps] -%}
                  {%- set nk = namespace(k=0) -%}{%- for i in range(((ps - kwart_s0) // 900) | int, (((ps + c_detail_periode_s) - kwart_s0 - 0.001) // 900) | int + 1) -%}{%- set qa = kwart_s0 + i * 900 -%}{%- set ov = [qa + 900, (ps + c_detail_periode_s)] | min - [qa, ps] | max -%}{%- if ov > 0 -%}{%- set nk.k = nk.k + (kwart_kw[[i, 0] | max] if i < kwart_kw | length else l_uur) * ov / 3600 -%}{%- endif -%}{%- endfor -%}{%- set kwh_p = nk.k -%}
                  {%- set kw = kwh_p * 3600 / c_detail_periode_s -%}
                  {%- set ns.l = ns.l + [{'s': ps, 'pv': ((p.pv_estimate | float(0)) * betr) | round(3), 'kw': kw}] -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.l | sort(attribute='s') }}
      t_zon_dek_detail: >
        {%- set ns = namespace(t=0) -%}
        {%- for p in zon_detail -%}
          {%- if ns.t == 0 and p.pv >= p.kw -%}{%- set ns.t = [p.s, nu_ts] | max -%}{%- endif -%}
        {%- endfor -%}
        {{ ns.t }}
      zon_dek_bron: >
        {%- if zon_detail | length > 0 and t_zon_dek_detail > 0 -%}Detailvoorspelling
        {%- elif zon_detail | length > 0 -%}Detailvoorspelling: zon dekt het verbruik niet meer, tot einde overbrugging
        {%- elif is_state('sun.sun', 'above_horizon') or zon_forecast_volgende >= c_dek_min_kwh -%}Zonsopkomst + {{ (c_dek_offset_s / 3600) | round(1) }} uur
        {%- else -%}Geen (te weinig zon verwacht){%- endif -%}
      t_zon_dek_ts: >
        {%- if zon_detail | length > 0 -%}{{ t_zon_dek_detail if t_zon_dek_detail > 0 else t_end_ts }}
        {%- elif is_state('sun.sun', 'above_horizon') -%}{{ [volgende_zon_ts - 86400 + c_dek_offset_s, nu_ts] | max }}
        {%- elif zon_forecast_volgende >= c_dek_min_kwh -%}{{ volgende_zon_ts + c_dek_offset_s }}
        {%- else -%}{{ t_end_ts }}{%- endif -%}

      # Het gat: van "accu leeg" tot het eerste van: zon-dekking of einde overbrugging.
      # Een gepland laadslot sluit het gat NIET af: één kwartier vult de accu niet, en dan
      # zou een dure piek ná dat slot onzichtbaar worden. De toewijzing hieronder kiest per
      # duur kwartier zelf de goedkoopste slots ervóór (de gewone laadslots horen daar ook bij).
      # Accu leeg: per prijsslot het verbruik uit de accu aftrekken. Met de dal-blokkade levert
      # de accu niets in een dal-slot (het huis koopt dan direct in), dus hij houdt langer.
      t_leeg_ts: >
        {%- set ns = namespace(e=s_nu * eff_out, t=0, eind=nu_ts) -%}
        {%- for x in (kand + morg) | sort(attribute='s') -%}
          {%- if ns.t == 0 and x.e > nu_ts -%}
            {%- set a = [x.s, nu_ts] | max -%}
            {%- set ns.eind = x.e -%}
            {%- set is_morgen = x.s >= eind_vandaag_ts -%}
            {%- set dal = dal_blokkade_plan and ((x.v <= dal_drempel_morgen and x.v < p_morg_gem) if is_morgen else (x.v <= dal_drempel and x.v < p_dag_gem)) -%}
            {%- if not dal -%}
              {%- set nk = namespace(k=0) -%}{%- for i in range(((a - kwart_s0) // 900) | int, ((x.e - kwart_s0 - 0.001) // 900) | int + 1) -%}{%- set qa = kwart_s0 + i * 900 -%}{%- set ov = [qa + 900, x.e] | min - [qa, a] | max -%}{%- if ov > 0 -%}{%- set nk.k = nk.k + (kwart_kw[[i, 0] | max] if i < kwart_kw | length else l_uur) * ov / 3600 -%}{%- endif -%}{%- endfor -%}{%- set nodig = nk.k -%}
              {%- if nodig >= ns.e and nodig > 0 -%}{%- set ns.t = a + ns.e / nodig * (x.e - a) -%}
              {%- else -%}{%- set ns.e = ns.e - nodig -%}{%- endif -%}
            {%- endif -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.t if ns.t > 0 else (ns.eind + (ns.e / l_uur * 3600 if l_uur > 0 else 172800)) }}
      # De laadmarge geldt ook hier: de accu wordt als leeg gerekend als alleen de marge nog over is,
      # zodat een te lage verbruiksschatting niet meteen een dure piek zonder accu geeft.
      # (t_leeg_ts hierboven is de eenvoudige verwachting zonder marge; het dashboard toont t_leeg_toon_ts.)
      t_leeg_plan_ts: >
        {%- set ns = namespace(e=([s_nu - marge_dc, 0] | max) * eff_out, t=0, eind=nu_ts) -%}
        {%- for x in (kand + morg) | sort(attribute='s') -%}
          {%- if ns.t == 0 and x.e > nu_ts -%}
            {%- set a = [x.s, nu_ts] | max -%}
            {%- set ns.eind = x.e -%}
            {%- set is_morgen = x.s >= eind_vandaag_ts -%}
            {%- set dal = dal_blokkade_plan and ((x.v <= dal_drempel_morgen and x.v < p_morg_gem) if is_morgen else (x.v <= dal_drempel and x.v < p_dag_gem)) -%}
            {%- if not dal -%}
              {%- set nk = namespace(k=0) -%}{%- for i in range(((a - kwart_s0) // 900) | int, ((x.e - kwart_s0 - 0.001) // 900) | int + 1) -%}{%- set qa = kwart_s0 + i * 900 -%}{%- set ov = [qa + 900, x.e] | min - [qa, a] | max -%}{%- if ov > 0 -%}{%- set nk.k = nk.k + (kwart_kw[[i, 0] | max] if i < kwart_kw | length else l_uur) * ov / 3600 -%}{%- endif -%}{%- endfor -%}{%- set nodig = nk.k -%}
              {%- if nodig >= ns.e and nodig > 0 -%}{%- set ns.t = a + ns.e / nodig * (x.e - a) -%}
              {%- else -%}{%- set ns.e = ns.e - nodig -%}{%- endif -%}
            {%- endif -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.t if ns.t > 0 else (ns.eind + (ns.e / l_uur * 3600 if l_uur > 0 else 172800)) }}
      # Kandidaat-slots: de rest van vandaag, plus morgen als die prijzen echt bekend zijn
      pad_kand: "{{ kand + (morg if morgen_bekend else []) }}"

      # ---- Pad-check voorbij de nacht ----------------------------------
      # 's Middags en 's avonds eindigt de overbrugging bij het begin van de goedkope uren van
      # morgen (bv. 00:45). Een dure ochtendpiek ná die uren viel daardoor buiten de pad-check,
      # ook als laden nu goedkoper is dan in de nacht. Zodra de prijzen van morgen bekend zijn,
      # kijkt de pad-check door tot de zon van morgen het verbruik dekt (niet verder, anders
      # wordt er 's nachts geladen wat de zon overdag toch levert), begrensd op het einde van de
      # bekende prijzen. De toewijzing kiest per duur kwartier zelf het goedkoopste slot ervóór:
      # nu, of in de nacht als die goedkoper is. De energiebalans (overbrugging, scenario A/B)
      # verandert niet. Na middernacht valt de ochtend al binnen de gewone overbrugging.
      zon_morgen_van_ts: "{{ volgende_zon_ts - 7200 }}"
      zon_morgen_tot_ts: "{{ volgende_zon_ts + 72000 }}"
      zon_detail_morgen: >
        {%- set e1 = states('input_text.forecast_zon_resterend_vandaag_sensor') | trim -%}
        {%- set e2 = states('input_text.forecast_zon_morgen_sensor') | trim -%}
        {%- set ns = namespace(l=[], ts=[], ids=[]) -%}
        {%- if not zon_dag_is_vandaag -%}
          {%- for e in [e2, e1 | replace('_remaining_today', '_today'), e1] -%}
            {%- if e | lower | regex_match('^sensor\\..+') and e not in ns.ids -%}
              {%- set ns.ids = ns.ids + [e] -%}
              {%- set d = state_attr(e, 'detailedForecast') or state_attr(e, 'detailed_forecast') or [] -%}
              {%- for p in d -%}
                {%- if p is mapping and p.period_start is defined -%}
                  {%- set ps = as_timestamp(p.period_start, 0) -%}
                  {%- if ps >= zon_morgen_van_ts and ps < zon_morgen_tot_ts and ps not in ns.ts -%}
                    {%- set ns.ts = ns.ts + [ps] -%}
                    {%- set nk = namespace(k=0) -%}{%- for i in range(((ps - kwart_s0) // 900) | int, (((ps + c_detail_periode_s) - kwart_s0 - 0.001) // 900) | int + 1) -%}{%- set qa = kwart_s0 + i * 900 -%}{%- set ov = [qa + 900, (ps + c_detail_periode_s)] | min - [qa, ps] | max -%}{%- if ov > 0 -%}{%- set nk.k = nk.k + (kwart_kw[[i, 0] | max] if i < kwart_kw | length else l_uur) * ov / 3600 -%}{%- endif -%}{%- endfor -%}
                    {%- set ns.l = ns.l + [{'s': ps, 'pv': ((p.pv_estimate | float(0)) * betr) | round(3), 'kw': nk.k * 3600 / c_detail_periode_s}] -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endif -%}
        {{ ns.l | sort(attribute='s') }}
      # Vanaf wanneer dekt de zon van morgen het verbruik? 0 = niet (of niet bekend)
      t_zon_dek_morgen_ts: >
        {%- set ns = namespace(t=0) -%}
        {%- for p in zon_detail_morgen -%}
          {%- if ns.t == 0 and p.pv >= p.kw -%}{%- set ns.t = p.s -%}{%- endif -%}
        {%- endfor -%}
        {%- if zon_detail_morgen | length > 0 -%}{{ ns.t }}
        {%- elif not zon_dag_is_vandaag and zon_morgen >= c_dek_min_kwh -%}{{ volgende_zon_ts + c_dek_offset_s }}
        {%- else -%}0{%- endif -%}
      prijzen_eind_ts: "{{ (morg | map(attribute='e') | max) if morg | length > 0 else eind_vandaag_ts }}"
      # Dekt de zon morgen het verbruik niet (winter), dan tot zonsopkomst + 3 uur: het gaat om de
      # ochtendpiek, niet om de avond van morgen (die plant de planner na middernacht).
      t_pad_morgen_ts: >
        {%- set t = t_zon_dek_morgen_ts if t_zon_dek_morgen_ts > 0 else volgende_zon_ts + c_dek_offset_s -%}
        {{ [t, prijzen_eind_ts] | min }}
      pad_verder: "{{ morgen_bekend and not zon_dag_is_vandaag and t_pad_morgen_ts > t_end_ts }}"
      # Over de dag heen: dekt de zon het verbruik vóór het einde van de overbrugging, dan kijkt de
      # pad-check toch door tot het einde van de overbrugging. Zo ziet hij ook de avondpiek ná de zon:
      # op een sombere dag vult de zon de accu niet en loont laden in de goedkope nacht voor de avond.
      # De zon telt per detailperiode mee (direct verbruik en overschot naar de accu).
      # Alleen met "Niet ontladen in goedkoop dal" of "Slim vasthouden": anders gaat de nachtstroom
      # 's ochtends al op. Beide houden de nachtlading vast tot de duurdere kwartieren.
      pad_dag: >
        {{ not pad_verder and t_zon_dek_ts < t_end_ts
           and (is_state('input_boolean.forecast_dal_ontladen_blokkeren', 'on') or is_state('input_boolean.forecast_slim_vasthouden', 'on')) }}
      t_pad_horizon_ts: "{{ t_pad_morgen_ts if pad_verder else (t_end_ts if pad_dag else [t_zon_dek_ts, t_end_ts] | min) }}"
      pad_horizon_bron: >
        {%- if pad_dag -%}Over de dag heen tot einde overbrugging (zon telt mee)
        {%- elif not pad_verder -%}Tot {{ 'zon-dekking' if t_zon_dek_ts < t_end_ts else 'einde overbrugging' }}
        {%- elif zon_detail_morgen | length > 0 and t_zon_dek_morgen_ts > 0 -%}Tot zon-dekking morgen (detailvoorspelling)
        {%- elif t_zon_dek_morgen_ts > 0 -%}Tot zon-dekking morgen (zonsopkomst + {{ (c_dek_offset_s / 3600) | round(1) }} uur)
        {%- else -%}Tot zonsopkomst morgen + {{ (c_dek_offset_s / 3600) | round(1) }} uur (zon dekt morgen het verbruik niet){%- endif -%}
      # Zon per detailperiode voor de pad-check: vandaag plus (bij doorkijken) morgen
      pad_zon: >
        {%- if pad_verder -%}
          {%- set ts = zon_detail | map(attribute='s') | list -%}
          {{ (zon_detail + (zon_detail_morgen | rejectattr('s', 'in', ts) | list)) | sort(attribute='s') }}
        {%- else -%}{{ zon_detail }}{%- endif -%}
      # Accu leeg bij doorkijken: de zon van vandaag telt mee (direct verbruik en overschot naar
      # de accu), anders begint het gat 's middags al terwijl de zon het huis nog draait. Zonder
      # detailvoorspelling: zon dekt het verbruik tot zonsondergang en het verwachte overschot
      # gaat er nu bij. Nachtladen telt hier bewust niet mee: dat plant de toewijzing.
      t_leeg_verder_ts: >
        {%- set emax = ([s_max - marge_dc, 0] | max) * eff_out -%}
        {%- set ns = namespace(e=([s_nu - marge_dc, 0] | max) * eff_out, t=0, ev=ev_zon_vandaag_kwh) -%}
        {%- set zon_zonder_detail = zon_detail | length == 0 and is_state('sun.sun', 'above_horizon') -%}
        {%- if zon_zonder_detail -%}{%- set ns.e = [ns.e + zon_dc * eff_out, emax] | min -%}{%- endif -%}
        {%- if pad_verder or pad_dag -%}
          {%- for x in pad_kand | sort(attribute='s') -%}
            {%- if ns.t == 0 and x.e > nu_ts and x.s < t_pad_horizon_ts -%}
              {%- set a = [x.s, nu_ts] | max -%}{%- set b = [x.e, t_pad_horizon_ts] | min -%}
              {%- set nk = namespace(k=0) -%}{%- for i in range(((a - kwart_s0) // 900) | int, ((b - kwart_s0 - 0.001) // 900) | int + 1) -%}{%- set qa = kwart_s0 + i * 900 -%}{%- set ov = [qa + 900, b] | min - [qa, a] | max -%}{%- if ov > 0 -%}{%- set nk.k = nk.k + (kwart_kw[[i, 0] | max] if i < kwart_kw | length else l_uur) * ov / 3600 -%}{%- endif -%}{%- endfor -%}
              {%- set nz = namespace(d=0, o=0) -%}
              {%- for p in pad_zon -%}
                {%- set pa = [p.s, a] | max -%}{%- set pb = [p.s + c_detail_periode_s, b] | min -%}
                {%- if pb > pa -%}
                  {%- set nz.d = nz.d + ([p.pv, p.kw] | min) * (pb - pa) / 3600 -%}
                  {%- set nz.o = nz.o + ([p.pv - p.kw, 0] | max) * (pb - pa) / 3600 -%}
                {%- endif -%}
              {%- endfor -%}
              {%- if zon_zonder_detail and a < zon_ondergang_ts -%}{%- set nz.d = nk.k -%}{%- endif -%}
              {%- set naar_ev = [nz.o, ns.ev] | min -%}{%- set ns.ev = ns.ev - naar_ev -%}
              {%- set ns.e = [ns.e + (nz.o - naar_ev) * eff_in * eff_out, emax] | min -%}
              {%- set is_morgen = x.s >= eind_vandaag_ts -%}
              {%- set dal = dal_blokkade_plan and ((x.v <= dal_drempel_morgen and x.v < p_morg_gem) if is_morgen else (x.v <= dal_drempel and x.v < p_dag_gem)) -%}
              {%- set nodig = [nk.k - nz.d, 0] | max -%}
              {%- if not dal -%}
                {%- if nodig >= ns.e and nodig > 0 -%}{%- set ns.t = a + ns.e / nodig * (b - a) -%}
                {%- else -%}{%- set ns.e = ns.e - nodig -%}{%- endif -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endif -%}
        {{ ns.t if ns.t > 0 else t_pad_horizon_ts }}

      t_gap_eind_ts: "{{ t_pad_horizon_ts }}"
      t_gap_start_ts: "{{ [t_leeg_verder_ts if (pad_verder or pad_dag) else t_leeg_plan_ts, nu_ts] | max }}"
      gap_uren: "{{ ([t_gap_eind_ts - t_gap_start_ts, 0] | max / 3600) | round(2) }}"
      gap_last: >
        {%- set ns = namespace(k=0) -%}
        {%- for u in uur_last -%}
          {%- set a = [u.s, t_gap_start_ts] | max -%}{%- set b = [u.s + 3600, t_gap_eind_ts] | min -%}
          {%- if b > a -%}{%- set ns.k = ns.k + u.kw * (b - a) / 3600 -%}{%- endif -%}
        {%- endfor -%}
        {{ ns.k | round(3) }}
      # Per prijsslot in het gat: verbruik min de zon die daar al direct verbruikt wordt
      # (zon alleen bekend met detailvoorspelling)
      gap_kwartieren: >
        {%- set ns = namespace(l=[]) -%}
        {%- for x in pad_kand -%}
          {%- set a = [x.s, t_gap_start_ts] | max -%}
          {%- set b = [x.e, t_gap_eind_ts] | min -%}
          {%- if b > a -%}
            {%- set nz = namespace(k=0) -%}
            {%- for p in pad_zon -%}
              {%- set pa = [p.s, a] | max -%}
              {%- set pb = [p.s + c_detail_periode_s, b] | min -%}
              {%- if pb > pa -%}{%- set nz.k = nz.k + ([p.pv, p.kw] | min) * (pb - pa) / 3600 -%}{%- endif -%}
            {%- endfor -%}
            {%- set nk = namespace(k=0) -%}{%- for i in range(((a - kwart_s0) // 900) | int, ((b - kwart_s0 - 0.001) // 900) | int + 1) -%}{%- set qa = kwart_s0 + i * 900 -%}{%- set ov = [qa + 900, b] | min - [qa, a] | max -%}{%- if ov > 0 -%}{%- set nk.k = nk.k + (kwart_kw[[i, 0] | max] if i < kwart_kw | length else l_uur) * ov / 3600 -%}{%- endif -%}{%- endfor -%}{%- set last = nk.k -%}
            {%- set ns.l = ns.l + [{'s': x.s, 'v': x.v, 'kwh': ([last - nz.k, 0] | max) | round(4)}] -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.l }}
      gap_tekort_ac: "{{ (gap_kwartieren | map(attribute='kwh') | sum) | round(3) }}"
      gap_zon_direct: "{{ ([gap_last - gap_tekort_ac, 0] | max) | round(3) }}"
      # Goedkoopste laadmoment dat het gat nog kan helpen
      p_laad_min: >
        {% set v = pad_kand | selectattr('s', 'lt', t_gap_eind_ts) | map(attribute='v') | list %}
        {% if v | length > 0 %}{{ v | min }}{% else %}0{% endif %}
      # Alleen de slots in het gat die duurder zijn dan dat laadmoment na round-trip-verlies tellen mee:
      # inkopen in een goedkoop deel van het gat is goedkoper dan eerst opslaan.
      gap_waardevol: >
        {%- set ns = namespace(l=[]) -%}
        {%- for q in gap_kwartieren -%}
          {%- set sp = (q.v * eff_rt - p_laad_min) / ([p_laad_min | abs, c_prijs_noemer] | max) * 100 -%}
          {%- set sp_bruto = (q.v - p_laad_min) / ([p_laad_min | abs, c_prijs_noemer] | max) * 100 -%}
          {%- if q.kwh > 0 and sp > 0 and sp_bruto >= spread_min -%}{%- set ns.l = ns.l + [q] -%}{%- endif -%}
        {%- endfor -%}
        {{ ns.l }}
      gap_waardevol_ac: "{{ (gap_waardevol | map(attribute='kwh') | sum) | round(3) }}"
      # Gewogen gemiddelde inkoopprijs in die dure slots
      p_gap_avg: >
        {% set ns = namespace(som=0, kwh=0) %}
        {% for q in gap_waardevol %}{% set ns.som = ns.som + q.v * q.kwh %}{% set ns.kwh = ns.kwh + q.kwh %}{% endfor %}
        {% if ns.kwh > 0 %}{{ (ns.som / ns.kwh) | round(5) }}{% else %}0{% endif %}
      pad_actief: "{{ gap_uren >= c_pad_min_uren and gap_waardevol_ac >= c_pad_min_tekort_kwh and p_gap_avg > 0 }}"
      # Toewijzing: elk duur slot in het gat (duurste eerst) krijgt de goedkoopste laadslots
      # die vóór dat dure slot eindigen. Een laadslot dat pas na de piek valt, helpt de piek niet.
      # Een laadslot levert maximaal e_slot kWh (AC) en kan meerdere dure slots bedienen.
      # Begrensd op de ruimte in de accu.
      # Laadmarge bij een (bijna) lege accu: de marge wordt hierboven van de accu-inhoud afgetrokken,
      # maar is de accu leeger dan de marge, dan telt het tekort als extra verbruik in het eerste
      # dure kwartier, zodat de buffer vóór de dure kwartieren wordt bijgeladen (als dat loont).
      marge_tekort_ac: "{{ (([marge_dc - s_nu, 0] | max) * eff_out) | round(3) }}"
      # Over de dag heen: zon-overschot ná "accu leeg" laadt de accu weer bij. Dat dekt de goedkoopste
      # dure kwartieren die erna komen, zodat er niet uit het net wordt geladen wat de zon levert.
      gap_zon_overschot: >
        {%- set ns = namespace(l=[]) -%}
        {%- if pad_dag -%}
          {%- for p in pad_zon -%}
            {%- set pa = [p.s, t_gap_start_ts] | max -%}{%- set pb = [p.s + c_detail_periode_s, t_gap_eind_ts] | min -%}
            {%- if pb > pa and p.pv > p.kw -%}{%- set ns.l = ns.l + [{'s': pa, 'k': ((p.pv - p.kw) * (pb - pa) / 3600 * eff_in * eff_out) | round(4)}] -%}{%- endif -%}
          {%- endfor -%}
        {%- endif -%}
        {{ ns.l }}
      gap_na_zon: >
        {%- set ns = namespace(l=[], zon=0) -%}
        {%- set zl = gap_zon_overschot -%}
        {%- set ns.l = gap_waardevol -%}
        {%- for z in zl -%}
          {%- set nz = namespace(k=z.k, out=[]) -%}
          {%- for q in ns.l | sort(attribute='v') -%}
            {%- if q.s >= z.s and nz.k > 0 -%}
              {%- set af = [q.kwh, nz.k] | min -%}{%- set nz.k = nz.k - af -%}
              {%- if q.kwh - af > 0.0001 -%}{%- set nz.out = nz.out + [{'s': q.s, 'v': q.v, 'kwh': (q.kwh - af) | round(4)}] -%}{%- endif -%}
            {%- else -%}{%- set nz.out = nz.out + [q] -%}{%- endif -%}
          {%- endfor -%}
          {%- set ns.l = nz.out -%}
        {%- endfor -%}
        {{ ns.l }}
      gap_met_marge: >
        {%- set eerste = gap_na_zon | sort(attribute='s') | first if gap_na_zon | length > 0 else none -%}
        {%- if eerste is not none and marge_tekort_ac > 0 -%}
          {{ gap_na_zon + [{'s': eerste.s, 'v': eerste.v, 'kwh': marge_tekort_ac}] }}
        {%- else -%}{{ gap_na_zon }}{%- endif -%}
      pad_toewijzing: >
        {%- set ns = namespace(l=[], totaal=0) -%}
        {%- set ruimte = ([room - zon_dc, 0] | max) if pad_dag else room -%}
        {%- set max_ac = (ruimte / eff_in) if eff_in > 0 else 0 -%}
        {%- if pad_actief and e_slot > 0 and eff_rt > 0 -%}
          {%- set laad_kand = pad_kand | sort(attribute='v') -%}
          {%- for q in gap_met_marge | sort(attribute='v', reverse=true) -%}
            {%- set nq = namespace(nodig=q.kwh / eff_rt) -%}
            {%- for x in laad_kand -%}
              {%- if nq.nodig > 0.001 and ns.totaal < max_ac and x.e <= q.s and x.e > nu_ts -%}
                {%- set sp = (q.v * eff_rt - x.v) / ([x.v | abs, c_prijs_noemer] | max) * 100 -%}
                {%- set sp_bruto = (q.v - x.v) / ([x.v | abs, c_prijs_noemer] | max) * 100 -%}
                {%- if sp > 0 and sp_bruto >= spread_min -%}
                  {%- set gebruikt = ns.l | selectattr('s', 'eq', x.s) | map(attribute='k') | sum -%}
                  {%- set neem = [e_slot - gebruikt, nq.nodig, max_ac - ns.totaal] | min -%}
                  {%- if neem > 0.001 -%}
                    {%- set ns.l = ns.l + [{'s': x.s, 'k': neem | round(4)}] -%}
                    {%- set ns.totaal = ns.totaal + neem -%}
                    {%- set nq.nodig = nq.nodig - neem -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endfor -%}
        {%- endif -%}
        {{ ns.l }}
      pad_netladen_ac: "{{ (pad_toewijzing | map(attribute='k') | sum) | round(3) }}"
      extra_slots: >
        {%- set ss = pad_toewijzing | map(attribute='s') | list -%}
        {{ pad_kand | selectattr('s', 'in', ss) | list }}

      # ---- Vooraf ontladen voor een negatieve terugleverprijs -------------------
      # Komt er een venster met een negatieve terugleverprijs én verwacht zon-overschot, dan moet
      # de accu bij het begin van dat venster leeg genoeg zijn om het overschot op te nemen (de
      # omvormer hoeft dan minder te knijpen en er wordt minder tegen een negatieve prijs
      # teruggeleverd). Werkt alleen door vasthouden op te heffen en netladen te beperken; er
      # komt geen ontladen naar het net bij. Ontladen gebeurt in de duurste kwartieren vóór het
      # venster (grensprijs, zoals bij slim vasthouden). Min. SOC blijft altijd staan.
      vo_aan: "{{ is_state('input_boolean.negatieve_prijs_vooraf_ontladen', 'on') and prijzen_ok }}"
      vo_zon: >
        {%- set ts = zon_detail | map(attribute='s') | list -%}
        {{ (zon_detail + (zon_detail_morgen | rejectattr('s', 'in', ts) | list)) | sort(attribute='s') }}
      # Eerste aaneengesloten reeks kwartieren met een negatieve terugleverprijs die nog moet
      # beginnen, met het verwachte zon-overschot (kWh AC) erin
      vo_venster: >
        {%- set opslag = states('input_number.besparing_dyn_opslag_teruglevering') | float(0) -%}
        {%- set bonus = states('input_number.besparing_dyn_bonus_teruglevering') | float(0) / 100 -%}
        {#- Marktprijs per kwartier (teruglevering): uit de marktprijs-sensor als die is ingevuld, anders de prijs van het slot -#}
        {%- set msens = states('input_text.dynamisch_marktprijs_sensor') | trim | lower -%}
        {%- set mk = namespace(d={}) -%}
        {%- if msens.startswith('sensor.') -%}
          {%- for y in (state_attr(msens, 'raw_today') or []) + (state_attr(msens, 'raw_tomorrow') or []) -%}
            {%- if y.value is number -%}{%- set mk.d = dict(mk.d, **{((as_timestamp(y.start, 0) | int) | string): y.value}) -%}{%- endif -%}
          {%- endfor -%}
        {%- endif -%}
        {%- set ns = namespace(r=[], cur=none, w=none) -%}
        {%- if vo_aan -%}
          {%- for x in pad_kand | sort(attribute='s') -%}
            {%- set mq = namespace(s=0, n=0) -%}
            {%- for k in range([((x.e - x.s) / 900) | round(0) | int, 1] | max) -%}
              {%- set key = ((x.s | int) + k * 900) | string -%}
              {%- if key in mk.d -%}{%- set mq.s = mq.s + mk.d[key] -%}{%- set mq.n = mq.n + 1 -%}{%- endif -%}
            {%- endfor -%}
            {%- set mp = (mq.s / mq.n) if mq.n > 0 else x.v -%}
            {%- set neg = (mp + bonus * ([mp, 0] | max) + opslag) < 0 -%}
            {%- if neg and ns.cur is not none and ns.cur.e == x.s -%}
              {%- set ns.cur = {'s': ns.cur.s, 'e': x.e} -%}
            {%- elif neg -%}
              {%- if ns.cur is not none -%}{%- set ns.r = ns.r + [ns.cur] -%}{%- endif -%}
              {%- set ns.cur = {'s': x.s, 'e': x.e} -%}
            {%- elif ns.cur is not none -%}
              {%- set ns.r = ns.r + [ns.cur] -%}{%- set ns.cur = none -%}
            {%- endif -%}
          {%- endfor -%}
          {%- if ns.cur is not none -%}{%- set ns.r = ns.r + [ns.cur] -%}{%- endif -%}
          {%- for w in ns.r -%}
            {%- if ns.w is none and w.s > nu_ts -%}
              {%- set nz = namespace(o=0) -%}
              {%- for p in vo_zon -%}
                {%- set pa = [p.s, w.s] | max -%}{%- set pb = [p.s + c_detail_periode_s, w.e] | min -%}
                {%- if pb > pa -%}{%- set nz.o = nz.o + ([p.pv - p.kw, 0] | max) * (pb - pa) / 3600 -%}{%- endif -%}
              {%- endfor -%}
              {%- if nz.o >= c_vo_min_kwh -%}{%- set ns.w = {'s': w.s, 'e': w.e, 'kwh': nz.o | round(3)} -%}{%- endif -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endif -%}
        {{ ns.w }}
      # Zonkrediet: is er een betrouwbaarheid ingevuld (per maand of algemeen), dan zit die al in de
      # zonvoorspelling en telt het overschot volledig; anders voor 75% (c_zon_krediet)
      vo_krediet: "{{ 1 if betr_ingevuld else c_zon_krediet }}"
      # Doel bij het begin van het venster (kWh boven min. SOC): ruimte voor het zonkrediet-deel van het overschot
      vo_doel_dc: >
        {{ ([s_max - vo_venster.kwh * vo_krediet * eff_in, 0] | max) | round(3) if vo_venster is mapping else s_max }}
      # Vrije simulatie tot het venster: accu ontlaadt in elk kwartier voor het huis, zon laadt
      # bij, geen netladen en geen vasthouden. Per slot wat de accu dan levert (kWh AC).
      vo_sim: >
        {%- set ns = namespace(e=s_nu, l=[]) -%}
        {%- if vo_venster is mapping -%}
          {%- for x in pad_kand | sort(attribute='s') -%}
            {%- if x.e > nu_ts and x.s < vo_venster.s -%}
              {%- set a = [x.s, nu_ts] | max -%}{%- set b = [x.e, vo_venster.s] | min -%}
              {%- set nk = namespace(k=0) -%}{%- for i in range(((a - kwart_s0) // 900) | int, ((b - kwart_s0 - 0.001) // 900) | int + 1) -%}{%- set qa = kwart_s0 + i * 900 -%}{%- set ov = [qa + 900, b] | min - [qa, a] | max -%}{%- if ov > 0 -%}{%- set nk.k = nk.k + (kwart_kw[[i, 0] | max] if i < kwart_kw | length else l_uur) * ov / 3600 -%}{%- endif -%}{%- endfor -%}
              {%- set nz = namespace(d=0, o=0) -%}
              {%- for p in vo_zon -%}
                {%- set pa = [p.s, a] | max -%}{%- set pb = [p.s + c_detail_periode_s, b] | min -%}
                {%- if pb > pa -%}
                  {%- set nz.d = nz.d + ([p.pv, p.kw] | min) * (pb - pa) / 3600 -%}
                  {%- set nz.o = nz.o + ([p.pv - p.kw, 0] | max) * (pb - pa) / 3600 -%}
                {%- endif -%}
              {%- endfor -%}
              {%- set ns.e = [ns.e + nz.o * eff_in, s_max] | min -%}
              {%- set lever = [[nk.k - nz.d, 0] | max, ns.e * eff_out] | min -%}
              {%- set ns.e = ns.e - (lever / eff_out if eff_out > 0 else 0) -%}
              {%- if lever > 0.001 -%}{%- set ns.l = ns.l + [{'s': x.s, 'v': x.v, 'kwh': lever | round(4)}] -%}{%- endif -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endif -%}
        {{ {'e': ns.e | round(3), 'l': ns.l} }}
      # ---- Totaal netladen en definitieve slots ------------------------------
      # Het gewone plan en de pad-check overlappen: het gat zit al in de totale energiebalans.
      # Daarom telt het grootste van de twee, niet de som.
      # ---- Kalibratieladen -------------------------------------------
      # De Zendure kalibreert (SOC + balanceren) bij 100%. Met de forecasting haalt de accu dat in de
      # winter zelden. Vanaf de helft van de drempel wacht de planner op zon die de accu vol krijgt;
      # op de drempel laadt hij de accu vol uit het net in de goedkoopste kwartieren (buiten het
      # rendementsfilter: het is onderhoud). Gaat vanzelf uit zodra Gielz een nieuwe kalibratie ziet.
      kal_dagen: "{{ states('sensor.zendure_2400_ac_laatste_kalibratie_dagen') | float(-1) }}"
      kal_drempel: "{{ (states('input_number.forecast_kalibratie_dagen') | float(0)) if (states('input_number.forecast_kalibratie_dagen') | float(0)) > 0 else c_kalibratie_dagen }}"
      kal_wacht_vanaf: "{{ (kal_drempel / 2) | round(0, 'ceil') }}"
      kal_aan: "{{ not is_state('input_boolean.forecast_kalibratie_uit', 'on') and kal_dagen >= 0 and cap > 0 }}"
      kal_max_ok: "{{ soc_max >= 100 }}"
      # Vult de zon de accu vandaag (rest van de dag) of morgen (overschot ≥ 80% van de bruikbare capaciteit)?
      kal_zon_vandaag: "{{ room > 0 and ([zon_rest - direct_rest_kwh - ev_zon_vandaag_kwh, 0] | max) * eff_in >= room }}"
      kal_zon_morgen: "{{ morgen_bekend and ([zon_morgen - direct_morgen_kwh - ev_zon_morgen_kwh, 0] | max) * eff_in >= s_max * 0.8 }}"
      kal_laden: "{{ kal_aan and kal_max_ok and prijzen_ok and kal_dagen >= kal_drempel and room > 0.05 * cap and not kal_zon_vandaag }}"
      kal_extra_ac: "{{ (([room - zon_dc, 0] | max) / eff_in) | round(3) if kal_laden and eff_in > 0 else 0 }}"
      kal_status: >
        {% if not kal_aan or kal_dagen < kal_wacht_vanaf %}{{ none }}
        {% elif not kal_max_ok %}max_te_laag
        {% elif kal_dagen >= kal_drempel %}{{ 'zon_vandaag' if kal_zon_vandaag else ('laden' if kal_laden else 'vol') }}
        {% else %}{{ 'zon_vandaag' if kal_zon_vandaag else ('zon_morgen' if kal_zon_morgen else 'wachten') }}{% endif %}

      netladen_ac: "{{ ([grid_ac, pad_netladen_ac if extra_slots | length > 0 else 0, kal_extra_ac] | max) | round(3) }}"
      n_totaal: >
        {% if netladen_ac >= c_laden_stop_kwh and e_slot > 0 %}{{ (netladen_ac / e_slot) | round(0, 'ceil') | int }}{% else %}0{% endif %}
      gekozen_plan: >
        {%- set extra_s = extra_slots | map(attribute='s') | list -%}
        {%- set ns = namespace(l=extra_slots) -%}
        {#- Kalibratieladen: de goedkoopste kwartieren van vandaag en (bekend) morgen, buiten het rendementsfilter -#}
        {%- set basis = (pad_kand | selectattr('e', 'gt', nu_ts) | list) if kal_laden else gekozen_basis -%}
        {%- for x in basis | sort(attribute='v') -%}
          {%- if x.s not in extra_s and ns.l | length < n_totaal -%}
            {%- set ns.l = ns.l + [x] -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.l | sort(attribute='s') }}
      # Vooraf ontladen: netladen vóór het venster mag alleen in de ruimte die boven het doel
      # overblijft (de goedkoopste slots eerst); de rest vervalt
      vo_zinvol: "{{ vo_aan and vo_venster is mapping and vo_sim.e < s_max - 0.1 }}"
      vo_ruimte_dc: "{{ ([vo_doel_dc - vo_sim.e, 0] | max) | round(3) if vo_zinvol else 0 }}"
      gekozen: >
        {%- if vo_zinvol -%}
          {%- set n_max = ((vo_ruimte_dc / (e_slot * eff_in)) | int) if e_slot * eff_in > 0 else 0 -%}
          {%- set voor = gekozen_plan | selectattr('s', 'lt', vo_venster.s) | sort(attribute='v') | list -%}
          {%- set houden = voor[:n_max] | map(attribute='s') | list -%}
          {{ ((gekozen_plan | rejectattr('s', 'lt', vo_venster.s) | list) + (gekozen_plan | selectattr('s', 'in', houden) | list)) | sort(attribute='s') }}
        {%- else -%}{{ gekozen_plan }}{%- endif -%}
      vo_netladen_vervallen: "{{ (gekozen_plan | length) - (gekozen | length) }}"
      vo_netladen_dc: >
        {{ ([(gekozen | selectattr('s', 'lt', vo_venster.s) | list | length) * e_slot * eff_in, vo_ruimte_dc] | min) | round(3) if vo_zinvol else 0 }}
      # Hoeveel moet de accu vóór het venster minstens leveren (kWh AC)? Gepland netladen vóór
      # het venster telt mee. Eind boven het doel (ook met overal ontladen): overal ontladen.
      vo_lever_min_ac: >
        {%- set totaal = vo_sim.l | map(attribute='kwh') | sum -%}
        {%- set ruimte = [vo_ruimte_dc - vo_netladen_dc, 0] | max * eff_out -%}
        {{ ([totaal - ruimte, 0] | max) | round(3) }}
      # Alleen als het verschil maakt: laadt de zon de accu vóór het venster toch weer vol (ook met
      # overal ontladen), dan helpt vooraf ontladen niet
      vo_actief: >
        {{ vo_zinvol and (vo_lever_min_ac > 0.05 or vo_sim.e > vo_doel_dc + 0.05) }}
      # Grensprijs: de accu levert in de duurste kwartieren vóór het venster tot het minimum
      # gehaald is. none = in alle kwartieren (ook dan haalt hij het doel niet).
      vo_grens: >
        {%- set ns = namespace(r=vo_lever_min_ac, p=none) -%}
        {%- if vo_actief and vo_sim.e <= vo_doel_dc + 0.05 -%}
          {%- for q in vo_sim.l | sort(attribute='v', reverse=true) -%}
            {%- if ns.r > 0 -%}{%- set ns.p = q.v -%}{%- set ns.r = ns.r - q.kwh -%}{%- endif -%}
          {%- endfor -%}
        {%- endif -%}
        {{ ns.p }}
      vo_ontladen_nu: >
        {{ vo_actief and nu_ts < vo_venster.s and prijs_nu < 999 and (vo_grens is not number or prijs_nu >= vo_grens) }}

      slot_nu: >
        {% set ns = namespace(a=false) %}
        {% for x in gekozen %}{% if x.s <= nu_ts < x.e %}{% set ns.a = true %}{% endif %}{% endfor %}
        {{ ns.a }}
      gepland_ac: "{{ ([gekozen | length * e_slot, netladen_ac] | min) | round(3) }}"
      p_gekozen_avg: >
        {% if gekozen | length > 0 %}{{ (gekozen | map(attribute='v') | sum / (gekozen | length)) | round(5) }}{% else %}0{% endif %}
      kosten: "{{ (gepland_ac * p_gekozen_avg) | round(2) }}"
      # Aaneengesloten geplande slots samengevoegd tot laadblokken, met kWh per blok
      # (een lopend slot telt alleen het deel dat nog komt; totaal begrensd op gepland_ac)
      blokken_vandaag: >
        {%- set ns = namespace(l=[], rest=gepland_ac) -%}
        {%- for x in gekozen | sort(attribute='s') -%}
          {%- set frac = ((x.e - [x.s, nu_ts] | max) / (x.e - x.s)) if x.e > x.s else 0 -%}
          {%- set k = [[e_slot * frac, ns.rest] | min, 0] | max -%}
          {%- set ns.rest = ns.rest - k -%}
          {%- set b = ns.l[-1] if ns.l | length > 0 else none -%}
          {%- if b is not none and b.e == x.s -%}
            {%- set ns.l = ns.l[:-1] + [{'s': b.s, 'e': x.e, 'kwh': b.kwh + k, 'som': b.som + x.v, 'n': b.n + 1}] -%}
          {%- else -%}
            {%- set ns.l = ns.l + [{'s': x.s, 'e': x.e, 'kwh': k, 'som': x.v, 'n': 1}] -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.l }}

      # ---- Goedkoop dal: accu niet ontladen --------------------------------
      # (dal_drempel staat boven de pad-check)
      in_dal: "{{ prijzen_ok and prijs_nu < 999 and prijs_nu <= dal_drempel and prijs_nu < p_dag_gem }}"
      # Alleen vasthouden als er nog uit het net bijgeladen moet worden (accu komt niet vol uit zon)
      dal_vasthouden: >
        {{ is_state('input_boolean.forecast_dal_ontladen_blokkeren', 'on') and in_dal and netladen_ac >= c_laden_stop_kwh }}

      # ---- Slim vasthouden: de lading die er is naar de duurste kwartieren schuiven ----
      # Haalt de accu het einde van het gat (zon-dekking of einde overbrugging) niet en is er geen
      # laadmoment meer gepland, dan krijgt de lading de duurste kwartieren. Vasthouden kost geen
      # extra verlies (de stroom gaat er later net zo goed uit), dus het loont zodra de prijs nu
      # lager is dan het goedkoopste kwartier dat de accu dan nog dekt (de grensprijs).
      vh_kwartieren: >
        {%- set ns = namespace(l=[]) -%}
        {%- for x in pad_kand -%}
          {%- set a = [x.s, nu_ts] | max -%}{%- set b = [x.e, t_gap_eind_ts] | min -%}
          {%- if b > a -%}
            {%- set nz = namespace(k=0) -%}
            {%- for z in pad_zon -%}
              {%- set pa = [z.s, a] | max -%}{%- set pb = [z.s + c_detail_periode_s, b] | min -%}
              {%- if pb > pa -%}{%- set nz.k = nz.k + ([z.pv, z.kw] | min) * (pb - pa) / 3600 -%}{%- endif -%}
            {%- endfor -%}
            {%- set nk = namespace(k=0) -%}{%- for i in range(((a - kwart_s0) // 900) | int, ((b - kwart_s0 - 0.001) // 900) | int + 1) -%}{%- set qa = kwart_s0 + i * 900 -%}{%- set ov = [qa + 900, b] | min - [qa, a] | max -%}{%- if ov > 0 -%}{%- set nk.k = nk.k + (kwart_kw[[i, 0] | max] if i < kwart_kw | length else l_uur) * ov / 3600 -%}{%- endif -%}{%- endfor -%}{%- set last = nk.k -%}
            {%- set k = [last - nz.k, 0] | max -%}
            {%- if k > 0 -%}{%- set ns.l = ns.l + [{'s': x.s, 'v': x.v, 'kwh': k | round(4)}] -%}{%- endif -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.l }}
      # Gepland netladen vóór het einde van het gat (kWh AC). Een restje (bv. twee bijlaadslots met een
      # bijna volle accu) zet slim vasthouden niet uit; het telt mee in wat de accu kan leveren.
      vh_gepland_ac: >
        {{ ([(gekozen | selectattr('e', 'gt', nu_ts) | selectattr('s', 'lt', t_gap_eind_ts) | list | length) * e_slot, gepland_ac] | min) | round(3) }}
      vh_laden_gepland: "{{ vh_gepland_ac >= c_vasthouden_laden_min_kwh }}"
      vh_grens: >
        {%- set ns = namespace(e=(s_nu + [vh_gepland_ac * eff_in, room] | min) * eff_out, p=none) -%}
        {%- set totaal = vh_kwartieren | map(attribute='kwh') | sum -%}
        {%- if ns.e > 0 and totaal > ns.e -%}
          {%- for q in vh_kwartieren | sort(attribute='v', reverse=true) -%}
            {%- if ns.e > 0 -%}{%- set ns.p = q.v -%}{%- set ns.e = ns.e - q.kwh -%}{%- endif -%}
          {%- endfor -%}
        {%- endif -%}
        {{ ns.p }}
      slim_vasthouden: >
        {{ is_state('input_boolean.forecast_slim_vasthouden', 'on') and prijzen_ok and prijs_nu < 999 and not slot_nu
           and not vh_laden_gepland and vh_grens is number and zon_dc <= room
           and prijs_nu < vh_grens - c_vasthouden_min_verschil }}
      # Vooraf ontladen gaat voor: in de kwartieren boven de grensprijs niet vasthouden
      # Tussen laadslots: wat de accu nu levert, laadt een later gepland slot weer bij (met verlies).
      # Is de prijs nu lager dan dat slot na laad- en ontlaadverlies (prijs slot / rendement), dan is
      # direct inkopen goedkoper en houdt de accu vast. Hoort bij Slim vasthouden (kost geen verlies).
      tussen_laden_vasthouden: >
        {%- set later = gekozen | selectattr('s', 'gt', nu_ts) | list -%}
        {{ is_state('input_boolean.forecast_slim_vasthouden', 'on') and prijzen_ok and prijs_nu < 999 and not slot_nu
           and later | length > 0 and eff_rt > 0 and prijs_nu < (later | map(attribute='v') | max) / eff_rt }}
      ontladen_vasthouden: "{{ (dal_vasthouden or slim_vasthouden or tussen_laden_vasthouden) and not vo_ontladen_nu }}"

      # ---- Accu leeg (voor het dashboard) ----------------------------------
      # Zoals het plan het verwacht: zon van vandaag (en morgen) telt mee, in goedkope dalen levert
      # de accu niet (dal-blokkade), en bij slim vasthouden ook niet onder de grensprijs. Vóór een
      # negatief venster met vooraf ontladen geldt geen vasthouden. Zonder laadmarge; geplande
      # laadslots tellen niet mee (zoals voorheen). Alleen voor de weergave, het plan rekent met
      # t_leeg_plan_ts / t_leeg_verder_ts.
      vh_plan_actief: >
        {{ is_state('input_boolean.forecast_slim_vasthouden', 'on') and prijzen_ok
           and not vh_laden_gepland and vh_grens is number and zon_dc <= room }}
      t_leeg_toon_ts: >
        {%- set emax = s_max * eff_out -%}
        {%- set ns = namespace(e=s_nu * eff_out, t=0, eind=nu_ts, ev=ev_zon_vandaag_kwh) -%}
        {%- set zon_zonder_detail = zon_detail | length == 0 and is_state('sun.sun', 'above_horizon') -%}
        {%- if zon_zonder_detail -%}{%- set ns.e = [ns.e + zon_dc * eff_out, emax] | min -%}{%- endif -%}
        {%- set zon_l = pad_zon if pad_verder else zon_detail -%}
        {%- for x in (kand + morg) | sort(attribute='s') -%}
          {%- if ns.t == 0 and x.e > nu_ts -%}
            {%- set a = [x.s, nu_ts] | max -%}{%- set b = x.e -%}
            {%- set ns.eind = b -%}
            {%- set nk = namespace(k=0) -%}{%- for i in range(((a - kwart_s0) // 900) | int, ((b - kwart_s0 - 0.001) // 900) | int + 1) -%}{%- set qa = kwart_s0 + i * 900 -%}{%- set ov = [qa + 900, b] | min - [qa, a] | max -%}{%- if ov > 0 -%}{%- set nk.k = nk.k + (kwart_kw[[i, 0] | max] if i < kwart_kw | length else l_uur) * ov / 3600 -%}{%- endif -%}{%- endfor -%}
            {%- set nz = namespace(d=0, o=0) -%}
            {%- for p in zon_l -%}
              {%- set pa = [p.s, a] | max -%}{%- set pb = [p.s + c_detail_periode_s, b] | min -%}
              {%- if pb > pa -%}
                {%- set nz.d = nz.d + ([p.pv, p.kw] | min) * (pb - pa) / 3600 -%}
                {%- set nz.o = nz.o + ([p.pv - p.kw, 0] | max) * (pb - pa) / 3600 -%}
              {%- endif -%}
            {%- endfor -%}
            {%- if zon_zonder_detail and a < zon_ondergang_ts -%}{%- set nz.d = nk.k -%}{%- endif -%}
            {%- set naar_ev = [nz.o, ns.ev] | min -%}{%- set ns.ev = ns.ev - naar_ev -%}
            {%- set ns.e = [ns.e + (nz.o - naar_ev) * eff_in * eff_out, emax] | min -%}
            {%- set is_morgen = x.s >= eind_vandaag_ts -%}
            {%- set dal = dal_blokkade_plan and ((x.v <= dal_drempel_morgen and x.v < p_morg_gem) if is_morgen else (x.v <= dal_drempel and x.v < p_dag_gem)) -%}
            {%- set vh = vh_plan_actief and b <= t_gap_eind_ts and x.v < vh_grens - c_vasthouden_min_verschil -%}
            {%- set vo_vrij = vo_actief and x.s < vo_venster.s -%}
            {%- set nodig = [nk.k - nz.d, 0] | max -%}
            {%- if vo_vrij or not (dal or vh) -%}
              {%- if nodig >= ns.e and nodig > 0 -%}{%- set ns.t = a + ns.e / nodig * (b - a) -%}
              {%- else -%}{%- set ns.e = ns.e - nodig -%}{%- endif -%}
            {%- endif -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.t if ns.t > 0 else (ns.eind + (ns.e / l_uur * 3600 if l_uur > 0 else 172800)) }}

      # ---- Overzicht voor morgen --------------------------------------
      morgen_direct: "{{ direct_morgen_kwh | round(2) }}"
      morgen_gebruik_batterij: "{{ ([gebruik_dag - morgen_direct, 0] | max) | round(2) }}"
      morgen_zon_overschot: "{{ ([zon_morgen - direct_morgen_kwh - ev_zon_morgen_kwh, 0] | max) | round(2) }}"
      morgen_zon_dc: "{{ ([morgen_zon_overschot * eff_in, s_max] | min) | round(2) }}"
      # Bovengrens: de energiebalans voor morgen (accu leeg aan het begin van morgen)
      morgen_netladen_balans: >
        {% set doel = [morgen_gebruik_batterij / eff_out + marge_dc, s_max] | min %}
        {{ (([doel - morgen_zon_dc, 0] | max) / eff_in) | round(2) }}
      # Indicatie met dezelfde regels als de pad-check: alleen kwartieren die na round-trip-verlies
      # duurder zijn dan het goedkoopste kwartier van morgen tellen als duur. Zon-overschot dat
      # morgen in de accu komt, dekt eerst de minst dure daarvan. Daarna krijgt elk duur kwartier
      # (duurste eerst) de goedkoopste laadslots die ervóór liggen en na verlies goedkoper zijn.
      morgen_dure: >
        {%- set ns = namespace(l=[], zon=morgen_zon_dc * eff_out) -%}
        {%- for x in morg | sort(attribute='v') -%}
          {%- if x.v * eff_rt > p_morg_min -%}
            {%- set nk = namespace(k=0) -%}{%- for i in range(((x.s - kwart_s0) // 900) | int, ((x.e - kwart_s0 - 0.001) // 900) | int + 1) -%}{%- set qa = kwart_s0 + i * 900 -%}{%- set ov = [qa + 900, x.e] | min - [qa, x.s] | max -%}{%- if ov > 0 -%}{%- set nk.k = nk.k + (kwart_kw[[i, 0] | max] if i < kwart_kw | length else l_uur) * ov / 3600 -%}{%- endif -%}{%- endfor -%}{%- set kwh = nk.k -%}
            {%- set af = [ns.zon, kwh] | min -%}
            {%- set ns.zon = ns.zon - af -%}
            {%- if kwh - af > 0.001 -%}{%- set ns.l = ns.l + [{'s': x.s, 'v': x.v, 'kwh': (kwh - af) | round(4)}] -%}{%- endif -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.l }}
      morgen_toewijzing: >
        {%- set ns = namespace(l=[], totaal=0) -%}
        {%- set max_ac = [morgen_netladen_balans, (s_max / eff_in) if eff_in > 0 else 0] | min -%}
        {%- if e_slot > 0 and eff_rt > 0 -%}
          {%- set laad_kand = morg | sort(attribute='v') -%}
          {%- for q in morgen_dure | sort(attribute='v', reverse=true) -%}
            {%- set nq = namespace(nodig=q.kwh / eff_rt) -%}
            {%- for x in laad_kand -%}
              {%- if nq.nodig > 0.001 and ns.totaal < max_ac and x.e <= q.s -%}
                {%- set sp = (q.v * eff_rt - x.v) / ([x.v | abs, c_prijs_noemer] | max) * 100 -%}
                {%- set sp_bruto = (q.v - x.v) / ([x.v | abs, c_prijs_noemer] | max) * 100 -%}
                {%- if sp > 0 and sp_bruto >= spread_min -%}
                  {%- set gebruikt = ns.l | selectattr('s', 'eq', x.s) | map(attribute='k') | sum -%}
                  {%- set neem = [e_slot - gebruikt, nq.nodig, max_ac - ns.totaal] | min -%}
                  {%- if neem > 0.001 -%}
                    {%- set ns.l = ns.l + [{'s': x.s, 'k': neem | round(4)}] -%}
                    {%- set ns.totaal = ns.totaal + neem -%}
                    {%- set nq.nodig = nq.nodig - neem -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endfor -%}
        {%- endif -%}
        {{ ns.l }}
      morgen_netladen: "{{ (morgen_toewijzing | map(attribute='k') | sum) | round(2) }}"
      # Wat die lading morgen in de dure kwartieren oplevert (na laad- en ontlaadverlies),
      # plus het zon-overschot dat via de accu gaat; de rest van het verbruik komt direct uit het net
      morgen_uit_accu: "{{ (morgen_netladen * eff_rt + morgen_zon_dc * eff_out) | round(2) }}"
      morgen_direct_net: "{{ ([morgen_gebruik_batterij - morgen_uit_accu, 0] | max) | round(2) }}"
      morgen_laadslots: "{{ morgen_toewijzing | map(attribute='s') | unique | list }}"
      morgen_blokken: >
        {%- set ns = namespace(l=[]) -%}
        {%- for x in morg | selectattr('s', 'in', morgen_laadslots) | sort(attribute='s') -%}
          {%- set k = morgen_toewijzing | selectattr('s', 'eq', x.s) | map(attribute='k') | sum -%}
          {%- set b = ns.l[-1] if ns.l | length > 0 else none -%}
          {%- if b is not none and b.e == x.s -%}
            {%- set ns.l = ns.l[:-1] + [{'s': b.s, 'e': x.e, 'kwh': b.kwh + k, 'som': b.som + x.v, 'n': b.n + 1}] -%}
          {%- else -%}
            {%- set ns.l = ns.l + [{'s': x.s, 'e': x.e, 'kwh': k, 'som': x.v, 'n': 1}] -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.l }}

      # ---- Tijdlijn (voorspelling per prijsslot, voor de dashboardgrafiek) ----
      # Simuleert per slot: verbruik (profiel), zon (detailvoorspelling), laden uit het net
      # in de geplande slots (vandaag) en de indicatieve laadslots van morgen, en verder
      # nul-op-de-meter: tekort uit de accu, overschot in de accu. Indicatief: HVAC en
      # dal-blokkade worden hier niet meegenomen.
      tl_slots: "{{ (kand + morg) | sort(attribute='s') | selectattr('e', 'gt', nu_ts) | list }}"
      tl_eind_ts: "{{ (tl_slots | map(attribute='e') | max) if tl_slots | length > 0 else nu_ts }}"
      tl_zon: >
        {%- set e1 = states('input_text.forecast_zon_resterend_vandaag_sensor') | trim -%}
        {%- set e2 = states('input_text.forecast_zon_morgen_sensor') | trim -%}
        {%- set ns = namespace(l=[], ts=[], ids=[]) -%}
        {%- for e in [e1, e1 | replace('_remaining_today', '_today'), e2] -%}
          {%- if e | lower | regex_match('^sensor\\..+') and e not in ns.ids -%}
            {%- set ns.ids = ns.ids + [e] -%}
            {%- set d = state_attr(e, 'detailedForecast') or state_attr(e, 'detailed_forecast') or [] -%}
            {%- for q in d -%}
              {%- if q is mapping and q.period_start is defined -%}
                {%- set ps = as_timestamp(q.period_start, 0) -%}
                {%- if ps > nu_ts - c_detail_periode_s and ps < tl_eind_ts and ps not in ns.ts -%}
                  {%- set ns.ts = ns.ts + [ps] -%}
                  {%- set ns.l = ns.l + [{'s': ps, 'pv': ((q.pv_estimate | float(0)) * betr) | round(3)}] -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.l | sort(attribute='s') }}
      tl_laad_s: "{{ (gekozen | map(attribute='s') | list) + morgen_laadslots }}"
      p_ontl_kw: "{{ [states('input_number.zendure_2400_ac_max_ontlaadvermogen') | float(2400), 100] | max / 1000 }}"
      tijdlijn: >
        {%- set ns = namespace(soc=s_nu, t=[], p=[], bek=[], laad=[], pv=[], last=[], accu=[], soc_l=[], net=[]) -%}
        {%- set bekend_tot = eind_vandaag_ts + (dag_lengte if morgen_bekend else 0) -%}
        {%- for x in tl_slots -%}
          {%- set a = [x.s, nu_ts] | max -%}
          {%- set dur = (x.e - a) / 3600 -%}
          {%- if dur > 0 -%}
            {%- set nk = namespace(k=0) -%}{%- for i in range(((a - kwart_s0) // 900) | int, ((x.e - kwart_s0 - 0.001) // 900) | int + 1) -%}{%- set qa = kwart_s0 + i * 900 -%}{%- set ov = [qa + 900, x.e] | min - [qa, a] | max -%}{%- if ov > 0 -%}{%- set nk.k = nk.k + (kwart_kw[[i, 0] | max] if i < kwart_kw | length else l_uur) * ov / 3600 -%}{%- endif -%}{%- endfor -%}{%- set last = nk.k -%}
            {%- set nz = namespace(k=0) -%}
            {%- for q in tl_zon | selectattr('s', 'gt', a - c_detail_periode_s) | selectattr('s', 'lt', x.e) -%}
              {%- set ov = [q.s + c_detail_periode_s, x.e] | min - [q.s, a] | max -%}
              {%- if ov > 0 -%}{%- set nz.k = nz.k + q.pv * ov / 3600 -%}{%- endif -%}
            {%- endfor -%}
            {%- set pv = nz.k -%}
            {%- set ruimte_ac = ([s_max - ns.soc, 0] | max) / eff_in -%}
            {%- set laden = x.s in tl_laad_s -%}
            {%- if laden -%}
              {%- set accu = [p_max_kw * dur, ruimte_ac] | min -%}
              {%- set net = last - pv + accu -%}
            {%- elif last >= pv -%}
              {%- set accu = 0 - ([last - pv, ns.soc * eff_out, p_ontl_kw * dur] | min) -%}
              {%- set net = last - pv + accu -%}
            {%- else -%}
              {%- set accu = [pv - last, ruimte_ac, p_set_kw * dur] | min -%}
              {%- set net = last - pv + accu -%}
            {%- endif -%}
            {%- set ns.soc = ns.soc + (accu * eff_in if accu > 0 else accu / eff_out) -%}
            {%- set ns.soc = [[ns.soc, 0] | max, s_max] | min -%}
            {%- set ns.t = ns.t + [x.s | int] -%}
            {%- set ns.p = ns.p + [x.v | round(4)] -%}
            {%- set ns.bek = ns.bek + [1 if x.s < bekend_tot else 0] -%}
            {%- set ns.laad = ns.laad + [1 if laden else 0] -%}
            {%- set ns.pv = ns.pv + [(pv / dur) | round(2)] -%}
            {%- set ns.last = ns.last + [(last / dur) | round(2)] -%}
            {%- set ns.accu = ns.accu + [(accu / dur) | round(2)] -%}
            {%- set ns.soc_l = ns.soc_l + [((soc_min + ns.soc / cap * 100) if cap > 0 else 0) | round(1)] -%}
            {%- set ns.net = ns.net + [(net / dur) | round(2)] -%}
          {%- endif -%}
        {%- endfor -%}
        {{ {'t': ns.t, 'prijs': ns.p, 'bekend': ns.bek, 'laden': ns.laad, 'zon_kw': ns.pv, 'verbruik_kw': ns.last,
            'accu_kw': ns.accu, 'soc_pct': ns.soc_l, 'net_kw': ns.net, 'soc_nu_pct': soc} }}
    sensor:
      - name: "Zendure Forecast Plan"
        unique_id: zendure_forecast_plan
        icon: mdi:calendar-clock
        state: >
          {% if not prijzen_ok %}
            Geen prijzen
          {% elif cap <= 0 or not has_value('sensor.zendure_2400_ac_laadpercentage') %}
            Geen batterijdata
          {% else %}
            {% set drempel = c_laden_stop_kwh if this.state == 'Laden' else c_laden_start_kwh %}
            {% if netladen_ac < drempel %}
              Niet nodig
            {% elif gekozen | length == 0 %}
              {{ 'Niet nodig' if vo_netladen_vervallen | int > 0 else 'Niet gunstig' }}
            {% elif slot_nu %}
              Laden
            {% else %}
              Wachten
            {% endif %}
          {% endif %}
        attributes:
          # --- Plan vandaag ---
          scenario: >
            {% if not morgen_bekend %}A (prijzen morgen nog onbekend, patroon van vandaag aangehouden)
            {% elif scenario == 'B' %}B (morgen duurder: zo vol mogelijk laden)
            {% else %}A (morgen goedkoper of gelijk: alleen overbruggen){% endif %}
          morgen_prijzen_bekend: "{{ morgen_bekend }}"
          netladen_vandaag_kwh: "{{ netladen_ac }}"
          netladen_energiebalans_kwh: "{{ grid_ac }}"
          gepland_netladen_kwh: "{{ gepland_ac }}"
          doel_opgeslagen_kwh: "{{ target_dc }}"
          batterij_nu_kwh: "{{ s_nu }}"
          batterij_max_kwh: "{{ s_max }}"
          verwacht_batterijgebruik_kwh: "{{ need_bridge_ac }}"
          verwachte_zon_naar_batterij_kwh: "{{ zon_dc }}"
          zon_overschot_kwh: "{{ zon_overschot_ac }}"
          ev_overdag_van_zon_kwh: "{{ ev_overdag_kwh }}"
          overbruggen_tot: "{{ (t_end_ts | timestamp_custom('%Y-%m-%d %H:%M', true)) }}"
          overbruggen_uren: "{{ uren_bridge }}"
          zon_voldoende_volgende_dag: "{{ zon_voldoende }}"
          prijs_vandaag_ref: "{{ p_vandaag_ref }}"
          prijs_morgen_ref: "{{ p_morgen_ref }}"
          spread_morgen_pct: "{{ spread_morgen }}"
          gemiddelde_laadprijs: "{{ p_gekozen_avg }}"
          geschatte_kosten: "{{ kosten }}"
          geplande_slots: >
            {%- set ns = namespace(l=[]) -%}
            {%- for x in gekozen -%}
              {%- set ns.l = ns.l + [{'start': x.s | timestamp_custom('%H:%M', true), 'eind': x.e | timestamp_custom('%H:%M', true), 'prijs': x.v}] -%}
            {%- endfor -%}
            {{ ns.l }}
          # Laadblokken vandaag: aaneengesloten slots met duur, kWh en gemiddelde prijs
          # (een lopend blok: bezig = true, minuten en kWh alleen wat nog komt)
          laadblokken: >
            {%- set ns = namespace(l=[]) -%}
            {%- for b in blokken_vandaag -%}
              {%- set ns.l = ns.l + [{'dag': 'morgen' if (b.s | timestamp_custom('%Y-%m-%d', true)) != (nu_ts | timestamp_custom('%Y-%m-%d', true)) else 'vandaag', 'start': b.s | timestamp_custom('%H:%M', true), 'eind': b.e | timestamp_custom('%H:%M', true), 'minuten': ((b.e - [b.s, nu_ts] | max) / 60) | round(0) | int, 'bezig': b.s <= nu_ts, 'kwh': b.kwh | round(2), 'prijs': (b.som / b.n) | round(3)}] -%}
            {%- endfor -%}
            {{ ns.l }}
          # --- Uitleg van het plan in gewone taal (voor het dashboard) ---
          plan_uitleg: >
            {%- macro tijd(ts) -%}{{ ('morgen ' if (ts | timestamp_custom('%Y-%m-%d', true)) != (nu_ts | timestamp_custom('%Y-%m-%d', true)) else '') ~ (ts | timestamp_custom('%H:%M', true)) }}{%- endmacro -%}
            {%- macro hm(ts) -%}{{ ts | timestamp_custom('%H:%M', true) }}{%- endmacro -%}
            {%- macro blok(b) -%}{{ tijd(b.s) }}-{{ hm(b.e) }} ({{ ((b.e - b.s) / 60) | round(0) | int }} min, ongeveer {{ '%.1f' | format(b.kwh) }} kWh, gemiddeld €{{ '%.3f' | format(b.som / b.n) }}){%- endmacro -%}
            {%- set drempel = c_laden_stop_kwh if this.state == 'Laden' else c_laden_start_kwh -%}
            {%- set leeg = s_nu <= 0.05 -%}
            {%- set morgen_zin -%}{%- if morgen_bekend and morgen_blokken | length > 0 %} Indicatie: laden {{ blok(morgen_blokken | first) }}{% if morgen_blokken | length > 1 %} en nog {{ morgen_blokken | length - 1 }} laadblok(ken), samen ongeveer {{ '%.1f' | format(morgen_netladen) }} kWh{% endif %}. Na middernacht wordt dit definitief gepland.{%- elif morgen_bekend %} Morgen loont laden uit het net naar verwachting niet.{%- endif -%}{%- endset -%}
            {%- if not prijzen_ok -%}Geen prijzen beschikbaar, er wordt niets gepland.
            {%- elif netladen_ac < drempel -%}Geen netladen nodig: accu en verwachte zon zijn genoeg tot {{ tijd(t_end_ts) }}.{{ morgen_zin }}
            {%- elif gekozen | length == 0 and vo_netladen_vervallen | int > 0 -%}Niet uit het net laden: de accu moet ruimte hebben voor het zon-overschot bij de negatieve terugleverprijs (zie hieronder).
            {%- elif gekozen | length == 0 -%}
              {%- if leeg -%}De accu is leeg. Het huis neemt nu direct stroom uit het net{% if gap_kwartieren | length > 0 %}, tot {{ tijd(t_gap_eind_ts) }} voor maximaal €{{ '%.3f' | format(gap_kwartieren | map(attribute='v') | max) }}{% endif %}. Er is daarvoor geen laadmoment meer dat na {{ ((1 - eff_rt) * 100) | round(0) | int }}% laad- en ontlaadverlies goedkoper is dan direct inkopen.
              {%- elif slim_vasthouden and not vo_ontladen_nu -%}De accu ({{ '%.1f' | format(s_nu) }} kWh) houdt het niet vol tot {{ tijd(t_gap_eind_ts) }} en er is geen laadmoment meer. Daarom wordt hij bewaard voor de duurste kwartieren (€{{ '%.3f' | format(vh_grens) }} en hoger); tot dan koopt het huis direct in tegen €{{ '%.3f' | format(prijs_nu) }}. Bijladen uit het net loont nu niet.
              {%- elif dal_blokkade_plan and not vo_actief -%}De accu ({{ '%.1f' | format(s_nu) }} kWh) wordt in goedkope dalen gespaard, want direct inkopen is daar goedkoper; hij levert alleen in duurdere kwartieren en is naar verwachting rond {{ tijd(t_leeg_toon_ts) }} leeg. Bijladen uit het net loont nu niet: geen enkel slot is na verlies goedkoper dan de inkoop die het zou vervangen.
              {%- else -%}De accu ({{ '%.1f' | format(s_nu) }} kWh) levert tot ongeveer {{ tijd(t_leeg_toon_ts) }}. Bijladen uit het net loont nu niet: geen enkel slot is na verlies goedkoper dan de inkoop die het zou vervangen.
              {%- endif -%}
              {%- if not morgen_bekend %} Rond 14:00 komen de prijzen van morgen, dan wordt opnieuw gepland.
              {%- else -%}{{ morgen_zin }}
              {%- endif -%}
            {%- else -%}
              {%- set eerste = blokken_vandaag | first -%}
              {%- if slot_nu -%}Nu aan het laden uit het net tot {{ hm(eerste.e) }}, nog ongeveer {{ '%.1f' | format(eerste.kwh) }} kWh{% if prijs_nu < 999 %} (€{{ '%.3f' | format(prijs_nu) }}){% endif %}.
              {%- else -%}Volgende laadmoment: {{ blok(eerste) }}.{%- endif %}
              {%- if blokken_vandaag | length > 1 %} Daarna nog {{ blokken_vandaag | length - 1 }} laadblok(ken).{% endif %} Totaal ongeveer {{ '%.1f' | format(gepland_ac) }} kWh voor €{{ '%.2f' | format(kosten) }}{% if extra_slots | length > 0 %}, om de dure kwartieren tot {{ tijd(t_gap_eind_ts) }} (gemiddeld €{{ '%.3f' | format(p_gap_avg) }}) uit de accu te halen{% endif %}.
              {%- if leeg and not slot_nu %} Tot dan neemt het huis direct stroom uit het net.{% endif -%}
            {%- endif -%}
            {%- if vo_actief %} Vooraf ontladen: {{ tijd(vo_venster.s) }}-{{ hm(vo_venster.e) }} is de terugleverprijs negatief, met ongeveer {{ '%.1f' | format(vo_venster.kwh) }} kWh zon-overschot.
              {%- if vo_grens is number %} De accu levert daarvoor vooral in de kwartieren vanaf €{{ '%.3f' | format(vo_grens) }}{% else %} De accu levert daarvoor in alle kwartieren{% endif %}
              {%- if gekozen | selectattr('s', 'lt', vo_venster.s) | list | length > 0 %}; het geplande netladen daarvoor past binnen de ruimte.
              {%- elif vo_netladen_vervallen | int > 0 %} en wordt tot dan niet uit het net geladen ({{ vo_netladen_vervallen }} laadslot(s) vervallen).
              {%- else %}.{% endif -%}
              {%- if vo_sim.e > vo_doel_dc + 0.05 %} Ook dan is er naar verwachting nog geen ruimte voor alles; de rest vangt de omvormerbegrenzing op.{% endif -%}
            {%- endif -%}
          # --- Pad-check (haalt de accu het moment dat er weer energie bijkomt?) ---
          padcheck_accu_leeg_om: "{{ (t_leeg_toon_ts | timestamp_custom('%Y-%m-%d %H:%M', true)) if t_leeg_toon_ts < nu_ts + 172800 else none }}"
          padcheck_zon_dekt_vanaf: "{{ t_zon_dek_ts | timestamp_custom('%Y-%m-%d %H:%M', true) }}"
          padcheck_zon_bron: "{{ zon_dek_bron }}"
          # Begin van het tekort (accu leeg zonder bijladen) voor de regel "Planning". padcheck_accu_leeg_om
          # rekent met vasthouden (dal, slim vasthouden) en kan daardoor na het einde van het gat liggen.
          padcheck_gat_start: "{{ t_gap_start_ts | timestamp_custom('%Y-%m-%d %H:%M', true) }}"
          padcheck_gat_eind: "{{ t_gap_eind_ts | timestamp_custom('%Y-%m-%d %H:%M', true) }}"
          padcheck_horizon: "{{ pad_horizon_bron }}"
          padcheck_voorbij_nacht: "{{ pad_verder }}"
          padcheck_over_dag: "{{ pad_dag }}"
          padcheck_zon_dekt_morgen_vanaf: "{{ (t_zon_dek_morgen_ts | timestamp_custom('%Y-%m-%d %H:%M', true)) if t_zon_dek_morgen_ts > 0 else none }}"
          padcheck_gat_uren: "{{ gap_uren }}"
          padcheck_zon_in_gat_kwh: "{{ gap_zon_direct }}"
          padcheck_tekort_kwh: "{{ gap_tekort_ac }}"
          padcheck_tekort_dure_slots_kwh: "{{ gap_waardevol_ac }}"
          padcheck_gat_prijs: "{{ p_gap_avg }}"
          padcheck_netladen_kwh: "{{ pad_netladen_ac }}"
          padcheck_extra_slots: "{{ extra_slots | length }}"
          padcheck_dal_blokkade: "{{ dal_blokkade_plan }}"
          # Voor de regel "Planning": eerste en laatste laadslot daarvoor, en de ruimte die vrij blijft voor de zon
          padcheck_laden_van: "{{ ((extra_slots | map(attribute='s') | min) | timestamp_custom('%Y-%m-%d %H:%M', true)) if extra_slots | length > 0 else none }}"
          padcheck_laden_tot: "{{ ((extra_slots | map(attribute='e') | max) | timestamp_custom('%Y-%m-%d %H:%M', true)) if extra_slots | length > 0 else none }}"
          padcheck_zon_ruimte_kwh: "{{ zon_dc if pad_dag else 0 }}"
          # --- Dal en laadvermogen ---
          prijs_nu: "{{ prijs_nu if prijs_nu < 999 else none }}"
          dal_drempel: "{{ dal_drempel }}"
          in_dal: "{{ in_dal }}"
          ontladen_vasthouden: "{{ ontladen_vasthouden }}"
          slim_vasthouden: "{{ slim_vasthouden }}"
          tussen_laden_vasthouden: "{{ tussen_laden_vasthouden }}"
          vasthouden_grensprijs: "{{ vh_grens }}"
          # --- Vooraf ontladen voor een negatieve terugleverprijs ---
          vooraf_ontladen: "{{ vo_actief }}"
          vooraf_ontladen_nu: "{{ vo_ontladen_nu }}"
          vooraf_venster_start: "{{ (vo_venster.s | timestamp_custom('%Y-%m-%d %H:%M', true)) if vo_venster is mapping else none }}"
          vooraf_venster_eind: "{{ (vo_venster.e | timestamp_custom('%Y-%m-%d %H:%M', true)) if vo_venster is mapping else none }}"
          vooraf_zon_overschot_kwh: "{{ vo_venster.kwh if vo_venster is mapping else 0 }}"
          vooraf_zonkrediet_pct: "{{ (vo_krediet * 100) | round(0) | int }}"
          vooraf_doel_kwh: "{{ vo_doel_dc if vo_venster is mapping else none }}"
          vooraf_verwacht_kwh: "{{ vo_sim.e if vo_venster is mapping else none }}"
          vooraf_grensprijs: "{{ vo_grens }}"
          vooraf_netladen_vervallen: "{{ vo_netladen_vervallen }}"
          laadvermogen_gebruikt_kw: "{{ p_max_kw | round(2) }}"
          laadvermogen_gemeten_w: "{{ p_gemeten_w if p_gemeten_w >= c_laden_min_w else none }}"
          laadvermogen_ingesteld_kw: "{{ p_set_kw }}"
          rendement_round_trip_pct: "{{ (eff_rt * 100) | round(1) }}"
          # --- Invoer zoals gebruikt ---
          zon_resterend_vandaag_kwh: "{{ zon_rest }}"
          zon_morgen_kwh: "{{ zon_morgen }}"
          zon_resterend_vandaag_sensor_ok: "{{ zon_rest_raw >= 0 }}"
          zon_morgen_sensor_ok: "{{ zon_morgen_raw >= 0 }}"
          betrouwbaarheid_pct: "{{ (betr * 100) | round(0) }}"
          betrouwbaarheid_bron: "{{ betr_bron }}"
          kalibratie_status: "{{ kal_status }}"
          kalibratie_dagen: "{{ kal_dagen | int if kal_dagen >= 0 else none }}"
          kalibratie_drempel: "{{ kal_drempel | int }}"
          kalibratie_extra_kwh: "{{ kal_extra_ac }}"
          zelfverbruik_pct: "{{ direct_rest_pct if zon_rest > 0 else direct_morgen_pct }}"
          zelfverbruik_vandaag_pct: "{{ direct_rest_pct }}"
          zelfverbruik_morgen_pct: "{{ direct_morgen_pct }}"
          direct_verbruik_dag_kwh: "{{ direct_dag_kwh if direct_dag_kwh >= 0 else none }}"
          zelfverbruik_bron: "{{ zelfverbruik_bron }}"
          zelfverbruik_berekend_pct: "{{ zelfverbruik_berekend if zelfverbruik_berekend >= 0 else none }}"
          gebruik_dag_kwh: "{{ gebruik_dag }}"
          gebruik_bron: "{{ gebruik_bron }}"
          verbruik_per_uur_bron: "{{ verbruik_bron_uur }}"
          verbruik_per_kwartier_bron: "{{ verbruik_bron_kwartier }}"
          vorm_kwartier_aandeel_pct: "{{ vorm_aandeel }}"
          verbruik_komende_24u_kwh: "{{ (uur_last[:24] | map(attribute='kw') | sum) | round(2) }}"
          historie_dagen: "{{ hist_dagen }}"
          historie_7_dagen: "{{ {'prod7': prod7, 'imp7': imp7, 'exp7': exp7, 'exp_zon7': exp_zon7, 'laden7': laden7, 'ontladen7': ontladen7, 'laden_zon7': laden_zon7, 'ev7': ev7, 'ev_zon7': ev_zon7, 'hvac7': hvac7, 'hvac_zon7': hvac_zon7} }}"
          historie_7_dagen_vorige_waarde: "{{ hist_7_ontbreekt }}"
          marge_pct: "{{ marge_pct }}"
          marge_kwh: "{{ marge_dc }}"
          efficientie_laden_pct: "{{ (eff_in * 100) | round(1) }}"
          rendement_bron: "{{ rendement_bron }}"
          efficientie_ontladen_pct: "{{ (eff_out * 100) | round(1) }}"
          # --- Morgen ---
          morgen_zon_direct_kwh: "{{ morgen_direct }}"
          morgen_batterijgebruik_kwh: "{{ morgen_gebruik_batterij }}"
          morgen_zon_naar_batterij_kwh: "{{ morgen_zon_dc }}"
          morgen_netladen_indicatie_kwh: "{{ morgen_netladen }}"
          morgen_netladen_balans_kwh: "{{ morgen_netladen_balans }}"
          morgen_uit_accu_kwh: "{{ morgen_uit_accu }}"
          morgen_direct_net_kwh: "{{ morgen_direct_net }}"
          morgen_dure_kwartieren_kwh: "{{ (morgen_dure | map(attribute='kwh') | sum) | round(2) }}"
          morgen_goedkoopste_start: >
            {% if morgen_bekend %}{{ t_cheap_morgen_ts | timestamp_custom('%H:%M', true) }}{% else %}onbekend{% endif %}
          # Indicatieve laadmomenten morgen, aaneengesloten slots samengevoegd (duur, kWh, gemiddelde prijs per blok)
          morgen_laadmomenten: >
            {%- set uit = namespace(l=[]) -%}
            {%- for b in morgen_blokken -%}
              {%- set uit.l = uit.l + [{'start': b.s | timestamp_custom('%H:%M', true), 'eind': b.e | timestamp_custom('%H:%M', true), 'minuten': ((b.e - b.s) / 60) | round(0) | int, 'kwh': b.kwh | round(2), 'prijs': (b.som / b.n) | round(3)}] -%}
            {%- endfor -%}
            {{ uit.l }}

      # Grafiekdata staat in een apart sensor-object: samen zijn de attributen groter dan
      # de 16 kB-limiet van de recorder, en zo blijft de geschiedenis van het plan zelf bewaard.
      # Tip: sluit dit object uit van de recorder (recorder: exclude: entities).
      - name: "Zendure Forecast Grafiek"
        unique_id: zendure_forecast_grafiek
        icon: mdi:chart-bar
        state: "{{ raw_vandaag | length }}"
        attributes:
          # Voorspelling per prijsslot: t (start, unix), prijs, bekend (0 = patroon van vandaag),
          # laden (1 = gepland netladen), zon_kw, verbruik_kw, accu_kw (+ laden / - ontladen),
          # soc_pct (laadpercentage aan het eind van het slot), net_kw (+ import / - export)
          tijdlijn: "{{ tijdlijn }}"
          # Zelfde opbouw als sensor.dynamisch_goedkoopste_periode (raw_today / raw_tomorrow)
          raw_today: >
            {%- set gekozen_s = gekozen | map(attribute='s') | list -%}
            [
            {%- for p in raw_vandaag -%}
              {%- set s = as_timestamp(p.start) -%}
              {"start": "{{ p.start }}", "end": "{{ p.end }}", "value": {{ p.value }},
               "goedkoop": "{{ 'ja' if s in gekozen_s else 'nee' }}", "duur": "nee"}{{ ',' if not loop.last }}
            {%- endfor -%}
            ]
          raw_tomorrow: >
            {%- set gekozen_s = gekozen | map(attribute='s') | list -%}
            [
            {%- for p in raw_morgen -%}
              {%- set s = as_timestamp(p.start) -%}
              {"start": "{{ p.start }}", "end": "{{ p.end }}", "value": {{ p.value }},
               "goedkoop": "{{ 'ja' if s in morgen_laadslots or s in gekozen_s else 'nee' }}", "duur": "nee"}{{ ',' if not loop.last }}
            {%- endfor -%}
            ]

      # --- Afgeleide sensoren (met eenheid) voor dashboard en historie ---
      - name: "Forecast Zon Resterend Vandaag"
        unique_id: forecast_zon_resterend_vandaag
        unit_of_measurement: "kWh"
        device_class: energy
        icon: mdi:solar-power-variant
        availability: "{{ zon_rest_raw >= 0 }}"
        state: "{{ zon_rest_raw | round(2) }}"
        attributes:
          na_betrouwbaarheid_kwh: "{{ zon_rest }}"

      - name: "Forecast Zon Morgen"
        unique_id: forecast_zon_morgen
        unit_of_measurement: "kWh"
        device_class: energy
        icon: mdi:solar-power-variant-outline
        availability: "{{ zon_morgen_raw >= 0 }}"
        state: "{{ zon_morgen_raw | round(2) }}"
        attributes:
          na_betrouwbaarheid_kwh: "{{ zon_morgen }}"

      - name: "Forecast Zelfverbruik Zon"
        unique_id: forecast_zelfverbruik_zon
        unit_of_measurement: "%"
        icon: mdi:home-lightning-bolt
        state: "{{ direct_morgen_pct if zon_morgen > 0 else zelfverbruik_pct }}"
        attributes:
          bron: "{{ zelfverbruik_bron }}"
          direct_verbruik_dag_kwh: "{{ direct_dag_kwh if direct_dag_kwh >= 0 else none }}"
          vandaag_pct: "{{ direct_rest_pct }}"
          gemiddeld_7_dagen_pct: "{{ zelfverbruik_berekend if zelfverbruik_berekend >= 0 else none }}"
          historie_dagen: "{{ hist_dagen }}"

      - name: "Forecast Laadmarge"
        unique_id: forecast_laadmarge
        unit_of_measurement: "kWh"
        device_class: energy
        icon: mdi:battery-plus-variant
        state: "{{ marge_dc }}"
        attributes:
          percentage: "{{ marge_pct }}"

      - name: "Forecast Gemiddeld Gebruik Per Dag"
        unique_id: forecast_gemiddeld_gebruik_per_dag
        unit_of_measurement: "kWh"
        device_class: energy
        icon: mdi:home-lightning-bolt-outline
        state: "{{ gebruik_dag }}"
        attributes:
          bron: "{{ gebruik_bron }}"

      - name: "Forecast Netladen Vandaag"
        unique_id: forecast_netladen_vandaag
        unit_of_measurement: "kWh"
        device_class: energy
        icon: mdi:transmission-tower-import
        state: "{{ netladen_ac }}"

      - name: "Forecast Verwacht Batterijgebruik"
        unique_id: forecast_verwacht_batterijgebruik
        unit_of_measurement: "kWh"
        device_class: energy
        icon: mdi:battery-arrow-down
        state: "{{ need_bridge_ac }}"

      - name: "Forecast Verwachte Zon Naar Batterij"
        unique_id: forecast_verwachte_zon_naar_batterij
        unit_of_measurement: "kWh"
        device_class: energy
        icon: mdi:battery-arrow-up
        state: "{{ zon_dc }}"

# ---------------------------------------------------------------------
# 5. Verbruiksgegevens resetten (knop in Forecasting Configuratie (Basis))
#    Het verbruiksprofiel reset zichzelf via dezelfde knop (zie 3b). Deze automation wist
#    de opgeslagen historie van de tellers waar de 7-daagse statistieken op rekenen en laadt
#    die statistieken opnieuw: zonproductie, net, accu, gemiddeld gebruik en zelfverbruik
#    beginnen dan opnieuw (de planner gebruikt eerst de startwaarden). De tellers zelf lopen
#    gewoon door; de besparing (zendure_besparing.yaml) houdt zijn eigen totalen bij en
#    blijft bewaard. Forecast Gemeten Laadvermogen blijft ook staan.
# ---------------------------------------------------------------------
automation:
  # Slim vasthouden staat standaard aan: een nieuwe input_boolean begint in HA uit, en
  # initial: true zou hem bij elke herstart terugzetten. Daarom eenmalig aanzetten; daarna
  # blijft de keuze van de gebruiker staan.
  - id: forecast_slim_vasthouden_standaard
    alias: Forecast Slim Vasthouden Standaard Aan
    description: >-
      Forecasting 2026.11.5 - Zet Slim vasthouden eenmalig aan (na installatie of upgrade).
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: input_boolean.forecast_slim_vasthouden_ingesteld
        to: 'off'
    conditions:
      - condition: state
        entity_id: input_boolean.forecast_slim_vasthouden_ingesteld
        state: 'off'
    actions:
      - delay:
          seconds: 5
      - action: input_boolean.turn_on
        target:
          entity_id:
            - input_boolean.forecast_slim_vasthouden
            - input_boolean.forecast_slim_vasthouden_ingesteld

  # Invoervelden met een entiteit opschonen: op een telefoon maakt autocorrectie er snel
  # "Sensor .solcast_..." van (hoofdletter, spatie). Zo'n veld wordt dan niet herkend. Deze
  # automatisering zet het om naar kleine letters zonder spaties (ook bij komma-lijsten).
  - id: forecast_invoervelden_opschonen
    alias: Forecast Invoervelden Opschonen
    description: >-
      Forecasting 2026.11.5 - Zet ingevulde entiteiten om naar kleine letters zonder spaties.
    mode: queued
    max: 5
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id:
          - input_text.forecast_zon_resterend_vandaag_sensor
          - input_text.forecast_zon_morgen_sensor
          - input_text.forecast_zon_productie_sensor
          - input_text.forecast_net_import_teller_sensor
          - input_text.forecast_net_export_teller_sensor
          - input_text.afwijkende_p1_sensor
          - input_text.dynamisch_nordpool_sensor
          - input_text.dynamisch_marktprijs_sensor
          - input_text.negatieve_prijs_omvormer_limiet
          - input_text.negatieve_prijs_omvormer_vermogen_sensor
          - input_text.negatieve_prijs_omvormer_limiet_secundair
          - input_text.hvac_sensor
          - input_text.hvac_vermogen_sensor
          - input_text.ev_vermogen_sensor
          - input_text.ev_schakelaar
        not_to:
          - unknown
          - unavailable
    conditions: []
    actions:
      - variables:
          velden: >
            {%- set ns = namespace(l=[]) -%}
            {%- for e in ['input_text.forecast_zon_resterend_vandaag_sensor', 'input_text.forecast_zon_morgen_sensor', 'input_text.forecast_zon_productie_sensor', 'input_text.forecast_net_import_teller_sensor', 'input_text.forecast_net_export_teller_sensor', 'input_text.afwijkende_p1_sensor', 'input_text.dynamisch_nordpool_sensor', 'input_text.dynamisch_marktprijs_sensor', 'input_text.negatieve_prijs_omvormer_limiet', 'input_text.negatieve_prijs_omvormer_vermogen_sensor', 'input_text.negatieve_prijs_omvormer_limiet_secundair', 'input_text.hvac_sensor', 'input_text.hvac_vermogen_sensor', 'input_text.ev_vermogen_sensor', 'input_text.ev_schakelaar'] -%}
              {%- set oud = states(e) -%}
              {%- if oud not in ['unknown', 'unavailable'] -%}
                {%- set nieuw = oud | lower | regex_replace('\\s+', '') -%}
                {%- if nieuw != oud -%}{%- set ns.l = ns.l + [{'e': e, 'oud': oud, 'nieuw': nieuw}] -%}{%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.l }}
      - repeat:
          for_each: "{{ velden }}"
          sequence:
            - action: input_text.set_value
              target:
                entity_id: "{{ repeat.item.e }}"
              data:
                value: "{{ repeat.item.nieuw }}"
            - action: logbook.log
              data:
                name: Zendure Forecasting
                message: "Invoerveld opgeschoond: '{{ repeat.item.oud }}' wordt '{{ repeat.item.nieuw }}'"
                entity_id: "{{ repeat.item.e }}"

  # Betrouwbaarheid per maand: de gemeten verhouding van de afgeronde maand invullen (voor volgend jaar)
  - id: forecast_betrouwbaarheid_maand_invullen
    alias: Forecast Betrouwbaarheid Maand Invullen
    description: >-
      Forecasting 2026.11.5 - Vult na afloop van een maand de gemeten betrouwbaarheid in voor die maand.
    mode: single
    triggers:
      - trigger: state
        entity_id: sensor.forecast_zon_maandmeting
        attribute: afgerond
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.to_state.attributes.afgerond is mapping and (trigger.to_state.attributes.afgerond.pct | int(0)) > 0
             and not is_state('input_boolean.forecast_betrouwbaarheid_niet_automatisch', 'on') }}
    actions:
      - variables:
          a: "{{ trigger.to_state.attributes.afgerond }}"
          veld: "input_number.forecast_betrouwbaarheid_{{ ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'][(a.maand[5:7] | int) - 1] }}"
      - action: input_number.set_value
        target:
          entity_id: "{{ veld }}"
        data:
          value: "{{ a.pct }}"
      - action: logbook.log
        data:
          name: Zendure Forecasting
          message: "Betrouwbaarheid {{ a.maand }} ingevuld: {{ a.pct }}% ({{ a.werkelijk_kwh }} kWh zon, {{ a.verwacht_kwh }} kWh voorspeld, {{ a.dagen }} dagen)"
          entity_id: "{{ veld }}"

  - id: forecast_verbruiksgegevens_resetten
    alias: Forecast Verbruiksgegevens Resetten
    description: >-
      Forecasting 2026.11.3 - Wist de historie van 7 dagen (zon, net, accu en de auto als
      zendure_ev.yaml geladen is) en laadt de statistieken opnieuw. Het verbruiksprofiel
      reset zichzelf via dezelfde knop.
    mode: single
    triggers:
      - trigger: state
        entity_id: input_button.forecast_verbruiksgegevens_resetten
        not_from:
          - unknown
          - unavailable
    conditions: []
    actions:
      - variables:
          tellers: >
            {{ ['sensor.forecast_teller_zon_productie', 'sensor.forecast_teller_p1_import',
                'sensor.forecast_teller_p1_export', 'sensor.forecast_teller_p1_export_uit_zon',
                'sensor.forecast_teller_zendure_laden', 'sensor.forecast_teller_zendure_ontladen',
                'sensor.forecast_teller_zendure_laden_uit_zon', 'sensor.forecast_netladen_vermogen',
                'sensor.ev_teller_geladen', 'sensor.ev_teller_geladen_uit_zon',
                'sensor.hvac_teller_apart', 'sensor.hvac_teller_apart_uit_zon']
               | select('in', states.sensor | map(attribute='entity_id') | list) | list }}
      - action: recorder.purge_entities
        target:
          entity_id: "{{ tellers }}"
        data:
          keep_days: 0
      # De recorder wist op de achtergrond; even wachten voordat de statistieken opnieuw laden
      - delay:
          seconds: 15
      - action: statistics.reload
      - action: input_button.press
        target:
          entity_id: input_button.forecast_herberekenen
      - action: logbook.log
        data:
          name: Zendure Forecasting
          message: Verbruiksgegevens gereset (verbruiksprofiel en historie van 7 dagen)
          entity_id: input_button.forecast_verbruiksgegevens_resetten
