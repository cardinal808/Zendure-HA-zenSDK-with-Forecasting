# Zendure zenSDK (Gielz) + Forecasting 2026.11.5 | gebaseerd op Gielz v20261113
# Gebaseerd op Gielz1986/Zendure-HA-zenSDK (Michiel Hofker). Zie README.md voor licentie en wijzigingen.
# VEREIST PAKKET - hoort bij de basis van deze set (naast zendure_gielz1986_nl.yaml).
# =====================================================================
# Zendure Forecasting (aanvulling op zendure_gielz1986_nl.yaml)
# Modus: "Dynamisch NOM + Forecasting"
#
# Plaats dit bestand naast zendure_gielz1986_nl.yaml (zelfde packages-map).
# Dit bestand bevat:
#   1. Invoervelden (helpers) voor de forecast-instellingen
#   2. Vermogenssensoren + integratiesensoren (kWh-tellers)
#   3. Statistieken: 7 dagen (zelfverbruik zon, gemiddeld gebruik) en gemeten laadvermogen
#   4. De planner: sensor.zendure_forecast_plan (+ sensor.zendure_forecast_grafiek)
#      met o.a. scenario A/B, pad-check (tot zon-dekking, met prijzen van morgen tot zon-dekking morgen), efficiencyfilter en goedkoop-dal-blokkade
#
# Vaste waarden (drempels, terugvalwaarden) staan bovenaan de planner onder
# "Instellingen (vaste waarden)" met het voorvoegsel c_.
# =====================================================================

# ---------------------------------------------------------------------
# 1. Invoervelden
# ---------------------------------------------------------------------
input_text:
  forecast_zon_resterend_vandaag_sensor:
    name: Forecast Zon Resterend Vandaag Sensor
    icon: mdi:solar-power-variant
    max: 250
    mode: text

  forecast_zon_morgen_sensor:
    name: Forecast Zon Morgen Sensor
    icon: mdi:solar-power-variant-outline
    max: 250
    mode: text

  forecast_zon_productie_sensor:
    name: Forecast Zonnepanelen Productie Sensor (totaal kWh)
    icon: mdi:solar-panel
    max: 250
    mode: text

  # Optioneel: eigen kWh-tellers voor net-import en -export (bv. Shelly Pro 3EM, P1 Monitor,
  # DSMR Reader). Meerdere sensoren met een komma; die worden opgeteld (bv. tarief 1 en 2).
  # Leeg = automatisch herkennen (SlimmeLezer, HomeWizard, DSMR-integratie).
  forecast_net_import_teller_sensor:
    name: Forecast Net Import Teller Sensor (totaal kWh)
    icon: mdi:transmission-tower-import
    max: 250
    mode: text

  forecast_net_export_teller_sensor:
    name: Forecast Net Export Teller Sensor (totaal kWh)
    icon: mdi:transmission-tower-export
    max: 250
    mode: text

input_number:
  forecast_laad_marge:
    name: Forecast Batterij Laadmarge
    icon: mdi:battery-plus-variant
    min: 0
    max: 50
    step: 1
    mode: box
    unit_of_measurement: "%"

  # Kalibratieladen: na zoveel dagen zonder kalibratie (100%) laadt de planner de accu vol uit het net.
  # Vanaf de helft wacht hij op een zonnige dag. 0 = standaard (14 dagen).
  forecast_kalibratie_dagen:
    name: Forecast Kalibratie Na Dagen
    icon: mdi:battery-sync
    min: 0
    max: 60
    step: 1
    mode: box
    unit_of_measurement: "d"

  forecast_betrouwbaarheid:
    name: Forecast Betrouwbaarheid Zonvoorspelling
    icon: mdi:weather-partly-cloudy
    min: 0
    max: 100
    step: 5
    mode: box
    unit_of_measurement: "%"

  # Betrouwbaarheid per maand (%). 0 = niet ingevuld: dan geldt de algemene betrouwbaarheid hierboven.
  # Aan het eind van elke maand vult de set de gemeten verhouding (werkelijke zon / voorspelling) in
  # voor die maand, zodat hij volgend jaar klopt. Uitzetten met "Niet automatisch invullen".
