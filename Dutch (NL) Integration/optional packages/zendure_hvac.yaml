# Zendure zenSDK (Gielz) + Forecasting 2026.11.3 | gebaseerd op Gielz v20261007
# Gebaseerd op Gielz1986/Zendure-HA-zenSDK (Michiel Hofker). Zie README.md voor licentie en wijzigingen.
# OPTIONEEL PAKKET - niet nodig voor Dynamisch NOM + Forecasting. Weglaten = functie uit.
# Staat in de repo in de map "optional packages". Toevoegen: kopieer het naar je packages-map en herstart
# Home Assistant. Weghalen en herstarten zet de functie weer uit.
# Nodig: een climate-entiteit, vermogenssensor of schakelaar van de airco; voor "Airco niet uit
# accu" en het apart tellen ook een vermogensmeting (W of kW) of een kWh-teller van de airco.
# =====================================================================
# Zendure HVAC (airco) - de airco niet uit de accu laten draaien (optioneel)
#
# Plaats dit bestand naast zendure_gielz1986_nl.yaml (zelfde packages-map).
# Zonder dit bestand verandert er niets. Het blok Forecasting Configuratie (HVAC) op de tab Configuratie
# verschijnt vanzelf zodra dit bestand geladen is.
# Werking:
#   - sensor.hvac_modus                       : wat doet de airco? (Uit, Stand-by, Verwarmen,
#                                               Koelen, Drogen, Ventileren, Auto, Aan)
#   - binary_sensor.hvac_actief               : draait de airco echt?
#   - binary_sensor.hvac_ontladen_geblokkeerd : airco draait in een modus waarin ontladen niet
#                                               is toegestaan, en (optioneel) niet in een duur uur
#   - binary_sensor.hvac_niet_uit_accu       : de airco mag niet uit de accu (modus niet
#                                               toegestaan, geen duur uur)
#   - Aanpak (input_select.hvac_aanpak) bepaalt wat er dan gebeurt:
#       * Niet ontladen (standaard): binary_sensor.hvac_ontladen_geblokkeerd gaat aan en de
#         NOM-ontlaadblokken in de automation ontladen helemaal niet.
#       * Airco niet uit accu: sensor.hvac_ontlaad_correctie is het vermogen van de airco; de
#         NOM-ontlaadblokken trekken dat af van de P1-meter (zoals bij de auto), dus de accu
#         voedt de rest van het huis gewoon. Vereist een vermogensmeting van de airco
#         (HVAC Vermogen Sensor, of een vermogenssensor als HVAC Sensor); zonder meting geldt
#         Niet ontladen.
#   - Verbruik apart tellen: zolang de airco niet uit de accu mag, telt zijn verbruik
#     (sensor.hvac_apart_totaal, ..._uit_zon_totaal en de 7-daagse cijfers) niet mee in het
#     verbruiksprofiel, het dagverbruik en het zelfverbruik van de zon (alleen met vermogensmeting).
# Laden (zon of net) blijft gewoon werken.
# Standaard mag de airco in geen enkele modus uit de accu. Zet per modus aan waarin het wel mag
# (bv. Koelen: zomer, zon genoeg). Laat het sensorveld leeg om de functie uit te zetten.
# =====================================================================

input_text:
  hvac_sensor:
    name: HVAC Sensor
    icon: mdi:air-conditioner
    max: 250
    mode: text
  # Vermogen van de airco (W of kW), bv. een Shelly of de vermogenssensor van de airco-integratie.
  # Een kWh-teller (bv. Energieverbruik totaal van de airco) kan ook: het vermogen wordt dan uit de
  # stappen van de teller berekend (sensor.hvac_vermogen_uit_teller). Neem een totaalteller, niet
  # een teller per cyclus. Leeg: de HVAC Sensor als dat een vermogenssensor is.
  hvac_vermogen_sensor:
    name: HVAC Vermogen Sensor
    icon: mdi:flash
    max: 250
    mode: text

input_select:
  # Wat gebeurt er als de airco niet uit de accu mag? Eerste optie = standaard (zoals voorheen).
  hvac_aanpak:
    name: HVAC Aanpak
    icon: mdi:battery-sync-outline
    options:
      - Niet ontladen
      - Airco niet uit accu

input_number:
  hvac_drempel_vermogen:
    name: HVAC Drempel Vermogen
    icon: mdi:flash
    min: 0
    max: 2000
    step: 10
    mode: box
    unit_of_measurement: "W"

input_boolean:
  hvac_ontladen_bij_duur_uur:
    name: HVAC Ontladen Toestaan Tijdens Duur Uur
    icon: mdi:cash-plus
  hvac_ontladen_bij_verwarmen:
    name: HVAC Ontladen Toestaan Bij Verwarmen
    icon: mdi:fire
  hvac_ontladen_bij_koelen:
    name: HVAC Ontladen Toestaan Bij Koelen
    icon: mdi:snowflake
  hvac_ontladen_bij_drogen:
    name: HVAC Ontladen Toestaan Bij Drogen
    icon: mdi:water-percent
  hvac_ontladen_bij_ventileren:
    name: HVAC Ontladen Toestaan Bij Ventileren
    icon: mdi:fan
  hvac_ontladen_bij_auto:
    name: HVAC Ontladen Toestaan Bij Auto
    icon: mdi:thermostat-auto

# ---------------------------------------------------------------------
# kWh-tellers van het apart getelde airco-verbruik (methode "left", zoals de EV-tellers)
# ---------------------------------------------------------------------
sensor:
  - platform: integration
    name: "HVAC Apart Totaal"
    unique_id: hvac_apart_totaal
    source: sensor.hvac_apart_vermogen
    unit_prefix: k
    round: 3
    method: left

  - platform: integration
    name: "HVAC Apart Uit Zon Totaal"
    unique_id: hvac_apart_uit_zon_totaal
    source: sensor.hvac_apart_uit_zon_vermogen
    unit_prefix: k
    round: 3
    method: left

  - platform: statistics
    name: "HVAC Apart 7 Dagen"
    unique_id: hvac_apart_7_dagen
    entity_id: sensor.hvac_teller_apart
    state_characteristic: change
    max_age:
      days: 7
    sampling_size: 1500
    precision: 2

  - platform: statistics
    name: "HVAC Apart Uit Zon 7 Dagen"
    unique_id: hvac_apart_uit_zon_7_dagen
    entity_id: sensor.hvac_teller_apart_uit_zon
    state_characteristic: change
    max_age:
      days: 7
    sampling_size: 1500
    precision: 2

template:
  # Tellers elk kwartier bevriezen (voor de 7-daagse statistiek, zoals in zendure_forecasting.yaml)
  - trigger:
      - trigger: time_pattern
        minutes: "/15"
      - trigger: homeassistant
        event: start
    sensor:
      - name: "HVAC Teller Apart"
        unique_id: hvac_teller_apart
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        # Bron even weg (bv. net na een herstart): vorige stand houden, niet unavailable
        availability: "{{ has_value('sensor.hvac_apart_totaal') or this.state | is_number }}"
        state: "{{ states('sensor.hvac_apart_totaal') | float(0) if has_value('sensor.hvac_apart_totaal') else this.state }}"

      - name: "HVAC Teller Apart Uit Zon"
        unique_id: hvac_teller_apart_uit_zon
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        # Bron even weg (bv. net na een herstart): vorige stand houden, niet unavailable
        availability: "{{ has_value('sensor.hvac_apart_uit_zon_totaal') or this.state | is_number }}"
        state: "{{ states('sensor.hvac_apart_uit_zon_totaal') | float(0) if has_value('sensor.hvac_apart_uit_zon_totaal') else this.state }}"

  # Vermogen uit een kWh-teller van de airco (als de airco-integratie geen vermogen in W geeft,
  # bv. Energieverbruik totaal). De teller loopt in stapjes op; het vermogen is de laatste stap
  # gedeeld door de tijd sinds de vorige stap (of sinds de airco aanging). Komt er langer geen
  # stap, dan zakt het vermogen mee; na een uur zonder stap is het 0. Voor de eerste stap na het
  # aangaan geldt het vermogen van de vorige keer.
  - trigger:
      - trigger: time_pattern
        seconds: "/15"
      - trigger: homeassistant
        event: start
    variables:
      t_e: >
        {% set e = states('input_text.hvac_vermogen_sensor') | trim | lower %}
        {{ e if e != '' else (states('input_text.hvac_sensor') | trim | lower) }}
      t_u: "{{ state_attr(t_e, 'unit_of_measurement') if t_e | regex_match('^sensor\\..+') else none }}"
      t_kwh: >
        {% set v = states(t_e) | float(-1) if t_u in ['kWh', 'Wh', 'MWh'] else -1 %}
        {{ -1 if v < 0 else (v / 1000 if t_u == 'Wh' else (v * 1000 if t_u == 'MWh' else v)) }}
      t_oud_kwh: "{{ state_attr('sensor.hvac_vermogen_uit_teller', 'teller_kwh') | float(-1) }}"
      t_oud_ts: "{{ state_attr('sensor.hvac_vermogen_uit_teller', 'stap_ts') | float(0) }}"
      t_stap_w: "{{ state_attr('sensor.hvac_vermogen_uit_teller', 'stap_w') | float(-1) }}"
      t_stap_kwh: "{{ state_attr('sensor.hvac_vermogen_uit_teller', 'stap_kwh') | float(0) }}"
      t_geleerd_w: "{{ state_attr('sensor.hvac_vermogen_uit_teller', 'geleerd_w') | float(0) }}"
      t_nu: "{{ as_timestamp(now()) }}"
      t_actief: "{{ is_state('binary_sensor.hvac_actief', 'on') }}"
      t_actief_ts: >
        {{ as_timestamp(states.binary_sensor.hvac_actief.last_changed, 0)
           if states.binary_sensor.hvac_actief is not none else 0 }}
      # Is de teller veranderd? Omlaag of een grote sprong (andere sensor, teller per cyclus die
      # op 0 begint) telt niet als verbruik, alleen als nieuw ijkpunt.
      t_veranderd: "{{ t_kwh >= 0 and t_oud_kwh >= 0 and t_kwh != t_oud_kwh }}"
      t_delta: "{{ (t_kwh - t_oud_kwh) if t_veranderd else 0 }}"
      t_begin: "{{ [t_oud_ts, t_actief_ts] | max }}"
      t_p: >
        {% set dt = t_nu - t_begin %}
        {{ (t_delta * 3600000 / dt) | round(0)
           if t_veranderd and t_actief and 0 < t_delta <= 2 and t_oud_ts > 0 and 20 <= dt <= 3600 else -1 }}
      n_stap_w: "{{ t_p if t_p >= 0 else (-1 if t_veranderd else t_stap_w) }}"
      n_stap_kwh: "{{ t_delta if t_p >= 0 else (0 if t_veranderd else t_stap_kwh) }}"
      n_ts: "{{ t_nu if (t_veranderd or t_oud_ts == 0) else t_oud_ts }}"
      n_geleerd_w: "{{ t_p if t_p >= 0 else t_geleerd_w }}"
    sensor:
      - name: "HVAC Vermogen Uit Teller"
        unique_id: hvac_vermogen_uit_teller
        icon: mdi:air-conditioner
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: "{{ t_kwh >= 0 }}"
        state: >
          {% set sinds = t_nu - n_ts %}
          {% if not t_actief %}0
          {% elif n_ts < t_actief_ts or n_stap_w < 0 %}
            {# Nog geen stap sinds de airco aanging: vermogen van de vorige keer #}
            {{ n_geleerd_w | round(0) }}
          {% elif sinds > 3600 %}0
          {% else %}
            {% set interval = n_stap_kwh * 3600000 / n_stap_w if n_stap_w > 0 else 0 %}
            {% set p = n_stap_w if sinds <= interval else [n_stap_w, n_stap_kwh * 3600000 / sinds] | min %}
            {{ p | round(0) }}
          {% endif %}
        attributes:
          bron: "{{ t_e }}"
          teller_kwh: "{{ t_kwh if t_kwh >= 0 else (t_oud_kwh if t_oud_kwh >= 0 else none) }}"
          stap_ts: "{{ n_ts }}"
          stap_w: "{{ n_stap_w }}"
          stap_kwh: "{{ n_stap_kwh | round(4) }}"
          geleerd_w: "{{ n_geleerd_w }}"

  - sensor:
      # Wat doet de airco?
      #   climate.*  -> hvac_action (heating/cooling/drying/fan) als die er is, anders de modus.
      #                 hvac_action idle/off terwijl de airco aan staat = Stand-by
      #                 (temperatuur bereikt, de airco verbruikt dan nauwelijks).
      #                 auto/heat_cool zonder bruikbare hvac_action = Auto.
      #   sensor.* (vermogen in W of kW) -> Aan boven de drempel (0 = 50 W), anders Uit
      #   overige (switch, binary_sensor, input_boolean, ...) -> Aan bij state "on"
      - name: "HVAC Modus"
        unique_id: hvac_modus
        icon: mdi:air-conditioner
        state: >
          {% set e = states('input_text.hvac_sensor') | trim %}
          {% if e == '' or not has_value(e) %}
            Uit
          {% elif e.startswith('climate.') %}
            {% set s = states(e) %}
            {% set a = state_attr(e, 'hvac_action') %}
            {% set acties = {'heating': 'Verwarmen', 'preheating': 'Verwarmen', 'defrosting': 'Verwarmen',
                             'cooling': 'Koelen', 'drying': 'Drogen', 'fan': 'Ventileren'} %}
            {% set modi = {'heat': 'Verwarmen', 'cool': 'Koelen', 'dry': 'Drogen',
                           'fan_only': 'Ventileren', 'auto': 'Auto', 'heat_cool': 'Auto'} %}
            {% if s == 'off' %}
              Uit
            {% elif a in acties %}
              {{ acties[a] }}
            {% elif a in ['idle', 'off'] %}
              Stand-by
            {% else %}
              {{ modi.get(s, 'Aan') }}
            {% endif %}
          {% elif e.startswith('sensor.') %}
            {% set d = states('input_number.hvac_drempel_vermogen') | float(0) %}
            {% set w = states(e) | float(0) * (1000 if state_attr(e, 'unit_of_measurement') == 'kW' else 1) %}
            {{ 'Aan' if w > (d if d > 0 else 50) else 'Uit' }}
          {% else %}
            {{ 'Aan' if is_state(e, 'on') else 'Uit' }}
          {% endif %}

      # Vermogen van de airco in W; unavailable zonder vermogensmeting
      - name: "HVAC Vermogen"
        unique_id: hvac_vermogen
        icon: mdi:air-conditioner
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        # Vermogenssensor (W/kW) direct; een kWh-teller via sensor.hvac_vermogen_uit_teller
        availability: >
          {% set e = states('input_text.hvac_vermogen_sensor') | trim | lower %}
          {% set e = e if e != '' else (states('input_text.hvac_sensor') | trim | lower) %}
          {% if state_attr(e, 'unit_of_measurement') in ['kWh', 'Wh', 'MWh'] %}
            {{ has_value('sensor.hvac_vermogen_uit_teller') }}
          {% else %}
            {{ e | regex_match('^sensor\\..+') and has_value(e) }}
          {% endif %}
        state: >
          {% set e = states('input_text.hvac_vermogen_sensor') | trim | lower %}
          {% set e = e if e != '' else (states('input_text.hvac_sensor') | trim | lower) %}
          {% set u = state_attr(e, 'unit_of_measurement') %}
          {% if u in ['kWh', 'Wh', 'MWh'] %}
            {{ states('sensor.hvac_vermogen_uit_teller') | float(0) | round(0) }}
          {% else %}
            {% set v = states(e) | float(0) %}
            {{ ([v * 1000 if u == 'kW' else v, 0] | max) | round(0) }}
          {% endif %}

      # Wat de NOM-ontlaadblokken van de P1-meter aftrekken (aanpak Airco niet uit accu)
      - name: "HVAC Ontlaad Correctie"
        unique_id: hvac_ontlaad_correctie
        icon: mdi:battery-minus-outline
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {{ states('sensor.hvac_vermogen') | float(0)
             if is_state('binary_sensor.hvac_niet_uit_accu', 'on') and is_state('input_select.hvac_aanpak', 'Airco niet uit accu')
             else 0 }}

      # Verbruik dat apart geteld wordt (niet in het verbruiksprofiel): de airco zolang hij
      # niet uit de accu mag, ongeacht de aanpak
      - name: "HVAC Apart Vermogen"
        unique_id: hvac_apart_vermogen
        icon: mdi:air-conditioner
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {{ states('sensor.hvac_vermogen') | float(0) if is_state('binary_sensor.hvac_niet_uit_accu', 'on') else 0 }}

      # Deel daarvan dat niet uit het net komt (dus uit zon). Wat de auto uit het net haalt gaat voor.
      - name: "HVAC Apart Uit Zon Vermogen"
        unique_id: hvac_apart_uit_zon_vermogen
        icon: mdi:solar-power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set h = states('sensor.hvac_apart_vermogen') | float(0) %}
          {% set ev = states('sensor.ev_laadvermogen') | float(0) %}
          {% set import_w = [states('sensor.p1_aansturing_vermogen') | float(0) - ev, 0] | max %}
          {{ (h - [import_w, h] | min) | round(0) }}

  - binary_sensor:
      - name: "HVAC Actief"
        unique_id: hvac_actief
        icon: mdi:air-conditioner
        state: "{{ states('sensor.hvac_modus') not in ['Uit', 'Stand-by', 'unknown', 'unavailable'] }}"

      # Aan = de airco mag niet uit de accu: hij draait in een modus waarin dat niet is toegestaan
      # en het is geen duur uur (met die optie aan). "Aan" (geen climate-entiteit, modus onbekend)
      # telt altijd als niet toegestaan, net als voorheen.
      - name: "HVAC Niet Uit Accu"
        unique_id: hvac_niet_uit_accu
        icon: mdi:air-conditioner
        state: >
          {% set m = states('sensor.hvac_modus') %}
          {% set toestaan = {'Verwarmen': 'input_boolean.hvac_ontladen_bij_verwarmen',
                             'Koelen': 'input_boolean.hvac_ontladen_bij_koelen',
                             'Drogen': 'input_boolean.hvac_ontladen_bij_drogen',
                             'Ventileren': 'input_boolean.hvac_ontladen_bij_ventileren',
                             'Auto': 'input_boolean.hvac_ontladen_bij_auto'} %}
          {% set modus_ok = m in toestaan and is_state(toestaan[m], 'on') %}
          {% set duur_uur = is_state('input_boolean.hvac_ontladen_bij_duur_uur', 'on')
                            and is_state('sensor.dynamisch_duurste_periode', 'Ja') %}
          {{ is_state('binary_sensor.hvac_actief', 'on') and not modus_ok and not duur_uur }}

      # Aan = de NOM-modussen ontladen niet. Bij aanpak Airco niet uit accu alleen als er geen
      # vermogensmeting is (dan kan de correctie niet).
      - name: "HVAC Ontladen Geblokkeerd"
        unique_id: hvac_ontladen_geblokkeerd
        icon: mdi:battery-off-outline
        state: >
          {{ is_state('binary_sensor.hvac_niet_uit_accu', 'on')
             and not (is_state('input_select.hvac_aanpak', 'Airco niet uit accu') and has_value('sensor.hvac_vermogen')) }}
        attributes:
          reden: >
            {% set m = states('sensor.hvac_modus') %}
            {% set toestaan = {'Verwarmen': 'input_boolean.hvac_ontladen_bij_verwarmen',
                               'Koelen': 'input_boolean.hvac_ontladen_bij_koelen',
                               'Drogen': 'input_boolean.hvac_ontladen_bij_drogen',
                               'Ventileren': 'input_boolean.hvac_ontladen_bij_ventileren',
                               'Auto': 'input_boolean.hvac_ontladen_bij_auto'} %}
            {% if is_state('binary_sensor.hvac_actief', 'off') %}
              Airco {{ m | lower }}: ontladen normaal
            {% elif m in toestaan and is_state(toestaan[m], 'on') %}
              {{ m }}: ontladen toegestaan
            {% elif is_state('input_boolean.hvac_ontladen_bij_duur_uur', 'on')
                    and is_state('sensor.dynamisch_duurste_periode', 'Ja') %}
              {{ m }}, maar duur uur: ontladen toegestaan
            {% elif is_state('input_select.hvac_aanpak', 'Airco niet uit accu') and has_value('sensor.hvac_vermogen') %}
              {{ m }}: accu ontlaadt voor het huis, niet voor de airco ({{ states('sensor.hvac_vermogen') | float(0) | round(0) | int }} W)
            {% elif is_state('input_select.hvac_aanpak', 'Airco niet uit accu') %}
              {{ m }}: alleen laden (geen vermogensmeting, dus geen correctie mogelijk)
            {% else %}
              {{ m }}: alleen laden
            {% endif %}
