# Zendure zenSDK (Gielz) + Forecasting 2026.11.3 | gebaseerd op Gielz v20261007
# Gebaseerd op Gielz1986/Zendure-HA-zenSDK (Michiel Hofker). Zie README.md voor licentie en wijzigingen.
# OPTIONEEL PAKKET - niet nodig voor Dynamisch NOM + Forecasting. Weglaten = functie uit.
# Staat in de repo in de map "optional packages". Toevoegen: kopieer het naar je packages-map en herstart
# Home Assistant. Weghalen en herstarten zet de functie weer uit.
# Nodig: een vermogensmeting van de lader (bv. Shelly 1PM); voor een laadsessie ook een schakelaar.
# =====================================================================
# Zendure EV - elektrische auto laden zonder de thuisaccu leeg te trekken (optioneel)
#
# Plaats dit bestand naast zendure_gielz1986_nl.yaml (zelfde packages-map).
# Zonder dit bestand verandert er niets: de automation en de planner rekenen dan met 0 W.
# Het blok Forecasting Configuratie (EV) op de tab Configuratie verschijnt vanzelf zodra dit bestand
# geladen is.
#
# Bedoeld voor een lader zonder eigen aansturing (grannylader, of een wallbox achter een
# slimme schakelaar). Nodig: een vermogenssensor (W of kW) van de lader, bv. een Shelly 1PM
# of Pro 1PM in de groep van de lader. Optioneel: de schakelaar van diezelfde Shelly om de
# lader aan en uit te zetten.
#
# Wat het pakket doet:
# 1. Accu niet in de auto ontladen (altijd, ook als Laadmoment op Uit staat):
#    sensor.ev_ontlaad_correctie is het laadvermogen van de auto zodra dat boven de drempel
#    komt. De NOM-ontlaadblokken in de automation trekken dat af van de P1-meter, zodat de
#    accu alleen het huis voedt en de auto uit het net (of de zon) laadt.
# 2. Verbruik van de auto apart tellen (sensor.ev_geladen_totaal, ..._uit_zon_totaal en de
#    7-daagse cijfers). De planner haalt dat uit het verbruiksprofiel, het dagverbruik en het
#    zelfverbruik van de zon, zodat een laaddag de verwachting voor de accu niet scheef trekt.
# 3. Laadsessie (Laadmoment + Benodigde energie):
#    - Nacht (goedkoopste uren): de lader gaat alleen aan in de goedkoopste prijsslots tot
#      "Klaar om" (00:00 = 07:00). Zijn de prijzen van morgen nog niet bekend, dan rekent hij
#      met het patroon van vandaag en plant hij opnieuw zodra ze er zijn. Zonder prijzen laadt
#      hij direct.
#    - Overdag (zon): de lader staat aan zolang de zon op is, tot de benodigde energie geladen is
#      of de zon ondergaat. Gekozen na zonsondergang: dan geldt de volgende dag.
#      De planner trekt de nog te laden kWh af van het verwachte zon-overschot voor de accu en
#      laadt dat tekort op het goedkoopste moment uit het net.
#    Klaar (energie geladen of tijd voorbij): Laadmoment gaat terug naar Uit en de lader weer aan.
#    Benodigde energie is gemeten aan het stopcontact (dus inclusief laadverlies van de auto).
#
# Let op: niet elke auto hervat het laden vanzelf als de stroom terugkomt. Test dat eerst.
# =====================================================================

input_select:
  ev_laadmoment:
    name: EV Laadmoment
    icon: mdi:ev-station
    options:
      - Uit
      - Nacht (goedkoopste uren)
      - Overdag (zon)

input_number:
  ev_benodigde_kwh:
    name: EV Benodigde Energie
    icon: mdi:car-electric
    min: 0
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "kWh"

  # 0 = 2,3 kW (grannylader op 10 A)
  ev_laadvermogen_kw:
    name: EV Laadvermogen
    icon: mdi:flash
    min: 0
    max: 22
    step: 0.1
    mode: box
    unit_of_measurement: "kW"

  # 0 = 300 W
  ev_drempel_vermogen:
    name: EV Drempel Vermogen
    icon: mdi:flash-alert
    min: 0
    max: 2000
    step: 10
    mode: box
    unit_of_measurement: "W"

  # Intern: stand van sensor.ev_geladen_totaal bij het begin van de sessie
  ev_sessie_teller_start:
    name: EV Sessie Teller Start
    icon: mdi:history
    min: 0
    max: 10000000
    step: 0.001
    mode: box
    unit_of_measurement: "kWh"

input_datetime:
  ev_klaar_om:
    name: EV Klaar Om
    icon: mdi:clock-end
    has_date: false
    has_time: true

  # Intern: einde van de lopende sessie
  ev_sessie_eind:
    name: EV Sessie Eind
    icon: mdi:clock-check-outline
    has_date: true
    has_time: true

input_text:
  ev_vermogen_sensor:
    name: EV Vermogen Sensor
    icon: mdi:meter-electric
    max: 250
    mode: text

  ev_schakelaar:
    name: EV Schakelaar
    icon: mdi:power-socket-eu
    max: 250
    mode: text

# ---------------------------------------------------------------------
# kWh-tellers van de auto (methode "left", zie zendure_forecasting.yaml)
# ---------------------------------------------------------------------
sensor:
  - platform: integration
    name: "EV Geladen Totaal"
    unique_id: ev_geladen_totaal
    source: sensor.ev_laadvermogen
    unit_prefix: k
    round: 3
    method: left

  - platform: integration
    name: "EV Geladen Uit Zon Totaal"
    unique_id: ev_geladen_uit_zon_totaal
    source: sensor.ev_laden_uit_zon_vermogen
    unit_prefix: k
    round: 3
    method: left

  - platform: statistics
    name: "EV Geladen 7 Dagen"
    unique_id: ev_geladen_7_dagen
    entity_id: sensor.ev_teller_geladen
    state_characteristic: change
    max_age:
      days: 7
    sampling_size: 1500
    precision: 2

  - platform: statistics
    name: "EV Geladen Uit Zon 7 Dagen"
    unique_id: ev_geladen_uit_zon_7_dagen
    entity_id: sensor.ev_teller_geladen_uit_zon
    state_characteristic: change
    max_age:
      days: 7
    sampling_size: 1500
    precision: 2

template:
  - sensor:
      # Laadvermogen van de auto in W (0 als de sensor niet is ingevuld)
      - name: "EV Laadvermogen"
        unique_id: ev_laadvermogen
        icon: mdi:car-electric
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set e = states('input_text.ev_vermogen_sensor') | trim %}
          {% if e | lower | regex_match('^sensor\\..+') and has_value(e) %}
            {% set u = state_attr(e, 'unit_of_measurement') %}
            {% set v = states(e) | float(0) %}
            {{ ([v * 1000 if u == 'kW' else v, 0] | max) | round(0) }}
          {% else %}0{% endif %}

      # Wat de NOM-ontlaadblokken van de P1-meter aftrekken: het laadvermogen van de auto,
      # zodra dat boven de drempel komt (stand-by van de lader telt niet).
      - name: "EV Ontlaad Correctie"
        unique_id: ev_ontlaad_correctie
        icon: mdi:battery-minus-outline
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set d = states('input_number.ev_drempel_vermogen') | float(0) %}
          {% set p = states('sensor.ev_laadvermogen') | float(0) %}
          {{ p if p > (d if d > 0 else 300) else 0 }}

      # Deel van het laadvermogen dat niet uit het net komt (dus uit zon).
      # De accu ontlaadt niet in de auto, dus wat niet uit het net komt, komt van de zon.
      - name: "EV Laden Uit Zon Vermogen"
        unique_id: ev_laden_uit_zon_vermogen
        icon: mdi:solar-power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set ev = states('sensor.ev_laadvermogen') | float(0) %}
          {% set import_w = [states('sensor.p1_aansturing_vermogen') | float(0), 0] | max %}
          {{ (ev - [import_w, ev] | min) | round(0) }}

      # Geladen in de lopende sessie (kWh)
      - name: "EV Sessie Geladen"
        unique_id: ev_sessie_geladen
        icon: mdi:battery-charging-medium
        unit_of_measurement: "kWh"
        state: >
          {% if is_state('input_select.ev_laadmoment', 'Uit') %}0
          {% else %}
            {{ ([states('sensor.ev_geladen_totaal') | float(0)
                 - states('input_number.ev_sessie_teller_start') | float(0), 0] | max) | round(2) }}
          {% endif %}

  # -------------------------------------------------------------------
  # Tellers elk kwartier bevriezen (voor de 7-daagse statistiek, zoals in zendure_forecasting.yaml)
  # -------------------------------------------------------------------
  - trigger:
      - trigger: time_pattern
        minutes: "/15"
      - trigger: homeassistant
        event: start
    sensor:
      - name: "EV Teller Geladen"
        unique_id: ev_teller_geladen
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        # Bron even weg (bv. net na een herstart): vorige stand houden, niet unavailable
        availability: "{{ has_value('sensor.ev_geladen_totaal') or this.state | is_number }}"
        state: "{{ states('sensor.ev_geladen_totaal') | float(0) if has_value('sensor.ev_geladen_totaal') else this.state }}"

      - name: "EV Teller Geladen Uit Zon"
        unique_id: ev_teller_geladen_uit_zon
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        # Bron even weg (bv. net na een herstart): vorige stand houden, niet unavailable
        availability: "{{ has_value('sensor.ev_geladen_uit_zon_totaal') or this.state | is_number }}"
        state: "{{ states('sensor.ev_geladen_uit_zon_totaal') | float(0) if has_value('sensor.ev_geladen_uit_zon_totaal') else this.state }}"

  # -------------------------------------------------------------------
  # Laadplan
  #   State: Uit | Laden | Wachten | Klaar
  #   Attribuut laden_nu: moet de lader nu aan?
  #   Attribuut overdag_kwh: wat de auto bij "Overdag" nog van de zon vraagt (voor de planner)
  # -------------------------------------------------------------------
  - trigger:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id:
          - input_select.ev_laadmoment
          - input_number.ev_benodigde_kwh
          - input_number.ev_laadvermogen_kw
          - input_number.ev_sessie_teller_start
          - input_datetime.ev_sessie_eind
          - sensor.dynamisch_nordpool
    variables:
      nu_ts: "{{ as_timestamp(now()) }}"
      modus: "{{ states('input_select.ev_laadmoment') }}"
      nacht: "{{ modus.startswith('Nacht') }}"
      overdag: "{{ modus.startswith('Overdag') }}"
      actief: "{{ nacht or overdag }}"
      kw: >
        {% set k = states('input_number.ev_laadvermogen_kw') | float(0) %}
        {{ k if k > 0 else 2.3 }}
      nodig: "{{ states('input_number.ev_benodigde_kwh') | float(0) }}"
      geladen: "{{ states('sensor.ev_sessie_geladen') | float(0) if actief else 0 }}"
      rest: "{{ ([nodig - geladen, 0] | max) | round(3) if actief else 0 }}"
      eind_ts: "{{ as_timestamp(states('input_datetime.ev_sessie_eind'), 0) }}"
      raw_vandaag: "{{ state_attr('sensor.dynamisch_nordpool', 'raw_today') or [] }}"
      raw_morgen: "{{ state_attr('sensor.dynamisch_nordpool', 'raw_tomorrow') or [] }}"
      morgen_bekend: "{{ raw_morgen | length > 0 }}"
      dag_lengte: "{{ as_timestamp(today_at('00:00') + timedelta(days=1)) - as_timestamp(today_at('00:00')) }}"
      # Prijsslots tot het einde van de sessie; prijzen van morgen onbekend = patroon van vandaag
      kand: >
        {%- set ns = namespace(l=[]) -%}
        {%- set morg = raw_morgen if morgen_bekend else raw_vandaag -%}
        {%- set schuif = 0 if morgen_bekend else dag_lengte -%}
        {%- for p in raw_vandaag + morg -%}
          {%- set extra = schuif if loop.index > raw_vandaag | length else 0 -%}
          {%- set s = as_timestamp(p.start) + extra -%}
          {%- set e = as_timestamp(p.end) + extra -%}
          {%- set a = [s, nu_ts] | max -%}
          {%- set b = [e, eind_ts] | min -%}
          {%- if b > a -%}
            {%- set ns.l = ns.l + [{'s': s, 'e': e, 'v': p.value | float(0), 'kwh': (kw * (b - a) / 3600) | round(4)}] -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.l }}
      # Goedkoopste slots tot de benodigde energie gedekt is (bij gelijke prijs de vroegste)
      gekozen: >
        {%- set ns = namespace(l=[], k=0) -%}
        {%- for x in kand | sort(attribute='s') | sort(attribute='v') -%}
          {%- if ns.k < rest -%}
            {%- set ns.l = ns.l + [x] -%}{%- set ns.k = ns.k + x.kwh -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.l | sort(attribute='s') }}
      laden_nu: >
        {% if not actief or rest <= 0 or nu_ts >= eind_ts %}{{ false }}
        {% elif overdag %}{{ is_state('sun.sun', 'above_horizon') }}
        {% elif kand | length == 0 %}{{ true }}
        {% else %}{{ gekozen | selectattr('s', 'le', nu_ts) | selectattr('e', 'gt', nu_ts) | list | length > 0 }}{% endif %}
    sensor:
      - name: "EV Laadplan"
        unique_id: ev_laadplan
        icon: mdi:car-clock
        state: >
          {% if not actief %}Uit
          {% elif rest <= 0 %}Klaar
          {% elif laden_nu %}Laden
          {% else %}Wachten{% endif %}
        attributes:
          laden_nu: "{{ laden_nu }}"
          geladen_kwh: "{{ geladen | round(2) }}"
          rest_kwh: "{{ rest | round(2) }}"
          overdag_kwh: "{{ rest | round(2) if overdag else 0 }}"
          laadvermogen_kw: "{{ kw }}"
          eind: "{{ (eind_ts | timestamp_custom('%Y-%m-%d %H:%M', true)) if actief and eind_ts > 0 else none }}"
          prijzen_morgen_bekend: "{{ morgen_bekend }}"
          prijzen_beschikbaar: "{{ kand | length > 0 }}"
          # Aaneengesloten geplande slots samengevoegd: start, eind, kWh, gemiddelde prijs
          laadblokken: >
            {%- set ns = namespace(l=[], b=none) -%}
            {%- if nacht -%}
              {%- for x in gekozen -%}
                {%- if ns.b is not none and (ns.b.e_ts == x.s) -%}
                  {%- set ns.b = {'s_ts': ns.b.s_ts, 'e_ts': x.e, 'kwh': ns.b.kwh + x.kwh, 'som': ns.b.som + x.v * x.kwh} -%}
                {%- else -%}
                  {%- if ns.b is not none -%}{%- set ns.l = ns.l + [ns.b] -%}{%- endif -%}
                  {%- set ns.b = {'s_ts': x.s, 'e_ts': x.e, 'kwh': x.kwh, 'som': x.v * x.kwh} -%}
                {%- endif -%}
              {%- endfor -%}
              {%- if ns.b is not none -%}{%- set ns.l = ns.l + [ns.b] -%}{%- endif -%}
            {%- endif -%}
            {%- set uit = namespace(l=[]) -%}
            {%- for b in ns.l -%}
              {%- set uit.l = uit.l + [{
                  'dag': 'vandaag' if (b.s_ts | timestamp_custom('%Y-%m-%d', true)) == (now().date() | string) else 'morgen',
                  'start': b.s_ts | timestamp_custom('%H:%M', true),
                  'eind': b.e_ts | timestamp_custom('%H:%M', true),
                  'kwh': b.kwh | round(2),
                  'prijs': (b.som / b.kwh) | round(3) if b.kwh > 0 else 0}] -%}
            {%- endfor -%}
            {{ uit.l }}

automation:
  # -------------------------------------------------------------------
  # Sessie starten, wijzigen en afsluiten
  # -------------------------------------------------------------------
  - id: zendure_ev_sessie
    alias: Zendure EV Sessie
    description: >-
      Forecasting 2026.11.3 - Start een EV-laadsessie als Laadmoment op Nacht of Overdag gaat,
      sluit hem af als de energie geladen is of de tijd voorbij is, en zet de lader dan weer aan.
    mode: queued
    max: 5
    triggers:
      - trigger: state
        entity_id: input_select.ev_laadmoment
        id: modus
      - trigger: state
        entity_id: input_datetime.ev_klaar_om
        id: klaar_om
      - trigger: state
        entity_id: sensor.ev_laadplan
        to: Klaar
        for:
          minutes: 1
        id: klaar
      - trigger: time_pattern
        minutes: /1
        id: tijd
    variables:
      modus: "{{ states('input_select.ev_laadmoment') }}"
      schakelaar: "{{ states('input_text.ev_schakelaar') | trim }}"
      schakelaar_ok: "{{ schakelaar.split('.')[0] in ['switch', 'input_boolean', 'light'] and has_value(schakelaar) }}"
      # Volgende keer "Klaar om" (00:00 = 07:00)
      klaar_om_ts: >
        {% set t = states('input_datetime.ev_klaar_om') %}
        {% set t = '07:00:00' if t in ['00:00:00', 'unknown', 'unavailable', ''] else t %}
        {% set d = today_at(t) %}
        {{ as_timestamp(d + timedelta(days=1) if d <= now() else d) }}
      zon_onder_ts: "{{ as_timestamp(state_attr('sun.sun', 'next_setting'), as_timestamp(now()) + 43200) }}"
      eind_nieuw: "{{ klaar_om_ts if modus.startswith('Nacht') else zon_onder_ts }}"
    conditions: []
    actions:
      - choose:
          - alias: Sessie start
            conditions:
              - condition: trigger
                id: modus
              - condition: template
                value_template: "{{ trigger.from_state is not none and trigger.from_state.state == 'Uit' and modus != 'Uit' }}"
            sequence:
              - action: input_number.set_value
                target:
                  entity_id: input_number.ev_sessie_teller_start
                data:
                  value: "{{ states('sensor.ev_geladen_totaal') | float(0) }}"
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.ev_sessie_eind
                data:
                  timestamp: "{{ eind_nieuw }}"
              - action: logbook.log
                data:
                  message: >-
                    🚗EV laden gepland ({{ modus }}) — {{ states('input_number.ev_benodigde_kwh') | float(0) | round(0) | int }} kWh
                    tot {{ eind_nieuw | timestamp_custom('%H:%M', true) }} —
                  entity_id: input_select.zendure_2400_ac_modus_selecteren
                  name: ' '
          - alias: Wissel tussen Nacht en Overdag, of Klaar om aangepast
            conditions:
              - condition: or
                conditions:
                  - condition: template
                    value_template: "{{ trigger.id == 'modus' and trigger.from_state is not none and trigger.from_state.state != 'Uit' and modus != 'Uit' }}"
                  - condition: template
                    value_template: "{{ trigger.id == 'klaar_om' and modus.startswith('Nacht') }}"
            sequence:
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.ev_sessie_eind
                data:
                  timestamp: "{{ eind_nieuw }}"
          - alias: Sessie klaar of tijd voorbij
            conditions:
              - condition: template
                value_template: "{{ modus != 'Uit' }}"
              - condition: or
                conditions:
                  - condition: trigger
                    id: klaar
                  - condition: template
                    value_template: >-
                      {{ trigger.id == 'tijd'
                         and as_timestamp(now()) >= as_timestamp(states('input_datetime.ev_sessie_eind'), 0) }}
            sequence:
              - action: logbook.log
                data:
                  message: >-
                    🚗EV laadsessie afgerond — {{ states('sensor.ev_sessie_geladen') | float(0) | round(1) }} kWh geladen
                    ({{ 'energie bereikt' if is_state('sensor.ev_laadplan', 'Klaar') else 'tijd voorbij' }}) —
                  entity_id: input_select.zendure_2400_ac_modus_selecteren
                  name: ' '
              - action: input_select.select_option
                target:
                  entity_id: input_select.ev_laadmoment
                data:
                  option: Uit
          - alias: Laadmoment op Uit - lader weer aan
            conditions:
              - condition: trigger
                id: modus
              - condition: template
                value_template: "{{ modus == 'Uit' and schakelaar_ok and not is_state(schakelaar, 'on') }}"
            sequence:
              - action: homeassistant.turn_on
                target:
                  entity_id: "{{ schakelaar }}"

  # -------------------------------------------------------------------
  # Lader aan en uit volgens het laadplan (alleen met een ingevulde schakelaar)
  # -------------------------------------------------------------------
  - id: zendure_ev_lader
    alias: Zendure EV Lader
    description: >-
      Forecasting 2026.11.3 - Zet de EV-lader aan in de geplande slots en uit daartussen,
      zolang Laadmoment op Nacht of Overdag staat.
    mode: queued
    max: 3
    triggers:
      - trigger: state
        entity_id: sensor.ev_laadplan
        attribute: laden_nu
      - trigger: time_pattern
        minutes: /1
    variables:
      schakelaar: "{{ states('input_text.ev_schakelaar') | trim }}"
      gewenst: "{{ is_state_attr('sensor.ev_laadplan', 'laden_nu', true) }}"
    conditions:
      - condition: template
        value_template: >-
          {{ not is_state('input_select.ev_laadmoment', 'Uit')
             and schakelaar.split('.')[0] in ['switch', 'input_boolean', 'light']
             and has_value(schakelaar) }}
      - condition: template
        value_template: "{{ is_state(schakelaar, 'on') != gewenst }}"
    actions:
      - action: "homeassistant.turn_{{ 'on' if gewenst else 'off' }}"
        target:
          entity_id: "{{ schakelaar }}"
      - action: logbook.log
        data:
          message: >-
            🚗EV lader {{ 'aan' if gewenst else 'uit' }} — {{ state_attr('sensor.ev_laadplan', 'rest_kwh') }} kWh te gaan —
          entity_id: input_select.zendure_2400_ac_modus_selecteren
          name: ' '
