# Zendure zenSDK (Gielz) + Forecasting 2026.11.8 | gebaseerd op Gielz v20261113
# Gebaseerd op Gielz1986/Zendure-HA-zenSDK (Michiel Hofker). Zie README.md voor licentie en wijzigingen.
# OPTIONEEL PAKKET - niet nodig voor Dynamisch NOM + Forecasting. Weglaten = functie uit.
# Staat in de repo in de map "optional packages". Toevoegen: kopieer het naar je packages-map en herstart
# Home Assistant. Weghalen en herstarten zet de functie weer uit.
# Nodig: een meting (W, kW of A) van de Quooker, bv. een Shelly Plug of Shelly 1PM.
# =====================================================================
# Zendure Quooker - de pieken van de Quooker niet uit de accu (optioneel)
#
# Plaats dit bestand naast zendure_gielz1986_nl.yaml (zelfde packages-map).
# Zonder dit bestand verandert er niets: de automation rekent dan met 0 W.
# Het blok Forecasting Configuratie (Quooker) op de tab Configuratie verschijnt vanzelf
# zodra dit bestand geladen is.
#
# Bedoeld voor een Quooker: die warmt vaak kort na met veel vermogen (ook 's nachts om de paar uur
# ~2,2 kW gedurende tientallen seconden). Andere korte piekverbruikers (waterkoker, koffiemachine,
# inductieplaat) kun je in hetzelfde veld erbij zetten.
# Zonder dit pakket volgt de accu in de NOM-modussen elke piek: opschakelen, afschakelen, het relais
# schakelt vaak om en door de regelvertraging levert de accu na de piek kort terug aan het net.
#
# Wat het pakket doet:
#   sensor.zendure_quooker_vermogen is het opgetelde vermogen van de ingevulde sensoren (W, kW of A; A x 230 V).
#   sensor.zendure_quooker_ontlaad_correctie is dat vermogen zodra het boven de drempel komt (stand-by telt niet).
#   De NOM-ontlaadblokken in de automation trekken die correctie af van de P1-meter (zoals bij de auto
#   en de airco): de accu blijft het huis voeden en het net levert de piek.
#   Bij laden (zonoverschot) verandert er niets: de piek gaat dan van het laadvermogen af, dus de zon
#   voedt de piek en er komt niets uit het net.
#
# Let op:
# - Vul hier niet de lader van de auto of de airco in als je het EV- of HVAC-pakket gebruikt;
#   die trekken hun vermogen al af (dan telt het dubbel).
# - Het verbruik boven de drempel telt apart (sensor.zendure_quooker_apart_totaal en de 7-daagse
#   cijfers), net als bij de auto en de airco: het telt niet mee in het verbruiksprofiel, het
#   dagverbruik en het zelfverbruik van de planner. De accu levert het niet, dus de planner hoeft er
#   ook niet voor te laden. Stand-by (onder de drempel) blijft gewoon huisverbruik.
# =====================================================================

# ---------------------------------------------------------------------
# kWh-tellers van het apart getelde verbruik (methode "left", zoals bij de auto en de airco)
# ---------------------------------------------------------------------
sensor:
  - platform: integration
    name: "Zendure Quooker Apart Totaal"
    unique_id: zendure_quooker_apart_totaal
    source: sensor.zendure_quooker_ontlaad_correctie
    unit_prefix: k
    round: 3
    method: left

  - platform: integration
    name: "Zendure Quooker Apart Uit Zon Totaal"
    unique_id: zendure_quooker_apart_uit_zon_totaal
    source: sensor.zendure_quooker_apart_uit_zon_vermogen
    unit_prefix: k
    round: 3
    method: left

  - platform: statistics
    name: "Zendure Quooker Apart 7 Dagen"
    unique_id: zendure_quooker_apart_7_dagen
    entity_id: sensor.zendure_quooker_teller_apart
    state_characteristic: change
    max_age:
      days: 7
    sampling_size: 1500
    precision: 2

  - platform: statistics
    name: "Zendure Quooker Apart Uit Zon 7 Dagen"
    unique_id: zendure_quooker_apart_uit_zon_7_dagen
    entity_id: sensor.zendure_quooker_teller_apart_uit_zon
    state_characteristic: change
    max_age:
      days: 7
    sampling_size: 1500
    precision: 2

input_text:
  # Eén of meer sensoren, gescheiden door komma's (bv. sensor.quooker_vermogen, sensor.waterkoker_vermogen)
  zendure_quooker_vermogen_sensoren:
    name: Zendure Quooker Vermogen Sensoren
    icon: mdi:kettle-steam
    max: 255
    mode: text

input_number:
  # Vermogen waarboven een piek niet uit de accu komt (standaard 1000 W)
  zendure_quooker_drempel_vermogen:
    name: Zendure Quooker Drempel Vermogen
    icon: mdi:flash-alert
    min: 0
    max: 5000
    step: 50
    mode: box
    unit_of_measurement: "W"

template:
  - sensor:
      # Opgeteld vermogen van de piekverbruikers in W (0 als niets is ingevuld)
      - name: "Zendure Quooker Vermogen"
        unique_id: zendure_quooker_vermogen
        icon: mdi:kettle-steam
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set ns = namespace(w=0) %}
          {% for e in states('input_text.zendure_quooker_vermogen_sensoren').split(',') | map('trim') %}
            {% if e | lower | regex_match('^sensor\\..+') and has_value(e) %}
              {% set u = state_attr(e, 'unit_of_measurement') %}
              {% set v = states(e) | float(0) %}
              {% set w = v * 1000 if u == 'kW' else (v * 230 if u == 'A' else v) %}
              {% set ns.w = ns.w + [w, 0] | max %}
            {% endif %}
          {% endfor %}
          {{ ns.w | round(0) }}
        attributes:
          sensoren: >
            {{ states('input_text.zendure_quooker_vermogen_sensoren').split(',') | map('trim')
               | select('match', '(?i)^sensor\\..+') | list }}
          zonder_waarde: >
            {{ states('input_text.zendure_quooker_vermogen_sensoren').split(',') | map('trim')
               | select('match', '(?i)^sensor\\..+') | reject('has_value') | list }}

      # Wat de NOM-ontlaadblokken van de P1-meter aftrekken: het piekvermogen zodra het
      # boven de drempel komt (stand-by en kleine verbruikers tellen niet).
      - name: "Zendure Quooker Ontlaad Correctie"
        unique_id: zendure_quooker_ontlaad_correctie
        icon: mdi:battery-minus-outline
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set d = states('input_number.zendure_quooker_drempel_vermogen') | float(0) %}
          {% set p = states('sensor.zendure_quooker_vermogen') | float(0) %}
          {{ p if p > (d if d > 0 else 1000) else 0 }}

      # Deel van het apart getelde verbruik dat niet uit het net komt (dus uit zon). Wat de auto en
      # de airco uit het net halen gaat voor.
      - name: "Zendure Quooker Apart Uit Zon Vermogen"
        unique_id: zendure_quooker_apart_uit_zon_vermogen
        icon: mdi:solar-power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set q = states('sensor.zendure_quooker_ontlaad_correctie') | float(0) %}
          {% set ander = states('sensor.ev_laadvermogen') | float(0) + states('sensor.hvac_apart_vermogen') | float(0) %}
          {% set import_w = [states('sensor.p1_aansturing_vermogen') | float(0) - ander, 0] | max %}
          {{ (q - [import_w, q] | min) | round(0) }}

  # Tellers elk kwartier bevriezen (voor de 7-daagse statistiek, zoals in zendure_forecasting.yaml)
  - trigger:
      - trigger: time_pattern
        minutes: "/15"
      - trigger: homeassistant
        event: start
    sensor:
      - name: "Zendure Quooker Teller Apart"
        unique_id: zendure_quooker_teller_apart
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        # Bron even weg (bv. net na een herstart): vorige stand houden, niet unavailable
        availability: "{{ has_value('sensor.zendure_quooker_apart_totaal') or this.state | is_number }}"
        state: "{{ states('sensor.zendure_quooker_apart_totaal') | float(0) if has_value('sensor.zendure_quooker_apart_totaal') else this.state }}"

      - name: "Zendure Quooker Teller Apart Uit Zon"
        unique_id: zendure_quooker_teller_apart_uit_zon
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        # Bron even weg (bv. net na een herstart): vorige stand houden, niet unavailable
        availability: "{{ has_value('sensor.zendure_quooker_apart_uit_zon_totaal') or this.state | is_number }}"
        state: "{{ states('sensor.zendure_quooker_apart_uit_zon_totaal') | float(0) if has_value('sensor.zendure_quooker_apart_uit_zon_totaal') else this.state }}"

automation:
  # Drempel op 0 (bv. nieuwe installatie): standaardwaarde 1000 W invullen (zichtbaar in het veld).
  - id: zendure_quooker_standaardwaarden
    alias: Zendure Quooker Standaardwaarden
    description: >-
      Forecasting 2026.11.8 - Vult de drempel van de Quooker in met 1000 W als die op 0 staat.
    mode: queued
    max: 5
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: input_number.zendure_quooker_drempel_vermogen
    conditions: []
    actions:
      - delay:
          seconds: 10
      - if:
          - condition: template
            value_template: "{{ states('input_number.zendure_quooker_drempel_vermogen') | float(-1) == 0 }}"
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.zendure_quooker_drempel_vermogen
            data:
              value: 1000
