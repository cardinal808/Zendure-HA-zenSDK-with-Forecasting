          - type: custom:mod-card
            card_mod:
              style: |
                ha-card {
                  --vertical-stack-card-gap: 0px;
                  --stack-card-gap: 0px;
                  background: var(--ha-card-background, var(--card-background-color, white)) !important;
                  border: var(--ha-card-border-width, 1px) solid var(--ha-card-border-color, var(--divider-color, #e0e0e0)) !important;
                  border-radius: var(--ha-card-border-radius, 12px) !important;
                  padding: 4px 6px 2px 6px;
                  overflow: hidden;
                }
            card:
              type: vertical-stack
              cards:
                - type: custom:apexcharts-card
                  graph_span: 36h
                  span:
                    start: hour
                  now:
                    show: true
                    color: var(--primary-text-color)
                  update_interval: 5min
                  header:
                    show: false
                  apex_config:
                    yaxis:
                      - show: false
                    chart:
                      height: 80px
                      sparkline:
                        enabled: false
                    legend:
                      show: false
                    plotOptions:
                      bar:
                        columnWidth: 100%
                    dataLabels:
                      enabled: false
                    annotations:
                      texts:
                        - x: 4
                          'y': 11
                          text: 'Price €/kWh'
                          fontSize: 10px
                          foreColor: grey
                          textAnchor: start
                    grid:
                      show: true
                      borderColor: color-mix(in srgb, var(--divider-color) 40%, transparent)
                      strokeDashArray: 0
                      padding:
                        top: -10
                        bottom: -28
                        left: 6
                        right: 4
                    tooltip:
                      shared: true
                      intersect: false
                      followCursor: true
                      custom: >-
                        EVAL:function({ series, dataPointIndex, w }) {
                          const t = w.globals.seriesX[0][dataPointIndex];
                          const d = new Date(t);
                          const tijd = d.toLocaleString(navigator.language, { weekday: 'short', hour: '2-digit', minute: '2-digit' });
                          const delen = [];
                          w.globals.seriesNames.forEach((naam, i) => {
                            const v = series[i] ? series[i][dataPointIndex] : null;
                            if (v === null || v === undefined || Number.isNaN(v)) return;
                            const n = naam.toLowerCase();
                            const txt = (n.startsWith('prijs') || n.startsWith('price')) ? v.toFixed(3) + ' €'
                              : ((n.startsWith('laadperc') || n.startsWith('state')) ? Math.round(v) + '%' : v.toFixed(2) + ' kW');
                            delen.push('<span style="color:' + w.globals.colors[i] + '">●</span> ' + naam + ' ' + txt);
                          });
                          return '<div style="padding:1px 6px;font-size:11px;line-height:16px;white-space:nowrap;background:var(--card-background-color,#1c1f26);color:var(--primary-text-color,#e1e1e1);border:1px solid var(--divider-color,#444);border-radius:4px">' + tijd + ' · ' + delen.join(' · ') + '</div>';
                        }
                    xaxis:
                      tooltip:
                        enabled: false
                      labels:
                        show: false
                        datetimeUTC: false
                        format: HH:mm
                        style:
                          fontSize: 10px
                          colors: grey
                      axisTicks:
                        show: false
                      axisBorder:
                        show: false
                  series:
                    - entity: sensor.zendure_forecast_chart
                      name: Price
                      type: column
                      color: '#01a180'
                      float_precision: 3
                      show:
                        in_header: false
                      data_generator: |
                        const d = entity.attributes.timeline;
                        if (!d || !d.t) return [];
                        // Colours as in Gielz (Dynamic Today/Tomorrow): green = charging (here: planned
                        // by the planner), red = expensive (Gielz's most expensive periods), grey = other.
                        // Light grey = price not known yet (today's pattern assumed).
                        const g = hass.states['sensor.dynamic_lowest_price_period'];
                        const exp = new Set();
                        if (g) {
                          [...(g.attributes.raw_today || []), ...(g.attributes.raw_tomorrow || [])]
                            .forEach((p) => { if (p.duur === 'Yes') exp.add(new Date(p.start).getTime()); });
                        }
                        return d.t.map((t, i) => {
                          const v = d.price[i];
                          let c = 'rgba(162,162,163,1)';
                          if (exp.has(t * 1000)) c = 'rgba(197,59,44,1)';
                          if (!d.known[i]) c = 'rgba(162,162,163,0.4)';
                          if (d.charge[i]) c = 'rgba(1,161,128,1)';
                          return { x: t * 1000, y: v, fillColor: c };
                        });
                  card_mod:
                    style: |
                      ha-card {
                        background: none !important;
                        border: none !important;
                        border-radius: 0 !important;
                        box-shadow: none !important;
                      }
                - type: custom:apexcharts-card
                  graph_span: 36h
                  span:
                    start: hour
                  now:
                    show: true
