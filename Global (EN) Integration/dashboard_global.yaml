              %}

              {% set base =
              'https://cdn.jsdelivr.net/gh/Gielz1986/Zendure-HA-zenSDK@main/Devices/'
              %}

              {% set images = {
                'solarFlow2400AC': 'V2_SF_2400_AC.png',
                'solarFlow2400AC+': 'V2_SF_2400_AC_Plus_Pro.png',
                'Hyper2000': 'V2_Hyper_2000.png',
                'solarFlow2400Pro': 'V2_SF_2400_AC_Plus_Pro.png',
                'solarFlow1600AC+': 'V2_SF_1600_AC_Plus.png',
                'solarFlow800Pro': 'V2_SF_800_Pro.png',
                'solarFlow800Pro2': 'V2_SF_800_Pro.png',
                'solarFlow4000MixAC+': 'V2_SF_3000_4000_Mix.png',
                'solarFlow4000MixPro': 'V2_SF_3000_4000_Mix.png',
                'solarFlow3000MixAC+': 'V2_SF_3000_4000_Mix.png',
                'solarFlow800Plus': 'V2_SF_800_Plus.png'
              } %}

              {% if last in ['unknown', 'unavailable', '', None] %}
                {% set img = 'Inactive.png' %}
              {% else %}
                {% set diff = as_timestamp(now()) - as_timestamp(last) %}
                {% if diff >= 120 %}
                  {% set img = 'Inactive.png' %}
                {% else %}
                  {% set img = images.get(product, 'sf_2400_ac.png') %}
                {% endif %}
              {% endif %}

              <img src="{{ base ~ img }}">
            grid_options:
              columns: 3
              rows: auto
          - type: markdown
            content: >-
              {% set product = states('sensor.zendure_product_model') %}


              {% set names = {
                'solarFlow2400AC': 'Solarflow 2400 AC',
                'solarFlow2400AC+': 'Solarflow 2400 AC+',
                'solarFlow4000MixAC+': 'SolarFlow 4000 Mix AC+',
                'solarFlow4000MixPro': 'SolarFlow 4000 Mix Pro',
                'solarFlow3000MixAC+': 'SolarFlow 3000 Mix AC+',
                'solarFlow2400Pro': 'Solarflow 2400 Pro',
                'solarFlow1600AC+': 'Solarflow 1600 AC+',
                'Hyper2000': 'Hyper 2000',
                'solarFlow800Pro': 'Solarflow 800 Pro',
                'solarFlow800Pro2': 'Solarflow 800 Pro 2',
                'solarFlow800Plus': 'Solarflow 800 Plus'
              } %}


              **{{ names.get(product, 'Unknown') }}** ({{
              states('sensor.zendure_total_capacity') }} kWh)  

              {{ states('sensor.zendure_serial_number') }}


              {% set last =
              states('input_datetime.zendure_gielz_automation_last_time_executed')
              %}


              {% if last not in ['unknown', 'unavailable', '', None] %}

              {% set diff = as_timestamp(now()) - as_timestamp(last) %}


              **Automation Heartbeat**  

              {% if diff > 120 %} Automation Offline

              {% else %} {{ as_timestamp(last) | timestamp_custom('%Y-%m-%d
              %H:%M') }} (last checked)

              {% endif %}


              {% else %}

              **Incorrect entities check package**

              {% endif %}
            grid_options:
              columns: 9
              rows: auto
