                'y':
                  formatter: |
                    EVAL: (val) => `${val.toFixed(3)} €/kWh`
              grid:
                show: true
                borderColor: color-mix(in srgb, var(--divider-color) 50%, transparent)
                strokeDashArray: 0
                padding:
                  top: -10
              chart:
                height: 150px
                stacked: true
                stackOnlyBar: true
              yaxis:
                - title:
                    text: ''
                  decimalsInFloat: 2
                  forceNiceScale: true
                  labels:
                    style:
                      colors: >-
                        color-mix(in srgb, var(--primary-text-color) 75%,
                        transparent)
