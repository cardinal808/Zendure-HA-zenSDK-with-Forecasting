              <ha-alert alert-type="info">The package <b>zendure_savings_global.yaml</b> is not loaded.</ha-alert>Copy the file from the <code>optional packages</code> folder on GitHub to your <code>packages</code> folder and restart Home Assistant to see the savings and the battery payback time.
            grid_options:
              columns: full
      - type: grid
        visibility:
          - condition: state
            entity: input_number.savings_setting_fixed_supply_price
            state_not: unavailable
        column_span: 3
        cards:
          - type: markdown
            content: >-
              <ha-alert alert-type="info">This tab is a <b>work in progress</b>, expect improvements in the next release.</ha-alert>
            text_only: true
            grid_options:
              columns: full
          - type: heading
            icon: ''
            heading: Savings
            heading_style: title
          - type: grid
            columns: 4
            square: false
            cards:
              - type: tile
                entity: sensor.zendure_savings_today
                name: Today
                icon: mdi:calendar-today
                color: green
                vertical: false
              - type: tile
                entity: sensor.zendure_savings_this_month
                name: This month
                icon: mdi:calendar-month
                color: green
                vertical: false
              - type: tile
                entity: sensor.zendure_savings_this_year
                name: This year
                icon: mdi:calendar-blank-multiple
                color: green
                vertical: false
              - type: tile
                entity: sensor.zendure_savings
                name: Total
                icon: mdi:piggy-bank-outline
                color: green
                vertical: false
            grid_options:
              columns: full
          - type: markdown
            content: >-
              <ha-alert alert-type="info">Help text</ha-alert>Every quarter
              hour your usage is settled at the fixed tariff and at the
              dynamic price of that moment, with and without solar and battery.
              Export counts at the (lower) feed-in price. **Saved** is the
              difference between a fixed contract without solar and battery
              and what you pay with solar, battery and a dynamic contract.
              Fixed costs (standing charges, grid fees, tax credits) are not
              included; they are the same in every situation.


              **Solar panels** is everything the sun yields: direct use and
              export, plus the solar energy used in the home later via the
              battery (at the price it saves at that moment, without costs).
              **Battery and smart charging** is what remains: charging from the
              grid and discharging again, including the charge and discharge
              loss and energy still in the battery. In months with little sun
              and small price differences this can be negative.
            text_only: true
            visibility:
              - condition: state
                entity: input_boolean.dashboard_setting_show_help
                state: 'on'
            grid_options:
              columns: full
      - type: grid
        visibility:
          - condition: state
            entity: input_number.savings_setting_fixed_supply_price
            state_not: unavailable
        cards:
          - type: markdown
            title: Overview
            text_only: false
            content: |
              {%- set e = state_attr('sensor.zendure_savings', 'buckets') or {} -%}
              {%- set P = [('day', 'Today'), ('month', 'Month'), ('year', 'Year'), ('total', 'Total')] -%}
              {%- macro eur(x) -%}{%- set x = x | float(0) | round(2) -%}{{ ('-' if x < 0 else '') ~ '€ ' ~ ('%.2f' | format(x | abs)) }}{%- endmacro -%}
              {%- macro colour(x) -%}{%- set x = x | float(0) | round(2) -%}{% if x > 0 %}<font color="#01a180">{{ eur(x) }}</font>{% elif x < 0 %}<font color="#c53b2c">{{ eur(x) }}</font>{% else %}{{ eur(x) }}{% endif %}{%- endmacro -%}
              {%- macro kwh(x) -%}{{ '%.1f' | format(x | float(0)) }}{%- endmacro -%}
              {%- macro w(b, k) -%}{{ ((e.get(b) or {}).get(k, 0)) | float(0) }}{%- endmacro -%}
              {% if states('input_number.savings_setting_fixed_supply_price') | float(0) <= 0 %}
              <ha-alert alert-type="warning">Enter the fixed tariff under Settings, Forecasting Configuration (Savings).</ha-alert>
              {% endif %}
              | | {% for k, n in P %}{{ n }} | {% endfor %}
              |:---|{% for k, n in P %}---:|{% endfor %}
              | **Saved** | {% for k, n in P %}**{{ colour(w(k, 'none_fixed') | float - w(k, 'now_dyn') | float) }}** | {% endfor %}
              | <ha-icon icon="mdi:solar-power-variant"></ha-icon>solar panels | {% for k, n in P %}{{ colour(w(k, 'none_fixed') | float - w(k, 'solar_fixed') | float + w(k, 'solar_batt') | float) }} | {% endfor %}
              | &emsp;&emsp;<small>direct use and export</small> | {% for k, n in P %}<small>{{ colour(w(k, 'none_fixed') | float - w(k, 'solar_fixed') | float) }}</small> | {% endfor %}
              | &emsp;&emsp;<small>stored in the battery</small> | {% for k, n in P %}<small>{{ colour(w(k, 'solar_batt')) }}</small> | {% endfor %}
              | <ha-icon icon="mdi:chart-bell-curve-cumulative"></ha-icon>dynamic tariff | {% for k, n in P %}{{ colour(w(k, 'solar_fixed') | float - w(k, 'solar_dyn') | float) }} | {% endfor %}
              | <ha-icon icon="mdi:battery-charging"></ha-icon>battery and smart charging | {% for k, n in P %}{{ colour(w(k, 'solar_dyn') | float - w(k, 'now_dyn') | float - w(k, 'solar_batt') | float) }} | {% endfor %}
              | <ha-icon icon="mdi:cash-remove"></ha-icon>Fixed contract, no solar or battery | {% for k, n in P %}{{ eur(w(k, 'none_fixed')) }} | {% endfor %}
              | <ha-icon icon="mdi:cash-check"></ha-icon>Actual costs | {% for k, n in P %}{{ eur(w(k, 'now_dyn')) }} | {% endfor %}

              | Energy (kWh) | {% for k, n in P %}{{ n }} | {% endfor %}
              |:---|{% for k, n in P %}---:|{% endfor %}
              | <ha-icon icon="mdi:home-lightning-bolt-outline"></ha-icon>Usage | {% for k, n in P %}{{ kwh(w(k, 'usage')) }} | {% endfor %}
              | <ha-icon icon="mdi:solar-power"></ha-icon>Solar | {% for k, n in P %}{{ kwh(w(k, 'solar')) }} | {% endfor %}
              | &emsp;&emsp;<small>solar into / out of the battery</small> | {% for k, n in P %}<small>{{ kwh(w(k, 'solar_into_batt')) }} / {{ kwh(w(k, 'solar_from_batt')) }}</small> | {% endfor %}
              | <ha-icon icon="mdi:transmission-tower-import"></ha-icon>Import | {% for k, n in P %}{{ kwh(w(k, 'imp')) }} | {% endfor %}
              | <ha-icon icon="mdi:transmission-tower-export"></ha-icon>Export | {% for k, n in P %}{{ kwh(w(k, 'exp')) }} | {% endfor %}

              <small>Total since {{ (e.get('total') or {}).get('start', '-') }}{% if e.get('yesterday') %} · saved yesterday {{ eur(w('yesterday', 'none_fixed') | float - w('yesterday', 'now_dyn') | float) }}{% endif %}</small>
            grid_options:
              columns: full
            card_mod:
              style:
                ha-markdown$: |
                  table { width: 100%; border-collapse: collapse; table-layout: fixed; margin: 2px 0 6px; }
                  th, td { border: none !important; padding: 6px 6px !important; }
                  th { font-size: 0.72em; font-weight: 500; text-transform: uppercase; letter-spacing: .02em; color: var(--secondary-text-color); border-bottom: 1px solid var(--divider-color) !important; }
                  td { border-bottom: 1px solid color-mix(in srgb, var(--divider-color) 45%, transparent) !important; }
                  tr:last-child td { border-bottom: none !important; }
                  th:not(:first-child), td:not(:first-child) { text-align: right !important; white-space: nowrap; font-variant-numeric: tabular-nums; }
                  th:first-child, td:first-child { width: 42%; }
                  ha-icon { --mdc-icon-size: 18px; color: var(--secondary-text-color); margin-right: 6px; vertical-align: -3px; }
                  small { color: var(--secondary-text-color); }
          - type: markdown
            title: Cost per situation
            text_only: false
            content: |
              {%- set e = state_attr('sensor.zendure_savings', 'buckets') or {} -%}
              {%- set P = [('month', 'Month'), ('year', 'Year'), ('total', 'Total')] -%}
              {%- macro eur(x) -%}{%- set x = x | float(0) | round(2) -%}{{ ('-' if x < 0 else '') ~ '€ ' ~ ('%.2f' | format(x | abs)) }}{%- endmacro -%}
              {%- macro w(b, k) -%}{{ ((e.get(b) or {}).get(k, 0)) | float(0) }}{%- endmacro -%}
              {%- set S = [('none_fixed', 'mdi:home-outline', 'No solar, no battery', 'fixed'), ('none_dyn', 'mdi:home-outline', 'No solar, no battery', 'dynamic'), ('solar_fixed', 'mdi:solar-power-variant', 'Solar only', 'fixed'), ('solar_dyn', 'mdi:solar-power-variant', 'Solar only', 'dynamic'), ('now_fixed', 'mdi:home-battery', 'Solar + battery', 'fixed'), ('now_dyn', 'mdi:home-battery', 'Solar + battery', 'dynamic')] -%}
              | What would you have paid? | {% for k, n in P %}{{ n }} | {% endfor %}
              |:---|{% for k, n in P %}---:|{% endfor %}
              {% for key, icon, label, contract in S %}| <ha-icon icon="{{ icon }}"></ha-icon>{% if key == 'now_dyn' %}**{{ label }}, {{ contract }}** <small>(your situation)</small>{% else %}{{ label }}, {{ contract }}{% endif %} | {% for k, n in P %}{% if key == 'now_dyn' %}**<font color="#01a180">{{ eur(w(k, key)) }}</font>**{% else %}{{ eur(w(k, key)) }}{% endif %} | {% endfor %}
              {% endfor %}
            grid_options:
              columns: full
            card_mod:
              style:
                ha-markdown$: |
                  table { width: 100%; border-collapse: collapse; table-layout: fixed; margin: 2px 0 6px; }
                  th, td { border: none !important; padding: 6px 6px !important; }
                  th { font-size: 0.72em; font-weight: 500; text-transform: uppercase; letter-spacing: .02em; color: var(--secondary-text-color); border-bottom: 1px solid var(--divider-color) !important; }
                  td { border-bottom: 1px solid color-mix(in srgb, var(--divider-color) 45%, transparent) !important; }
                  tr:last-child td { border-bottom: none !important; }
                  th:not(:first-child), td:not(:first-child) { text-align: right !important; white-space: nowrap; font-variant-numeric: tabular-nums; }
                  th:first-child, td:first-child { width: 55%; }
                  ha-icon { --mdc-icon-size: 18px; color: var(--secondary-text-color); margin-right: 6px; vertical-align: -3px; }
                  small { color: var(--secondary-text-color); }
      - type: grid
        visibility:
          - condition: state
            entity: input_number.savings_setting_fixed_supply_price
            state_not: unavailable
        cards:
          - type: heading
            icon: ''
            heading: Savings per day
            heading_style: title
          - type: custom:apexcharts-card
            graph_span: 30d
            span:
              end: day
            cache: false
            header:
              show: false
            apex_config:
              chart:
                height: 160px
              legend:
                show: false
              plotOptions:
                bar:
                  columnWidth: 80%
              tooltip:
                x:
                  format: d/MM
                  show: true
                'y':
                  formatter: |
                    EVAL: (val) => val === null ? '-' : `€ ${val.toFixed(2)}`
              grid:
                show: true
                borderColor: color-mix(in srgb, var(--divider-color) 50%, transparent)
                strokeDashArray: 0
                padding:
                  top: -10
              xaxis:
                labels:
                  show: false
                axisTicks:
                  show: false
                axisBorder:
                  color: color-mix(in srgb, var(--divider-color) 50%, transparent)
              yaxis:
                - decimalsInFloat: 2
                  labels:
                    style:
                      colors: >-
                        color-mix(in srgb, var(--primary-text-color) 75%,
                        transparent)
            series:
              - entity: sensor.zendure_savings
                name: Saved
                type: column
                color: '#01a180'
                float_precision: 2
                statistics:
                  type: change
                  period: day
                  align: start
                show:
                  in_header: false
            grid_options:
              columns: full
          - type: heading
            icon: ''
            heading: Savings per month
            heading_style: title
          - type: custom:apexcharts-card
            graph_span: 12month
            span:
              start: month
              offset: -11month
            cache: false
            header:
              show: false
            apex_config:
              chart:
                height: 160px
              legend:
                show: false
              tooltip:
                x:
                  format: MM-yyyy
                  show: true
                'y':
                  formatter: |
                    EVAL: (val) => val === null ? '-' : `€ ${val.toFixed(2)}`
              grid:
                show: true
                borderColor: color-mix(in srgb, var(--divider-color) 50%, transparent)
                strokeDashArray: 0
                padding:
                  top: -10
              xaxis:
                labels:
                  show: false
                axisTicks:
                  show: false
                axisBorder:
                  color: color-mix(in srgb, var(--divider-color) 50%, transparent)
              yaxis:
                - decimalsInFloat: 0
                  labels:
                    style:
                      colors: >-
                        color-mix(in srgb, var(--primary-text-color) 75%,
                        transparent)
            series:
              - entity: sensor.zendure_savings
                name: Saved
                type: column
                color: '#01a180'
                float_precision: 2
                statistics:
                  type: change
                  period: month
                  align: start
                show:
                  in_header: false
            grid_options:
              columns: full
          - type: markdown
            content: >-
              <ha-alert alert-type="info">Help text</ha-alert>The charts come from
              the statistics (LTS) of the total savings and therefore run about
              an hour behind on average. After "Restart total" that day shows a
              negative value.
            text_only: true
            visibility:
              - condition: state
                entity: input_boolean.dashboard_setting_show_help
                state: 'on'
            grid_options:
              columns: full
      - type: grid
        visibility:
          - condition: state
            entity: input_number.savings_setting_fixed_supply_price
            state_not: unavailable
        cards:
          - type: tile
            entity: sensor.zendure_battery_payback_time
            name: Battery payback time
            icon: mdi:cash-clock
            color: green
            vertical: false
            grid_options:
              columns: full
          - type: markdown
            title: Payback time
            text_only: false
            content: |
              {%- set s = 'sensor.zendure_battery_payback_time' -%}
              {%- set price = states('input_number.savings_setting_battery_purchase_price') | float(0) -%}
              {%- macro eur(x, d=2) -%}{%- set x = x | float(0) -%}{{ ('-' if x < 0 else '') ~ '€ ' ~ (('%.' ~ d ~ 'f') | format(x | abs)) }}{%- endmacro -%}
              {%- set earned = state_attr(s, 'earned') | float(0) -%}
              {%- set pct = [[state_attr(s, 'earned_pct') | float(0), 0] | max, 100] | min -%}
              {%- set n = (pct / 5) | round(0) | int -%}
              {% if price <= 0 -%}
              Enter the purchase price of the battery under Settings, Forecasting Configuration (Savings).
              {%- else -%}
              {% if has_value(s) %}**{{ states(s) }} years** in total{% if state_attr(s, 'still_to_go') | float(0) > 0 %}, **{{ state_attr(s, 'years_left') }} years** to go (around {{ state_attr(s, 'paid_back_around') }}){% else %}, **paid back**{% endif %}{% elif (state_attr(s, 'measured_days') | float(0)) >= 1 %}No payback time yet: on balance the battery has not earned anything over this period.{% else %}Not enough data yet: the first estimate follows after a full day of measuring.{% endif %}

              <font color="#01a180">{{ '█' * n }}</font><font color="#5a5a5c">{{ '█' * (20 - n) }}</font> {{ pct | abs | round(1) }}%

              | | |
              |:---|---:|
              | <ha-icon icon="mdi:cash"></ha-icon>Purchase price | {{ eur(price, 0) }} |
              | <ha-icon icon="mdi:cash-check"></ha-icon>Earned back | {% if earned < 0 %}<font color="#c53b2c">{{ eur(earned) }}</font>{% else %}<font color="#01a180">{{ eur(earned) }}</font>{% endif %} |
              {% if state_attr(s, 'of_which_solar_energy') is not none %}| &emsp;&emsp;<small>of which stored solar energy</small> | <small>{{ eur(state_attr(s, 'of_which_solar_energy')) }}</small> |
              | &emsp;&emsp;<small>of which smart charging</small> | <small>{{ eur(state_attr(s, 'of_which_smart_charging')) }}</small> |
              {% endif %}| <ha-icon icon="mdi:cash-clock"></ha-icon>Still to go | {{ eur(state_attr(s, 'still_to_go') if state_attr(s, 'still_to_go') is not none else price - earned) }} |
              {% if has_value(s) %}| <ha-icon icon="mdi:calendar-sync"></ha-icon>Earnings of the battery per year | {{ eur(state_attr(s, 'savings_per_year'), 0) }} |
              {% endif %}
              {% if (state_attr(s, 'measured_days') | float(0)) < 365 %}
              <small>Indication based on {{ state_attr(s, 'measured_days') | float(0) | round(0) | int }} day(s) of measuring. Summer and winter differ a lot (less solar in winter, but often a larger price spread); after a year of measuring the estimate is most reliable. Tariffs and battery price: Settings tab, block Forecasting Configuration (Savings).</small>
              {%- endif %}
              {%- endif %}
            grid_options:
              columns: full
            card_mod:
              style:
                ha-markdown$: |
                  table { width: 100%; border-collapse: collapse; table-layout: fixed; margin: 2px 0 6px; }
                  th, td { border: none !important; padding: 6px 6px !important; }
                  th { font-size: 0.72em; font-weight: 500; text-transform: uppercase; letter-spacing: .02em; color: var(--secondary-text-color); border-bottom: 1px solid var(--divider-color) !important; }
                  td { border-bottom: 1px solid color-mix(in srgb, var(--divider-color) 45%, transparent) !important; }
                  tr:last-child td { border-bottom: none !important; }
                  th:not(:first-child), td:not(:first-child) { text-align: right !important; white-space: nowrap; font-variant-numeric: tabular-nums; }
                  th:first-child, td:first-child { width: 60%; }
                  ha-icon { --mdc-icon-size: 18px; color: var(--secondary-text-color); margin-right: 6px; vertical-align: -3px; }
                  small { color: var(--secondary-text-color); }
                  thead { display: none; }
    cards: []
  - type: sections
    max_columns: 4
    icon: mdi:battery-heart-variant
    path: gezondheid
    title: Health
    sections:
      - type: grid
        cards:
          - type: heading
            icon: ''
            heading_style: title
            heading: Global
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.zendure_total_batteries
                name: Total Batteries
              - entity: sensor.zendure_total_capacity
                name: Total Capacity
              - entity: sensor.zendure_wifi_signal_strength
                name: WIFI Signal Strength
              - entity: sensor.zendure_error
                name: Error
              - entity: sensor.zendure_offgrid_mode
                name: Offgrid Mode
              - type: conditional
                conditions:
                  - entity: input_boolean.dashboard_setting_show_pv
                    state: 'on'
                row:
                  entity: sensor.zendure_pv_export_mode
                  name: PV Export Mode
              - entity: sensor.zendure_calibrating
                name: Calibrating
              - entity: sensor.zendure_inverter_max_charge_power
                name: Inverter Max. Charge Power
              - entity: sensor.zendure_inverter_max_discharge_power
                name: Inverter Max. Discharge Power
              - entity: sensor.zendure_storage_mode
                name: Storage Mode
              - entity: sensor.zendure_battery_voltage
                name: Battery Voltage
              - entity: sensor.zendure_minimum_state_of_charge
                name: Min. State Of Charge
              - entity: sensor.zendure_maximum_state_of_charge
                name: Max. State Of Charge
          - type: heading
            icon: ''
            heading: Relay Switches
            heading_style: title
            badges:
              - type: entity
                show_state: true
                show_icon: true
                entity: sensor.zendure_relay_switches_today
                color: '#01a180'
                name: Today
                state_content:
                  - name
                  - state
                tap_action:
                  action: more-info
          - type: markdown
            content: >-
              <ha-alert alert-type="info">Help text</ha-alert>The number of
              relay switches per day for this month and the previous month. The
              dotted line indicates the threshold at which the number of
              switches is considered elevated. Anything below 100 switches per
              day is normal on a partly cloudy day.


              This data comes from the statistics (LTS). As a result, the graph
              is on average 1 hour behind.
            text_only: true
            visibility:
              - condition: state
                entity: input_boolean.dashboard_setting_show_help
                state: 'on'
          - type: custom:apexcharts-card
            stacked: true
            header:
              show: true
              title: ''
            graph_span: 2month
            span:
              start: month
              offset: -1month
            cache: false
            apex_config:
              annotations:
                yaxis:
                  - 'y': 100
                    borderColor: var(--accent-color)
                    strokeDashArray: 4
                    borderWidth: 2
              yaxis:
                - decimalsInFloat: 0
                  labels:
                    show: true
                    style:
                      colors: >-
                        color-mix(in srgb, var(--primary-text-color) 75%,
                        transparent)
              tooltip:
                x:
                  format: d/MM
                  show: false
              grid:
                show: true
                borderColor: color-mix(in srgb, var(--divider-color) 50%, transparent)
                strokeDashArray: 0
                padding:
                  top: -10
              chart:
                height: 150px
              legend:
                show: false
              xaxis:
                labels:
                  show: false
                axisTicks:
                  show: false
                axisBorder:
                  color: color-mix(in srgb, var(--divider-color) 50%, transparent)
            series:
              - entity: sensor.zendure_relay_switches_charging_today
                name: Relay Switches (Charging)
                transform: 'return x > 0 ? x - 1 : 0;'
                statistics:
                  period: day
                  type: max
                  align: middle
                type: column
                color: '#01a180'
                show:
                  in_header: false
                  extremas: false
              - entity: sensor.zendure_relay_switches_discharging_today
                name: Relay Switches (Discharging)
                statistics:
                  period: day
                  type: max
                  align: middle
                type: column
                color: '#01a180'
                show:
                  in_header: false
                  extremas: false
          - type: heading
            icon: ''
            heading: Calibrations
            heading_style: title
            badges:
              - type: entity
                show_state: true
                show_icon: true
                entity: sensor.zendure_last_calibration
                color: '#01a180'
                tap_action:
                  action: more-info
              - type: entity
                show_state: true
                show_icon: true
                entity: sensor.zendure_last_calibration_days
                color: '#01a180'
          - type: markdown
            content: >-
              <ha-alert alert-type="info">Help text</ha-alert>The number of
              calibrations shown in green for this month and the previous month.
              Battery calibration takes place when the battery is charged to
              100%. If no calibration has occurred for more than one month, the
              BMS will perform it automatically.


              This data comes from the statistics (LTS). As a result, the graph
              is on average 1 hour behind.
            text_only: true
            visibility:
              - condition: state
                entity: input_boolean.dashboard_setting_show_help
                state: 'on'
          - type: custom:apexcharts-card
            experimental:
              hidden_by_default: true
              color_threshold: true
            stacked: true
            header:
              show: true
              title: ''
            graph_span: 2month
            span:
              start: month
              offset: -1month
            cache: false
            apex_config:
              yaxis:
                - decimalsInFloat: 0
                  min: 0
                  max: 100
                  tickAmount: 4
                  labels:
                    show: true
                    style:
                      colors: >-
                        color-mix(in srgb, var(--primary-text-color) 75%,
                        transparent)
              tooltip:
                x:
                  format: d/MM
                  show: false
                'y':
                  formatter: |
                    function(value, { seriesIndex, w }) {
                      const name = w.globals.seriesNames[seriesIndex];
                      if (name === "Geen kalibratie") {
                        return "";
                      }
                      return value;
                    }
              grid:
                show: true
                borderColor: color-mix(in srgb, var(--divider-color) 50%, transparent)
                strokeDashArray: 0
                padding:
                  top: -10
              chart:
                height: 150px
              legend:
                show: false
              xaxis:
                labels:
                  show: false
                axisTicks:
                  show: false
                axisBorder:
                  color: color-mix(in srgb, var(--divider-color) 50%, transparent)
            series:
              - entity: sensor.zendure_total_state_of_charge
                name: Calibration Finished
                transform: |
                  return x === 100 ? x : null;
                statistics:
                  period: day
                  type: max
                  align: middle
                type: column
                color: '#01a180'
                show:
                  in_header: false
                  extremas: false
              - entity: sensor.zendure_total_state_of_charge
                name: No Calibration
                transform: |
                  return x < 100 ? x : null;
                statistics:
                  period: day
                  type: max
                  align: middle
                type: column
                color: '#a2a2a3'
                show:
                  in_header: false
                  extremas: false
      - type: grid
        cards:
          - type: heading
            icon: ''
            heading: Inverter Temperature
            heading_style: title
            badges:
              - type: entity
                show_state: true
                show_icon: true
                entity: sensor.zendure_inverter_temperature
                color: '#01a180'
                tap_action:
                  action: more-info
          - type: markdown
            content: >-
              <ha-alert alert-type="info">Help text</ha-alert>The temperature of
              the inverter for today. The dotted line indicates the threshold at
              which the inverter starts reducing its power. This happens from 55
              °C.
            text_only: true
            visibility:
              - condition: state
                entity: input_boolean.dashboard_setting_show_help
                state: 'on'
          - type: custom:apexcharts-card
            experimental:
              hidden_by_default: true
              color_threshold: true
            header:
              show: true
              title: ''
            graph_span: 1day
            span:
              start: day
            stacked: true
            cache: false
            apex_config:
              markers:
                size: 0
                hover:
                  size: 0
              annotations:
                yaxis:
                  - 'y': 55
                    borderColor: var(--accent-color)
                    strokeDashArray: 4
                    borderWidth: 2
              yaxis:
                - decimalsInFloat: 0
                  min: 0
                  max: 80
                  tickAmount: 4
                  labels:
                    show: true
                    style:
                      colors: >-
                        color-mix(in srgb, var(--primary-text-color) 75%,
                        transparent)
              tooltip:
                x:
                  format: HH:mm
                  show: false
              grid:
                show: true
                borderColor: color-mix(in srgb, var(--divider-color) 50%, transparent)
                strokeDashArray: 0
                padding:
                  top: -10
              chart:
                height: 150px
              legend:
                show: false
              xaxis:
                labels:
                  show: false
                axisTicks:
                  show: false
                axisBorder:
                  color: color-mix(in srgb, var(--divider-color) 50%, transparent)
            series:
              - entity: sensor.zendure_inverter_temperature
                name: Inverter Temperature
                stroke_width: 2
                opacity: 0.2
                curve: smooth
                extend_to: now
                statistics:
                  period: 5minute
                  type: max
                  align: start
                type: area
                color: '#01a180'
                show:
                  in_header: false
                color_threshold:
                  - value: 0
                    opacity: 0.2
                  - value: 30
                    opacity: 0.35
                  - value: 40
                    opacity: 0.5
                  - value: 50
                    opacity: 0.65
                  - value: 60
                    opacity: 0.8
              - entity: sensor.zendure_power
                name: Battery
                transform: return Math.abs(x)
                statistics:
                  period: 5minute
                  type: max
                  align: start
                type: line
                curve: smooth
                stroke_width: 0
                opacity: 1
                extend_to: now
                color: var(--accent-color)
                float_precision: 0
                yaxis_id: percentage
                show:
                  in_header: false
                  in_legend: false
          - type: heading
            icon: ''
            heading: Batteries
            heading_style: title
          - type: horizontal-stack
            cards:
              - type: entities
                show_header_toggle: false
                entities:
                  - entity: sensor.zendure_battery_1_temperature
                    name: Battery 1 Temperature
                  - entity: sensor.zendure_battery_1_state_of_charge
                    name: Battery 1 State Of Charge
                  - entity: sensor.zendure_battery_1_cell_balance_status
                    name: Battery 1 Cell Balance
                visibility:
                  - condition: state
                    entity: sensor.zendure_total_batteries
                    state: '1'
              - type: entities
                show_header_toggle: false
                entities:
                  - entity: sensor.zendure_battery_1_temperature
                    name: Battery 1 Temperature
                  - entity: sensor.zendure_battery_2_temperature
                    name: Battery 2 Temperature
                  - entity: sensor.zendure_battery_1_state_of_charge
                    name: Battery 1 State Of Charge
