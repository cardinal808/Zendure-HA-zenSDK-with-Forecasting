          - type: markdown
            content: >-
              <ha-alert alert-type="info">Help text</ha-alert>If you are not
              using a HomeWizard P1 but do have a home energy sensor where -watt
              indicates export and +watt indicates import per second, enter it
              here under **Home Energy Meter Sensor⚙️**. For example
              **sensor.my_own_energy_meter**.


              You can also set a custom battery order here under **Battery
              Order⚙️**. This allows you to define a different order of the
              batteries yourself. The correct order can be determined using
              **sensor.zendure_battery_serienumbers** and the sticker on the
              battery(ies). This ensures that the battery temperatures and
              charge percentages follow the correct order as they are physically
              stacked.
            text_only: true
            visibility:
              - condition: state
                entity: input_boolean.dashboard_setting_show_help
                state: 'on'
          - type: entities
            entities:
              - entity: input_text.home_energy_setting_meter_sensor
              - entity: input_text.zendure_setting_battery_order
                name: Battery Order
          - type: heading
            icon: ''
            heading: Gielz Configuration (Dynamic)
            heading_style: title
            badges: []
            visibility:
              - condition: state
                entity: input_boolean.dashboard_setting_show_dynamic
                state: 'on'
          - type: markdown
            content: >-
              <ha-alert alert-type="info">Help text</ha-alert>If you have a
              dynamic contract, you can enter this under **Dynamic Nordpool
              Sensor⚙️**. For example **sensor.nordpool_kwh_nl_eur_3_09_0** and
              this has te be from the Nordpool HACS integration.


              Specify the minimum spread required to make use of charging and
              discharging at low and high tariffs. If you have a 15-minute
              contract, enable this so that the graphs and prices are set
