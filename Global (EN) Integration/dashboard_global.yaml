                after: '13:30:00'
                before: '24:00:00'
          - type: entities
            entities:
              - entity: input_number.dynamic_lowest_price_x_period_tomorrow
                name: Lowest Price Periods Tomorrow
              - entity: input_number.dynamic_highest_price_x_period_tomorrow
                name: Highest Price Periods Tomorrow
              - entity: input_text.dynamic_manual_period_tomorrow
                name: Manual Periods Tomorrow
            visibility:
              - condition: time
                after: '13:30:00'
                before: '24:00:00'
        visibility:
          - condition: state
            entity: input_boolean.dashboard_setting_show_dynamic
            state: 'on'
      - type: grid
        cards:
          - type: heading
            icon: ''
            heading: Forecasting
            heading_style: title
            badges:
              - type: entity
                show_state: true
                show_icon: true
                entity: sensor.zendure_forecast_plan
