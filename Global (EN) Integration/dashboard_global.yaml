            visibility:
              - condition: state
                entity: input_boolean.dashboard_setting_show_help
                state: 'on'
              - condition: state
                entity: input_boolean.dashboard_setting_show_dynamic
                state: 'on'
            text_only: true
          - type: entities
            entities:
              - entity: input_text.dynamic_setting_nordpool_sensor
