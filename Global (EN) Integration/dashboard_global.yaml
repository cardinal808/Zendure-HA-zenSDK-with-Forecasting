                name: Export Correction
              - entity: input_number.dynamic_setting_minimal_spread
                name: Minimal Spread
              - entity: input_boolean.dynamic_setting_15_minute_interval
                name: 15 Minute Interval
            visibility:
              - condition: state
                entity: input_boolean.dashboard_setting_show_dynamic
                state: 'on'
      - type: grid
        cards:
          - type: heading
            icon: ''
            heading: Forecasting Configuration (Basic)
            heading_style: title
            badges:
              - type: button
                icon: mdi:restore-alert
                tap_action:
                  action: perform-action
                  perform_action: input_button.press
                  target:
                    entity_id: input_button.forecast_reset_usage_data
                  data: {}
                  confirmation:
                    title: Reset usage data?
                    text: >-
                      The learned usage profile (per hour and per quarter) and the
                      7-day history (solar production, grid, battery, average usage
                      and self-consumption) are cleared. The planner then first uses
                      start values and learns everything again. This cannot be undone.
                      The savings are kept.
                    confirm_text: Reset
                    dismiss_text: Cancel
                color: '#01a180'
                text: Reset usage data
            visibility:
              - condition: state
                entity: input_boolean.dashboard_setting_show_forecasting
                state: 'on'
          - type: markdown
            content: >-
              <ha-alert alert-type="info">Help text</ha-alert>For the mode
              **Dynamic Smart Matching + Forecasting**. Enter the entity_id of your
              solar forecast sensors (kWh, e.g. Forecast.Solar or Solcast) and of
              a total counter (kWh) of your solar panels. Solar self-consumption
              and daily usage are calculated automatically from day 1 from your own
              measurements and get more accurate every day (up to 7 days). The
              charge margin is an extra buffer as a percentage of the battery
              capacity. The kWh counters of your grid meter are detected automatically
              (SlimmeLezer, HomeWizard, DSMR integration). With another meter, e.g. a
              Shelly Pro 3EM, enter the grid import and export counter (several
              sensors separated by a comma, e.g. tariff 1 and 2). **Hold discharge in
              cheap dip**: the battery does not supply in cheap dips when grid
              charging is still needed. **Smart hold**: if the battery won't last until
              the sun or the next charge moment, it keeps its charge for the most
              expensive quarter hours (no extra loss; on by default).
              **Reliability per month**: a separate solar forecast correction per
              month; after a month ends the set fills in the measured value for
              next year. **Calibration after days**: the Zendure calibrates at 100%.
              From half this number of days the planner waits for a sunny day;
              after that it charges the battery full from the grid (cheapest
              quarter hours).
            text_only: true
            visibility:
              - condition: state
                entity: input_boolean.dashboard_setting_show_help
                state: 'on'
              - condition: state
                entity: input_boolean.dashboard_setting_show_forecasting
                state: 'on'
          - type: entities
            entities:
              - entity: input_text.forecast_setting_solar_remaining_today_sensor
                name: Solar remaining today sensor
              - entity: input_text.forecast_setting_solar_tomorrow_sensor
                name: Solar tomorrow sensor
              - entity: input_text.forecast_setting_solar_production_sensor
                name: Solar panels production sensor (total kWh)
              - entity: input_text.forecast_setting_grid_import_counter_sensor
                name: Grid import counter (kWh, empty = automatic)
              - entity: input_text.forecast_setting_grid_export_counter_sensor
                name: Grid export counter (kWh, empty = automatic)
              - entity: input_number.forecast_setting_charge_margin
                name: Battery charge margin %
              - entity: input_number.forecast_setting_solar_reliability
                name: Solar forecast reliability % (all months, 0 = 100%)
              - entity: input_boolean.forecast_setting_show_reliability_per_month
                name: Show reliability per month
              - type: conditional
                conditions:
                  - entity: input_boolean.forecast_setting_show_reliability_per_month
                    state: 'on'
                row:
                  entity: sensor.forecast_solar_month_measurement
                  name: Measured this month (actual solar / forecast)
              - type: conditional
                conditions:
                  - entity: input_boolean.forecast_setting_show_reliability_per_month
                    state: 'on'
                row:
                  entity: input_boolean.forecast_setting_reliability_no_auto_fill
                  name: Do not fill in the monthly value automatically
              - type: conditional
                conditions:
                  - entity: input_boolean.forecast_setting_show_reliability_per_month
                    state: 'on'
                row:
                  entity: input_number.forecast_setting_solar_reliability_jan
                  name: January % (0 = general value)
              - type: conditional
                conditions:
                  - entity: input_boolean.forecast_setting_show_reliability_per_month
                    state: 'on'
                row:
                  entity: input_number.forecast_setting_solar_reliability_feb
                  name: February % (0 = general value)
              - type: conditional
                conditions:
                  - entity: input_boolean.forecast_setting_show_reliability_per_month
                    state: 'on'
                row:
                  entity: input_number.forecast_setting_solar_reliability_mar
                  name: March % (0 = general value)
              - type: conditional
                conditions:
                  - entity: input_boolean.forecast_setting_show_reliability_per_month
                    state: 'on'
                row:
                  entity: input_number.forecast_setting_solar_reliability_apr
                  name: April % (0 = general value)
              - type: conditional
                conditions:
                  - entity: input_boolean.forecast_setting_show_reliability_per_month
                    state: 'on'
                row:
                  entity: input_number.forecast_setting_solar_reliability_may
                  name: May % (0 = general value)
              - type: conditional
                conditions:
                  - entity: input_boolean.forecast_setting_show_reliability_per_month
                    state: 'on'
                row:
                  entity: input_number.forecast_setting_solar_reliability_jun
                  name: June % (0 = general value)
              - type: conditional
                conditions:
                  - entity: input_boolean.forecast_setting_show_reliability_per_month
                    state: 'on'
                row:
                  entity: input_number.forecast_setting_solar_reliability_jul
                  name: July % (0 = general value)
              - type: conditional
                conditions:
                  - entity: input_boolean.forecast_setting_show_reliability_per_month
                    state: 'on'
                row:
                  entity: input_number.forecast_setting_solar_reliability_aug
                  name: August % (0 = general value)
              - type: conditional
                conditions:
                  - entity: input_boolean.forecast_setting_show_reliability_per_month
                    state: 'on'
                row:
                  entity: input_number.forecast_setting_solar_reliability_sep
                  name: September % (0 = general value)
              - type: conditional
                conditions:
                  - entity: input_boolean.forecast_setting_show_reliability_per_month
                    state: 'on'
                row:
                  entity: input_number.forecast_setting_solar_reliability_oct
                  name: October % (0 = general value)
              - type: conditional
                conditions:
                  - entity: input_boolean.forecast_setting_show_reliability_per_month
                    state: 'on'
                row:
                  entity: input_number.forecast_setting_solar_reliability_nov
                  name: November % (0 = general value)
              - type: conditional
                conditions:
                  - entity: input_boolean.forecast_setting_show_reliability_per_month
                    state: 'on'
                row:
                  entity: input_number.forecast_setting_solar_reliability_dec
                  name: December % (0 = general value)
              - entity: input_boolean.forecast_setting_hold_discharge_in_dip
                name: Hold discharge in cheap dip (save the battery)
              - entity: input_boolean.forecast_setting_smart_hold
                name: Smart hold (keep the charge for the most expensive quarter hours)
              - entity: input_number.forecast_setting_calibration_days
                name: Calibration after days (0 = 14)
              - entity: input_boolean.forecast_setting_calibration_off
                name: Calibration charging off
            visibility:
              - condition: state
                entity: input_boolean.dashboard_setting_show_forecasting
                state: 'on'
          - type: heading
            icon: ''
            heading: Forecasting Configuration (Negative Price)
            heading_style: title
            visibility:
              - condition: state
                entity: input_boolean.negative_price_block_export
                state_not: unavailable
              - condition: state
                entity: input_boolean.dashboard_setting_show_pv
                state: 'on'
          - type: heading
            icon: ''
            heading: Feed-in price now
            heading_style: subtitle
            badges:
              - type: entity
                show_state: true
                show_icon: true
                entity: sensor.zendure_feedin_price_now
                name: Feed-in
                state_content: state
                color: '#01a180'
                tap_action:
                  action: more-info
              - type: entity
                show_state: false
                show_icon: true
                entity: binary_sensor.zendure_export_blocked_negative_price
                name: Export blocked
                state_content: name
                color: '#c53b2c'
                visibility:
                  - condition: state
                    entity: binary_sensor.zendure_export_blocked_negative_price
                    state: 'on'
            visibility:
              - condition: state
                entity: input_boolean.negative_price_block_export
                state_not: unavailable
              - condition: state
                entity: input_boolean.dashboard_setting_show_pv
                state: 'on'
          - type: markdown
            content: >-
              <ha-alert alert-type="info">Help text</ha-alert>When the feed-in
              price is negative, the installation does not export. Feed-in
              price = market price + bonus % (only when the market price is
              positive) + feed-in markup, using the fields under **Feed-in
              price** below (also used by the savings). Enter a sensor with the
              bare market price at **Market price sensor** (with the Nordpool
              package that happens automatically:
              sensor.nordpool_kwh_nl_eur_5_10_021). Empty = Gielz' Nordpool
              sensor, which is wrong if it is all-in.


              **Zendure Pro** (only shown for a Zendure with solar inputs: Pro, Plus or Hyper): when **Disable PV export at negative prices** is on, PV
              Export Disabled is turned on automatically and back off
              afterwards. It turns on by itself when you switch on No export.
              Turn it off if your Zendure has no solar panels or if you only
              want to limit external inverters. Charging from solar and discharging to the
              house keep working.


              **External inverter (optional):** choose the **limit type** and
              fill in the limiter entity.

              - *Production limit* (SolarEdge, OpenDTU/Hoymiles, APsystems,
              Fronius Modbus): a number.* such as
              number.solaredge_modbus_active_power_limit. The module regulates
              on the grid meter, so the inverter keeps powering the house but
              does not export. Also fill in the **power sensor** (W, preferably
              AC, e.g. sensor.solaredge_modbus_ac_power); without a sensor it
              regulates in steps of 5%.

              - *Export limit* (GoodWe, Growatt): a number.* with the export
              limit. It goes to 0; the inverter regulates on its own meter.

              - A **switch.*** (e.g. Enphase Production) is turned off and back
              on afterwards. A **script.*** (e.g. for Huawei or Sofar) is
              started with the variable block: true or false; an example is at
              the top of zendure_negative_price_global.yaml.


              The production limit only throttles when the Zendure cannot absorb
              the surplus (battery full or charging at maximum power) and leaves
              a small export (25 W, while charging 50 W below the charge buffer)
              to prevent oscillating around 0 W. The other types only act when
              the battery is full and only release when the price is positive
              again. Afterwards everything is restored as it was.


              **Two inverters:** choose the inverter with a production limit
              (e.g. SolarEdge) as **primary**; it regulates on the grid meter.
              The **secondary** goes fully to 0 (number to 0, switch off or
              script with block: true) as soon as the Zendure cannot absorb the
              surplus, and is restored when the price is positive again. Not
              using the secondary's solar costs nothing: with a negative price,
              power from the grid is free or even pays.


              **Pre-discharge** (mode Dynamic Smart Matching + Forecasting, needs a
              detailed solar forecast): if a window with a negative feed-in price and
              expected solar surplus is coming, the planner makes sure the battery is
              empty enough at its start for 75% of that surplus, or for 100% if you filled in a solar forecast reliability (per month or general), since that is already in the forecast. For this it discharges
              (only for the house) in the most expensive quarter hours before it, also when
              the battery would otherwise wait, and only charges from the grid until the
              window if that fits within the room. Plan for today shows what it does.
            text_only: true
            visibility:
              - condition: state
                entity: input_boolean.negative_price_block_export
                state_not: unavailable
              - condition: state
                entity: input_boolean.dashboard_setting_show_help
                state: 'on'
              - condition: state
                entity: input_boolean.dashboard_setting_show_pv
                state: 'on'
          - type: markdown
            content: >-
              <ha-alert alert-type="warning">Feed-in markup is set to {{ states('input_number.savings_setting_dynamic_feedin_markup') | float(0) | round(3) }} €/kWh. That is unusually large (usually between −0.05 and 0). With a large negative markup the feed-in price is almost always negative and export is blocked all the time. Did you mean e.g. −0.01?</ha-alert>
            text_only: true
            visibility:
              - condition: or
                conditions:
                  - condition: numeric_state
                    entity: input_number.savings_setting_dynamic_feedin_markup
                    below: -0.1
                  - condition: numeric_state
                    entity: input_number.savings_setting_dynamic_feedin_markup
                    above: 0.1
              - condition: state
                entity: input_boolean.dashboard_setting_show_pv
                state: 'on'
          - type: entities
            entities:
              - entity: input_boolean.negative_price_block_export
                name: No export at negative price
              - type: conditional
                conditions:
                  - entity: binary_sensor.zendure_has_pv_inputs
                    state_not: 'off'
                row:
                  type: section
                  label: Zendure Pro (PV inputs)
              - type: conditional
                conditions:
                  - entity: binary_sensor.zendure_has_pv_inputs
                    state_not: 'off'
                row:
                  entity: input_boolean.negative_price_zendure_pv_export
                  name: Disable PV export at negative prices
              - type: section
                label: Discharge battery ahead of negative prices
              - entity: input_boolean.negative_price_pre_discharge
                name: Pre-discharge
              - type: section
                label: Feed-in price
              - entity: input_text.dynamic_setting_market_price_sensor
                name: Market price sensor (bare market price incl. VAT)
              - entity: input_number.savings_setting_dynamic_feedin_markup
                name: Feed-in markup (incl. VAT)
              - entity: input_number.savings_setting_dynamic_feedin_bonus
                name: Feed-in bonus % (of market price)
              - type: section
                label: External inverter (optional) managed at negative prices
              - entity: input_select.negative_price_inverter_count
                name: Number of external inverters
              - type: conditional
                conditions:
                  - entity: input_select.negative_price_inverter_count
                    state: '2'
                row:
                  type: section
                  label: Primary inverter (regulates on grid meter)
              - type: conditional
                conditions:
                  - entity: input_select.negative_price_inverter_count
                    state_not: '0'
                row:
                  entity: input_select.negative_price_inverter_type
                  name: Limit type
              - type: conditional
                conditions:
                  - entity: input_select.negative_price_inverter_count
                    state_not: '0'
                row:
                  entity: input_text.negative_price_inverter_limiter
                  name: Inverter limiter entity (number.*, switch.* or script.*)
              - type: conditional
                conditions:
                  - entity: input_select.negative_price_inverter_count
                    state_not: '0'
                  - entity: input_select.negative_price_inverter_type
                    state: Production limit (SolarEdge, Hoymiles, APsystems, Fronius)
                row:
                  entity: input_text.negative_price_inverter_power_sensor
                  name: External inverter power sensor (W)
              - type: conditional
                conditions:
                  - entity: input_select.negative_price_inverter_count
                    state: '2'
                row:
                  type: section
                  label: Secondary inverter (turns off)
              - type: conditional
                conditions:
                  - entity: input_select.negative_price_inverter_count
                    state: '2'
                row:
                  entity: input_text.negative_price_inverter_limiter_secondary
                  name: Inverter limiter entity (number.*, switch.* or script.*)
            visibility:
              - condition: state
                entity: input_boolean.negative_price_block_export
                state_not: unavailable
              - condition: state
                entity: input_boolean.dashboard_setting_show_pv
                state: 'on'
          - type: heading
            icon: ''
            heading: Forecasting Configuration (Nordpool)
            heading_style: title
            visibility:
              - condition: state
                entity: input_number.nordpool_setting_energy_tax
                state_not: unavailable
          - type: markdown
            content: >-
              <ha-alert alert-type="info">Help text</ha-alert>Amounts
              **excluding VAT**; the sensor adds the VAT. All-in price (supply)
              = (market price + energy tax + markup) × (1 + VAT): enter that
              sensor in Gielz Configuration (Dynamic) and set Dynamic supply
              markup to 0. Bare market price incl. VAT (export):
              sensor.nordpool_kwh_nl_eur_5_10_021, filled in automatically at
              Market price sensor in Forecasting Configuration (Negative Price)
              when that field is empty.
            text_only: true
            visibility:
              - condition: state
                entity: input_number.nordpool_setting_energy_tax
                state_not: unavailable
              - condition: state
                entity: input_boolean.dashboard_setting_show_help
                state: 'on'
          - type: entities
            entities:
              - entity: input_number.nordpool_setting_energy_tax
                name: Energy tax (excl. VAT)
              - entity: input_number.nordpool_setting_supplier_markup
                name: Supplier markup (excl. VAT)
              - entity: input_number.nordpool_setting_vat_percentage
                name: VAT %
              - type: section
                label: Sensors
              - entity: sensor.nordpool_kwh_nl_eur_5_09_0
                name: All-in price (supply)
              - entity: sensor.nordpool_kwh_nl_eur_5_10_021
                name: Market price incl. VAT (export)
              - entity: sensor.zendure_feedin_price_now
                name: Feed-in price now (with markup and bonus)
            visibility:
              - condition: state
                entity: input_number.nordpool_setting_energy_tax
                state_not: unavailable
          - type: heading
            icon: ''
            heading: Forecasting Configuration (Savings)
            heading_style: title
            visibility:
              - condition: state
                entity: input_number.savings_setting_fixed_supply_price
                state_not: unavailable
              - condition: state
                entity: input_boolean.dashboard_setting_show_forecasting
                state: 'on'
          - type: markdown
            content: >-
              <ha-alert alert-type="info">Help text</ha-alert>Enter the
              all-in prices per kWh (including energy tax and VAT).
              **Fixed contract supply tariff** and **feed-in tariff**: what you
              would pay and receive with a fixed or variable contract, only for
              the comparison; with full net metering the feed-in price equals
              the supply price. For dynamic, the price from the Nordpool
              sensor is used plus the **supply markup**: if your sensor is
              already all-in, leave it at 0 (with the Nordpool package the field
              is hidden, because that sensor is all-in). The feed-in price
              (market price sensor, feed-in markup and bonus) is set in
              Forecasting Configuration (Negative Price). The button only
              restarts the total.


              **Battery purchase price**: what the battery (with inverter and
              installation) cost. **Battery already earned back**: what the
              battery earned before this measurement started (optional). The
              payback time uses everything the battery yields with a dynamic
              contract: stored solar energy plus smart charging.
            text_only: true
            visibility:
              - condition: state
                entity: input_number.savings_setting_fixed_supply_price
                state_not: unavailable
              - condition: state
                entity: input_boolean.dashboard_setting_show_help
                state: 'on'
              - condition: state
                entity: input_boolean.dashboard_setting_show_forecasting
                state: 'on'
          - type: entities
            entities:
              - entity: input_number.savings_setting_fixed_supply_price
                name: Fixed contract supply tariff
              - entity: input_number.savings_setting_fixed_feedin_price
                name: Fixed contract feed-in tariff
              - type: conditional
                conditions:
                  - entity: input_number.nordpool_setting_energy_tax
                    state: unavailable
                row:
                  entity: input_number.savings_setting_dynamic_supply_markup
                  name: Dynamic supply markup
              - entity: input_number.savings_setting_battery_purchase_price
                name: Battery purchase price
              - entity: input_number.savings_setting_battery_already_earned
                name: Battery already earned back (before measuring)
              - entity: input_button.savings_total_reset
                name: Restart total
            visibility:
              - condition: state
                entity: input_number.savings_setting_fixed_supply_price
                state_not: unavailable
              - condition: state
                entity: input_boolean.dashboard_setting_show_forecasting
                state: 'on'
          - type: heading
            icon: ''
            heading_style: title
            heading: Forecasting Configuration (EV)
            badges:
              - type: entity
                show_state: true
                show_icon: true
                entity: sensor.ev_charge_plan
                name: Plan
                state_content:
                  - name
                  - state
                color: '#01a180'
                tap_action:
                  action: more-info
              - type: entity
                show_state: true
                show_icon: true
                entity: sensor.ev_charging_power
                name: Car
                state_content:
                  - name
                  - state
                color: '#01a180'
                tap_action:
                  action: more-info
                visibility:
                  - condition: numeric_state
                    entity: sensor.ev_charging_power
                    above: 0
            visibility:
              - condition: state
                entity: input_select.ev_charge_moment
                state_not: unavailable
          - type: markdown
            content: >-
              <ha-alert alert-type="info">Help text</ha-alert>For a charger
              without its own control (granny charger, or a wallbox behind a
              smart switch). Enter the charger's **power sensor** (W or kW, e.g.
              from a Shelly 1PM in the charger's circuit). From then on the
              battery no longer discharges into the car: the Smart Matching
              modes subtract the car's charging power from the grid meter. The
              car's charging also no longer counts in the planner's usage
              profile and daily usage.


              **Charging session** (only with a configured **switch**): choose
              the **charge moment** and the **required energy** (kWh at the
              socket). *Night* charges in the cheapest price slots until **Ready
              by** (00:00 = 07:00). *Daytime* charges while the sun is up; the
              planner subtracts those kWh from the solar surplus for the battery
              and charges the shortfall from the grid at the cheapest moment.
              Once the energy is charged or the time has passed, the charge
              moment returns to Off and the charger is switched on again. Note:
              not every car resumes charging by itself when power returns.
            text_only: true
            visibility:
              - condition: state
                entity: input_boolean.dashboard_setting_show_help
                state: 'on'
              - condition: state
                entity: input_select.ev_charge_moment
                state_not: unavailable
          - type: entities
            entities:
              - entity: input_select.ev_charge_moment
                name: Charge moment
              - entity: input_number.ev_required_energy
                name: Required energy (kWh at the socket)
              - type: conditional
                conditions:
                  - entity: input_select.ev_charge_moment
                    state: Night (cheapest hours)
                row:
                  entity: input_datetime.ev_ready_by
                  name: Ready by (00:00 = 07:00)
              - type: section
                label: Charger
              - entity: input_text.ev_power_sensor
                name: Charger power sensor (W or kW)
              - entity: input_text.ev_charger_switch
                name: Charger switch (optional, e.g. switch.shelly_charger)
              - entity: input_number.ev_charger_power
                name: Charging power kW (0 = 2.3 kW)
              - entity: input_number.ev_threshold_power
                name: Threshold W (0 = 300 W)
            visibility:
              - condition: state
                entity: input_select.ev_charge_moment
                state_not: unavailable
          - type: markdown
            text_only: true
            content: |-
              {%- set p = 'sensor.ev_charge_plan' -%}
              {%- set c = states('sensor.ev_discharge_correction') | float(0) -%}
              {% if not is_state('input_select.ev_charge_moment', 'Off') %}**Charging session:** {{ states(p) }} · charged {{ '%.1f' | format(state_attr(p, 'charged_kwh') | float(0)) }} of {{ states('input_number.ev_required_energy') | float(0) | round(0) | int }} kWh{% if state_attr(p, 'end') %} · until {{ (state_attr(p, 'end') or '')[11:] }}{% endif %}
              {% for b in state_attr(p, 'charge_blocks') or [] %}
              - Charge {{ b.day }} {{ b.start }}–{{ b.end }}: about {{ '%.1f' | format(b.kwh) }} kWh, average €{{ '%.3f' | format(b.price) }}
              {%- endfor %}
              {% if is_state('input_select.ev_charge_moment', 'Night (cheapest hours)') and not state_attr(p, 'tomorrow_prices_known') %}
              <small>Tomorrow's prices not known yet: planned with today's pattern, replanned around 14:00.</small>
              {% endif %}{% if states('input_text.ev_charger_switch') | trim == '' %}
              <ha-alert alert-type="warning">No switch configured: the charger is not switched on and off, only the plan is calculated.</ha-alert>
              {% endif %}{% else %}No charging session. Choose a charge moment to charge the car on a plan.{% endif %}
              {% if c > 0 %}
              The car is charging at {{ c | round(0) | int }} W: the battery does not discharge into it.{% endif %}
            visibility:
              - condition: state
                entity: input_select.ev_charge_moment
                state_not: unavailable
          - type: heading
            icon: ''
            heading_style: title
            heading: Forecasting Configuration (HVAC)
            visibility:
              - condition: state
                entity: input_text.hvac_sensor
                state_not: unavailable
          - type: markdown
            content: >-
              <ha-alert alert-type="info">Help text</ha-alert>While the AC
              runs, it may not run from the battery (charging from solar or
              grid keeps working). Enter your AC entity (e.g.
              climate.living_room; a power sensor in W also works). With a
              climate entity you see the mode and choose per mode whether the
              AC may still run from the battery, e.g. **Cooling** on (summer,
              plenty of sun) and **Heating** off (winter, no sun). When the
              AC has reached its temperature (standby), the battery
              discharges as usual. With a power sensor or switch the mode is
              unknown and it always applies. Leave the sensor empty to switch
              the feature off.


              **Approach:** *No discharging* stops discharging completely while
              the AC may not run from the battery. *AC not from battery*
              subtracts the AC power from the grid meter (as for the car): the
              battery keeps supplying the rest of the house. That needs a power
              measurement (**Power sensor**, W or kW, e.g. a Shelly; empty =
              the HVAC sensor if that is a power sensor). A kWh counter of the
              AC works too (use the total counter, not the per-cycle one): the
              power is then calculated from the counter's steps and lags a few
              minutes. With a power
              measurement the AC usage during that time also does not count in
              the usage profile and the daily usage, so the planner does not
              count on power the battery will not supply anyway.
            text_only: true
            visibility:
              - condition: state
                entity: input_boolean.dashboard_setting_show_help
                state: 'on'
              - condition: state
                entity: input_text.hvac_sensor
                state_not: unavailable
          - type: entities
            entities:
              - entity: input_text.hvac_sensor
                name: HVAC sensor (e.g. climate.living_room)
              - entity: input_number.hvac_threshold_power
                name: Threshold power W (power sensor only, 0 = 50 W)
              - entity: input_text.hvac_power_sensor
                name: Power sensor (W/kW or kWh counter, empty = HVAC sensor)
              - entity: input_select.hvac_approach
                name: Approach when the AC may not run from the battery
              - type: section
                label: Allow the AC from the battery when
              - entity: input_boolean.hvac_allow_discharge_when_heating
                name: Heating
              - entity: input_boolean.hvac_allow_discharge_when_cooling
                name: Cooling
              - entity: input_boolean.hvac_allow_discharge_when_drying
                name: Drying
              - entity: input_boolean.hvac_allow_discharge_when_fan
                name: Fan
              - entity: input_boolean.hvac_allow_discharge_when_auto
                name: Auto
              - entity: input_boolean.hvac_allow_discharge_in_expensive_hour
                name: Expensive hour (in any mode)
              - type: section
                label: Status
              - entity: sensor.hvac_mode
                name: AC mode
              - entity: binary_sensor.hvac_active
                name: AC active
              - entity: sensor.hvac_power
                name: AC power
              - entity: binary_sensor.hvac_not_from_battery
                name: AC not from battery
              - entity: sensor.hvac_discharge_correction
                name: Subtracted from grid meter
              - entity: binary_sensor.hvac_discharge_blocked
                name: Discharge blocked
              - entity: sensor.hvac_separate_7_days
                name: Counted separately (7 days)
              - type: attribute
                entity: binary_sensor.hvac_discharge_blocked
                attribute: reason
                name: Reason
                icon: mdi:information-outline
            visibility:
              - condition: state
                entity: input_text.hvac_sensor
                state_not: unavailable
      - type: grid
        cards:
          - type: heading
            icon: ''
            heading_style: title
            heading: Configuration (Dashboard)
          - type: markdown
            content: >-
              <ha-alert alert-type="info">Help text</ha-alert>Here you can set
              whether you want to hide or show the dynamic information on the
              first tab via **Show Dynamic On Dashboard⚙️**. Use **Show Forecasting On Dashboard** to show or hide the Forecasting section and the Forecasting settings.
            text_only: true
            visibility:
              - condition: state
                entity: input_boolean.dashboard_setting_show_help
                state: 'on'
          - type: entities
            entities:
              - entity: input_boolean.dashboard_setting_show_help
              - entity: input_boolean.dashboard_setting_show_pv
              - entity: input_boolean.dashboard_setting_show_dynamic
              - entity: input_boolean.dashboard_setting_show_forecasting
                name: Show Forecasting On Dashboard
          - type: heading
            heading: Logbook (last 4 hours)
            heading_style: title
            badges:
              - type: button
                icon: mdi:information
                tap_action:
                  action: navigate
                  navigation_path: /logbook
                color: '#01a180'
                text: More
          - type: logbook
            target:
              entity_id:
                - input_select.zendure_operation_mode
            grid_options:
              columns: 12
              rows: 12
            hours_to_show: 4
          - type: heading
            icon: ''
            heading: Diagnostics export
            heading_style: title
            visibility:
              - condition: state
                entity: script.zendure_diagnostics_export
                state_not: unavailable
          - type: markdown
            content: >-
              <ha-alert alert-type="info">Help text</ha-alert>**Download export**
              saves one file on your own device with your settings, the state of
              all sensors, the planner details and the logs of the last 24 hours.
              Attach it to your question or GitHub issue. IP addresses and serial
              numbers are left out. Nothing is stored in Home Assistant.


              The button needs [button-card](https://github.com/custom-cards/button-card)
              (HACS). Without button-card, or if downloading does not work in the
              app: Developer tools → Actions → *Zendure Diagnostics Export* →
              Perform action, and copy the response.


              Decisions, snapshots and errors are collected from the moment this
              package is loaded.
            text_only: true
            visibility:
              - condition: state
                entity: input_boolean.dashboard_setting_show_help
                state: 'on'
              - condition: state
                entity: script.zendure_diagnostics_export
                state_not: unavailable
          - type: custom:button-card
            name: Download export
            icon: mdi:download
            layout: icon_name
            show_state: false
            tap_action:
              action: javascript
              javascript: |
                [[[
                  (async () => {
                    try {
                      const r = await hass.callWS({
                        type: 'call_service', domain: 'script', service: 'zendure_diagnostics_export',
                        service_data: {}, return_response: true });
                      const d = r.response;
                      const blob = new Blob([JSON.stringify(d.export, null, 2)],
                        { type: 'application/json' });
                      const url = URL.createObjectURL(blob);
                      const a = document.createElement('a');
                      a.href = url;
                      a.download = d.file;
                      document.body.appendChild(a);
                      a.click();
                      a.remove();
                      setTimeout(() => URL.revokeObjectURL(url), 30000);
                    } catch (e) {
                      hass.callService('persistent_notification', 'create', {
                        notification_id: 'zendure_diagnostics_export',
                        title: 'Zendure diagnostics export failed',
                        message: 'Download failed. Use Developer tools > Actions > Zendure Diagnostics Export and copy the response. (' + (e && e.message ? e.message : e) + ')' });
                    }
                  })();
                ]]]
            styles:
              card:
                - height: 56px
                - padding: 0 16px
              grid:
                - grid-template-columns: 40px 1fr
              name:
                - justify-self: start
                - font-size: 14px
              icon:
                - width: 24px
                - color: var(--primary-color)
            visibility:
              - condition: state
                entity: script.zendure_diagnostics_export
                state_not: unavailable
          - type: entities
            entities:
              - entity: sensor.zendure_diagnostics_decisions
                name: Decisions (last 50)
              - entity: sensor.zendure_diagnostics_snapshots
                name: Snapshots (last 24 hours)
              - entity: sensor.zendure_diagnostics_errors
                name: Errors (last 20)
            visibility:
              - condition: state
                entity: script.zendure_diagnostics_export
                state_not: unavailable
          - type: heading
            icon: ''
            heading: Optional packages
            heading_style: title
          - type: markdown
            text_only: true
            content: |-
              {%- set p = [
                ['Savings', 'sensor.zendure_savings', 'zendure_savings_global.yaml', 'Savings tab: what solar, the battery and a dynamic contract earn, payback time.'],
                ['EV', 'sensor.ev_charge_plan', 'zendure_ev_global.yaml', 'Charge the car without the battery discharging into it, night or daytime session.'],
                ['HVAC', 'binary_sensor.hvac_active', 'zendure_hvac_global.yaml', 'AC not from the battery, per AC mode: no discharging or subtract the AC power.'],
                ['Diagnostics export', 'script.zendure_diagnostics_export', 'zendure_export_global.yaml', 'Export settings, sensors and logs for a question or issue.'],
                ['Nordpool', 'input_number.nordpool_setting_energy_tax', 'zendure_nordpool_global.yaml', 'Nord Pool sensors: all-in price for supply and bare market price for export.']
              ] -%}
              | | Package | What it does |
              |:-:|:--|:--|
              {%- for x in p %}
              | {{ '✅' if expand(x[1]) | count > 0 else '➖' }} | **{{ x[0] }}**<br>`{{ x[2] }}` | {{ x[3] }} |
              {%- endfor %}

              ✅ loaded · ➖ not installed. To add one: copy the file from the optional packages folder on GitHub to your packages folder and restart Home Assistant. [Packages explained](https://github.com/cardinal808/Zendure-HA-zenSDK-with-Forecasting/blob/main/README.md#packages)
          - type: heading
            icon: ''
            heading: Version
            heading_style: title
            badges:
              - type: button
                icon: mdi:information
                text: Show Latest Release Notes
                color: '#01a180'
                tap_action:
                  action: navigate
                  navigation_path: releasenotes
            visibility:
              - condition: state
                entity: sensor.github_zendure_gielz1986_releasecheck
                state_not: Pre-release Active
          - type: heading
            icon: ''
            heading: Version
            heading_style: title
            badges:
              - type: button
                icon: mdi:information
                text: Show pre-releasenotes
                color: '#01a180'
                tap_action:
                  action: url
                  url_path: https://github.com/Gielz1986/Zendure-HA-zenSDK/pulls
            visibility:
              - condition: state
                entity: sensor.github_zendure_gielz1986_releasecheck
                state: Pre-release Active
          - type: markdown
            content: >-
              <ha-alert alert-type="info">Help text</ha-alert>Here you can see
              which package version you are using and what the latest version is
              on GitHub. You can also immediately see how many issues are open
              and go directly to GitHub from here.
            text_only: true
            visibility:
              - condition: state
                entity: input_boolean.dashboard_setting_show_help
                state: 'on'
          - type: entities
            entities:
              - entity: sensor.zendure_configuration_version
                name: Installed Version
              - entity: sensor.github_zendure_gielz1986
                name: Available Version
              - entity: sensor.github_zendure_gielz1986_releasecheck
                name: Release Check
              - type: section
                label: Forecasting
              - entity: sensor.forecasting_version
                name: Installed Version
              - entity: sensor.github_zendure_forecasting
                name: Available Version
              - entity: sensor.forecasting_release_check
                name: Release Check
          - type: markdown
            content: >
              &nbsp;&nbsp;[![Open
              Issues](https://img.shields.io/github/issues/Gielz1986/Zendure-HA-zenSDK?style=for-the-badge&label=Open%20Issues&labelColor=029c7b&color=0d2e2b)](https://github.com/Gielz1986/Zendure-HA-zenSDK/issues)
            grid_options:
              columns: 12
              rows: auto
            text_only: true
    cards: []
    dense_section_placement: false
  - type: sections
    max_columns: 2
    subview: true
    path: releasenotes
    title: Releasenotes
    icon: mdi:github
    sections:
      - type: grid
        cards:
          - type: markdown
            content: >
              &nbsp;&nbsp;[![Laatste
              release](https://img.shields.io/github/v/release/Gielz1986/Zendure-HA-zenSDK?style=for-the-badge&label=Download&color=01a180&logo=github)](https://github.com/Gielz1986/Zendure-HA-zenSDK/releases/latest)


              {{ state_attr('sensor.github_zendure_gielz1986', 'body')}}
            grid_options:
              columns: 24
              rows: auto
            text_only: true
          - type: markdown
            content: >
              &nbsp;&nbsp;[![Forecasting
              release](https://img.shields.io/github/v/release/cardinal808/Zendure-HA-zenSDK-with-Forecasting?style=for-the-badge&label=Forecasting&color=01a180&logo=github)](https://github.com/cardinal808/Zendure-HA-zenSDK-with-Forecasting/releases/latest)


              {{ state_attr('sensor.github_zendure_forecasting', 'body') }}
            grid_options:
              columns: 24
              rows: auto
            text_only: true
        column_span: 2
    cards: []
