          - type: markdown
            content: |-
              {% set p = 'sensor.zendure_forecast_plan' %}{% set a = states[p].attributes %}{% if states('input_select.zendure_operation_mode') != 'Dynamic Smart Matching + Forecasting' %}<ha-alert alert-type="info">Mode **Dynamic Smart Matching + Forecasting** is not active. The plan below is a simulation.</ha-alert>{% endif %}{% if a.solar_remaining_today_sensor_ok == false or a.solar_tomorrow_sensor_ok == false %}<ha-alert alert-type="warning">A solar forecast sensor is not filled in or not available. That solar is counted as 0 kWh (more grid charging will be planned).</ha-alert>{% endif %}{% set ns = namespace(l=[]) %}{% for e in (states('input_text.forecast_setting_solar_production_sensor') | lower | replace(' ', '')).split(',') | reject('eq', '') %}{% if e not in ['unknown', 'unavailable'] and (not e is match('^sensor\\.[a-z0-9_]+$') or (states(e) == 'unknown' and state_attr(e, 'friendly_name') is none)) %}{% set ns.l = ns.l + ['Solar panels production sensor (' ~ e ~ ')'] %}{% endif %}{% endfor %}{% for e in (states('input_text.forecast_setting_grid_import_counter_sensor') | lower | replace(' ', '')).split(',') | reject('eq', '') %}{% if e not in ['unknown', 'unavailable'] and (not e is match('^sensor\\.[a-z0-9_]+$') or (states(e) == 'unknown' and state_attr(e, 'friendly_name') is none)) %}{% set ns.l = ns.l + ['Grid import counter (' ~ e ~ ')'] %}{% endif %}{% endfor %}{% for e in (states('input_text.forecast_setting_grid_export_counter_sensor') | lower | replace(' ', '')).split(',') | reject('eq', '') %}{% if e not in ['unknown', 'unavailable'] and (not e is match('^sensor\\.[a-z0-9_]+$') or (states(e) == 'unknown' and state_attr(e, 'friendly_name') is none)) %}{% set ns.l = ns.l + ['Grid export counter (' ~ e ~ ')'] %}{% endif %}{% endfor %}{% if ns.l | length > 0 %}<ha-alert alert-type="warning">Filled-in field does not point to an existing sensor: {{ ns.l | join(', ') }}. Check the entity ID (Settings → Entities). Without a valid solar panel counter the usage profile learns without solar production.</ha-alert>{% endif %}
              **Status:** {{ states(p) }}

              **Scenario:** {{ a.scenario }}

              **Plan:** {{ a.plan_explanation }}
              {% set ks = a.calibration_status %}{% if ks %}

              **Calibration:** {{ a.calibration_days }} days ago (threshold {{ a.calibration_threshold }}). {% if ks == 'max_too_low' %}Max. State Of Charge is set to {{ states('sensor.zendure_maximum_state_of_charge') }}%: the Zendure only calibrates at 100%.{% elif ks == 'sun_today' %}The sun fills the battery today; it then calibrates by itself.{% elif ks == 'sun_tomorrow' %}Waiting for sun: enough sun is expected tomorrow to fill the battery. Otherwise it charges full from the grid from day {{ a.calibration_threshold }}.{% elif ks == 'waiting' %}Waiting for a sunny day; otherwise it charges full from the grid from day {{ a.calibration_threshold }}.{% elif ks == 'charge' %}The battery is charged to 100% from the grid in the cheapest quarter hours (about {{ '%.1f' | format(a.calibration_extra_kwh | float(0)) }} kWh).{% else %}The battery is (almost) full; the Zendure calibrates as soon as it reaches 100%.{% endif %}{% endif %}

              ### Today

              - Battery now: **{{ a.battery_now_kwh }}** of {{ a.battery_max_kwh }} kWh usable
              {% set td = now().strftime('%Y-%m-%d') %}- Today's plan runs until **{{ ('tomorrow ' if (a.bridge_until or '')[:10] != td else '') ~ (a.bridge_until or '')[11:] }}** ({{ a.bridge_hours }} hours), the start of tomorrow's cheap hours; after that it plans again with tomorrow's prices
              {% set lb = a.charge_blocks | default([]) %}- Expected usage until end of bridge (after direct solar): **{{ '%.1f' | format(a.expected_battery_usage_kwh | float(0)) }} kWh**, covered by the battery{% if lb | length > 0 %} and the planned charging{% endif %}{% if a.pathcheck_dip_hold %} (outside the cheap dips){% endif %}, the rest directly from the grid
              - Expected solar to battery: **{{ a.expected_solar_to_battery_kwh }} kWh** (solar still expected: {{ a.solar_remaining_today_kwh }} kWh, {{ a.self_consumption_pct }}% used directly){% if a.get('ev_daytime_from_solar_kwh', 0) | float(0) > 0 %}; the car still charges {{ '%.1f' | format(a.get('ev_daytime_from_solar_kwh', 0) | float(0)) }} kWh during the day, which comes off the solar surplus first{% endif %}
              - Price now: €{{ '%.3f' | format(a.price_now | float(0)) }}{% if a.smart_hold %}: the battery is saved for the most expensive quarters (€{{ '%.3f' | format(a.hold_threshold_price | float(0)) }} and up), because it does not last until the end of the bridge; until then the house buys directly{% elif a.between_charge_hold %}: the battery holds until the next charge slot, because what it supplies now would have to be charged back there with loss; buying directly is cheaper now{% elif a.in_dip %}, cheap dip{% if a.hold_discharge %}: the battery is being saved and the house buys directly from the grid, because that is cheaper than power from the battery{% endif %}{% endif %}
              {% set lb = a.charge_blocks | default([]) %}- **Charge from the grid: {% if lb | length > 0 %}{{ '%.1f' | format(a.planned_grid_charge_kwh | float(0)) }} kWh planned at {{ a.charge_power_used_kw }} kW, estimated cost €{{ '%.2f' | format(a.estimated_cost) }}**{% else %}nothing planned**{% endif %}{% set rest = (a.grid_charge_today_kwh | float(0)) - (a.planned_grid_charge_kwh | float(0)) %}{% if rest >= 0.3 %} (energy balance {{ '%.1f' | format(a.grid_charge_today_kwh | float(0)) }} kWh; the rest is not stored, because buying directly from the grid is then cheaper after charge and discharge losses){% endif %}
              {% if a.pathcheck_gap_hours | float(0) > 0 %}{% set td = now().strftime('%Y-%m-%d') %}{% set empty = a.pathcheck_battery_empty_at or '' %}{% set gend = a.pathcheck_gap_end or '' %}- **Shortfall until the sun:** without topping up, the battery is empty {{ 'today' if empty[:10] == td else 'tomorrow' }} around **{{ empty[11:] }}**{% if a.pathcheck_dip_hold %} (the battery does not supply in cheap dips){% endif %}. Until {{ ('tomorrow ' if gend[:10] != td else '') ~ gend[11:] }} ({% if a.pathcheck_over_day %}over the day, solar counts{% elif a.pathcheck_beyond_night %}until the sun covers usage tomorrow{% elif (a.pathcheck_solar_source or '') is search('no longer|None') %}end of the bridge{% else %}then the sun covers usage{% endif %}) the house would then buy **{{ '%.1f' | format(a.pathcheck_shortfall_kwh | float(0)) }} kWh**{% if a.pathcheck_shortfall_expensive_slots_kwh | float(0) > 0 %}, of which {{ '%.1f' | format(a.pathcheck_shortfall_expensive_slots_kwh | float(0)) }} kWh expensive{% if a.pathcheck_gap_price | float(0) > 0 %} (avg. €{{ '%.3f' | format(a.pathcheck_gap_price | float(0)) }}){% endif %}{% endif %}.{% if a.pathcheck_extra_slots | int(0) > 0 %}{% set cf = a.pathcheck_charge_from or '' %}{% set cu = a.pathcheck_charge_until or '' %} So **{{ '%.1f' | format(a.pathcheck_grid_charge_kwh | float(0)) }} kWh charging** {{ ('tomorrow ' if cf[:10] != td else '') ~ cf[11:] }}–{{ cu[11:] }} ({{ a.pathcheck_extra_slots }} quarter hour{{ 's' if a.pathcheck_extra_slots | int(0) != 1 else '' }}){% if a.pathcheck_solar_room_kwh | float(0) >= 0.1 %}; {{ '%.1f' | format(a.pathcheck_solar_room_kwh | float(0)) }} kWh of room stays free for the sun{% endif %}.{% elif a.pathcheck_shortfall_expensive_slots_kwh | float(0) > 0 %} Topping up does not pay off: buying directly is cheaper after losses.{% endif %}{% endif %}
              {% for b in lb %}- Charge {{ b.day }} {{ b.start }}–{{ b.end }}: {{ b.minutes }} minutes{{ ' left' if b.running | default(false) else '' }}, about {{ '%.1f' | format(b.kwh) }} kWh, average €{{ '%.3f' | format(b.price) }}
              {% endfor %}

              ### Tomorrow

              - Tomorrow's prices known: {{ 'yes' if a.tomorrow_prices_known else "no (today's pattern assumed)" }}
              - Cheapest hours tomorrow vs. today: {{ a.spread_tomorrow_pct }}% (decides scenario A or B)
              - Solar tomorrow: {{ a.solar_tomorrow_kwh }} kWh, of which {{ a.tomorrow_solar_direct_kwh }} kWh used directly{% if a.tomorrow_solar_to_battery_kwh | float(0) > 0 %} and {{ a.tomorrow_solar_to_battery_kwh }} kWh to the battery{% endif %}
              - Expected usage tomorrow (after direct solar): **{{ '%.1f' | format(a.tomorrow_battery_usage_kwh | float(0)) }} kWh**. About **{{ '%.1f' | format(a.tomorrow_from_battery_kwh | float(0)) }} kWh of it comes from the battery**, in the expensive quarter hours. The rest, {{ '%.1f' | format(a.tomorrow_direct_grid_kwh | float(0)) }} kWh, the house buys directly from the grid, because in those hours that is cheaper than storing it first
              {% set mb = a.tomorrow_charge_moments | default([]) %}- Estimated grid charge tomorrow: **{% if mb | length > 0 %}{{ '%.1f' | format(a.tomorrow_grid_charge_estimate_kwh | float(0)) }} kWh**, for the expensive quarter hours, without charge margin. It is planned definitively after midnight, with the margin of {{ '%.1f' | format(a.margin_kwh | float(0)) }} kWh added if there are enough cheap quarter hours{% else %}nothing**, charging is not expected to pay off{% endif %}
              {% for b in mb %}- Charge tomorrow {{ b.start }}–{{ b.end }}: {{ b.minutes | default('-') }} minutes, about {{ '%.1f' | format(b.kwh | default(0)) }} kWh, average €{{ '%.3f' | format(b.price) }}
              {% endfor %}
            text_only: true
          - type: markdown
            title: Collected data (last 7 days)
            content: >-
              {%- set a = states['sensor.zendure_forecast_plan'].attributes -%}
              {%- set prod = states('sensor.forecast_solar_production_7_days') | float(0) -%}
              {%- set exp_solar = states('sensor.forecast_grid_export_from_solar_7_days') | float(0) -%}
              {%- set charge_solar = states('sensor.forecast_zendure_charge_from_solar_7_days') | float(0) -%}
              {%- set direct = [prod - exp_solar - charge_solar, 0] | max -%}
              - History available: **{{ a.history_days }}** of 7 days

              - Solar production: **{{ prod | round(1) }} kWh**, of which used directly **{{ direct | round(1) }} kWh** ({{ ((direct / prod * 100) | round(1)) if prod > 0 else '-' }}%), to the battery **{{ charge_solar | round(1) }} kWh**, exported **{{ exp_solar | round(1) }} kWh**

              - Grid: import {{ states('sensor.forecast_grid_import_7_days') | float(0) | round(1) }} kWh, export {{ states('sensor.forecast_grid_export_7_days') | float(0) | round(1) }} kWh ({{ state_attr('sensor.forecast_counter_grid_import', 'source') or 'source unknown' }})

              - Battery: charged {{ states('sensor.forecast_zendure_charge_7_days') | float(0) | round(1) }} kWh, discharged {{ states('sensor.forecast_zendure_discharge_7_days') | float(0) | round(1) }} kWh

              - Average usage: **{{ a.usage_day_kwh }} kWh per day** ({{ a.usage_source }})

              - Direct solar usage: **{{ a.direct_usage_day_kwh if a.direct_usage_day_kwh is not none else '-' }} kWh per day**; applied self-consumption today {{ a.self_consumption_today_pct }}%, tomorrow {{ a.self_consumption_tomorrow_pct }}% ({{ a.self_consumption_source }})

              - Efficiency: charging {{ a.efficiency_charge_pct }}%, discharging {{ a.efficiency_discharge_pct }}%, round trip {{ a.efficiency_round_trip_pct }}% ({{ a.efficiency_source }})

              - Usage per hour: **{{ a.usage_per_hour_source }}**, next 24 hours {{ a.usage_next_24h_kwh }} kWh. Profile learned: {{ states('sensor.forecast_usage_profile') }} of 48 hours (workday + weekend){% set pd = state_attr('sensor.forecast_usage_profile', 'n_per_day') or [] %}{% if pd | length == 7 %}. Learned per weekday (hours with 3+ measurements): {% for d in range(7) %}{{ ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][d] }} {{ pd[d] | select('ge', 3) | list | length }}{{ ', ' if not loop.last else '' }}{% endfor %} of 24{% endif %}{% if state_attr('sensor.forecast_usage_profile', 'last_hour') %}, last measurement {{ state_attr('sensor.forecast_usage_profile', 'last_hour') }}: {{ state_attr('sensor.forecast_usage_profile', 'last_hour_kwh') }} kWh{% endif %}

              - Usage per quarter: **{{ a.usage_per_quarter_source }}**{% if state_attr('sensor.forecast_usage_profile', 'last_quarter_kwh') is not none %}, last quarter {{ state_attr('sensor.forecast_usage_profile', 'last_quarter_kwh') }} kWh{% endif %}
            text_only: false
        visibility:
          - condition: state
            entity: input_boolean.dashboard_setting_show_forecasting
            state: 'on'
      - column_span: 2
        cards: []
        visibility:
          - condition: state
            entity: input_boolean.dashboard_setting_show_forecasting
            state: 'on'
    cards: []
    icon: mdi:battery
    dense_section_placement: false
  - type: sections
    max_columns: 3
    title: Savings
    path: savings
    icon: mdi:currency-eur
    sections:
      - type: grid
        column_span: 3
        visibility:
          - condition: state
            entity: input_number.savings_setting_fixed_supply_price
            state: unavailable
        cards:
          - type: markdown
