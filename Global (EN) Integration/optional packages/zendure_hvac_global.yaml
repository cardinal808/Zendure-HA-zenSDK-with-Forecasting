# Zendure zenSDK (Gielz) + Forecasting 2026.11.4 | based on Gielz v20261113
# Based on Gielz1986/Zendure-HA-zenSDK (Michiel Hofker). See README.md for license and changes.
# OPTIONAL PACKAGE - not needed for Dynamic Smart Matching + Forecasting. Leave it out = feature off.
# In the repo this file is in the "optional packages" folder. To add it: copy it to your packages folder
# and restart Home Assistant. Removing it and restarting turns the feature off again.
# Needs: a climate entity, power sensor or switch of the AC; for "AC not from battery" and the
# separate counting also a power measurement (W or kW) or a kWh counter of the AC.
# =====================================================================
# Zendure HVAC (air conditioning) - do not run the AC from the battery (optional)
#
# Put this file next to zendure_gielz1986_global.yaml (same packages folder).
# Without this file nothing changes. The Forecasting Configuration (HVAC) block on the Settings tab
# appears by itself as soon as this file is loaded.
# How it works:
#   - sensor.hvac_mode                      : what is the AC doing? (Off, Standby, Heating,
#                                             Cooling, Drying, Fan, Auto, On)
#   - binary_sensor.hvac_active             : is the AC really running?
#   - binary_sensor.hvac_discharge_blocked  : AC runs in a mode in which discharging is not
#                                             allowed, and (optionally) not in an expensive hour
#   - binary_sensor.hvac_not_from_battery   : the AC may not run from the battery (mode not
#                                             allowed, no expensive hour)
#   - Approach (input_select.hvac_approach) decides what happens then:
#       * No discharging (default): binary_sensor.hvac_discharge_blocked turns on and the Smart
#         Matching discharge blocks in the automation do not discharge at all.
#       * AC not from battery: sensor.hvac_discharge_correction is the AC power; the Smart
#         Matching discharge blocks subtract it from the grid meter (as for the car), so the
#         battery keeps supplying the rest of the house. Needs a power measurement of the AC
#         (HVAC Power Sensor, or a power sensor as HVAC Sensor); without it, No discharging applies.
#   - Separate counting: while the AC may not run from the battery, its usage
#     (sensor.hvac_separate_total, ..._from_solar_total and the 7-day figures) does not count in
#     the usage profile, the daily usage and the solar self-consumption (power measurement only).
# Charging (solar or grid) keeps working.
# By default the AC may not run from the battery in any mode. Switch on per mode where it may
# (e.g. Cooling: summer, plenty of sun). Leave the sensor field empty to switch the feature off.
# =====================================================================

input_text:
  hvac_sensor:
    name: HVAC Sensor
    icon: mdi:air-conditioner
    max: 250
    mode: text
  # Power of the AC (W or kW), e.g. a Shelly or the power sensor of the AC integration.
  # A kWh counter (e.g. the AC's Energy consumption total) works too: the power is then calculated
  # from the counter's steps (sensor.hvac_power_from_counter). Use a total counter, not a
  # per-cycle counter. Empty: the HVAC Sensor if that is a power sensor.
  hvac_power_sensor:
    name: HVAC Power Sensor
    icon: mdi:flash
    max: 250
    mode: text

input_select:
  # What happens when the AC may not run from the battery? First option = default (as before).
  hvac_approach:
    name: HVAC Approach
    icon: mdi:battery-sync-outline
    options:
      - No discharging
      - AC not from battery

input_number:
  hvac_threshold_power:
    name: HVAC Threshold Power
    icon: mdi:flash
    min: 0
    max: 2000
    step: 10
    mode: box
    unit_of_measurement: "W"

input_boolean:
  hvac_allow_discharge_in_expensive_hour:
    name: HVAC Allow Discharge In Expensive Hour
    icon: mdi:cash-plus
  hvac_allow_discharge_when_heating:
    name: HVAC Allow Discharge When Heating
    icon: mdi:fire
  hvac_allow_discharge_when_cooling:
    name: HVAC Allow Discharge When Cooling
    icon: mdi:snowflake
  hvac_allow_discharge_when_drying:
    name: HVAC Allow Discharge When Drying
    icon: mdi:water-percent
  hvac_allow_discharge_when_fan:
    name: HVAC Allow Discharge When Fan
    icon: mdi:fan
  hvac_allow_discharge_when_auto:
    name: HVAC Allow Discharge When Auto
    icon: mdi:thermostat-auto

# ---------------------------------------------------------------------
# kWh counters of the separately counted AC usage (method "left", like the EV counters)
# ---------------------------------------------------------------------
sensor:
  - platform: integration
    name: "HVAC Separate Total"
    unique_id: hvac_separate_total
    source: sensor.hvac_separate_power
    unit_prefix: k
    round: 3
    method: left

  - platform: integration
    name: "HVAC Separate From Solar Total"
    unique_id: hvac_separate_from_solar_total
    source: sensor.hvac_separate_from_solar_power
    unit_prefix: k
    round: 3
    method: left

  - platform: statistics
    name: "HVAC Separate 7 Days"
    unique_id: hvac_separate_7_days
    entity_id: sensor.hvac_counter_separate
    state_characteristic: change
    max_age:
      days: 7
    sampling_size: 1500
    precision: 2

  - platform: statistics
    name: "HVAC Separate From Solar 7 Days"
    unique_id: hvac_separate_from_solar_7_days
    entity_id: sensor.hvac_counter_separate_from_solar
    state_characteristic: change
    max_age:
      days: 7
    sampling_size: 1500
    precision: 2

template:
  # Freeze the counters every quarter hour (for the 7-day statistics, as in the forecasting package)
  - trigger:
      - trigger: time_pattern
        minutes: "/15"
      - trigger: homeassistant
        event: start
    sensor:
      - name: "HVAC Counter Separate"
        unique_id: hvac_counter_separate
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        # Source briefly gone (e.g. right after a restart): keep the previous value, not unavailable
        availability: "{{ has_value('sensor.hvac_separate_total') or this.state | is_number }}"
        state: "{{ states('sensor.hvac_separate_total') | float(0) if has_value('sensor.hvac_separate_total') else this.state }}"

      - name: "HVAC Counter Separate From Solar"
        unique_id: hvac_counter_separate_from_solar
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        # Source briefly gone (e.g. right after a restart): keep the previous value, not unavailable
        availability: "{{ has_value('sensor.hvac_separate_from_solar_total') or this.state | is_number }}"
        state: "{{ states('sensor.hvac_separate_from_solar_total') | float(0) if has_value('sensor.hvac_separate_from_solar_total') else this.state }}"

  # Power from a kWh counter of the AC (when the AC integration gives no power in W, e.g.
  # Energy consumption total). The counter goes up in small steps; the power is the last step
  # divided by the time since the previous step (or since the AC came on). Without a new step the
  # power goes down with it; after an hour without a step it is 0. Until the first step after
  # switching on, the power of the previous time is used.
  - trigger:
      - trigger: time_pattern
        seconds: "/15"
      - trigger: homeassistant
        event: start
    variables:
      t_e: >
        {% set e = states('input_text.hvac_power_sensor') | trim | lower %}
        {{ e if e != '' else (states('input_text.hvac_sensor') | trim | lower) }}
      t_u: "{{ state_attr(t_e, 'unit_of_measurement') if t_e | regex_match('^sensor\\..+') else none }}"
      t_kwh: >
        {% set v = states(t_e) | float(-1) if t_u in ['kWh', 'Wh', 'MWh'] else -1 %}
        {{ -1 if v < 0 else (v / 1000 if t_u == 'Wh' else (v * 1000 if t_u == 'MWh' else v)) }}
      t_old_kwh: "{{ state_attr('sensor.hvac_power_from_counter', 'counter_kwh') | float(-1) }}"
      t_old_ts: "{{ state_attr('sensor.hvac_power_from_counter', 'step_ts') | float(0) }}"
      t_step_w: "{{ state_attr('sensor.hvac_power_from_counter', 'step_w') | float(-1) }}"
      t_step_kwh: "{{ state_attr('sensor.hvac_power_from_counter', 'step_kwh') | float(0) }}"
      t_learned_w: "{{ state_attr('sensor.hvac_power_from_counter', 'learned_w') | float(0) }}"
      t_now: "{{ as_timestamp(now()) }}"
      t_active: "{{ is_state('binary_sensor.hvac_active', 'on') }}"
      t_active_ts: >
        {{ as_timestamp(states.binary_sensor.hvac_active.last_changed, 0)
           if states.binary_sensor.hvac_active is not none else 0 }}
      # Did the counter change? Down or a large jump (other sensor, per-cycle counter starting
      # at 0) does not count as usage, only as a new reference point.
      t_changed: "{{ t_kwh >= 0 and t_old_kwh >= 0 and t_kwh != t_old_kwh }}"
      t_delta: "{{ (t_kwh - t_old_kwh) if t_changed else 0 }}"
      t_start: "{{ [t_old_ts, t_active_ts] | max }}"
      t_p: >
        {% set dt = t_now - t_start %}
        {{ (t_delta * 3600000 / dt) | round(0)
           if t_changed and t_active and 0 < t_delta <= 2 and t_old_ts > 0 and 20 <= dt <= 3600 else -1 }}
      n_step_w: "{{ t_p if t_p >= 0 else (-1 if t_changed else t_step_w) }}"
      n_step_kwh: "{{ t_delta if t_p >= 0 else (0 if t_changed else t_step_kwh) }}"
      n_ts: "{{ t_now if (t_changed or t_old_ts == 0) else t_old_ts }}"
      n_learned_w: "{{ t_p if t_p >= 0 else t_learned_w }}"
    sensor:
      - name: "HVAC Power From Counter"
        unique_id: hvac_power_from_counter
        icon: mdi:air-conditioner
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: "{{ t_kwh >= 0 }}"
        state: >
          {% set since = t_now - n_ts %}
          {% if not t_active %}0
          {% elif n_ts < t_active_ts or n_step_w < 0 %}
            {# No step yet since the AC came on: power of the previous time #}
            {{ n_learned_w | round(0) }}
          {% elif since > 3600 %}0
          {% else %}
            {% set interval = n_step_kwh * 3600000 / n_step_w if n_step_w > 0 else 0 %}
            {% set p = n_step_w if since <= interval else [n_step_w, n_step_kwh * 3600000 / since] | min %}
            {{ p | round(0) }}
          {% endif %}
        attributes:
          source: "{{ t_e }}"
          counter_kwh: "{{ t_kwh if t_kwh >= 0 else (t_old_kwh if t_old_kwh >= 0 else none) }}"
          step_ts: "{{ n_ts }}"
          step_w: "{{ n_step_w }}"
          step_kwh: "{{ n_step_kwh | round(4) }}"
          learned_w: "{{ n_learned_w }}"

  - sensor:
      # What is the AC doing?
      #   climate.*  -> hvac_action (heating/cooling/drying/fan) when available, otherwise the mode.
      #                 hvac_action idle/off while the AC is on = Standby
      #                 (temperature reached, the AC then uses hardly any power).
      #                 auto/heat_cool without a usable hvac_action = Auto.
      #   sensor.* (power in W or kW) -> On above the threshold (0 = 50 W), otherwise Off
      #   other (switch, binary_sensor, input_boolean, ...) -> On when state is "on"
      - name: "HVAC Mode"
        unique_id: hvac_mode
        icon: mdi:air-conditioner
        state: >
          {% set e = states('input_text.hvac_sensor') | trim %}
          {% if e == '' or not has_value(e) %}
            Off
          {% elif e.startswith('climate.') %}
            {% set s = states(e) %}
            {% set a = state_attr(e, 'hvac_action') %}
            {% set actions = {'heating': 'Heating', 'preheating': 'Heating', 'defrosting': 'Heating',
                              'cooling': 'Cooling', 'drying': 'Drying', 'fan': 'Fan'} %}
            {% set modes = {'heat': 'Heating', 'cool': 'Cooling', 'dry': 'Drying',
                            'fan_only': 'Fan', 'auto': 'Auto', 'heat_cool': 'Auto'} %}
            {% if s == 'off' %}
              Off
            {% elif a in actions %}
              {{ actions[a] }}
            {% elif a in ['idle', 'off'] %}
              Standby
            {% else %}
              {{ modes.get(s, 'On') }}
            {% endif %}
          {% elif e.startswith('sensor.') %}
            {% set d = states('input_number.hvac_threshold_power') | float(0) %}
            {% set w = states(e) | float(0) * (1000 if state_attr(e, 'unit_of_measurement') == 'kW' else 1) %}
            {{ 'On' if w > (d if d > 0 else 50) else 'Off' }}
          {% else %}
            {{ 'On' if is_state(e, 'on') else 'Off' }}
          {% endif %}

      # AC power in W; unavailable without a power measurement
      - name: "HVAC Power"
        unique_id: hvac_power
        icon: mdi:air-conditioner
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        # Power sensor (W/kW) directly; a kWh counter via sensor.hvac_power_from_counter
        availability: >
          {% set e = states('input_text.hvac_power_sensor') | trim | lower %}
          {% set e = e if e != '' else (states('input_text.hvac_sensor') | trim | lower) %}
          {% if state_attr(e, 'unit_of_measurement') in ['kWh', 'Wh', 'MWh'] %}
            {{ has_value('sensor.hvac_power_from_counter') }}
          {% else %}
            {{ e | regex_match('^sensor\\..+') and has_value(e) }}
          {% endif %}
        state: >
          {% set e = states('input_text.hvac_power_sensor') | trim | lower %}
          {% set e = e if e != '' else (states('input_text.hvac_sensor') | trim | lower) %}
          {% set u = state_attr(e, 'unit_of_measurement') %}
          {% if u in ['kWh', 'Wh', 'MWh'] %}
            {{ states('sensor.hvac_power_from_counter') | float(0) | round(0) }}
          {% else %}
            {% set v = states(e) | float(0) %}
            {{ ([v * 1000 if u == 'kW' else v, 0] | max) | round(0) }}
          {% endif %}

      # What the Smart Matching discharge blocks subtract from the grid meter (approach AC not from battery)
      - name: "HVAC Discharge Correction"
        unique_id: hvac_discharge_correction
        icon: mdi:battery-minus-outline
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {{ states('sensor.hvac_power') | float(0)
             if is_state('binary_sensor.hvac_not_from_battery', 'on') and is_state('input_select.hvac_approach', 'AC not from battery')
             else 0 }}

      # Usage counted separately (not in the usage profile): the AC while it may not run from the
      # battery, whatever the approach
      - name: "HVAC Separate Power"
        unique_id: hvac_separate_power
        icon: mdi:air-conditioner
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {{ states('sensor.hvac_power') | float(0) if is_state('binary_sensor.hvac_not_from_battery', 'on') else 0 }}

      # Part of that not coming from the grid (so from solar). What the car takes from the grid goes first.
      - name: "HVAC Separate From Solar Power"
        unique_id: hvac_separate_from_solar_power
        icon: mdi:solar-power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set h = states('sensor.hvac_separate_power') | float(0) %}
          {% set ev = states('sensor.ev_charging_power') | float(0) %}
          {% set import_w = [states('sensor.home_energy_meter_power') | float(0) - ev, 0] | max %}
          {{ (h - [import_w, h] | min) | round(0) }}

  - binary_sensor:
      - name: "HVAC Active"
        unique_id: hvac_active
        icon: mdi:air-conditioner
        state: "{{ states('sensor.hvac_mode') not in ['Off', 'Standby', 'unknown', 'unavailable'] }}"

      # On = the AC may not run from the battery: it runs in a mode in which that is not allowed
      # and it is not an expensive hour (with that option on). "On" (no climate entity, mode
      # unknown) always counts as not allowed, as before.
      - name: "HVAC Not From Battery"
        unique_id: hvac_not_from_battery
        icon: mdi:air-conditioner
        state: >
          {% set m = states('sensor.hvac_mode') %}
          {% set allow = {'Heating': 'input_boolean.hvac_allow_discharge_when_heating',
                          'Cooling': 'input_boolean.hvac_allow_discharge_when_cooling',
                          'Drying': 'input_boolean.hvac_allow_discharge_when_drying',
                          'Fan': 'input_boolean.hvac_allow_discharge_when_fan',
                          'Auto': 'input_boolean.hvac_allow_discharge_when_auto'} %}
          {% set mode_ok = m in allow and is_state(allow[m], 'on') %}
          {% set expensive = is_state('input_boolean.hvac_allow_discharge_in_expensive_hour', 'on')
                             and is_state('sensor.dynamic_highest_price_period', 'Yes') %}
          {{ is_state('binary_sensor.hvac_active', 'on') and not mode_ok and not expensive }}

      # On = the Smart Matching modes do not discharge. With approach AC not from battery only
      # when there is no power measurement (then the correction is not possible).
      - name: "HVAC Discharge Blocked"
        unique_id: hvac_discharge_blocked
        icon: mdi:battery-off-outline
        state: >
          {{ is_state('binary_sensor.hvac_not_from_battery', 'on')
             and not (is_state('input_select.hvac_approach', 'AC not from battery') and has_value('sensor.hvac_power')) }}
        attributes:
          reason: >
            {% set m = states('sensor.hvac_mode') %}
            {% set allow = {'Heating': 'input_boolean.hvac_allow_discharge_when_heating',
                            'Cooling': 'input_boolean.hvac_allow_discharge_when_cooling',
                            'Drying': 'input_boolean.hvac_allow_discharge_when_drying',
                            'Fan': 'input_boolean.hvac_allow_discharge_when_fan',
                            'Auto': 'input_boolean.hvac_allow_discharge_when_auto'} %}
            {% if is_state('binary_sensor.hvac_active', 'off') %}
              AC {{ m | lower }}: discharging normal
            {% elif m in allow and is_state(allow[m], 'on') %}
              {{ m }}: discharging allowed
            {% elif is_state('input_boolean.hvac_allow_discharge_in_expensive_hour', 'on')
                    and is_state('sensor.dynamic_highest_price_period', 'Yes') %}
              {{ m }}, but expensive hour: discharging allowed
            {% elif is_state('input_select.hvac_approach', 'AC not from battery') and has_value('sensor.hvac_power') %}
              {{ m }}: battery supplies the house, not the AC ({{ states('sensor.hvac_power') | float(0) | round(0) | int }} W)
            {% elif is_state('input_select.hvac_approach', 'AC not from battery') %}
              {{ m }}: charging only (no power measurement, so no correction possible)
            {% else %}
              {{ m }}: charging only
            {% endif %}
