# Zendure zenSDK (Gielz) + Forecasting 2026.11.4 | based on Gielz v20261113
# Based on Gielz1986/Zendure-HA-zenSDK (Michiel Hofker). See README.md for license and changes.
# REQUIRED PACKAGE - part of the base of this set (next to zendure_gielz1986_global.yaml).
# =====================================================================
# Zendure Forecasting (add-on to zendure_gielz1986_global.yaml)
# Mode: "Dynamic Smart Matching + Forecasting"
#
# Place this file next to zendure_gielz1986_global.yaml (same packages folder).
# This file contains:
#   1. Input fields (helpers) for the forecast settings
#   2. Power sensors + integration sensors (kWh counters)
#   3. Statistics: 7 days (solar self-consumption, average usage) and measured charge power
#   4. The planner: sensor.zendure_forecast_plan (+ sensor.zendure_forecast_chart)
#      incl. scenario A/B, path check (until solar coverage, with tomorrow's prices until tomorrow's solar coverage), efficiency filter and cheap-dip discharge hold
#
# Fixed values (thresholds, fallback values) are at the top of the planner under
# "Settings (fixed values)" with the prefix c_.
# =====================================================================

# ---------------------------------------------------------------------
# 1. Input fields
# ---------------------------------------------------------------------
input_text:
  forecast_setting_solar_remaining_today_sensor:
    name: Forecast Solar Remaining Today Sensor
    icon: mdi:solar-power-variant
    max: 250
    mode: text

  forecast_setting_solar_tomorrow_sensor:
    name: Forecast Solar Tomorrow Sensor
    icon: mdi:solar-power-variant-outline
    max: 250
    mode: text

  forecast_setting_solar_production_sensor:
    name: Forecast Solar Panels Production Sensor (total kWh)
    icon: mdi:solar-panel
    max: 250
    mode: text

  # Optional: your own kWh counters for grid import and export (e.g. Shelly Pro 3EM, P1 Monitor,
  # DSMR Reader). Several sensors separated by a comma are added up (e.g. tariff 1 and 2).
  # Empty = detect automatically (SlimmeLezer, HomeWizard, DSMR integration).
  forecast_setting_grid_import_counter_sensor:
    name: Forecast Grid Import Counter Sensor (total kWh)
    icon: mdi:transmission-tower-import
    max: 250
    mode: text

  forecast_setting_grid_export_counter_sensor:
    name: Forecast Grid Export Counter Sensor (total kWh)
    icon: mdi:transmission-tower-export
    max: 250
    mode: text

input_number:
  forecast_setting_charge_margin:
    name: Forecast Battery Charge Margin
    icon: mdi:battery-plus-variant
    min: 0
    max: 50
    step: 1
    mode: box
    unit_of_measurement: "%"

  # Calibration charging: after this many days without calibration (100%) the planner charges the
  # battery full from the grid. From half of it, it waits for a sunny day. 0 = default (14 days).
  forecast_setting_calibration_days:
    name: Forecast Calibration After Days
    icon: mdi:battery-sync
    min: 0
    max: 60
    step: 1
    mode: box
    unit_of_measurement: "d"

  forecast_setting_solar_reliability:
    name: Forecast Solar Forecast Reliability
    icon: mdi:weather-partly-cloudy
    min: 0
    max: 100
    step: 5
    mode: box
    unit_of_measurement: "%"

  # Reliability per month (%). 0 = not filled in: then the general reliability above applies.
  # At the end of each month the set fills in the measured ratio (actual solar / forecast) for
  # that month, so it is right next year. Turn off with "Do not fill in automatically".
  forecast_setting_solar_reliability_jan:
    name: Forecast Solar Reliability January
    icon: mdi:weather-partly-cloudy
    min: 0
    max: 150
    step: 1
    mode: box
    unit_of_measurement: "%"
  forecast_setting_solar_reliability_feb:
    name: Forecast Solar Reliability February
    icon: mdi:weather-partly-cloudy
    min: 0
    max: 150
    step: 1
    mode: box
    unit_of_measurement: "%"
  forecast_setting_solar_reliability_mar:
    name: Forecast Solar Reliability March
    icon: mdi:weather-partly-cloudy
    min: 0
    max: 150
    step: 1
    mode: box
    unit_of_measurement: "%"
  forecast_setting_solar_reliability_apr:
    name: Forecast Solar Reliability April
    icon: mdi:weather-partly-cloudy
    min: 0
    max: 150
    step: 1
    mode: box
    unit_of_measurement: "%"
  forecast_setting_solar_reliability_may:
    name: Forecast Solar Reliability May
    icon: mdi:weather-partly-cloudy
    min: 0
    max: 150
    step: 1
    mode: box
    unit_of_measurement: "%"
  forecast_setting_solar_reliability_jun:
    name: Forecast Solar Reliability June
    icon: mdi:weather-partly-cloudy
    min: 0
    max: 150
    step: 1
    mode: box
    unit_of_measurement: "%"
  forecast_setting_solar_reliability_jul:
    name: Forecast Solar Reliability July
    icon: mdi:weather-partly-cloudy
    min: 0
    max: 150
    step: 1
    mode: box
    unit_of_measurement: "%"
  forecast_setting_solar_reliability_aug:
    name: Forecast Solar Reliability August
    icon: mdi:weather-partly-cloudy
