input_boolean:
  forecast_setting_hold_discharge_in_dip:
    name: Forecast Hold Discharge In Cheap Dip
    icon: mdi:battery-lock
  # Smart hold: if the battery won't last, its charge goes to the most expensive quarter hours.
  # On by default (set once by the automation at the bottom).
  forecast_setting_smart_hold:
    name: Forecast Smart Hold
    icon: mdi:battery-clock
  # Internal: smart hold has been turned on by default once
  forecast_setting_smart_hold_set:
    name: Forecast Smart Hold Set
    icon: mdi:robot
  # Shows the 12 monthly reliability fields on the dashboard
  # Turn calibration charging off (on by default)
  forecast_setting_calibration_off:
    name: Forecast Calibration Charging Off
    icon: mdi:battery-sync-outline
  forecast_setting_show_reliability_per_month:
    name: Forecast Show Reliability Per Month
    icon: mdi:calendar-month
  # On = do not fill in the measured monthly value automatically
  forecast_setting_reliability_no_auto_fill:
    name: Forecast Reliability No Auto Fill
    icon: mdi:calendar-lock
  dashboard_setting_show_forecasting:
    name: Show Forecasting On Dashboard
    icon: mdi:calendar-clock

input_button:
  forecast_recalculate:
    name: Forecast Recalculate
    icon: mdi:calculator-variant
  # Clears the learned usage profile and the 7-day history (see the automation at the bottom)
  forecast_reset_usage_data:
    name: Forecast Reset Usage Data
    icon: mdi:restore-alert

# ---------------------------------------------------------------------
# 2. Integration sensors (kWh counters, derived from power sensors)
#    Method "left": the power sensors only get a new value when they change (step-wise).
#    Trapezoidal would draw a slanted line between two measurements and count energy
#    that was not there. For grid import and export the P1 meter's kWh counters are
#    preferred (see "Forecast Counter Grid ...").
# ---------------------------------------------------------------------
sensor:
  # Latest release of this extension on GitHub (for the release check)
  - platform: rest
    name: "GitHub Zendure Forecasting"
    unique_id: github_zendure_forecasting
    resource: "https://api.github.com/repos/cardinal808/Zendure-HA-zenSDK-with-Forecasting/releases/latest"
    headers:
      User-Agent: "HomeAssistant"
    scan_interval: 3600
    json_attributes:
      - tag_name
      - name
      - published_at
      - body
    value_template: "{{ (value_json.tag_name | default('unknown')) | replace('v', '') }}"

  - platform: integration
    name: "Forecast Grid Import Total"
    unique_id: forecast_grid_import_total
    source: sensor.forecast_grid_import_power
    unit_prefix: k
    round: 3
    method: left

  - platform: integration
    name: "Forecast Grid Export Total"
    unique_id: forecast_grid_export_total
    source: sensor.forecast_grid_export_power
    unit_prefix: k
    round: 3
    method: left

  - platform: integration
    name: "Forecast Grid Export From Solar Total"
    unique_id: forecast_grid_export_from_solar_total
    source: sensor.forecast_grid_export_from_solar_power
    unit_prefix: k
    round: 3
    method: left

  - platform: integration
    name: "Forecast Zendure Charge Total"
    unique_id: forecast_zendure_charge_total
    source: sensor.forecast_zendure_charge_power
    unit_prefix: k
    round: 3
    method: left

  - platform: integration
    name: "Forecast Zendure Discharge Total"
    unique_id: forecast_zendure_discharge_total
    source: sensor.forecast_zendure_discharge_power
    unit_prefix: k
    round: 3
    method: left

  - platform: integration
    name: "Forecast Zendure Charge From Solar Total"
    unique_id: forecast_zendure_charge_from_solar_total
    source: sensor.forecast_zendure_charge_from_solar_power
    unit_prefix: k
    round: 3
    method: left

  # -------------------------------------------------------------------
  # 3. Statistics over the last 7 days (rolling)
  #    Based on the counters "Forecast Counter ..." (see template section)
  # -------------------------------------------------------------------
  # Average actual grid charge power over recent charging sessions
  - platform: statistics
    name: "Forecast Measured Charge Power"
    unique_id: forecast_measured_charge_power
    entity_id: sensor.forecast_grid_charge_power
    # Median: a few low readings (e.g. at the end of a charge) do not pull it down
    state_characteristic: median
    max_age:
      days: 14
    sampling_size: 3000
    precision: 0

  - platform: statistics
    name: "Forecast Solar Production 7 Days"
    unique_id: forecast_solar_production_7_days
    entity_id: sensor.forecast_counter_solar_production
    state_characteristic: change
    max_age:
      days: 7
    sampling_size: 1500
    precision: 2

  - platform: statistics
    name: "Forecast Grid Import 7 Days"
    unique_id: forecast_grid_import_7_days
    entity_id: sensor.forecast_counter_grid_import
    state_characteristic: change
    max_age:
      days: 7
    sampling_size: 1500
    precision: 2

  - platform: statistics
    name: "Forecast Grid Export 7 Days"
    unique_id: forecast_grid_export_7_days
    entity_id: sensor.forecast_counter_grid_export
    state_characteristic: change
    max_age:
      days: 7
    sampling_size: 1500
    precision: 2

  - platform: statistics
    name: "Forecast Grid Export From Solar 7 Days"
    unique_id: forecast_grid_export_from_solar_7_days
    entity_id: sensor.forecast_counter_grid_export_from_solar
    state_characteristic: change
    max_age:
      days: 7
    sampling_size: 1500
    precision: 2

  - platform: statistics
    name: "Forecast Zendure Charge 7 Days"
    unique_id: forecast_zendure_charge_7_days
    entity_id: sensor.forecast_counter_zendure_charge
    state_characteristic: change
    max_age:
      days: 7
    sampling_size: 1500
    precision: 2

  - platform: statistics
    name: "Forecast Zendure Discharge 7 Days"
    unique_id: forecast_zendure_discharge_7_days
    entity_id: sensor.forecast_counter_zendure_discharge
    state_characteristic: change
    max_age:
      days: 7
    sampling_size: 1500
    precision: 2

  - platform: statistics
    name: "Forecast Zendure Charge From Solar 7 Days"
    unique_id: forecast_zendure_charge_from_solar_7_days
    entity_id: sensor.forecast_counter_zendure_charge_from_solar
    state_characteristic: change
    max_age:
      days: 7
    sampling_size: 1500
    precision: 2

template:
  # Solar forecast reliability that applies now: the month value, otherwise the general one, otherwise 100%.
  # The binary sensor decides on the dashboard which row is visible.
  - binary_sensor:
      - name: "Forecast Reliability Month Set"
        unique_id: forecast_reliability_month_set
        icon: mdi:calendar-check
        state: "{{ states('input_number.forecast_setting_solar_reliability_' ~ ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'][now().month - 1]) | float(0) > 0 }}"
    sensor:
      - name: "Forecast Reliability Now"
        unique_id: forecast_reliability_now
        icon: mdi:weather-partly-cloudy
        unit_of_measurement: "%"
        state: >
          {% set m = states('input_number.forecast_setting_solar_reliability_' ~ ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'][now().month - 1]) | float(0) %}
          {% set g = states('input_number.forecast_setting_solar_reliability') | float(0) %}
          {{ (m if m > 0 else (g if g > 0 else 100)) | round(0) }}
        attributes:
          source: >
            {% set m = states('input_number.forecast_setting_solar_reliability_' ~ ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'][now().month - 1]) | float(0) %}
            {{ ('month value ' ~ ['January','February','March','April','May','June','July','August','September','October','November','December'][now().month - 1]) if m > 0 else ('general value' if states('input_number.forecast_setting_solar_reliability') | float(0) > 0 else 'not filled in (100%)') }}
  # Grid charging power as the battery really achieves it (> 300 W), only up to 10% below the
  # maximum state of charge: at the end of a charge the power drops (balancing), and that says
  # nothing about what a charge slot yields. Outside grid charging the
  # sensor keeps its last measurement (also after a restart), so the statistic Measured Charge
  # Power stays available and only counts real charging sessions. Was: unavailable outside grid
  # charging, so the planner almost always used the configured power.
  - trigger:
      - trigger: state
        entity_id:
          - sensor.zendure_power
          - sensor.home_energy_meter_power
    sensor:
      - name: "Forecast Grid Charge Power"
        unique_id: forecast_grid_charge_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: >
          {% set laden = [states('sensor.zendure_power') | float(0), 0] | max %}
          {% set import_w = [states('sensor.home_energy_meter_power') | float(0), 0] | max %}
          {% set onder_staart = states('sensor.zendure_total_state_of_charge') | float(100) <= states('sensor.zendure_maximum_state_of_charge') | float(100) - 10 %}
          {{ (has_value('sensor.home_energy_meter_power') and has_value('sensor.zendure_power') and ([import_w, laden] | min) > 300 and onder_staart)
             or this.state | is_number }}
        state: >
          {% set laden = [states('sensor.zendure_power') | float(0), 0] | max %}
          {% set import_w = [states('sensor.home_energy_meter_power') | float(0), 0] | max %}
          {% set onder_staart = states('sensor.zendure_total_state_of_charge') | float(100) <= states('sensor.zendure_maximum_state_of_charge') | float(100) - 10 %}
          {% if has_value('sensor.home_energy_meter_power') and has_value('sensor.zendure_power') and ([import_w, laden] | min) > 300 and onder_staart %}
            {{ [import_w, laden] | min | round(0) }}
          {% else %}
            {{ this.state }}
          {% endif %}

  # Version of this extension: year.month.sequence (sequence restarts at 1 every month)
  - sensor:
      - name: "Forecasting Version"
        unique_id: forecasting_version
        icon: mdi:one-up
        state: "2026.11.4"
        attributes:
          gielz_base: "v20261113"
          # Optional packages that are loaded
          packages: >
            {% set ns = namespace(l=[]) %}
            {% if states.sensor.zendure_savings is not none %}{% set ns.l = ns.l + ['Savings'] %}{% endif %}
            {% if states.sensor.zendure_feedin_price_now is not none %}{% set ns.l = ns.l + ['Negative Price'] %}{% endif %}
            {% if states.binary_sensor.hvac_active is not none %}{% set ns.l = ns.l + ['HVAC'] %}{% endif %}
            {% if states.sensor.ev_charge_plan is not none %}{% set ns.l = ns.l + ['EV'] %}{% endif %}
            {% if states.script.zendure_diagnostics_export is not none %}{% set ns.l = ns.l + ['Export'] %}{% endif %}
            {% if states.input_number.nordpool_setting_energy_tax is not none %}{% set ns.l = ns.l + ['Nordpool'] %}{% endif %}
            {{ ns.l }}
          github: "https://github.com/cardinal808/Zendure-HA-zenSDK-with-Forecasting"

      - name: "Forecasting Release Check"
        unique_id: forecasting_release_check
        state: >
          {% macro num(x) %}{% set p = (x | string | replace('v', '')).split('.') %}{% if p | length == 3 %}{{ '%04d%02d%03d' | format(p[0] | int(0), p[1] | int(0), p[2] | int(0)) }}{% endif %}{% endmacro %}
          {% set g = state_attr('sensor.github_zendure_forecasting', 'tag_name') %}
          {% set a = num(states('sensor.forecasting_version')) %}
          {% set b = num(g) if g not in [none, 'unknown', 'unavailable'] else '' %}
          {% if a and b %}
            {% if a > b %}Pre-release Active{% elif a < b %}New release on GitHub{% else %}Up-to-date{% endif %}
          {% else %}Unknown{% endif %}
        icon: >
          {% if this.state == 'Up-to-date' %}mdi:emoticon-happy-outline
          {% elif this.state == 'Pre-release Active' %}mdi:test-tube
          {% else %}mdi:emoticon-sad-outline{% endif %}

  # Hold discharging in a cheap dip (only mode Dynamic Smart Matching + Forecasting)
  - binary_sensor:
      - name: "Forecast Discharge Held In Dip"
        unique_id: forecast_discharge_held_in_dip
        icon: mdi:battery-lock
        state: >
          {{ is_state('input_select.zendure_operation_mode', 'Dynamic Smart Matching + Forecasting')
             and is_state_attr('sensor.zendure_forecast_plan', 'hold_discharge', true) }}

  # -------------------------------------------------------------------
  # Power sensors (source for the integration sensors above)
  #   Energy meter: positive = import, negative = export
  #   Zendure:      sensor.zendure_power
  #                positive = charging, negative = discharging
  # -------------------------------------------------------------------
  - sensor:
      - name: "Forecast Grid Import Power"
        unique_id: forecast_grid_import_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: "{{ has_value('sensor.home_energy_meter_power') }}"
        state: "{{ [states('sensor.home_energy_meter_power') | float(0), 0] | max }}"

      - name: "Forecast Grid Export Power"
        unique_id: forecast_grid_export_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: "{{ has_value('sensor.home_energy_meter_power') }}"
        state: "{{ [0 - states('sensor.home_energy_meter_power') | float(0), 0] | max }}"

      # Export that comes from solar: grid export minus what the battery is discharging at that moment
      # (otherwise export from the battery, e.g. in Dynamic Trading, would count as solar export)
      - name: "Forecast Grid Export From Solar Power"
        unique_id: forecast_grid_export_from_solar_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: >
          {{ has_value('sensor.home_energy_meter_power')
             and has_value('sensor.zendure_power') }}
        state: >
          {% set export_w = [0 - states('sensor.home_energy_meter_power') | float(0), 0] | max %}
          {% set discharging = [0 - states('sensor.zendure_power') | float(0), 0] | max %}
          {{ ([export_w - discharging, 0] | max) | round(0) }}

      - name: "Forecast Zendure Charge Power"
        unique_id: forecast_zendure_charge_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: "{{ has_value('sensor.zendure_power') }}"
        state: "{{ [states('sensor.zendure_power') | float(0), 0] | max }}"

      - name: "Forecast Zendure Discharge Power"
        unique_id: forecast_zendure_discharge_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: "{{ has_value('sensor.zendure_power') }}"
        state: "{{ [0 - states('sensor.zendure_power') | float(0), 0] | max }}"

      # The part of the charge power that does NOT come from the grid (i.e. from solar surplus).
      # The grid part is the grid import, capped at the charge power.
      - name: "Forecast Zendure Charge From Solar Power"
        unique_id: forecast_zendure_charge_from_solar_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: >
          {{ has_value('sensor.home_energy_meter_power')
             and has_value('sensor.zendure_power') }}
        state: >
          {% set charging = [states('sensor.zendure_power') | float(0), 0] | max %}
          {% set import_w = [states('sensor.home_energy_meter_power') | float(0), 0] | max %}
          {{ (charging - [import_w, charging] | min) | round(0) }}

  # -------------------------------------------------------------------
  # Counters are "frozen" every quarter hour (:00, :15, :30, :45), in step with the
  # 15-minute prices (needed for zendure_savings_global.yaml), and so the 7-day statistic
  # does not have to process thousands of samples per hour.
  # -------------------------------------------------------------------
  - trigger:
      - platform: time_pattern
        minutes: "/15"
      - platform: homeassistant
        event: start
    variables:
      c_max_kwh_per_hour: 15             # a larger increase per hour counts as a meter swap or error
      c_max_solar_kwh_per_hour: 50       # solar: a larger increase per hour counts as a jump (other sensor, reset)
      c_meter_max_gone_s: 21600          # meter gone for more than 6 hours: back to calculation from power
      now_ts: "{{ as_timestamp(now()) }}"
      # kWh counters of the grid meter. Entered in Forecasting Configuration (Basic) takes precedence;
      # otherwise detected automatically (first group in which all sensors have a value):
      # SlimmeLezer/ESPHome DSMR, HomeWizard P1, DSMR integration
      p1_import_groups:
        - ['sensor.energy_consumed_tariff_1', 'sensor.energy_consumed_tariff_2']
        - ['sensor.p1_meter_energy_import']
        - ['sensor.p1_meter_energie_import']
        - ['sensor.electricity_meter_energy_consumption_tarif_1', 'sensor.electricity_meter_energy_consumption_tarif_2']
      p1_export_groups:
        - ['sensor.energy_produced_tariff_1', 'sensor.energy_produced_tariff_2']
        - ['sensor.p1_meter_energy_export']
        - ['sensor.p1_meter_energie_export']
        - ['sensor.electricity_meter_energy_production_tarif_1', 'sensor.electricity_meter_energy_production_tarif_2']
      p1_import_own: >
        {{ (states('input_text.forecast_setting_grid_import_counter_sensor') | lower).split(',') | map('trim') | select('match', '^sensor\\.[a-z0-9_]+$') | list }}
      p1_export_own: >
        {{ (states('input_text.forecast_setting_grid_export_counter_sensor') | lower).split(',') | map('trim') | select('match', '^sensor\\.[a-z0-9_]+$') | list }}
      # Which sensors are used: the entered ones (comma separated), otherwise the first complete group
      p1_import_ids: >
        {%- set ns = namespace(g=[]) -%}
        {%- if p1_import_own | length > 0 -%}{%- set ns.g = p1_import_own -%}
        {%- else -%}
          {%- for g in p1_import_groups -%}
            {%- if ns.g | length == 0 and g | select('has_value') | list | length == g | length -%}{%- set ns.g = g -%}{%- endif -%}
          {%- endfor -%}
        {%- endif -%}
        {{ ns.g }}
      p1_export_ids: >
        {%- set ns = namespace(g=[]) -%}
        {%- if p1_export_own | length > 0 -%}{%- set ns.g = p1_export_own -%}
        {%- else -%}
          {%- for g in p1_export_groups -%}
            {%- if ns.g | length == 0 and g | select('has_value') | list | length == g | length -%}{%- set ns.g = g -%}{%- endif -%}
          {%- endfor -%}
        {%- endif -%}
        {{ ns.g }}
      # Sum in kWh (Wh and MWh are converted); -1 = no meter found or not available
      meter_import: >
        {%- if p1_import_ids | length > 0 and p1_import_ids | select('has_value') | list | length == p1_import_ids | length -%}
          {%- set ns = namespace(v=0) -%}
          {%- for e in p1_import_ids -%}
            {%- set u = state_attr(e, 'unit_of_measurement') -%}
            {%- set v = states(e) | float(0) -%}
            {%- set ns.v = ns.v + (v / 1000 if u == 'Wh' else (v * 1000 if u == 'MWh' else v)) -%}
          {%- endfor -%}
          {{ ns.v | round(3) }}
        {%- else -%}-1{%- endif -%}
      meter_export: >
        {%- if p1_export_ids | length > 0 and p1_export_ids | select('has_value') | list | length == p1_export_ids | length -%}
          {%- set ns = namespace(v=0) -%}
          {%- for e in p1_export_ids -%}
            {%- set u = state_attr(e, 'unit_of_measurement') -%}
            {%- set v = states(e) | float(0) -%}
            {%- set ns.v = ns.v + (v / 1000 if u == 'Wh' else (v * 1000 if u == 'MWh' else v)) -%}
          {%- endfor -%}
          {{ ns.v | round(3) }}
        {%- else -%}-1{%- endif -%}
      int_import: "{{ states('sensor.forecast_grid_import_total') | float(-1) }}"
      int_export: "{{ states('sensor.forecast_grid_export_total') | float(-1) }}"
      # Solar production: configured total counter (kWh; Wh and MWh are converted); -1 = no value
      solar_entity: "{{ states('input_text.forecast_setting_solar_production_sensor') | trim | lower }}"
      solar_source: >
        {%- if solar_entity | regex_match('^sensor\\..+') and has_value(solar_entity) -%}
          {%- set u = state_attr(solar_entity, 'unit_of_measurement') -%}
          {%- set v = states(solar_entity) | float(-1) -%}
          {%- if v < 0 -%}-1{%- elif u == 'Wh' -%}{{ (v / 1000) | round(4) }}{%- elif u == 'MWh' -%}{{ (v * 1000) | round(4) }}{%- else -%}{{ v }}{%- endif -%}
        {%- else -%}-1{%- endif -%}
    sensor:
      # Solar production: adds up the increase of the configured production sensor instead of
      # copying its value. A jump then does not count as production: another sensor entered, a
      # counter that briefly reports 0 or jumps back, a replaced inverter. If the sensor drops out
      # (e.g. at night), the missed part is added once it is back. An ignored jump is shown in the
      # attribute last_jump.
      - name: "Forecast Counter Solar Production"
        unique_id: forecast_counter_solar_production
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        # Available with a valid sensor and a value: its own reading or a reading of the source.
        # After a restart at night (inverter offline, no reading yet) it waits instead of
        # starting at 0.
        availability: >
          {{ solar_entity | regex_match('^sensor\\..+')
             and (this.state | float(-1) >= 0 or solar_source >= 0) }}
        state: >
          {% set prev_v = this.state | float(-1) %}
          {# No own reading yet (first time): start at the source reading. That matches the old
             data points (which copied the reading) and avoids a negative 7-day change. #}
          {% set prev_v = prev_v if prev_v >= 0 else ([solar_source, 0] | max) %}
          {% set s_old = this.attributes.get('source') %}
          {% set s_ts = this.attributes.get('source_ts') | float(0) %}
          {% if solar_source >= 0 and s_old is number and this.attributes.get('source_entity') == solar_entity %}
            {% set d = solar_source - s_old %}
            {% set max_d = c_max_solar_kwh_per_hour * ([(now_ts - s_ts) / 3600, 1] | max) %}
            {{ (prev_v + (d if 0 <= d <= max_d else 0)) | round(3) }}
          {% else %}{{ prev_v | round(3) }}{% endif %}
        attributes:
          # Last value of the source sensor (kWh), when it was read and which sensor it was
          source: >
            {% if solar_source >= 0 %}{{ solar_source }}
            {% elif this.attributes.get('source_entity') == solar_entity %}{{ this.attributes.get('source') }}
            {% else %}{{ none }}{% endif %}
          source_ts: >
            {% if solar_source >= 0 %}{{ now_ts | round(0) }}
            {% elif this.attributes.get('source_entity') == solar_entity %}{{ this.attributes.get('source_ts') }}
            {% else %}{{ none }}{% endif %}
          source_entity: "{{ solar_entity }}"
          last_jump: >
            {% set s_old = this.attributes.get('source') %}
            {% set s_ts = this.attributes.get('source_ts') | float(0) %}
            {% set d = (solar_source - s_old) if (solar_source >= 0 and s_old is number and this.attributes.get('source_entity') == solar_entity) else 0 %}
            {% set max_d = c_max_solar_kwh_per_hour * ([(now_ts - s_ts) / 3600, 1] | max) %}
            {% if d < 0 or d > max_d %}{{ now().strftime('%Y-%m-%d %H:%M') }}: {{ d | round(1) }} kWh ignored
            {% else %}{{ this.attributes.get('last_jump') }}{% endif %}

      # Adds up the increase of the P1 meter (exact, same source as the energy dashboard).
      # Without a meter: the increase of the integration from power. By adding up instead of
      # copying the meter reading, the counter continues without a jump, also when the source
      # changes, and the 7-day statistic stays correct. If the meter is briefly gone, the missed
      # part is added once it is back (last reading remembered). More than 6 hours without
      # a meter: back to power.
      - name: "Forecast Counter Grid Import"
        unique_id: forecast_counter_grid_import
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        availability: "{{ meter_import >= 0 or int_import >= 0 }}"
        state: >
          {% set prev = this.state | float(-1) %}
          {% set prev = prev if prev >= 0 else ([int_import, 0] | max) %}
          {% set m_old = this.attributes.get('meter') %}
          {% set m_ts = this.attributes.get('meter_ts') | float(0) %}
          {% set m_valid = m_old is number and (now_ts - m_ts) <= c_meter_max_gone_s and this.attributes.get('meter_sensors') in [none, p1_import_ids] %}
          {% set i_old = this.attributes.get('integration') %}
          {% if meter_import >= 0 %}
            {% set d = (meter_import - m_old) if m_valid else 0 %}
            {% set max_d = c_max_kwh_per_hour * ([(now_ts - m_ts) / 3600, 1] | max) %}
          {% elif m_valid %}
            {% set d = 0 %}{% set max_d = 0 %}
          {% elif int_import >= 0 %}
            {% set d = (int_import - i_old) if i_old is number else 0 %}
            {% set max_d = c_max_kwh_per_hour %}
          {% else %}
            {% set d = 0 %}{% set max_d = 0 %}
          {% endif %}
          {{ (prev + (d if 0 <= d <= max_d else 0)) | round(3) }}
        attributes:
          meter: >
            {% set m_old = this.attributes.get('meter') %}
            {% set m_ts = this.attributes.get('meter_ts') | float(0) %}
            {% if meter_import >= 0 %}{{ meter_import }}
            {% elif m_old is number and (now_ts - m_ts) <= c_meter_max_gone_s %}{{ m_old }}
            {% else %}{{ none }}{% endif %}
          meter_ts: >
            {% set m_ts = this.attributes.get('meter_ts') | float(0) %}
            {% if meter_import >= 0 %}{{ now_ts | round(0) }}
            {% elif m_ts > 0 and (now_ts - m_ts) <= c_meter_max_gone_s %}{{ m_ts }}
            {% else %}{{ none }}{% endif %}
          integration: "{{ int_import if int_import >= 0 else none }}"
          # Which sensors supply the meter reading; another source does not cause a jump
          meter_sensors: "{{ p1_import_ids if meter_import >= 0 else this.attributes.get('meter_sensors') }}"
          source: >
            {% set m_ts = this.attributes.get('meter_ts') | float(0) %}
            {% if meter_import >= 0 %}{{ 'Entered counter (kWh)' if p1_import_own | length > 0 else 'P1 meter (kWh counters)' }}
            {% elif m_ts > 0 and (now_ts - m_ts) <= c_meter_max_gone_s %}Meter briefly unreachable (will be added)
            {% else %}Calculated from power (no kWh counter found or entered){% endif %}

      # Adds up the increase of the P1 meter (exact, same source as the energy dashboard).
      # Without a meter: the increase of the integration from power. By adding up instead of
      # copying the meter reading, the counter continues without a jump, also when the source
      # changes, and the 7-day statistic stays correct. If the meter is briefly gone, the missed
      # part is added once it is back (last reading remembered). More than 6 hours without
      # a meter: back to power.
      - name: "Forecast Counter Grid Export"
        unique_id: forecast_counter_grid_export
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        availability: "{{ meter_export >= 0 or int_export >= 0 }}"
        state: >
          {% set prev = this.state | float(-1) %}
          {% set prev = prev if prev >= 0 else ([int_export, 0] | max) %}
          {% set m_old = this.attributes.get('meter') %}
          {% set m_ts = this.attributes.get('meter_ts') | float(0) %}
          {% set m_valid = m_old is number and (now_ts - m_ts) <= c_meter_max_gone_s and this.attributes.get('meter_sensors') in [none, p1_export_ids] %}
          {% set i_old = this.attributes.get('integration') %}
          {% if meter_export >= 0 %}
            {% set d = (meter_export - m_old) if m_valid else 0 %}
            {% set max_d = c_max_kwh_per_hour * ([(now_ts - m_ts) / 3600, 1] | max) %}
          {% elif m_valid %}
            {% set d = 0 %}{% set max_d = 0 %}
          {% elif int_export >= 0 %}
            {% set d = (int_export - i_old) if i_old is number else 0 %}
            {% set max_d = c_max_kwh_per_hour %}
          {% else %}
            {% set d = 0 %}{% set max_d = 0 %}
          {% endif %}
          {{ (prev + (d if 0 <= d <= max_d else 0)) | round(3) }}
        attributes:
          meter: >
            {% set m_old = this.attributes.get('meter') %}
            {% set m_ts = this.attributes.get('meter_ts') | float(0) %}
            {% if meter_export >= 0 %}{{ meter_export }}
            {% elif m_old is number and (now_ts - m_ts) <= c_meter_max_gone_s %}{{ m_old }}
            {% else %}{{ none }}{% endif %}
          meter_ts: >
            {% set m_ts = this.attributes.get('meter_ts') | float(0) %}
            {% if meter_export >= 0 %}{{ now_ts | round(0) }}
            {% elif m_ts > 0 and (now_ts - m_ts) <= c_meter_max_gone_s %}{{ m_ts }}
            {% else %}{{ none }}{% endif %}
          integration: "{{ int_export if int_export >= 0 else none }}"
          # Which sensors supply the meter reading; another source does not cause a jump
          meter_sensors: "{{ p1_export_ids if meter_export >= 0 else this.attributes.get('meter_sensors') }}"
          source: >
            {% set m_ts = this.attributes.get('meter_ts') | float(0) %}
            {% if meter_export >= 0 %}{{ 'Entered counter (kWh)' if p1_export_own | length > 0 else 'P1 meter (kWh counters)' }}
            {% elif m_ts > 0 and (now_ts - m_ts) <= c_meter_max_gone_s %}Meter briefly unreachable (will be added)
            {% else %}Calculated from power (no kWh counter found or entered){% endif %}

      - name: "Forecast Counter Grid Export From Solar"
        unique_id: forecast_counter_grid_export_from_solar
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        # Source briefly gone (e.g. right after a restart): keep the previous value, not unavailable
        availability: "{{ has_value('sensor.forecast_grid_export_from_solar_total') or this.state | is_number }}"
        state: "{{ states('sensor.forecast_grid_export_from_solar_total') | float(0) if has_value('sensor.forecast_grid_export_from_solar_total') else this.state }}"

      - name: "Forecast Counter Zendure Charge"
        unique_id: forecast_counter_zendure_charge
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        # Source briefly gone (e.g. right after a restart): keep the previous value, not unavailable
        availability: "{{ has_value('sensor.forecast_zendure_charge_total') or this.state | is_number }}"
        state: "{{ states('sensor.forecast_zendure_charge_total') | float(0) if has_value('sensor.forecast_zendure_charge_total') else this.state }}"

      - name: "Forecast Counter Zendure Discharge"
        unique_id: forecast_counter_zendure_discharge
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        # Source briefly gone (e.g. right after a restart): keep the previous value, not unavailable
        availability: "{{ has_value('sensor.forecast_zendure_discharge_total') or this.state | is_number }}"
        state: "{{ states('sensor.forecast_zendure_discharge_total') | float(0) if has_value('sensor.forecast_zendure_discharge_total') else this.state }}"

      - name: "Forecast Counter Zendure Charge From Solar"
        unique_id: forecast_counter_zendure_charge_from_solar
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        # Source briefly gone (e.g. right after a restart): keep the previous value, not unavailable
        availability: "{{ has_value('sensor.forecast_zendure_charge_from_solar_total') or this.state | is_number }}"
        state: "{{ states('sensor.forecast_zendure_charge_from_solar_total') | float(0) if has_value('sensor.forecast_zendure_charge_from_solar_total') else this.state }}"

  # -------------------------------------------------------------------
  # 3b. Usage profile per hour (workday and weekend) + shape per quarter
  #     Every full hour: the house usage of the past hour
  #     (import - export + solar - battery charge + battery discharge - car) is folded into a
  #     moving average for that hour of the day, separately for workdays and weekends.
  #     Every quarter the usage of the past quarter is measured as well. Once all four
  #     quarters of an hour are measured, the sensor learns how the usage is spread within
  #     that hour (shape factor per quarter, 1 = evenly spread). The total per hour still
  #     comes from the hourly profile; the shape only spreads it over the quarters.
  #     The shape learns slowly (memory about 4 working weeks / 5 weekends), so cooking or
  #     a washing machine once does not shift it. Hours with very little usage do not count.
  #     Holidays: if binary_sensor.workday_sensor (Workday integration) exists, it decides
  #     whether it is a workday. Otherwise Mon-Fri counts as a workday.
  #     The values are kept after a restart.
  #     Note: the entity must be named sensor.forecast_usage_profile (it reads its own previous values).
  #     Reset: button Reset Usage Data (input_button.forecast_reset_usage_data).
  # -------------------------------------------------------------------
  - trigger:
      - platform: time_pattern
        minutes: "/15"
        seconds: 5
      # Button Reset Usage Data: the profile starts over
      - platform: state
        entity_id: input_button.forecast_reset_usage_data
        not_from:
          - unknown
          - unavailable
        id: reset
    variables:
      # On a reset the sensor does not read its own previous values (an entity that does not exist),
      # so all values fall back to empty / 0 / evenly spread.
      profile: "{{ 'sensor.forecast_usage_profile_reset' if trigger.id == 'reset' else 'sensor.forecast_usage_profile' }}"
      # Weight of a new measurement once there are enough measurements (memory = about 1 / weight measurements):
      c_alpha_min_workday: 0.1           # workday: ~10 measurements = about 2 weeks
      c_alpha_min_weekend: 0.2           # weekend: ~5 measurements = about 2.5 weeks
      c_alpha_min_day: 0.25              # per weekday: ~4 measurements = about 4 weeks (one measurement per week)
      c_alpha_shape_workday: 0.05        # shape per quarter, workday: ~20 measurements = about 4 weeks
      c_alpha_shape_weekend: 0.1         # shape per quarter, weekend: ~10 measurements = about 5 weeks
      c_shape_min_hour_kwh: 0.1          # hours with less usage say nothing about the shape
      c_max_hour_kwh: 15                 # higher hourly usage counts as a measurement error
      now_ts: "{{ as_timestamp(now()) }}"
      full_hour: "{{ now().minute == 0 }}"
      # Current counter values (kWh); -1 = not available
      t_imp: "{{ states('sensor.forecast_counter_grid_import') | float(-1) }}"
      t_exp: "{{ states('sensor.forecast_counter_grid_export') | float(-1) }}"
      t_charge: "{{ states('sensor.forecast_zendure_charge_total') | float(-1) }}"
      t_disch: "{{ states('sensor.forecast_zendure_discharge_total') | float(-1) }}"
      # Energy to the car (zendure_ev_global.yaml) does not count as house usage. Without that package 0.
      t_ev: "{{ states('sensor.ev_charged_total') | float(-1) }}"
      # The AC while it may not run from the battery (zendure_hvac_global.yaml) does not count either. Without package 0.
      t_hvac: "{{ states('sensor.hvac_separate_total') | float(-1) }}"
      t_prod: >
        {% set e = states('input_text.forecast_setting_solar_production_sensor') | lower | replace(' ', '') %}
        {% if e | regex_match('^sensor\\..+') and has_value(e) %}
          {% set u = state_attr(e, 'unit_of_measurement') %}
          {% set v = states(e) | float(-1) %}
          {% if v < 0 %}-1{% elif u == 'Wh' %}{{ v / 1000 }}{% elif u == 'MWh' %}{{ v * 1000 }}{% else %}{{ v }}{% endif %}
        {% elif not e | regex_match('^sensor\\..+') or (states(e) == 'unknown' and state_attr(e, 'friendly_name') is none) %}-2
        {% else %}-1{% endif %}
      prev: "{{ state_attr(profile, 'measurement') }}"
      prev_q: "{{ state_attr(profile, 'measurement_quarter') }}"
      # At night the inverter may be offline: then the previous value applies (no production)
      prod_now: >
        {% if t_prod >= 0 %}{{ t_prod }}
        {% elif t_prod == -2 %}0
        {% elif prev_q is mapping and not is_state('sun.sun', 'above_horizon') %}{{ prev_q.prod }}
        {% elif prev is mapping and not is_state('sun.sun', 'above_horizon') %}{{ prev.prod }}
        {% else %}-1{% endif %}
      ev_now: >
        {% if t_ev >= 0 %}{{ t_ev }}
        {% elif prev_q is mapping and prev_q.ev is defined %}{{ prev_q.ev }}
        {% else %}0{% endif %}
      hvac_now: >
        {% if t_hvac >= 0 %}{{ t_hvac }}
        {% elif prev_q is mapping and prev_q.hvac is defined %}{{ prev_q.hvac }}
        {% else %}0{% endif %}
      measurement_ok: "{{ t_imp >= 0 and t_exp >= 0 and t_charge >= 0 and t_disch >= 0 and prod_now >= 0 }}"
      daytype_now: >
        {% if has_value('binary_sensor.workday_sensor') %}{{ 'workday' if is_state('binary_sensor.workday_sensor', 'on') else 'weekend' }}
        {% else %}{{ 'workday' if now().weekday() < 5 else 'weekend' }}{% endif %}
      # Usage of the past hour (only on the full hour, and if the previous measurement is about one hour old)
      hour_kwh: >
        {% if full_hour and measurement_ok and prev is mapping and 3000 <= now_ts - (prev.ts | float(0)) <= 4200 %}
          {% set d = (t_imp - prev.imp) - (t_exp - prev.exp) + (prod_now - prev.prod) - (t_charge - prev.charge) + (t_disch - prev.disch) %}
          {% set d_ev = (ev_now - prev.ev) if prev.ev is defined else 0 %}
          {% set d_ev = d_ev if 0 <= d_ev <= c_max_hour_kwh else 0 %}
          {% set d_hvac = (hvac_now - prev.hvac) if prev.hvac is defined else 0 %}
          {% set d_hvac = d_hvac if 0 <= d_hvac <= c_max_hour_kwh else 0 %}
          {{ ([d - d_ev - d_hvac, 0] | max | round(3)) if 0 <= d <= c_max_hour_kwh else -1 }}
        {% else %}-1{% endif %}
      hour_idx: "{{ ((prev.ts | float(0)) | timestamp_custom('%H', true) | int) if prev is mapping else -1 }}"
      hour_type: "{{ (prev.daytype if prev is mapping and prev.daytype is defined else 'workday') }}"
      # Weekday of that measurement (0 = Monday). Holidays (a workday weekday counted as weekend) are not learned per day.
      hour_wday: "{{ (((((prev.ts | float(0)) | timestamp_custom('%w', true) | int) + 6) % 7) if prev is mapping else -1) }}"
      hour_day_ok: "{{ hour_kwh >= 0 and hour_wday >= 0 and hour_type == ('workday' if hour_wday < 5 else 'weekend') }}"
      # Usage of the past quarter (if the previous quarter measurement is about a quarter old).
      # A small negative difference (counters not updating at exactly the same time) counts as 0.
      quarter_kwh: >
        {% if measurement_ok and prev_q is mapping and 600 <= now_ts - (prev_q.ts | float(0)) <= 1200 %}
          {% set d = (t_imp - prev_q.imp) - (t_exp - prev_q.exp) + (prod_now - prev_q.prod) - (t_charge - prev_q.charge) + (t_disch - prev_q.disch) %}
          {% set d = 0 if -0.05 <= d < 0 else d %}
          {% set d_ev = (ev_now - prev_q.ev) if prev_q.ev is defined else 0 %}
          {% set d_ev = d_ev if 0 <= d_ev <= c_max_hour_kwh / 4 else 0 %}
          {% set d_hvac = (hvac_now - prev_q.hvac) if prev_q.hvac is defined else 0 %}
          {% set d_hvac = d_hvac if 0 <= d_hvac <= c_max_hour_kwh / 4 else 0 %}
          {{ ([d - d_ev - d_hvac, 0] | max | round(4)) if 0 <= d <= c_max_hour_kwh / 4 else -1 }}
        {% else %}-1{% endif %}
      # Which hour (start, unix) and which quarter (0-3) does that measurement belong to?
      quarter_hour_ts: "{{ ((prev_q.ts | float(0)) // 3600 * 3600) | int if prev_q is mapping else 0 }}"
      quarter_idx: "{{ (((prev_q.ts | float(0)) % 3600) // 900) | int if prev_q is mapping else 0 }}"
      quarter_type: "{{ (prev_q.daytype if prev_q is mapping and prev_q.daytype is defined else daytype_now) }}"
      # The quarters of the running hour, until they are complete
      buffer_old: "{{ state_attr(profile, 'quarter_buffer') }}"
      buffer_new: >
        {%- if quarter_kwh >= 0 -%}
          {%- set same = buffer_old is mapping and (buffer_old.u | int(0)) == quarter_hour_ts and buffer_old.k is defined and buffer_old.k | length == 4 -%}
          {%- set k = buffer_old.k if same else [none, none, none, none] -%}
          {%- set ns = namespace(l=[]) -%}
          {%- for i in range(4) -%}{%- set ns.l = ns.l + [quarter_kwh if i == quarter_idx else k[i]] -%}{%- endfor -%}
          {{ {'u': quarter_hour_ts, 'type': buffer_old.type if same else quarter_type, 'k': ns.l} }}
        {%- else -%}{{ buffer_old if buffer_old is mapping else none }}{%- endif -%}
      # On the full hour: if all four quarters of the previous hour were measured, their shape
      # (shape factor = quarter / average quarter; together 4)
      shape_measurement: >
        {%- set prev_hour = (now_ts // 3600 * 3600 - 3600) | int -%}
        {%- if full_hour and buffer_new is mapping and (buffer_new.u | int(0)) == prev_hour
              and buffer_new.k | select('number') | list | length == 4 -%}
          {%- set total = buffer_new.k | sum -%}
          {%- if total >= c_shape_min_hour_kwh -%}
            {{ {'h': prev_hour | timestamp_custom('%H', true) | int, 'type': buffer_new.type,
                'f': buffer_new.k | map('multiply', 4 / total) | map('round', 3) | list} }}
          {%- else -%}{{ none }}{%- endif -%}
        {%- else -%}{{ none }}{%- endif -%}
    sensor:
      - name: "Forecast Usage Profile"
        unique_id: forecast_usage_profile
        icon: mdi:chart-timeline-variant
        unit_of_measurement: "h"
        state: >
          {% set n1 = state_attr(profile, 'n_workday') or [0] * 24 %}
          {% set n2 = state_attr(profile, 'n_weekend') or [0] * 24 %}
          {% set ns = namespace(k=0) %}
          {% for i in range(24) %}{% if n1[i] | int(0) >= 3 %}{% set ns.k = ns.k + 1 %}{% endif %}{% if n2[i] | int(0) >= 2 %}{% set ns.k = ns.k + 1 %}{% endif %}{% endfor %}
          {{ ns.k }}
        attributes:
          # Average usage (kWh) per hour of the day, index 0 = 00:00-01:00
          workday: >
            {% set old = state_attr(profile, 'workday') or [none] * 24 %}
            {% set n = state_attr(profile, 'n_workday') or [0] * 24 %}
            {% set ns = namespace(l=[]) %}
            {% for i in range(24) %}
              {% set w = old[i] if old | length == 24 else none %}
              {% if hour_kwh >= 0 and hour_type == 'workday' and hour_idx == i %}
                {% set a = [1 / ((n[i] | int(0)) + 1), c_alpha_min_workday] | max %}
                {% set w = hour_kwh if w is none else (w * (1 - a) + hour_kwh * a) %}
                {% set w = w | round(3) %}
              {% endif %}
              {% set ns.l = ns.l + [w] %}
            {% endfor %}
            {{ ns.l }}
          weekend: >
            {% set old = state_attr(profile, 'weekend') or [none] * 24 %}
            {% set n = state_attr(profile, 'n_weekend') or [0] * 24 %}
            {% set ns = namespace(l=[]) %}
            {% for i in range(24) %}
              {% set w = old[i] if old | length == 24 else none %}
              {% if hour_kwh >= 0 and hour_type == 'weekend' and hour_idx == i %}
                {% set a = [1 / ((n[i] | int(0)) + 1), c_alpha_min_weekend] | max %}
                {% set w = hour_kwh if w is none else (w * (1 - a) + hour_kwh * a) %}
                {% set w = w | round(3) %}
              {% endif %}
              {% set ns.l = ns.l + [w] %}
            {% endfor %}
            {{ ns.l }}
          # Number of measurements per hour
          n_workday: >
            {% set n = state_attr(profile, 'n_workday') or [0] * 24 %}
            {% set ns = namespace(l=[]) %}
            {% for i in range(24) %}
              {% set k = (n[i] | int(0)) if n | length == 24 else 0 %}
              {% set ns.l = ns.l + [k + 1 if (hour_kwh >= 0 and hour_type == 'workday' and hour_idx == i) else k] %}
            {% endfor %}
            {{ ns.l }}
          n_weekend: >
            {% set n = state_attr(profile, 'n_weekend') or [0] * 24 %}
            {% set ns = namespace(l=[]) %}
            {% for i in range(24) %}
              {% set k = (n[i] | int(0)) if n | length == 24 else 0 %}
              {% set ns.l = ns.l + [k + 1 if (hour_kwh >= 0 and hour_type == 'weekend' and hour_idx == i) else k] %}
            {% endfor %}
            {{ ns.l }}
          # Per weekday (0 = Monday): average usage per hour, and the number of measurements
          per_day: >
            {% set oud = state_attr(profile, 'per_day') or [] %}
            {% set n = state_attr(profile, 'n_per_day') or [] %}
            {% set ns = namespace(l=[]) %}
            {% for d in range(7) %}
              {% set rij = oud[d] if oud | length == 7 and oud[d] | length == 24 else [none] * 24 %}
              {% set nr = n[d] if n | length == 7 and n[d] | length == 24 else [0] * 24 %}
              {% set nd = namespace(l=[]) %}
              {% for i in range(24) %}
                {% set w = rij[i] %}
                {% if hour_day_ok and hour_wday == d and hour_idx == i %}
                  {% set a = [1 / ((nr[i] | int(0)) + 1), c_alpha_min_day] | max %}
                  {% set w = (hour_kwh if w is none else (w * (1 - a) + hour_kwh * a)) | round(3) %}
                {% endif %}
                {% set nd.l = nd.l + [w] %}
              {% endfor %}
              {% set ns.l = ns.l + [nd.l] %}
            {% endfor %}
            {{ ns.l }}
          n_per_day: >
            {% set n = state_attr(profile, 'n_per_day') or [] %}
            {% set ns = namespace(l=[]) %}
            {% for d in range(7) %}
              {% set nr = n[d] if n | length == 7 and n[d] | length == 24 else [0] * 24 %}
              {% set nd = namespace(l=[]) %}
              {% for i in range(24) %}
                {% set nd.l = nd.l + [(nr[i] | int(0)) + (1 if (hour_day_ok and hour_wday == d and hour_idx == i) else 0)] %}
              {% endfor %}
              {% set ns.l = ns.l + [nd.l] %}
            {% endfor %}
            {{ ns.l }}
          # Shape factor per quarter of the day (96 values, index 0 = 00:00-00:15; 1 = evenly spread,
          # the four quarters of an hour add up to 4)
          shape_workday: >
            {% set old = state_attr(profile, 'shape_workday') or [] %}
            {% set old = old if old | length == 96 else [1.0] * 96 %}
            {% set n = state_attr(profile, 'n_shape_workday') or [] %}
            {% set ok = shape_measurement is mapping and shape_measurement.type == 'workday' %}
            {% set ns = namespace(l=[]) %}
            {% for i in range(96) %}
              {% set w = old[i] | float(1) %}
              {% if ok and i // 4 == shape_measurement.h %}
                {% set a = [1 / (((n[shape_measurement.h] | int(0)) if n | length == 24 else 0) + 1), c_alpha_shape_workday] | max %}
                {% set w = w * (1 - a) + shape_measurement.f[i % 4] * a %}
              {% endif %}
              {% set ns.l = ns.l + [w | round(3)] %}
            {% endfor %}
            {{ ns.l }}
          shape_weekend: >
            {% set old = state_attr(profile, 'shape_weekend') or [] %}
            {% set old = old if old | length == 96 else [1.0] * 96 %}
            {% set n = state_attr(profile, 'n_shape_weekend') or [] %}
            {% set ok = shape_measurement is mapping and shape_measurement.type == 'weekend' %}
            {% set ns = namespace(l=[]) %}
            {% for i in range(96) %}
              {% set w = old[i] | float(1) %}
              {% if ok and i // 4 == shape_measurement.h %}
                {% set a = [1 / (((n[shape_measurement.h] | int(0)) if n | length == 24 else 0) + 1), c_alpha_shape_weekend] | max %}
                {% set w = w * (1 - a) + shape_measurement.f[i % 4] * a %}
              {% endif %}
              {% set ns.l = ns.l + [w | round(3)] %}
            {% endfor %}
            {{ ns.l }}
          # Number of complete hours (four quarters measured) per hour of the day
          n_shape_workday: >
            {% set n = state_attr(profile, 'n_shape_workday') or [] %}
            {% set ns = namespace(l=[]) %}
            {% for i in range(24) %}
              {% set k = (n[i] | int(0)) if n | length == 24 else 0 %}
              {% set ns.l = ns.l + [k + 1 if (shape_measurement is mapping and shape_measurement.type == 'workday' and shape_measurement.h == i) else k] %}
            {% endfor %}
            {{ ns.l }}
          n_shape_weekend: >
            {% set n = state_attr(profile, 'n_shape_weekend') or [] %}
            {% set ns = namespace(l=[]) %}
            {% for i in range(24) %}
              {% set k = (n[i] | int(0)) if n | length == 24 else 0 %}
              {% set ns.l = ns.l + [k + 1 if (shape_measurement is mapping and shape_measurement.type == 'weekend' and shape_measurement.h == i) else k] %}
            {% endfor %}
            {{ ns.l }}
          last_hour_kwh: >
            {% if full_hour %}{{ hour_kwh if hour_kwh >= 0 else none }}
            {% else %}{{ state_attr(profile, 'last_hour_kwh') }}{% endif %}
          last_hour: >
            {% if full_hour %}{{ ('%02d:00 (%s)' | format(hour_idx, hour_type)) if hour_idx >= 0 and hour_kwh >= 0 else none }}
            {% else %}{{ state_attr(profile, 'last_hour') }}{% endif %}
          last_quarter_kwh: "{{ quarter_kwh if quarter_kwh >= 0 else none }}"
          quarter_buffer: "{{ buffer_new }}"
          # Counter values for the calculation an hour from now (only updated on the full hour)
          measurement: >
            {% if full_hour %}
              {% if measurement_ok %}{{ {'ts': now_ts | round(0), 'imp': t_imp, 'exp': t_exp, 'prod': prod_now, 'charge': t_charge, 'disch': t_disch, 'ev': ev_now, 'hvac': hvac_now, 'daytype': daytype_now} }}{% else %}{{ prev }}{% endif %}
            {% else %}{{ prev }}{% endif %}
          # Counter values for the calculation a quarter from now
          measurement_quarter: >
            {% if measurement_ok %}{{ {'ts': now_ts | round(0), 'imp': t_imp, 'exp': t_exp, 'prod': prod_now, 'charge': t_charge, 'disch': t_disch, 'ev': ev_now, 'hvac': hvac_now, 'daytype': daytype_now} }}{% else %}{{ prev_q }}{% endif %}

  # -------------------------------------------------------------------
  # Solar per month: actual solar production versus the forecast (for the reliability per month).
  #   Every day at 23:58: today's solar production (solar counter) and the forecast that applied for
  #   today yesterday at 23:58 ("Solar tomorrow sensor", without reliability correction) are added up.
  #   At the first measurement in a new month the previous month is finalised (attribute finalised);
  #   an automation puts that value in the month field. State = ratio this month (%).
  # -------------------------------------------------------------------
  - trigger:
      - platform: time_pattern
        hours: 23
        minutes: 58
    variables:
      sm_prev: "{{ states.sensor.forecast_solar_month_measurement.attributes if states.sensor.forecast_solar_month_measurement is not none else {} }}"
      sm_counter: "{{ states('sensor.forecast_counter_solar_production') | float(-1) }}"
      sm_tomorrow: >
        {% set e = states('input_text.forecast_setting_solar_tomorrow_sensor') | lower | replace(' ', '') %}
        {% if e | regex_match('^sensor\\..+') and has_value(e) %}
          {% set u = state_attr(e, 'unit_of_measurement') %}
          {% set v = states(e) | float(-1) %}
          {% if v < 0 %}-1{% elif u == 'Wh' %}{{ v / 1000 }}{% elif u == 'MWh' %}{{ v * 1000 }}{% else %}{{ v }}{% endif %}
        {% else %}-1{% endif %}
      sm_yesterday: "{{ (now() - timedelta(days=1)).strftime('%Y-%m-%d') }}"
      sm_month: "{{ now().strftime('%Y-%m') }}"
      # Does today count? Yesterday a counter reading and a forecast for today were recorded.
      sm_day_ok: >
        {{ sm_prev.date is defined and sm_prev.date == sm_yesterday and sm_counter >= 0
           and (sm_prev.counter_start | float(-1)) >= 0 and (sm_prev.forecast_today | float(-1)) > 0
           and 0 <= sm_counter - (sm_prev.counter_start | float(0)) <= 200 }}
      sm_new_month: "{{ sm_prev.month is defined and sm_prev.month != sm_month }}"
      sm_a: "{{ ((0 if sm_new_month else (sm_prev.actual_kwh | float(0))) + ((sm_counter - (sm_prev.counter_start | float(0))) if sm_day_ok else 0)) | round(3) }}"
      sm_f: "{{ ((0 if sm_new_month else (sm_prev.forecast_kwh | float(0))) + ((sm_prev.forecast_today | float(0)) if sm_day_ok else 0)) | round(3) }}"
      sm_n: "{{ (0 if sm_new_month else (sm_prev.days | int(0))) + (1 if sm_day_ok else 0) }}"
    sensor:
      - name: "Forecast Solar Month Measurement"
        unique_id: forecast_solar_month_measurement
        icon: mdi:calendar-month
        unit_of_measurement: "%"
        state: "{{ ((sm_a / sm_f * 100) | round(0)) if sm_f >= 1 else none }}"
        attributes:
          month: "{{ sm_month }}"
          date: "{{ now().strftime('%Y-%m-%d') }}"
          actual_kwh: "{{ sm_a }}"
          forecast_kwh: "{{ sm_f }}"
          days: "{{ sm_n }}"
          counter_start: "{{ sm_counter if sm_counter >= 0 else none }}"
          forecast_today: "{{ sm_tomorrow if sm_tomorrow > 0 else none }}"
          # Finalised previous month: at least 10 days and 5 kWh forecast, ratio 10-150%
          finalised: >
            {% if sm_new_month and (sm_prev.days | int(0)) >= 10 and (sm_prev.forecast_kwh | float(0)) >= 5 %}
              {{ {'month': sm_prev.month, 'pct': ([[((sm_prev.actual_kwh | float(0)) / (sm_prev.forecast_kwh | float(1)) * 100) | round(0) | int, 10] | max, 150] | min),
                  'actual_kwh': sm_prev.actual_kwh, 'forecast_kwh': sm_prev.forecast_kwh, 'days': sm_prev.days} }}
            {% else %}{{ sm_prev.finalised if sm_prev.finalised is defined else none }}{% endif %}

  # -------------------------------------------------------------------
  # 4. THE PLANNER
  #    All calculations are in "variables" (once per calculation)
  #    and are reused by the state and the attributes.
  #
  #    State:  Charge | Waiting | Not needed | Not favorable |
  #            No prices | No battery data
  #    The automation only charges when the state is "Charge".
  # -------------------------------------------------------------------
  - trigger:
      # Every quarter hour, just after the price change (and after the usage profile at :05). Also right
      # away on changes in settings, prices or state of charge (stops charging in time when the battery is full).
      - platform: time_pattern
        minutes: "/15"
        seconds: 10
      - platform: homeassistant
        event: start
      - platform: state
        entity_id:
          - input_button.forecast_recalculate
          - input_text.forecast_setting_solar_remaining_today_sensor
          - input_text.forecast_setting_solar_tomorrow_sensor
          - input_text.forecast_setting_solar_production_sensor
          - input_number.forecast_setting_charge_margin
          - input_number.forecast_setting_solar_reliability
          - input_number.forecast_setting_solar_reliability_jan
          - input_number.forecast_setting_solar_reliability_feb
          - input_number.forecast_setting_solar_reliability_mar
          - input_number.forecast_setting_solar_reliability_apr
          - input_number.forecast_setting_solar_reliability_may
          - input_number.forecast_setting_solar_reliability_jun
          - input_number.forecast_setting_solar_reliability_jul
          - input_number.forecast_setting_solar_reliability_aug
          - input_number.forecast_setting_solar_reliability_sep
          - input_number.forecast_setting_solar_reliability_oct
          - input_number.forecast_setting_solar_reliability_nov
          - input_number.forecast_setting_solar_reliability_dec
          - input_boolean.forecast_setting_hold_discharge_in_dip
          - input_boolean.forecast_setting_smart_hold
          - sensor.forecast_measured_charge_power
          - input_boolean.forecast_setting_calibration_off
          - input_number.forecast_setting_calibration_days
          - sensor.zendure_last_calibration_days
          - input_number.dynamic_setting_minimal_spread
          - input_number.zendure_setting_max_charge_power
          - input_boolean.dynamic_setting_15_minute_interval
          - sensor.dynamic_nordpool
          - sensor.zendure_total_state_of_charge
          - sensor.zendure_minimum_state_of_charge
          - sensor.zendure_maximum_state_of_charge
    variables:
      # ---- Settings (fixed values, adjust here) ----------------------
      c_self_consumption_default_pct: 30   # starting value for self-consumption until the first solar production is measured
      c_usage_start_kwh: 8               # starting value for daily usage, only in the first hours after installation
      c_min_hist_days: 0.08              # history from about 2 hours is already used (day 1)
      c_min_production_kwh: 0.3          # minimum measured solar production for a self-consumption calculation
      c_min_usage_kwh: 0.2               # lower calculated daily usage is ignored
      c_sun_offset_s: 7200               # solar counts as "sufficient" 2 hours after sunrise
      c_min_bridge_s: 1800         # bridging is at least 30 minutes
      c_charge_start_kwh: 0.3             # a charging round starts from this grid charge (kWh)
      c_charge_stop_kwh: 0.05             # a charging round stops below this remainder (kWh)
      c_hold_min_difference: 0.01        # smart hold: price now at least this much (€/kWh) below the threshold price
      c_hold_charge_min_kwh: 0.5         # smart hold: only off with at least this much planned grid charging (kWh) before the end of the gap
      c_charge_min_w: 500                 # measured charge power below this level is ignored
      c_price_floor: 0.02               # lower bound in price comparisons (EUR/kWh)
      c_path_min_hours: 0.25               # path check only for a gap of at least 15 minutes
      c_path_min_shortfall_kwh: 0.2          # and a shortfall of at least 0.2 kWh
      c_detail_period_s: 1800            # length of a period in the detailed forecast (Solcast: 30 min)
      c_cover_offset_s: 10800            # without a detailed forecast: solar covers usage 3 hours after sunrise
      c_cover_min_kwh: 2                 # and only if at least this much solar is expected that day
      c_solar_credit: 0.75               # pre-discharge: expected solar surplus counts for only 75% (the forecast can be too optimistic)
      c_pd_min_kwh: 0.5                  # pre-discharge: only from this much expected solar surplus in a negative window
      c_shape_n_full_workday: 10         # shape per quarter counts fully after this many complete hours (workday)
      c_calibration_days: 14             # calibration charging: default after this many days without 100%
      c_day_n_full: 3                    # profile per weekday counts fully after this many measurements (weeks) of that hour
      c_shape_n_full_weekend: 5          # same for weekends; before that gradually (fewer measurements = closer to even)

      # ---- Time -------------------------------------------------------
      now_ts: "{{ as_timestamp(now()) }}"
      end_today_ts: "{{ as_timestamp(today_at('00:00') + timedelta(days=1)) }}"
      # Actual length of today (25 or 23 hours on the day of the DST change)
      day_length: "{{ end_today_ts - as_timestamp(today_at('00:00')) }}"
      dt_h: "{{ 0.25 if is_state('input_boolean.dynamic_setting_15_minute_interval', 'on') else 1.0 }}"

      # ---- Battery ----------------------------------------------------
      p_set_kw: "{{ [states('input_number.zendure_setting_max_charge_power') | float(2400), 100] | max / 1000 }}"
      # Measured average grid charge power (W); unknown or below c_charge_min_w = not yet usable
      p_measured_w: "{{ states('sensor.forecast_measured_charge_power') | float(0) }}"
      # Calculate with what the battery actually achieves, never more than the configured maximum
      p_max_kw: "{{ ([p_set_kw, p_measured_w / 1000] | min) if p_measured_w >= c_charge_min_w else p_set_kw }}"
      e_slot: "{{ (p_max_kw * dt_h) | round(4) }}"
      cap: "{{ states('sensor.zendure_total_capacity') | float(0) }}"
      soc: "{{ states('sensor.zendure_total_state_of_charge') | float(0) }}"
      soc_min: "{{ states('sensor.zendure_minimum_state_of_charge') | float(0) }}"
      soc_max: "{{ states('sensor.zendure_maximum_state_of_charge') | float(100) }}"
      s_max: "{{ ([soc_max - soc_min, 0] | max / 100 * cap) | round(3) }}"
      s_now: "{{ ([[soc, soc_max] | min - soc_min, 0] | max / 100 * cap) | round(3) }}"
      room: "{{ ([soc_max - soc, 0] | max / 100 * cap) | round(3) }}"
      # Efficiency: from the total RTE (all kWh out / all kWh in, energy-weighted), split
      # equally over charging and discharging (square root). The 24-hour point measurements
      # of efficiency are unweighted and count every stop as 0%, which makes them too low;
      # they are only used when the total RTE is not (yet) usable.
      rte_total: "{{ states('sensor.zendure_rte_total') | float(0) }}"
      rte_ok: "{{ 60 <= rte_total <= 100 }}"
      eff_rte_base: "{{ ((rte_total / 100) ** 0.5 * 100) if rte_ok else 0 }}"
      eff_in: >
        {% set m = states('sensor.zendure_import_efficiency_24h') | float(0) %}
        {% set e = eff_rte_base if rte_ok else m %}
        {{ (e if 50 <= e <= 100 else 92) / 100 }}
      eff_out: >
        {% set m = states('sensor.zendure_export_efficiency_24h') | float(0) %}
        {% set e = eff_rte_base if rte_ok else m %}
        {{ (e if 50 <= e <= 100 else 92) / 100 }}
      efficiency_source: >
        {% if rte_ok %}Total RTE ({{ rte_total | round(1) }}%), split equally over charging and discharging
        {% elif states('sensor.zendure_import_efficiency_24h') | float(0) >= 50 %}24-hour average of point measurements (total RTE not usable yet)
        {% else %}Default value 92% per direction{% endif %}
      eff_rt: "{{ (eff_in * eff_out) | round(4) }}"

      # ---- Solar energy (kWh) -----------------------------------------
      # -1 = sensor not filled in or not available
      solar_rest_raw: >
        {% set e = states('input_text.forecast_setting_solar_remaining_today_sensor') %}
        {% if e | lower | regex_match('^sensor\\..+') and has_value(e) %}
          {% set u = state_attr(e, 'unit_of_measurement') %}
          {% set v = states(e) | float(0) %}
          {% if u == 'Wh' %}{{ v / 1000 }}{% elif u == 'MWh' %}{{ v * 1000 }}{% else %}{{ v }}{% endif %}
        {% else %}-1{% endif %}
      solar_tomorrow_raw: >
        {% set e = states('input_text.forecast_setting_solar_tomorrow_sensor') %}
        {% if e | lower | regex_match('^sensor\\..+') and has_value(e) %}
          {% set u = state_attr(e, 'unit_of_measurement') %}
          {% set v = states(e) | float(0) %}
          {% if u == 'Wh' %}{{ v / 1000 }}{% elif u == 'MWh' %}{{ v * 1000 }}{% else %}{{ v }}{% endif %}
        {% else %}-1{% endif %}
      # Reliability of this month; 0 = not filled in, then the general one; also 0 = 100%
      reliab_month: "{{ states('input_number.forecast_setting_solar_reliability_' ~ ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'][now().month - 1]) | float(0) }}"
      reliab_general: "{{ states('input_number.forecast_setting_solar_reliability') | float(0) }}"
      reliab_set: "{{ reliab_month > 0 or reliab_general > 0 }}"
      reliab: "{{ (reliab_month if reliab_month > 0 else (reliab_general if reliab_general > 0 else 100)) / 100 }}"
      reliab_source: "{{ ('Month (' ~ ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'][now().month - 1] ~ ')') if reliab_month > 0 else ('General' if reliab_general > 0 else 'Not filled in (100%)') }}"
      solar_rest: "{{ ([solar_rest_raw, 0] | max * reliab) | round(2) }}"
      solar_tomorrow: "{{ ([solar_tomorrow_raw, 0] | max * reliab) | round(2) }}"

      # ---- History over 7 days ----------------------------------------
      # Previous 7-day values (attribute history_7_days of the plan). If a 7-day sensor is briefly
      # unavailable (e.g. right after a restart), the previous value is used instead of 0, so the
      # daily usage and the self-consumption do not get skewed. A sensor that does not exist (any
      # more) (package removed) counts as 0.
      hist_7_prev: "{{ state_attr('sensor.zendure_forecast_plan', 'history_7_days') or {} }}"
      prod7: >
        {% set e = 'sensor.forecast_solar_production_7_days' %}
        {{ states(e) | float(hist_7_prev.get('prod7', 0) if states[e] is not none and not state_attr(e, 'restored') else 0) }}
      imp7: >
        {% set e = 'sensor.forecast_grid_import_7_days' %}
        {{ states(e) | float(hist_7_prev.get('imp7', 0) if states[e] is not none and not state_attr(e, 'restored') else 0) }}
      exp7: >
        {% set e = 'sensor.forecast_grid_export_7_days' %}
        {{ states(e) | float(hist_7_prev.get('exp7', 0) if states[e] is not none and not state_attr(e, 'restored') else 0) }}
      exp_solar7: >
        {% set e = 'sensor.forecast_grid_export_from_solar_7_days' %}
        {{ states(e) | float(hist_7_prev.get('exp_solar7', 0) if states[e] is not none and not state_attr(e, 'restored') else 0) }}
      charge7: >
        {% set e = 'sensor.forecast_zendure_charge_7_days' %}
        {{ states(e) | float(hist_7_prev.get('charge7', 0) if states[e] is not none and not state_attr(e, 'restored') else 0) }}
      discharge7: >
        {% set e = 'sensor.forecast_zendure_discharge_7_days' %}
        {{ states(e) | float(hist_7_prev.get('discharge7', 0) if states[e] is not none and not state_attr(e, 'restored') else 0) }}
      charge_solar7: >
        {% set e = 'sensor.forecast_zendure_charge_from_solar_7_days' %}
        {{ states(e) | float(hist_7_prev.get('charge_solar7', 0) if states[e] is not none and not state_attr(e, 'restored') else 0) }}
      # Car (zendure_ev_global.yaml): not house usage and not direct solar usage. Without the package 0.
      ev7: >
        {% set e = 'sensor.ev_charged_7_days' %}
        {{ states(e) | float(hist_7_prev.get('ev7', 0) if states[e] is not none and not state_attr(e, 'restored') else 0) }}
      ev_solar7: >
        {% set e = 'sensor.ev_charged_from_solar_7_days' %}
        {{ states(e) | float(hist_7_prev.get('ev_solar7', 0) if states[e] is not none and not state_attr(e, 'restored') else 0) }}
      # The AC while it may not run from the battery (zendure_hvac_global.yaml): same treatment. Without package 0.
      hvac7: >
        {% set e = 'sensor.hvac_separate_7_days' %}
        {{ states(e) | float(hist_7_prev.get('hvac7', 0) if states[e] is not none and not state_attr(e, 'restored') else 0) }}
      hvac_solar7: >
        {% set e = 'sensor.hvac_separate_from_solar_7_days' %}
        {{ states(e) | float(hist_7_prev.get('hvac_solar7', 0) if states[e] is not none and not state_attr(e, 'restored') else 0) }}
      # Which 7-day figures currently use the previous value
      hist_7_missing: >
        {%- set ns = namespace(l=[]) -%}
        {%- for k, e in [['prod7', 'sensor.forecast_solar_production_7_days'], ['imp7', 'sensor.forecast_grid_import_7_days'], ['exp7', 'sensor.forecast_grid_export_7_days'], ['exp_solar7', 'sensor.forecast_grid_export_from_solar_7_days'], ['charge7', 'sensor.forecast_zendure_charge_7_days'], ['discharge7', 'sensor.forecast_zendure_discharge_7_days'], ['charge_solar7', 'sensor.forecast_zendure_charge_from_solar_7_days'], ['ev7', 'sensor.ev_charged_7_days'], ['ev_solar7', 'sensor.ev_charged_from_solar_7_days'], ['hvac7', 'sensor.hvac_separate_7_days'], ['hvac_solar7', 'sensor.hvac_separate_from_solar_7_days']] -%}
          {%- if states[e] is not none and not state_attr(e, 'restored') and not has_value(e) -%}{%- set ns.l = ns.l + [k] -%}{%- endif -%}
        {%- endfor -%}
        {{ ns.l }}
      hist_days: >
        {# Largest coverage of solar, grid import and battery charging: without solar panels (or
           when the solar counter is temporarily missing) the history of the other counters
           counts. No value at all (e.g. right after a reset): no history yet. #}
        {% set ns = namespace(c=0) %}
        {% for e in ['sensor.forecast_solar_production_7_days', 'sensor.forecast_grid_import_7_days', 'sensor.forecast_zendure_charge_7_days'] %}
          {% set c = state_attr(e, 'age_coverage_ratio') %}
          {% if c is not none %}{% set ns.c = [ns.c, c | float(0)] | max %}{% endif %}
        {% endfor %}
        {{ (7 * ns.c) | round(2) }}

      # Directly used solar in 7 days = production - export from solar - charging from solar - car from solar
      # - AC from solar (counted separately)
      direct_7_kwh: "{{ [prod7 - exp_solar7 - charge_solar7 - ev_solar7 - hvac_solar7, 0] | max }}"
      # Solar self-consumption (%) = directly used solar / production
      # Calculated from the first measured solar production (day 1), with the history available.
      self_consumption_calculated: >
        {% if prod7 >= c_min_production_kwh and hist_days >= c_min_hist_days %}
          {{ ([direct_7_kwh / prod7 * 100, 100] | min) | round(1) }}
        {% else %}-1{% endif %}
      self_consumption_pct: "{{ self_consumption_calculated if self_consumption_calculated >= 0 else c_self_consumption_default_pct }}"
      direct: "{{ self_consumption_pct / 100 }}"
      # Direct solar usage in kWh per day (average over the available history, max. 7 days).
      # This is fairly constant, so on a dull day the percentage is high and on a sunny day it is low.
      # Only from 1 day of history: scaling part of a day to a whole day gives a skewed picture.
      direct_day_kwh: >
        {% if prod7 >= c_min_production_kwh and hist_days >= 1 %}
          {{ (direct_7_kwh / hist_days) | round(2) }}
        {% else %}-1{% endif %}
      direct_model_kwh: "{{ direct_day_kwh >= 0 }}"
      self_consumption_source: >
        {% if direct_model_kwh %}Calculated (kWh per day, {{ [hist_days, 7] | min | round(1) }} of 7 days{{ ', partly previous values' if hist_7_missing | length > 0 else '' }})
        {% elif self_consumption_calculated >= 0 %}Calculated (% of production, day 1)
        {% else %}Starting value {{ c_self_consumption_default_pct }}% (no solar production measured yet){% endif %}

      # Average usage per day = import - export + production - charging + discharging - car - AC (separate)
      # Calculated from about 2 hours of history and scaled to a day; gets more accurate every day.
      usage_day_calculated: >
        {% if hist_days >= c_min_hist_days and (imp7 + prod7) > 0 %}
          {{ (([imp7 - exp7 + prod7 - charge7 + discharge7 - ev7 - hvac7, 0] | max) / hist_days) | round(2) }}
        {% else %}-1{% endif %}
      usage_day: "{{ usage_day_calculated if usage_day_calculated >= c_min_usage_kwh else c_usage_start_kwh }}"
      usage_source: >
        {% if usage_day_calculated >= c_min_usage_kwh %}Calculated ({{ [hist_days, 7] | min | round(1) }} of 7 days{{ ', day 1' if hist_days < 1 else '' }}{{ ', partly previous values' if hist_7_missing | length > 0 else '' }})
        {% else %}Starting value {{ c_usage_start_kwh }} kWh (first hours, history is being built){% endif %}
      l_hour: "{{ usage_day / 24 }}"

      # ---- Usage profile per hour (workday / weekend) -----------------
      # Per hour of the day the learned usage applies once there are enough measurements
      # (workday 3, weekend 2), otherwise the day average / 24.
      prof_wd: "{{ state_attr('sensor.forecast_usage_profile', 'workday') or [] }}"
      prof_we: "{{ state_attr('sensor.forecast_usage_profile', 'weekend') or [] }}"
      prof_n_wd: "{{ state_attr('sensor.forecast_usage_profile', 'n_workday') or [] }}"
      prof_n_we: "{{ state_attr('sensor.forecast_usage_profile', 'n_weekend') or [] }}"
      prof_day: "{{ state_attr('sensor.forecast_usage_profile', 'per_day') or [] }}"
      prof_n_day: "{{ state_attr('sensor.forecast_usage_profile', 'n_per_day') or [] }}"
      today_workday: >
        {% if has_value('binary_sensor.workday_sensor') %}{{ is_state('binary_sensor.workday_sensor', 'on') }}
        {% else %}{{ now().weekday() < 5 }}{% endif %}
      # 52 hour blocks from the current full hour: {'s': start, 'kw': kWh per hour, 'p': from profile}
      hour_load: >
        {%- set ns = namespace(l=[]) -%}
        {%- set h0 = (now_ts // 3600) * 3600 -%}
        {%- set today = now().date() | string -%}
        {%- for i in range(52) -%}
          {%- set st = h0 + i * 3600 -%}
          {%- set h = st | timestamp_custom('%H', true) | int -%}
          {%- set day = st | timestamp_custom('%Y-%m-%d', true) -%}
          {%- set wd = today_workday if day == today else (st | timestamp_custom('%w', true) | int) not in [0, 6] -%}
          {%- set prof = prof_wd if wd else prof_we -%}
          {%- set pn = prof_n_wd if wd else prof_n_we -%}
          {%- set nmin = 3 if wd else 2 -%}
          {%- set has = prof | length == 24 and pn | length == 24 and prof[h] is not none -%}
          {%- set n = (pn[h] | int(0)) if has else 0 -%}
          {%- set ok = has and n >= nmin -%}
          {#- Not enough measurements yet: blend the measurements there are with the day average
              (1 of 2 measurements = half profile, half day average). That way a clear evening
              peak already counts while the profile is still learning. -#}
          {%- set kw = (prof[h] | float(l_hour)) if ok else (((n * (prof[h] | float(l_hour)) + (nmin - n) * l_hour) / nmin) if has and n > 0 else l_hour) -%}
          {#- Per weekday (e.g. working from home): blend in that weekday's profile by the number of
              measurements (3 = fully). Not on a holiday counted as weekend. -#}
          {%- set wday = ((st | timestamp_custom('%w', true) | int) + 6) % 7 -%}
          {%- set normal = wday < 5 -%}
          {%- set pd = prof_day[wday] if prof_day | length == 7 and prof_day[wday] | length == 24 else [] -%}
          {%- set pdn = ((prof_n_day[wday][h] | int(0)) if prof_n_day | length == 7 and prof_n_day[wday] | length == 24 else 0) if pd | length == 24 and pd[h] is not none and wd == normal else 0 -%}
          {%- set wdg = [pdn / c_day_n_full, 1] | min -%}
          {%- set kw = (wdg * (pd[h] | float(kw)) + (1 - wdg) * kw) if pdn > 0 else kw -%}
          {%- set ok = ok or pdn >= c_day_n_full -%}
          {%- set ns.l = ns.l + [{'s': st, 'kw': kw | round(4), 'p': ok, 'wd': wd, 'dg': (wdg * 100) | round(0)}] -%}
        {%- endfor -%}
        {{ ns.l }}
      hour_load_end_ts: "{{ (now_ts // 3600) * 3600 + 52 * 3600 }}"
      profile_share: "{{ (hour_load[:24] | selectattr('p') | list | length / 24 * 100) | round(0) }}"
      usage_source_hour: >
        {% if profile_share >= 100 %}Profile per hour ({{ 'workday' if today_workday else 'weekend' }})
        {% elif profile_share > 0 %}Partly profile ({{ profile_share | int }}% of the next 24 hours), rest day average
        {% else %}Day average (profile still being learned){% endif %}

      # ---- Usage per quarter (hourly profile x learned shape) ----------
      # The hourly usage above is spread over the four quarters using the learned shape.
      # While the shape has few measurements, it moves gradually from evenly spread to the
      # learned shape. The total per hour stays the same. Used where the planner works per
      # price slot: solar coverage, battery empty, path check, smart hold, tomorrow and timeline.
      shape_wd: "{{ state_attr('sensor.forecast_usage_profile', 'shape_workday') or [] }}"
      shape_we: "{{ state_attr('sensor.forecast_usage_profile', 'shape_weekend') or [] }}"
      shape_n_wd: "{{ state_attr('sensor.forecast_usage_profile', 'n_shape_workday') or [] }}"
      shape_n_we: "{{ state_attr('sensor.forecast_usage_profile', 'n_shape_weekend') or [] }}"
      q_s0: "{{ ((now_ts // 3600) * 3600) | int }}"
      # Average power (kW) per quarter, 208 quarters from the current full hour
      q_kw: >
        {%- set ns = namespace(l=[]) -%}
        {%- for u in hour_load -%}
          {%- set h = u.s | timestamp_custom('%H', true) | int -%}
          {%- set v = shape_wd if u.wd else shape_we -%}
          {%- set n = shape_n_wd if u.wd else shape_n_we -%}
          {%- set nfull = c_shape_n_full_workday if u.wd else c_shape_n_full_weekend -%}
          {%- set w = ([(n[h] | int(0)) / nfull, 1] | min) if (v | length == 96 and n | length == 24) else 0 -%}
          {%- set f = namespace(l=[], tot=0) -%}
          {%- for i in range(4) -%}
            {%- set fi = [1 + ((v[h * 4 + i] | float(1)) - 1) * w, 0] | max if w > 0 else 1 -%}
            {%- set f.l = f.l + [fi] -%}{%- set f.tot = f.tot + fi -%}
          {%- endfor -%}
          {%- for fi in f.l -%}
            {%- set ns.l = ns.l + [(u.kw * fi * 4 / f.tot) | round(4) if f.tot > 0 else u.kw] -%}
          {%- endfor -%}
        {%- endfor -%}
        {{ ns.l }}
      # How strongly the learned shape counts over the next 24 hours (0% = even, 100% = fully learned)
      shape_share: >
        {%- set ns = namespace(w=0) -%}
        {%- for u in hour_load[:24] -%}
          {%- set h = u.s | timestamp_custom('%H', true) | int -%}
          {%- set n = shape_n_wd if u.wd else shape_n_we -%}
          {%- set nfull = c_shape_n_full_workday if u.wd else c_shape_n_full_weekend -%}
          {%- set ns.w = ns.w + (([(n[h] | int(0)) / nfull, 1] | min) if n | length == 24 else 0) -%}
        {%- endfor -%}
        {{ (ns.w / 24 * 100) | round(0) }}
      usage_source_quarter: >
        {% if shape_share >= 100 %}Learned shape per quarter
        {% elif shape_share > 0 %}Partly learned shape per quarter ({{ shape_share | int }}%), rest evenly spread over the hour
        {% else %}Evenly spread over the hour (shape still being learned){% endif %}

      # ---- Margin -----------------------------------------------------
      margin_pct: "{{ states('input_number.forecast_setting_charge_margin') | float(0) }}"
      margin_dc: "{{ (margin_pct / 100 * cap) | round(3) }}"

      # ---- Sun (rise) -------------------------------------------------
      next_sun_ts: "{{ as_timestamp(state_attr('sun.sun', 'next_rising'), now_ts + 43200) }}"
      sun_day_is_today: "{{ next_sun_ts < end_today_ts }}"
      solar_forecast_next: "{{ solar_rest if sun_day_is_today else solar_tomorrow }}"
      solar_sufficient: >
        {% set raw = solar_rest_raw if sun_day_is_today else solar_tomorrow_raw %}
        {{ raw >= 0 and solar_forecast_next >= usage_day }}
      t_sun_ts: "{{ next_sun_ts + c_sun_offset_s }}"

      # ---- Price slots ------------------------------------------------
      prices_today: "{{ state_attr('sensor.dynamic_nordpool', 'raw_today') or [] }}"
      prices_tomorrow: "{{ state_attr('sensor.dynamic_nordpool', 'raw_tomorrow') or [] }}"
      prices_ok: "{{ prices_today | length > 0 }}"
      tomorrow_known: "{{ prices_tomorrow | length > 0 }}"
      # Today's slots that are still (partly) in the future
      cand: >
        {%- set ns = namespace(l=[]) -%}
        {%- for p in prices_today -%}
          {%- set e = as_timestamp(p.end) -%}
          {%- if e > now_ts -%}
            {%- set ns.l = ns.l + [{'s': as_timestamp(p.start), 'e': e, 'v': p.value | float(0)}] -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.l }}
      # Tomorrow's slots (or, if prices are not known yet: today's pattern +24h)
      tmrw: >
        {%- set ns = namespace(l=[]) -%}
        {%- if tomorrow_known -%}
          {%- for p in prices_tomorrow -%}
            {%- set ns.l = ns.l + [{'s': as_timestamp(p.start), 'e': as_timestamp(p.end), 'v': p.value | float(0)}] -%}
          {%- endfor -%}
        {%- else -%}
          {%- for p in prices_today -%}
            {%- set ns.l = ns.l + [{'s': as_timestamp(p.start) + day_length, 'e': as_timestamp(p.end) + day_length, 'v': p.value | float(0)}] -%}
          {%- endfor -%}
        {%- endif -%}
        {{ ns.l }}
      # Price statistics for the whole day and the current price (for dip detection)
      p_day_avg: >
        {% set v = prices_today | map(attribute='value') | list %}
        {% if v | length > 0 %}{{ (v | sum / (v | length)) | round(5) }}{% else %}0{% endif %}
      p_day_min: >
        {% set v = prices_today | map(attribute='value') | list %}
        {% if v | length > 0 %}{{ v | min }}{% else %}0{% endif %}
      price_now: >
        {%- set ns = namespace(p=none) -%}
        {%- for p in prices_today -%}
          {%- if as_timestamp(p.start) <= now_ts < as_timestamp(p.end) -%}{%- set ns.p = p.value | float(0) -%}{%- endif -%}
        {%- endfor -%}
        {{ ns.p if ns.p is not none else 999 }}
      # Number of slots needed to fill the battery completely
      n_ref: >
        {% if e_slot > 0 and s_max > 0 %}
          {{ [(s_max / eff_in / e_slot) | round(0, 'ceil') | int, 1] | max }}
        {% else %}1{% endif %}
      p_today_ref: >
        {% set s = cand | sort(attribute='v') %}
        {% set n = [n_ref, s | length] | min %}
        {% if n > 0 %}{{ (s[:n] | map(attribute='v') | sum / n) | round(5) }}{% else %}0{% endif %}
      p_tomorrow_ref: >
        {% set s = tmrw | sort(attribute='v') %}
        {% set n = [n_ref, s | length] | min %}
        {% if n > 0 %}{{ (s[:n] | map(attribute='v') | sum / n) | round(5) }}{% else %}0{% endif %}
      t_cheap_tomorrow_ts: >
        {% set s = tmrw | sort(attribute='v') %}
        {% set n = [n_ref, s | length] | min %}
        {% if n > 0 %}{{ s[:n] | map(attribute='s') | min }}{% else %}{{ end_today_ts }}{% endif %}
      # Gielz' minimal spread, like in Gielz on the gross price difference (expensive - cheap) / cheap.
      # The charge and discharge loss is checked separately (after loss, charging must stay cheaper),
      # so the loss is not counted twice.
      spread_min: "{{ states('input_number.dynamic_setting_minimal_spread') | float(0) }}"
      spread_tomorrow: >
        {{ ((p_tomorrow_ref - p_today_ref) / ([p_today_ref | abs, c_price_floor] | max) * 100) | round(1) }}
      # A = tomorrow cheaper/equal (or unknown): bridge only
      # B = tomorrow more expensive: charge as full as possible
      scenario: "{{ 'B' if (tomorrow_known and spread_tomorrow > 0 and spread_tomorrow >= spread_min) else 'A' }}"

      # ---- Direct solar usage per forecast ----------------------------
      # Share of the sun hours still to come (for today's direct usage)
      day_fraction: >
        {% if is_state('sun.sun', 'above_horizon') %}
          {% set sets = as_timestamp(state_attr('sun.sun', 'next_setting'), now_ts) %}
          {% set rise = next_sun_ts - 86400 %}
          {{ ([[(sets - now_ts) / ([sets - rise, 3600] | max), 0] | max, 1] | min) | round(3) }}
        {% else %}1{% endif %}
      direct_rest_kwh: >
        {% if direct_model_kwh %}{{ ([solar_rest, direct_day_kwh * day_fraction] | min) | round(3) }}
        {% else %}{{ (solar_rest * direct) | round(3) }}{% endif %}
      direct_tomorrow_kwh: >
        {% if direct_model_kwh %}{{ ([solar_tomorrow, direct_day_kwh] | min) | round(3) }}
        {% else %}{{ (solar_tomorrow * direct) | round(3) }}{% endif %}
      direct_rest_pct: "{{ (direct_rest_kwh / solar_rest * 100) | round(1) if solar_rest > 0 else self_consumption_pct }}"
      direct_tomorrow_pct: "{{ (direct_tomorrow_kwh / solar_tomorrow * 100) | round(1) if solar_tomorrow > 0 else self_consumption_pct }}"
      # A car charging on solar during the day (zendure_ev_global.yaml, Charge moment Daytime) takes
      # from the solar surplus first. Today if the sun is up or still has to rise, otherwise tomorrow.
      # Without the package 0.
      ev_daytime_kwh: "{{ state_attr('sensor.ev_charge_plan', 'daytime_kwh') | float(0) }}"
      ev_solar_today_kwh: "{{ ev_daytime_kwh if (sun_day_is_today or is_state('sun.sun', 'above_horizon')) else 0 }}"
      ev_solar_tomorrow_kwh: "{{ ev_daytime_kwh - ev_solar_today_kwh }}"

      # ---- Bridging period --------------------------------------------
      t_end_ts: >
        {% set t = [t_cheap_tomorrow_ts, t_sun_ts] | min if solar_sufficient else t_cheap_tomorrow_ts %}
        {{ [t, now_ts + c_min_bridge_s] | max }}
      hours_bridge: "{{ ((t_end_ts - now_ts) / 3600) | round(2) }}"
      # Today's sun falls within the bridge, unless the bridge ends before sunrise
      sun_in_bridge: "{{ (not sun_day_is_today) or (t_end_ts > t_sun_ts) }}"
      load_bridge: >
        {%- set ns = namespace(k=0) -%}
        {%- for u in hour_load -%}
          {%- set a = [u.s, now_ts] | max -%}{%- set b = [u.s + 3600, t_end_ts] | min -%}
          {%- if b > a -%}{%- set ns.k = ns.k + u.kw * (b - a) / 3600 -%}{%- endif -%}
        {%- endfor -%}
        {%- if t_end_ts > hour_load_end_ts -%}{%- set ns.k = ns.k + l_hour * (t_end_ts - hour_load_end_ts) / 3600 -%}{%- endif -%}
        {{ ns.k | round(3) }}
      direct_bridge: "{{ direct_rest_kwh if sun_in_bridge else 0 }}"
      # What the battery (or the grid) has to deliver during the bridge
      need_bridge_ac: "{{ ([load_bridge - direct_bridge, 0] | max) | round(3) }}"
      need_bridge_dc: "{{ (need_bridge_ac / eff_out) | round(3) }}"
      # Solar surplus that can go to the battery
      solar_surplus_ac: "{{ ([solar_rest - direct_rest_kwh - ev_solar_today_kwh, 0] | max) | round(3) if sun_in_bridge else 0 }}"
      solar_dc: "{{ ([solar_surplus_ac * eff_in, room] | min) | round(3) }}"

      # ---- Target and grid charging -----------------------------------
      target_dc: "{{ s_max if scenario == 'B' else ([need_bridge_dc + margin_dc, s_max] | min) | round(3) }}"
      grid_dc: "{{ ([[target_dc - s_now - solar_dc, 0] | max, room] | min) | round(3) }}"
      grid_ac: "{{ (grid_dc / eff_in) | round(3) }}"
      n_slots: >
        {% if grid_ac >= c_charge_stop_kwh and e_slot > 0 %}{{ (grid_ac / e_slot) | round(0, 'ceil') | int }}{% else %}0{% endif %}
      # Average price of all slots in the bridging period
      p_bridge_avg: >
        {% set ns = namespace(sum=0, n=0) %}
        {% for x in cand %}{% if x.s < t_end_ts %}{% set ns.sum = ns.sum + x.v %}{% set ns.n = ns.n + 1 %}{% endif %}{% endfor %}
        {% for x in tmrw %}{% if x.s < t_end_ts %}{% set ns.sum = ns.sum + x.v %}{% set ns.n = ns.n + 1 %}{% endif %}{% endfor %}
        {% if ns.n > 0 %}{{ (ns.sum / ns.n) | round(5) }}{% else %}{{ p_today_ref }}{% endif %}
      # Comparison price: for B the cheapest charge price tomorrow, for A the bridge average
      p_compare: "{{ p_tomorrow_ref if scenario == 'B' else p_bridge_avg }}"
      # Stored energy yields less due to round-trip loss: discount its value accordingly
      p_compare_eff: "{{ (p_compare * eff_rt) if p_compare > 0 else p_compare }}"
      chosen_base: >
        {%- set ns = namespace(l=[]) -%}
        {%- for x in cand | sort(attribute='v') -%}
          {%- set sp = (p_compare_eff - x.v) / ([x.v | abs, c_price_floor] | max) * 100 -%}
          {%- set sp_gross = (p_compare - x.v) / ([x.v | abs, c_price_floor] | max) * 100 -%}
          {#- Scenario A: also below the day average (on a flat day there is no dip) -#}
          {%- set dip_ok = scenario == 'B' or x.v <= p_day_avg -%}
          {%- if ns.l | length < n_slots and sp_gross >= spread_min and sp > 0 and dip_ok -%}
            {%- set ns.l = ns.l + [x] -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.l | sort(attribute='s') }}

      # ---- Cheap dip (thresholds; needed for the path check and the discharge hold) ----
      # Dip = price below (lowest day price / efficiency) and below the day average, per day.
      dip_threshold: "{{ (p_day_min + (p_day_min | abs) * (1 / eff_rt - 1)) | round(5) if eff_rt > 0 else p_day_min }}"
      p_tmrw_avg: >
        {% set v = tmrw | map(attribute='v') | list %}
        {% if v | length > 0 %}{{ (v | sum / (v | length)) | round(5) }}{% else %}{{ p_day_avg }}{% endif %}
      p_tmrw_min: >
        {% set v = tmrw | map(attribute='v') | list %}
        {% if v | length > 0 %}{{ v | min }}{% else %}{{ p_day_min }}{% endif %}
      dip_threshold_tomorrow: "{{ (p_tmrw_min + (p_tmrw_min | abs) * (1 / eff_rt - 1)) | round(5) if eff_rt > 0 else p_tmrw_min }}"
      # Does the path check take the discharge hold into account? Only when the switch is on and the
      # energy balance says grid charging is needed (same condition as the hold itself; the path
      # check can only increase it, so this is at most cautious).
      dip_hold_plan: "{{ is_state('input_boolean.forecast_setting_hold_discharge_in_dip', 'on') and grid_ac >= c_charge_stop_kwh }}"
      # ---- Path check: does the battery last until energy comes in again? -----
      # A total energy balance says nothing about timing: the battery can be empty in the
      # morning while solar only covers usage hours later. The house then buys from the grid
      # in that gap, often at the morning peak. The path check calculates that gap and plans
      # extra charge slots before it, but only if they are cheaper (after round-trip loss)
      # than buying in the gap. It also works when no regular charge slot is planned, and
      # uses tomorrow's prices as soon as they are known.

      # Solar coverage: from when does solar cover the usage?
      # From the detailed forecast (Solcast: attribute detailedForecast, kW per half hour)
      # of the configured sensors and of the "_today" variant of the remaining-today sensor.
      # Only the next solar day counts (until the next sunset).
      sunset_ts: "{{ as_timestamp(state_attr('sun.sun', 'next_setting'), now_ts + 43200) }}"
      solar_detail: >
        {%- set e1 = states('input_text.forecast_setting_solar_remaining_today_sensor') | trim -%}
        {%- set e2 = states('input_text.forecast_setting_solar_tomorrow_sensor') | trim -%}
        {%- set ns = namespace(l=[], ts=[], ids=[]) -%}
        {%- for e in [e1, e1 | replace('_remaining_today', '_today'), e2] -%}
          {%- if e | lower | regex_match('^sensor\\..+') and e not in ns.ids -%}
            {%- set ns.ids = ns.ids + [e] -%}
            {%- set d = state_attr(e, 'detailedForecast') or state_attr(e, 'detailed_forecast') or [] -%}
            {%- for p in d -%}
              {%- if p is mapping and p.period_start is defined -%}
                {%- set ps = as_timestamp(p.period_start, 0) -%}
                {%- if ps > now_ts - c_detail_period_s and ps < sunset_ts and ps not in ns.ts -%}
                  {%- set ns.ts = ns.ts + [ps] -%}
                  {%- set nk = namespace(k=0) -%}{%- for i in range(((ps - q_s0) // 900) | int, (((ps + c_detail_period_s) - q_s0 - 0.001) // 900) | int + 1) -%}{%- set qa = q_s0 + i * 900 -%}{%- set ov = [qa + 900, (ps + c_detail_period_s)] | min - [qa, ps] | max -%}{%- if ov > 0 -%}{%- set nk.k = nk.k + (q_kw[[i, 0] | max] if i < q_kw | length else l_hour) * ov / 3600 -%}{%- endif -%}{%- endfor -%}{%- set kwh_p = nk.k -%}
                  {%- set kw = kwh_p * 3600 / c_detail_period_s -%}
                  {%- set ns.l = ns.l + [{'s': ps, 'pv': ((p.pv_estimate | float(0)) * reliab) | round(3), 'kw': kw}] -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.l | sort(attribute='s') }}
      t_cover_detail: >
        {%- set ns = namespace(t=0) -%}
        {%- for p in solar_detail -%}
          {%- if ns.t == 0 and p.pv >= p.kw -%}{%- set ns.t = [p.s, now_ts] | max -%}{%- endif -%}
        {%- endfor -%}
        {{ ns.t }}
      cover_source: >
        {%- if solar_detail | length > 0 and t_cover_detail > 0 -%}Detailed forecast
        {%- elif solar_detail | length > 0 -%}Detailed forecast: solar no longer covers usage, until end of bridge
        {%- elif is_state('sun.sun', 'above_horizon') or solar_forecast_next >= c_cover_min_kwh -%}Sunrise + {{ (c_cover_offset_s / 3600) | round(1) }} hours
        {%- else -%}None (too little solar expected){%- endif -%}
      t_cover_ts: >
        {%- if solar_detail | length > 0 -%}{{ t_cover_detail if t_cover_detail > 0 else t_end_ts }}
        {%- elif is_state('sun.sun', 'above_horizon') -%}{{ [next_sun_ts - 86400 + c_cover_offset_s, now_ts] | max }}
        {%- elif solar_forecast_next >= c_cover_min_kwh -%}{{ next_sun_ts + c_cover_offset_s }}
        {%- else -%}{{ t_end_ts }}{%- endif -%}

      # The gap: from "battery empty" to the first of: solar coverage or end of bridge.
      # A planned charge slot does NOT close the gap: one quarter hour does not fill the battery,
      # and an expensive peak after that slot would become invisible. The allocation below picks
      # the cheapest slots before each expensive quarter hour itself (regular slots included).
      # Battery empty: subtract the usage from the battery per price slot. With the discharge hold
      # the battery supplies nothing in a dip slot (the house buys directly), so it lasts longer.
      t_empty_ts: >
        {%- set ns = namespace(e=s_now * eff_out, t=0, end=now_ts) -%}
        {%- for x in (cand + tmrw) | sort(attribute='s') -%}
          {%- if ns.t == 0 and x.e > now_ts -%}
            {%- set a = [x.s, now_ts] | max -%}
            {%- set ns.end = x.e -%}
            {%- set is_tmrw = x.s >= end_today_ts -%}
            {%- set dip = dip_hold_plan and ((x.v <= dip_threshold_tomorrow and x.v < p_tmrw_avg) if is_tmrw else (x.v <= dip_threshold and x.v < p_day_avg)) -%}
            {%- if not dip -%}
              {%- set nk = namespace(k=0) -%}{%- for i in range(((a - q_s0) // 900) | int, ((x.e - q_s0 - 0.001) // 900) | int + 1) -%}{%- set qa = q_s0 + i * 900 -%}{%- set ov = [qa + 900, x.e] | min - [qa, a] | max -%}{%- if ov > 0 -%}{%- set nk.k = nk.k + (q_kw[[i, 0] | max] if i < q_kw | length else l_hour) * ov / 3600 -%}{%- endif -%}{%- endfor -%}{%- set need = nk.k -%}
              {%- if need >= ns.e and need > 0 -%}{%- set ns.t = a + ns.e / need * (x.e - a) -%}
              {%- else -%}{%- set ns.e = ns.e - need -%}{%- endif -%}
            {%- endif -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.t if ns.t > 0 else (ns.end + (ns.e / l_hour * 3600 if l_hour > 0 else 172800)) }}
      # The charge margin applies here too: the battery counts as empty when only the margin is left,
      # so an underestimated usage does not immediately leave an expensive peak without battery.
      # (t_empty_ts above is the expectation without margin, for the dashboard.)
      t_empty_plan_ts: >
        {%- set ns = namespace(e=([s_now - margin_dc, 0] | max) * eff_out, t=0, end=now_ts) -%}
        {%- for x in (cand + tmrw) | sort(attribute='s') -%}
          {%- if ns.t == 0 and x.e > now_ts -%}
            {%- set a = [x.s, now_ts] | max -%}
            {%- set ns.end = x.e -%}
            {%- set is_tmrw = x.s >= end_today_ts -%}
            {%- set dip = dip_hold_plan and ((x.v <= dip_threshold_tomorrow and x.v < p_tmrw_avg) if is_tmrw else (x.v <= dip_threshold and x.v < p_day_avg)) -%}
            {%- if not dip -%}
              {%- set nk = namespace(k=0) -%}{%- for i in range(((a - q_s0) // 900) | int, ((x.e - q_s0 - 0.001) // 900) | int + 1) -%}{%- set qa = q_s0 + i * 900 -%}{%- set ov = [qa + 900, x.e] | min - [qa, a] | max -%}{%- if ov > 0 -%}{%- set nk.k = nk.k + (q_kw[[i, 0] | max] if i < q_kw | length else l_hour) * ov / 3600 -%}{%- endif -%}{%- endfor -%}{%- set need = nk.k -%}
              {%- if need >= ns.e and need > 0 -%}{%- set ns.t = a + ns.e / need * (x.e - a) -%}
              {%- else -%}{%- set ns.e = ns.e - need -%}{%- endif -%}
            {%- endif -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.t if ns.t > 0 else (ns.end + (ns.e / l_hour * 3600 if l_hour > 0 else 172800)) }}
      # Candidate slots: the rest of today, plus tomorrow if those prices are really known
      path_cand: "{{ cand + (tmrw if tomorrow_known else []) }}"

      # ---- Path check beyond the night ----------------------------------
      # In the afternoon and evening the bridge ends at the start of tomorrow's cheap hours
      # (e.g. 00:45). An expensive morning peak after those hours fell outside the path check,
      # even when charging now is cheaper than at night. As soon as tomorrow's prices are known,
      # the path check looks ahead until tomorrow's solar covers usage (no further, otherwise it
      # charges at night what solar delivers during the day anyway), capped at the end of the
      # known prices. The allocation picks the cheapest slot before each expensive quarter hour
      # itself: now, or at night if that is cheaper. The energy balance (bridge, scenario A/B)
      # does not change. After midnight the morning already falls within the regular bridge.
      solar_tomorrow_from_ts: "{{ next_sun_ts - 7200 }}"
      solar_tomorrow_until_ts: "{{ next_sun_ts + 72000 }}"
      solar_detail_tomorrow: >
        {%- set e1 = states('input_text.forecast_setting_solar_remaining_today_sensor') | trim -%}
        {%- set e2 = states('input_text.forecast_setting_solar_tomorrow_sensor') | trim -%}
        {%- set ns = namespace(l=[], ts=[], ids=[]) -%}
        {%- if not sun_day_is_today -%}
          {%- for e in [e2, e1 | replace('_remaining_today', '_today'), e1] -%}
            {%- if e | lower | regex_match('^sensor\\..+') and e not in ns.ids -%}
              {%- set ns.ids = ns.ids + [e] -%}
              {%- set d = state_attr(e, 'detailedForecast') or state_attr(e, 'detailed_forecast') or [] -%}
              {%- for p in d -%}
                {%- if p is mapping and p.period_start is defined -%}
                  {%- set ps = as_timestamp(p.period_start, 0) -%}
                  {%- if ps >= solar_tomorrow_from_ts and ps < solar_tomorrow_until_ts and ps not in ns.ts -%}
                    {%- set ns.ts = ns.ts + [ps] -%}
                    {%- set nk = namespace(k=0) -%}{%- for i in range(((ps - q_s0) // 900) | int, (((ps + c_detail_period_s) - q_s0 - 0.001) // 900) | int + 1) -%}{%- set qa = q_s0 + i * 900 -%}{%- set ov = [qa + 900, (ps + c_detail_period_s)] | min - [qa, ps] | max -%}{%- if ov > 0 -%}{%- set nk.k = nk.k + (q_kw[[i, 0] | max] if i < q_kw | length else l_hour) * ov / 3600 -%}{%- endif -%}{%- endfor -%}
                    {%- set ns.l = ns.l + [{'s': ps, 'pv': ((p.pv_estimate | float(0)) * reliab) | round(3), 'kw': nk.k * 3600 / c_detail_period_s}] -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endif -%}
        {{ ns.l | sort(attribute='s') }}
      # From when does tomorrow's solar cover usage? 0 = not (or unknown)
      t_cover_tomorrow_ts: >
        {%- set ns = namespace(t=0) -%}
        {%- for p in solar_detail_tomorrow -%}
          {%- if ns.t == 0 and p.pv >= p.kw -%}{%- set ns.t = p.s -%}{%- endif -%}
        {%- endfor -%}
        {%- if solar_detail_tomorrow | length > 0 -%}{{ ns.t }}
        {%- elif not sun_day_is_today and solar_tomorrow >= c_cover_min_kwh -%}{{ next_sun_ts + c_cover_offset_s }}
        {%- else -%}0{%- endif -%}
      prices_end_ts: "{{ (tmrw | map(attribute='e') | max) if tmrw | length > 0 else end_today_ts }}"
      # If tomorrow's solar does not cover usage (winter), until sunrise + 3 hours: this is about the
      # morning peak, not tomorrow evening (the planner plans that after midnight).
      t_path_tomorrow_ts: >
        {%- set t = t_cover_tomorrow_ts if t_cover_tomorrow_ts > 0 else next_sun_ts + c_cover_offset_s -%}
        {{ [t, prices_end_ts] | min }}
      path_ahead: "{{ tomorrow_known and not sun_day_is_today and t_path_tomorrow_ts > t_end_ts }}"
      # Over the day: if solar covers usage before the end of the bridge, the path check still looks
      # ahead to the end of the bridge. That way it also sees the evening peak after the solar: on a
      # dull day solar does not fill the battery and charging in the cheap night pays off for the
      # evening. Solar counts per detail period (direct use and surplus to the battery).
      # Only with "Hold discharge in cheap dip" or "Smart hold": otherwise the night charge is used up
      # in the morning. Both keep the night charge for the more expensive quarter hours.
      path_day: >
        {{ not path_ahead and t_cover_ts < t_end_ts
           and (is_state('input_boolean.forecast_setting_hold_discharge_in_dip', 'on') or is_state('input_boolean.forecast_setting_smart_hold', 'on')) }}
      t_path_horizon_ts: "{{ t_path_tomorrow_ts if path_ahead else (t_end_ts if path_day else [t_cover_ts, t_end_ts] | min) }}"
      path_horizon_source: >
        {%- if path_day -%}Over the day until end of bridge (solar counts)
        {%- elif not path_ahead -%}Until {{ 'solar coverage' if t_cover_ts < t_end_ts else 'end of bridge' }}
        {%- elif solar_detail_tomorrow | length > 0 and t_cover_tomorrow_ts > 0 -%}Until solar coverage tomorrow (detailed forecast)
        {%- elif t_cover_tomorrow_ts > 0 -%}Until solar coverage tomorrow (sunrise + {{ (c_cover_offset_s / 3600) | round(1) }} hours)
        {%- else -%}Until sunrise tomorrow + {{ (c_cover_offset_s / 3600) | round(1) }} hours (solar does not cover usage tomorrow){%- endif -%}
      # Solar per detail period for the path check: today plus (when looking ahead) tomorrow
      path_solar: >
        {%- if path_ahead -%}
          {%- set ts = solar_detail | map(attribute='s') | list -%}
          {{ (solar_detail + (solar_detail_tomorrow | rejectattr('s', 'in', ts) | list)) | sort(attribute='s') }}
        {%- else -%}{{ solar_detail }}{%- endif -%}
      # Battery empty when looking ahead: today's solar counts (direct use and surplus into the
      # battery), otherwise the gap would start in the afternoon while solar still runs the house.
      # Without a detailed forecast: solar covers usage until sunset and the expected surplus is
      # added now. Night charging deliberately does not count here: the allocation plans that.
      t_empty_ahead_ts: >
        {%- set emax = ([s_max - margin_dc, 0] | max) * eff_out -%}
        {%- set ns = namespace(e=([s_now - margin_dc, 0] | max) * eff_out, t=0, ev=ev_solar_today_kwh) -%}
        {%- set solar_no_detail = solar_detail | length == 0 and is_state('sun.sun', 'above_horizon') -%}
        {%- if solar_no_detail -%}{%- set ns.e = [ns.e + solar_dc * eff_out, emax] | min -%}{%- endif -%}
        {%- if path_ahead or path_day -%}
          {%- for x in path_cand | sort(attribute='s') -%}
            {%- if ns.t == 0 and x.e > now_ts and x.s < t_path_horizon_ts -%}
              {%- set a = [x.s, now_ts] | max -%}{%- set b = [x.e, t_path_horizon_ts] | min -%}
              {%- set nk = namespace(k=0) -%}{%- for i in range(((a - q_s0) // 900) | int, ((b - q_s0 - 0.001) // 900) | int + 1) -%}{%- set qa = q_s0 + i * 900 -%}{%- set ov = [qa + 900, b] | min - [qa, a] | max -%}{%- if ov > 0 -%}{%- set nk.k = nk.k + (q_kw[[i, 0] | max] if i < q_kw | length else l_hour) * ov / 3600 -%}{%- endif -%}{%- endfor -%}
              {%- set nz = namespace(d=0, o=0) -%}
              {%- for p in path_solar -%}
                {%- set pa = [p.s, a] | max -%}{%- set pb = [p.s + c_detail_period_s, b] | min -%}
                {%- if pb > pa -%}
                  {%- set nz.d = nz.d + ([p.pv, p.kw] | min) * (pb - pa) / 3600 -%}
                  {%- set nz.o = nz.o + ([p.pv - p.kw, 0] | max) * (pb - pa) / 3600 -%}
                {%- endif -%}
              {%- endfor -%}
              {%- if solar_no_detail and a < sunset_ts -%}{%- set nz.d = nk.k -%}{%- endif -%}
              {%- set to_ev = [nz.o, ns.ev] | min -%}{%- set ns.ev = ns.ev - to_ev -%}
              {%- set ns.e = [ns.e + (nz.o - to_ev) * eff_in * eff_out, emax] | min -%}
              {%- set is_tmrw = x.s >= end_today_ts -%}
              {%- set dip = dip_hold_plan and ((x.v <= dip_threshold_tomorrow and x.v < p_tmrw_avg) if is_tmrw else (x.v <= dip_threshold and x.v < p_day_avg)) -%}
              {%- set need = [nk.k - nz.d, 0] | max -%}
              {%- if not dip -%}
                {%- if need >= ns.e and need > 0 -%}{%- set ns.t = a + ns.e / need * (b - a) -%}
                {%- else -%}{%- set ns.e = ns.e - need -%}{%- endif -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endif -%}
        {{ ns.t if ns.t > 0 else t_path_horizon_ts }}

      t_gap_end_ts: "{{ t_path_horizon_ts }}"
      t_gap_start_ts: "{{ [t_empty_ahead_ts if (path_ahead or path_day) else t_empty_plan_ts, now_ts] | max }}"
      gap_hours: "{{ ([t_gap_end_ts - t_gap_start_ts, 0] | max / 3600) | round(2) }}"
      gap_load: >
        {%- set ns = namespace(k=0) -%}
        {%- for u in hour_load -%}
          {%- set a = [u.s, t_gap_start_ts] | max -%}{%- set b = [u.s + 3600, t_gap_end_ts] | min -%}
          {%- if b > a -%}{%- set ns.k = ns.k + u.kw * (b - a) / 3600 -%}{%- endif -%}
        {%- endfor -%}
        {{ ns.k | round(3) }}
      # Candidate slots: the rest of today, plus tomorrow once those prices are actually known
      # Per price slot in the gap: usage minus the solar that is already used directly there
      # (solar only known with a detailed forecast)
      gap_slots: >
        {%- set ns = namespace(l=[]) -%}
        {%- for x in path_cand -%}
          {%- set a = [x.s, t_gap_start_ts] | max -%}
          {%- set b = [x.e, t_gap_end_ts] | min -%}
          {%- if b > a -%}
            {%- set nz = namespace(k=0) -%}
            {%- for p in path_solar -%}
              {%- set pa = [p.s, a] | max -%}
              {%- set pb = [p.s + c_detail_period_s, b] | min -%}
              {%- if pb > pa -%}{%- set nz.k = nz.k + ([p.pv, p.kw] | min) * (pb - pa) / 3600 -%}{%- endif -%}
            {%- endfor -%}
            {%- set nk = namespace(k=0) -%}{%- for i in range(((a - q_s0) // 900) | int, ((b - q_s0 - 0.001) // 900) | int + 1) -%}{%- set qa = q_s0 + i * 900 -%}{%- set ov = [qa + 900, b] | min - [qa, a] | max -%}{%- if ov > 0 -%}{%- set nk.k = nk.k + (q_kw[[i, 0] | max] if i < q_kw | length else l_hour) * ov / 3600 -%}{%- endif -%}{%- endfor -%}{%- set load = nk.k -%}
            {%- set ns.l = ns.l + [{'s': x.s, 'v': x.v, 'kwh': ([load - nz.k, 0] | max) | round(4)}] -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.l }}
      gap_shortfall_ac: "{{ (gap_slots | map(attribute='kwh') | sum) | round(3) }}"
      gap_solar_direct: "{{ ([gap_load - gap_shortfall_ac, 0] | max) | round(3) }}"
      # Cheapest charge moment that can still help the gap
      p_charge_min: >
        {% set v = path_cand | selectattr('s', 'lt', t_gap_end_ts) | map(attribute='v') | list %}
        {% if v | length > 0 %}{{ v | min }}{% else %}0{% endif %}
      # Only the slots in the gap that are more expensive than that charge moment after round-trip
      # loss count: buying in a cheap part of the gap is cheaper than storing first.
      gap_valuable: >
        {%- set ns = namespace(l=[]) -%}
        {%- for q in gap_slots -%}
          {%- set sp = (q.v * eff_rt - p_charge_min) / ([p_charge_min | abs, c_price_floor] | max) * 100 -%}
          {%- set sp_gross = (q.v - p_charge_min) / ([p_charge_min | abs, c_price_floor] | max) * 100 -%}
          {%- if q.kwh > 0 and sp > 0 and sp_gross >= spread_min -%}{%- set ns.l = ns.l + [q] -%}{%- endif -%}
        {%- endfor -%}
        {{ ns.l }}
      gap_valuable_ac: "{{ (gap_valuable | map(attribute='kwh') | sum) | round(3) }}"
      # Weighted average purchase price in those expensive slots
      p_gap_avg: >
        {% set ns = namespace(sum=0, kwh=0) %}
        {% for q in gap_valuable %}{% set ns.sum = ns.sum + q.v * q.kwh %}{% set ns.kwh = ns.kwh + q.kwh %}{% endfor %}
        {% if ns.kwh > 0 %}{{ (ns.sum / ns.kwh) | round(5) }}{% else %}0{% endif %}
      path_active: "{{ gap_hours >= c_path_min_hours and gap_valuable_ac >= c_path_min_shortfall_kwh and p_gap_avg > 0 }}"
      # Allocation: each expensive slot in the gap (most expensive first) gets the cheapest charge
      # slots that end before that expensive slot. A charge slot after the peak does not help the peak.
      # A charge slot delivers at most e_slot kWh (AC) and can serve several expensive slots.
      # Capped by the room in the battery.
      # Charge margin with an (almost) empty battery: the margin is subtracted from the battery
      # content above, but if the battery holds less than the margin, the shortfall counts as extra
      # usage in the first expensive quarter, so the buffer is charged before the expensive
      # quarters (when that pays off).
      margin_shortfall_ac: "{{ (([margin_dc - s_now, 0] | max) * eff_out) | round(3) }}"
      # Over the day: solar surplus after "battery empty" charges the battery again. It covers the
      # cheapest expensive quarters after it, so nothing is charged from the grid that solar delivers.
      gap_solar_surplus: >
        {%- set ns = namespace(l=[]) -%}
        {%- if path_day -%}
          {%- for p in path_solar -%}
            {%- set pa = [p.s, t_gap_start_ts] | max -%}{%- set pb = [p.s + c_detail_period_s, t_gap_end_ts] | min -%}
            {%- if pb > pa and p.pv > p.kw -%}{%- set ns.l = ns.l + [{'s': pa, 'k': ((p.pv - p.kw) * (pb - pa) / 3600 * eff_in * eff_out) | round(4)}] -%}{%- endif -%}
          {%- endfor -%}
        {%- endif -%}
        {{ ns.l }}
      gap_after_solar: >
        {%- set ns = namespace(l=gap_valuable) -%}
        {%- for z in gap_solar_surplus -%}
          {%- set nz = namespace(k=z.k, out=[]) -%}
          {%- for q in ns.l | sort(attribute='v') -%}
            {%- if q.s >= z.s and nz.k > 0 -%}
              {%- set off = [q.kwh, nz.k] | min -%}{%- set nz.k = nz.k - off -%}
              {%- if q.kwh - off > 0.0001 -%}{%- set nz.out = nz.out + [{'s': q.s, 'v': q.v, 'kwh': (q.kwh - off) | round(4)}] -%}{%- endif -%}
            {%- else -%}{%- set nz.out = nz.out + [q] -%}{%- endif -%}
          {%- endfor -%}
          {%- set ns.l = nz.out -%}
        {%- endfor -%}
        {{ ns.l }}
      gap_with_margin: >
        {%- set first = gap_after_solar | sort(attribute='s') | first if gap_after_solar | length > 0 else none -%}
        {%- if first is not none and margin_shortfall_ac > 0 -%}
          {{ gap_after_solar + [{'s': first.s, 'v': first.v, 'kwh': margin_shortfall_ac}] }}
        {%- else -%}{{ gap_after_solar }}{%- endif -%}
      path_allocation: >
        {%- set ns = namespace(l=[], total=0) -%}
        {%- set space = ([room - solar_dc, 0] | max) if path_day else room -%}
        {%- set max_ac = (space / eff_in) if eff_in > 0 else 0 -%}
        {%- if path_active and e_slot > 0 and eff_rt > 0 -%}
          {%- set charge_cand = path_cand | sort(attribute='v') -%}
          {%- for q in gap_with_margin | sort(attribute='v', reverse=true) -%}
            {%- set nq = namespace(need=q.kwh / eff_rt) -%}
            {%- for x in charge_cand -%}
              {%- if nq.need > 0.001 and ns.total < max_ac and x.e <= q.s and x.e > now_ts -%}
                {%- set sp = (q.v * eff_rt - x.v) / ([x.v | abs, c_price_floor] | max) * 100 -%}
                {%- set sp_gross = (q.v - x.v) / ([x.v | abs, c_price_floor] | max) * 100 -%}
                {%- if sp > 0 and sp_gross >= spread_min -%}
                  {%- set used = ns.l | selectattr('s', 'eq', x.s) | map(attribute='k') | sum -%}
                  {%- set take = [e_slot - used, nq.need, max_ac - ns.total] | min -%}
                  {%- if take > 0.001 -%}
                    {%- set ns.l = ns.l + [{'s': x.s, 'k': take | round(4)}] -%}
                    {%- set ns.total = ns.total + take -%}
                    {%- set nq.need = nq.need - take -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endfor -%}
        {%- endif -%}
        {{ ns.l }}
      path_grid_ac: "{{ (path_allocation | map(attribute='k') | sum) | round(3) }}"
      extra_slots: >
        {%- set ss = path_allocation | map(attribute='s') | list -%}
        {{ path_cand | selectattr('s', 'in', ss) | list }}

      # ---- Pre-discharge for a negative feed-in price ----------------------------
      # If a window with a negative feed-in price and expected solar surplus is coming, the battery
      # must be empty enough at the start of that window to absorb the surplus (the inverter then
      # needs to throttle less and less is exported at a negative price). Works only by lifting
      # the hold and limiting grid charging; no discharging to the grid is added. Discharging
      # happens in the most expensive quarter hours before the window (threshold price, as with
      # smart hold). Min. SOC always stays.
      pd_on: "{{ is_state('input_boolean.negative_price_pre_discharge', 'on') and prices_ok }}"
      pd_solar: >
        {%- set ts = solar_detail | map(attribute='s') | list -%}
        {{ (solar_detail + (solar_detail_tomorrow | rejectattr('s', 'in', ts) | list)) | sort(attribute='s') }}
      # First consecutive run of quarter hours with a negative feed-in price that has yet to
      # start, with the expected solar surplus (kWh AC) in it
      pd_window: >
        {%- set markup = states('input_number.savings_setting_dynamic_feedin_markup') | float(0) -%}
        {%- set bonus = states('input_number.savings_setting_dynamic_feedin_bonus') | float(0) / 100 -%}
        {#- Market price per quarter hour (export): from the market price sensor when filled in, otherwise the slot price -#}
        {%- set msens = states('input_text.dynamic_setting_market_price_sensor') | trim | lower -%}
        {%- set mk = namespace(d={}) -%}
        {%- if msens.startswith('sensor.') -%}
          {%- for y in (state_attr(msens, 'raw_today') or []) + (state_attr(msens, 'raw_tomorrow') or []) -%}
            {%- if y.value is number -%}{%- set mk.d = dict(mk.d, **{((as_timestamp(y.start, 0) | int) | string): y.value}) -%}{%- endif -%}
          {%- endfor -%}
        {%- endif -%}
        {%- set ns = namespace(r=[], cur=none, w=none) -%}
        {%- if pd_on -%}
          {%- for x in path_cand | sort(attribute='s') -%}
            {%- set mq = namespace(s=0, n=0) -%}
            {%- for k in range([((x.e - x.s) / 900) | round(0) | int, 1] | max) -%}
              {%- set key = ((x.s | int) + k * 900) | string -%}
              {%- if key in mk.d -%}{%- set mq.s = mq.s + mk.d[key] -%}{%- set mq.n = mq.n + 1 -%}{%- endif -%}
            {%- endfor -%}
            {%- set mp = (mq.s / mq.n) if mq.n > 0 else x.v -%}
            {%- set neg = (mp + bonus * ([mp, 0] | max) + markup) < 0 -%}
            {%- if neg and ns.cur is not none and ns.cur.e == x.s -%}
              {%- set ns.cur = {'s': ns.cur.s, 'e': x.e} -%}
            {%- elif neg -%}
              {%- if ns.cur is not none -%}{%- set ns.r = ns.r + [ns.cur] -%}{%- endif -%}
              {%- set ns.cur = {'s': x.s, 'e': x.e} -%}
            {%- elif ns.cur is not none -%}
              {%- set ns.r = ns.r + [ns.cur] -%}{%- set ns.cur = none -%}
            {%- endif -%}
          {%- endfor -%}
          {%- if ns.cur is not none -%}{%- set ns.r = ns.r + [ns.cur] -%}{%- endif -%}
          {%- for w in ns.r -%}
            {%- if ns.w is none and w.s > now_ts -%}
              {%- set nz = namespace(o=0) -%}
              {%- for p in pd_solar -%}
                {%- set pa = [p.s, w.s] | max -%}{%- set pb = [p.s + c_detail_period_s, w.e] | min -%}
                {%- if pb > pa -%}{%- set nz.o = nz.o + ([p.pv - p.kw, 0] | max) * (pb - pa) / 3600 -%}{%- endif -%}
              {%- endfor -%}
              {%- if nz.o >= c_pd_min_kwh -%}{%- set ns.w = {'s': w.s, 'e': w.e, 'kwh': nz.o | round(3)} -%}{%- endif -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endif -%}
        {{ ns.w }}
      # Solar credit: if a reliability is filled in (per month or general), it is already in the solar
      # forecast and the surplus counts fully; otherwise for 75% (c_solar_credit)
      pd_credit: "{{ 1 if reliab_set else c_solar_credit }}"
      # Target at the start of the window (kWh above min. SOC): room for the solar-credit share of the surplus
      pd_target_dc: >
        {{ ([s_max - pd_window.kwh * pd_credit * eff_in, 0] | max) | round(3) if pd_window is mapping else s_max }}
      # Free simulation until the window: the battery discharges for the house in every quarter
      # hour, solar charges it, no grid charging and no hold. Per slot what it delivers (kWh AC).
      pd_sim: >
        {%- set ns = namespace(e=s_now, l=[]) -%}
        {%- if pd_window is mapping -%}
          {%- for x in path_cand | sort(attribute='s') -%}
            {%- if x.e > now_ts and x.s < pd_window.s -%}
              {%- set a = [x.s, now_ts] | max -%}{%- set b = [x.e, pd_window.s] | min -%}
              {%- set nk = namespace(k=0) -%}{%- for i in range(((a - q_s0) // 900) | int, ((b - q_s0 - 0.001) // 900) | int + 1) -%}{%- set qa = q_s0 + i * 900 -%}{%- set ov = [qa + 900, b] | min - [qa, a] | max -%}{%- if ov > 0 -%}{%- set nk.k = nk.k + (q_kw[[i, 0] | max] if i < q_kw | length else l_hour) * ov / 3600 -%}{%- endif -%}{%- endfor -%}
              {%- set nz = namespace(d=0, o=0) -%}
              {%- for p in pd_solar -%}
                {%- set pa = [p.s, a] | max -%}{%- set pb = [p.s + c_detail_period_s, b] | min -%}
                {%- if pb > pa -%}
                  {%- set nz.d = nz.d + ([p.pv, p.kw] | min) * (pb - pa) / 3600 -%}
                  {%- set nz.o = nz.o + ([p.pv - p.kw, 0] | max) * (pb - pa) / 3600 -%}
                {%- endif -%}
              {%- endfor -%}
              {%- set ns.e = [ns.e + nz.o * eff_in, s_max] | min -%}
              {%- set deliver = [[nk.k - nz.d, 0] | max, ns.e * eff_out] | min -%}
              {%- set ns.e = ns.e - (deliver / eff_out if eff_out > 0 else 0) -%}
              {%- if deliver > 0.001 -%}{%- set ns.l = ns.l + [{'s': x.s, 'v': x.v, 'kwh': deliver | round(4)}] -%}{%- endif -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endif -%}
        {{ {'e': ns.e | round(3), 'l': ns.l} }}
      # ---- Total grid charge and final slots ---------------------------------
      # The regular plan and the path check overlap: the gap is already part of the total
      # energy balance. So the larger of the two counts, not the sum.
      # ---- Calibration charging --------------------------------------
      # The Zendure calibrates (SOC + balancing) at 100%. With the forecasting the battery rarely gets
      # there in winter. From half the threshold the planner waits for sun that fills the battery; at
      # the threshold it charges the battery full from the grid in the cheapest quarter hours (outside
      # the efficiency filter: it is maintenance). Turns off by itself once Gielz sees a new calibration.
      cal_days: "{{ states('sensor.zendure_last_calibration_days') | float(-1) }}"
      cal_threshold: "{{ (states('input_number.forecast_setting_calibration_days') | float(0)) if (states('input_number.forecast_setting_calibration_days') | float(0)) > 0 else c_calibration_days }}"
      cal_wait_from: "{{ (cal_threshold / 2) | round(0, 'ceil') }}"
      cal_on: "{{ not is_state('input_boolean.forecast_setting_calibration_off', 'on') and cal_days >= 0 and cap > 0 }}"
      cal_max_ok: "{{ soc_max >= 100 }}"
      # Does the sun fill the battery today (rest of the day) or tomorrow (surplus ≥ 80% of usable capacity)?
      cal_sun_today: "{{ room > 0 and ([solar_rest - direct_rest_kwh - ev_solar_today_kwh, 0] | max) * eff_in >= room }}"
      cal_sun_tomorrow: "{{ tomorrow_known and ([solar_tomorrow - direct_tomorrow_kwh - ev_solar_tomorrow_kwh, 0] | max) * eff_in >= s_max * 0.8 }}"
      cal_charge: "{{ cal_on and cal_max_ok and prices_ok and cal_days >= cal_threshold and room > 0.05 * cap and not cal_sun_today }}"
      cal_extra_ac: "{{ (([room - solar_dc, 0] | max) / eff_in) | round(3) if cal_charge and eff_in > 0 else 0 }}"
      cal_status: >
        {% if not cal_on or cal_days < cal_wait_from %}{{ none }}
        {% elif not cal_max_ok %}max_too_low
        {% elif cal_days >= cal_threshold %}{{ 'sun_today' if cal_sun_today else ('charge' if cal_charge else 'full') }}
        {% else %}{{ 'sun_today' if cal_sun_today else ('sun_tomorrow' if cal_sun_tomorrow else 'waiting') }}{% endif %}

      grid_total_ac: "{{ ([grid_ac, path_grid_ac if extra_slots | length > 0 else 0, cal_extra_ac] | max) | round(3) }}"
      n_total: >
        {% if grid_total_ac >= c_charge_stop_kwh and e_slot > 0 %}{{ (grid_total_ac / e_slot) | round(0, 'ceil') | int }}{% else %}0{% endif %}
      chosen_plan: >
        {%- set extra_s = extra_slots | map(attribute='s') | list -%}
        {%- set ns = namespace(l=extra_slots) -%}
        {#- Calibration charging: the cheapest quarter hours of today and (known) tomorrow, outside the efficiency filter -#}
        {%- set base = (path_cand | selectattr('e', 'gt', now_ts) | list) if cal_charge else chosen_base -%}
        {%- for x in base | sort(attribute='v') -%}
          {%- if x.s not in extra_s and ns.l | length < n_total -%}
            {%- set ns.l = ns.l + [x] -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.l | sort(attribute='s') }}
      # Pre-discharge: grid charging before the window only fits in the room left above the
      # target (cheapest slots first); the rest is dropped
      pd_useful: "{{ pd_on and pd_window is mapping and pd_sim.e < s_max - 0.1 }}"
      pd_room_dc: "{{ ([pd_target_dc - pd_sim.e, 0] | max) | round(3) if pd_useful else 0 }}"
      chosen: >
        {%- if pd_useful -%}
          {%- set n_max = ((pd_room_dc / (e_slot * eff_in)) | int) if e_slot * eff_in > 0 else 0 -%}
          {%- set before = chosen_plan | selectattr('s', 'lt', pd_window.s) | sort(attribute='v') | list -%}
          {%- set keep = before[:n_max] | map(attribute='s') | list -%}
          {{ ((chosen_plan | rejectattr('s', 'lt', pd_window.s) | list) + (chosen_plan | selectattr('s', 'in', keep) | list)) | sort(attribute='s') }}
        {%- else -%}{{ chosen_plan }}{%- endif -%}
      pd_grid_dropped: "{{ (chosen_plan | length) - (chosen | length) }}"
      pd_grid_dc: >
        {{ ([(chosen | selectattr('s', 'lt', pd_window.s) | list | length) * e_slot * eff_in, pd_room_dc] | min) | round(3) if pd_useful else 0 }}
      # How much must the battery deliver at least before the window (kWh AC)? Planned grid
      # charging before the window counts. End above target (even discharging everywhere): everywhere.
      pd_deliver_min_ac: >
        {%- set total = pd_sim.l | map(attribute='kwh') | sum -%}
        {%- set room_left = [pd_room_dc - pd_grid_dc, 0] | max * eff_out -%}
        {{ ([total - room_left, 0] | max) | round(3) }}
      # Only when it makes a difference: if solar fills the battery again before the window anyway
      # (even discharging everywhere), pre-discharge does not help
      pd_active: >
        {{ pd_useful and (pd_deliver_min_ac > 0.05 or pd_sim.e > pd_target_dc + 0.05) }}
      # Threshold price: the battery supplies in the most expensive quarters before the window until
      # the minimum is reached. none = in all quarters (even then it does not reach the target).
      pd_threshold: >
        {%- set ns = namespace(r=pd_deliver_min_ac, p=none) -%}
        {%- if pd_active and pd_sim.e <= pd_target_dc + 0.05 -%}
          {%- for q in pd_sim.l | sort(attribute='v', reverse=true) -%}
            {%- if ns.r > 0 -%}{%- set ns.p = q.v -%}{%- set ns.r = ns.r - q.kwh -%}{%- endif -%}
          {%- endfor -%}
        {%- endif -%}
        {{ ns.p }}
      pd_discharge_now: >
        {{ pd_active and now_ts < pd_window.s and price_now < 999 and (pd_threshold is not number or price_now >= pd_threshold) }}

      slot_now: >
        {% set ns = namespace(a=false) %}
        {% for x in chosen %}{% if x.s <= now_ts < x.e %}{% set ns.a = true %}{% endif %}{% endfor %}
        {{ ns.a }}
      planned_ac: "{{ ([chosen | length * e_slot, grid_total_ac] | min) | round(3) }}"
      p_chosen_avg: >
        {% if chosen | length > 0 %}{{ (chosen | map(attribute='v') | sum / (chosen | length)) | round(5) }}{% else %}0{% endif %}
      cost: "{{ (planned_ac * p_chosen_avg) | round(2) }}"
      # Adjacent planned slots merged into charge blocks, with kWh per block
      # (a running slot only counts the part still to come; total capped at planned_ac)
      blocks_today: >
        {%- set ns = namespace(l=[], rest=planned_ac) -%}
        {%- for x in chosen | sort(attribute='s') -%}
          {%- set frac = ((x.e - [x.s, now_ts] | max) / (x.e - x.s)) if x.e > x.s else 0 -%}
          {%- set k = [[e_slot * frac, ns.rest] | min, 0] | max -%}
          {%- set ns.rest = ns.rest - k -%}
          {%- set b = ns.l[-1] if ns.l | length > 0 else none -%}
          {%- if b is not none and b.e == x.s -%}
            {%- set ns.l = ns.l[:-1] + [{'s': b.s, 'e': x.e, 'kwh': b.kwh + k, 'sum': b.sum + x.v, 'n': b.n + 1}] -%}
          {%- else -%}
            {%- set ns.l = ns.l + [{'s': x.s, 'e': x.e, 'kwh': k, 'sum': x.v, 'n': 1}] -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.l }}

      # ---- Cheap dip: do not discharge the battery --------------------------
      # (dip_threshold is defined above the path check)
      in_dip: "{{ prices_ok and price_now < 999 and price_now <= dip_threshold and price_now < p_day_avg }}"
      # Only hold if grid charging is still needed (battery won't fill up from solar)
      dip_hold: >
        {{ is_state('input_boolean.forecast_setting_hold_discharge_in_dip', 'on') and in_dip and grid_total_ac >= c_charge_stop_kwh }}

      # ---- Smart hold: shift the charge that is there to the most expensive quarters ----
      # If the battery does not last until the end of the gap (solar coverage or end of bridge) and no
      # charge moment is planned any more, the charge goes to the most expensive quarters. Holding
      # costs no extra loss (the power comes out later just the same), so it pays off as soon as the
      # price now is below the cheapest quarter the battery still covers then (the threshold price).
      sh_quarters: >
        {%- set ns = namespace(l=[]) -%}
        {%- for x in path_cand -%}
          {%- set a = [x.s, now_ts] | max -%}{%- set b = [x.e, t_gap_end_ts] | min -%}
          {%- if b > a -%}
            {%- set nz = namespace(k=0) -%}
            {%- for z in path_solar -%}
              {%- set pa = [z.s, a] | max -%}{%- set pb = [z.s + c_detail_period_s, b] | min -%}
              {%- if pb > pa -%}{%- set nz.k = nz.k + ([z.pv, z.kw] | min) * (pb - pa) / 3600 -%}{%- endif -%}
            {%- endfor -%}
            {%- set nk = namespace(k=0) -%}{%- for i in range(((a - q_s0) // 900) | int, ((b - q_s0 - 0.001) // 900) | int + 1) -%}{%- set qa = q_s0 + i * 900 -%}{%- set ov = [qa + 900, b] | min - [qa, a] | max -%}{%- if ov > 0 -%}{%- set nk.k = nk.k + (q_kw[[i, 0] | max] if i < q_kw | length else l_hour) * ov / 3600 -%}{%- endif -%}{%- endfor -%}{%- set load = nk.k -%}
            {%- set k = [load - nz.k, 0] | max -%}
            {%- if k > 0 -%}{%- set ns.l = ns.l + [{'s': x.s, 'v': x.v, 'kwh': k | round(4)}] -%}{%- endif -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.l }}
      # Planned grid charging before the end of the gap (kWh AC). A small remainder (e.g. two top-up
      # slots with an almost full battery) does not turn smart hold off; it counts towards what the
      # battery can supply.
      sh_planned_ac: >
        {{ ([(chosen | selectattr('e', 'gt', now_ts) | selectattr('s', 'lt', t_gap_end_ts) | list | length) * e_slot, planned_ac] | min) | round(3) }}
      sh_charge_planned: "{{ sh_planned_ac >= c_hold_charge_min_kwh }}"
      sh_threshold: >
        {%- set ns = namespace(e=(s_now + [sh_planned_ac * eff_in, room] | min) * eff_out, p=none) -%}
        {%- set total = sh_quarters | map(attribute='kwh') | sum -%}
        {%- if ns.e > 0 and total > ns.e -%}
          {%- for q in sh_quarters | sort(attribute='v', reverse=true) -%}
            {%- if ns.e > 0 -%}{%- set ns.p = q.v -%}{%- set ns.e = ns.e - q.kwh -%}{%- endif -%}
          {%- endfor -%}
        {%- endif -%}
        {{ ns.p }}
      smart_hold: >
        {{ is_state('input_boolean.forecast_setting_smart_hold', 'on') and prices_ok and price_now < 999 and not slot_now
           and not sh_charge_planned and sh_threshold is number and solar_dc <= room
           and price_now < sh_threshold - c_hold_min_difference }}
      # Pre-discharge comes first: no hold in the quarter hours above the threshold price
      # Between charge slots: what the battery supplies now, a later planned slot charges back (with
      # loss). If the price now is lower than that slot after charge and discharge loss (slot price /
      # efficiency), buying directly is cheaper and the battery holds. Part of Smart hold (no loss).
      between_charge_hold: >
        {%- set later = chosen | selectattr('s', 'gt', now_ts) | list -%}
        {{ is_state('input_boolean.forecast_setting_smart_hold', 'on') and prices_ok and price_now < 999 and not slot_now
           and later | length > 0 and eff_rt > 0 and price_now < (later | map(attribute='v') | max) / eff_rt }}
      hold_discharge: "{{ (dip_hold or smart_hold or between_charge_hold) and not pd_discharge_now }}"

      # ---- Battery empty (for the dashboard) ------------------------------
      # As the plan expects it: today's (and tomorrow's) solar counts, the battery does not supply
      # in cheap dips (dip hold), and with smart hold not below the threshold price either. Before a
      # negative window with pre-discharge no hold applies. Without charge margin; planned charge
      # slots do not count (as before). Display only, the plan uses t_empty_plan_ts / t_empty_ahead_ts.
      sh_plan_active: >
        {{ is_state('input_boolean.forecast_setting_smart_hold', 'on') and prices_ok
           and not sh_charge_planned and sh_threshold is number and solar_dc <= room }}
      t_empty_show_ts: >
        {%- set emax = s_max * eff_out -%}
        {%- set ns = namespace(e=s_now * eff_out, t=0, end=now_ts, ev=ev_solar_today_kwh) -%}
        {%- set solar_no_detail = solar_detail | length == 0 and is_state('sun.sun', 'above_horizon') -%}
        {%- if solar_no_detail -%}{%- set ns.e = [ns.e + solar_dc * eff_out, emax] | min -%}{%- endif -%}
        {%- set sol_l = path_solar if path_ahead else solar_detail -%}
        {%- for x in (cand + tmrw) | sort(attribute='s') -%}
          {%- if ns.t == 0 and x.e > now_ts -%}
            {%- set a = [x.s, now_ts] | max -%}{%- set b = x.e -%}
            {%- set ns.end = b -%}
            {%- set nk = namespace(k=0) -%}{%- for i in range(((a - q_s0) // 900) | int, ((b - q_s0 - 0.001) // 900) | int + 1) -%}{%- set qa = q_s0 + i * 900 -%}{%- set ov = [qa + 900, b] | min - [qa, a] | max -%}{%- if ov > 0 -%}{%- set nk.k = nk.k + (q_kw[[i, 0] | max] if i < q_kw | length else l_hour) * ov / 3600 -%}{%- endif -%}{%- endfor -%}
            {%- set nz = namespace(d=0, o=0) -%}
            {%- for p in sol_l -%}
              {%- set pa = [p.s, a] | max -%}{%- set pb = [p.s + c_detail_period_s, b] | min -%}
              {%- if pb > pa -%}
                {%- set nz.d = nz.d + ([p.pv, p.kw] | min) * (pb - pa) / 3600 -%}
                {%- set nz.o = nz.o + ([p.pv - p.kw, 0] | max) * (pb - pa) / 3600 -%}
              {%- endif -%}
            {%- endfor -%}
            {%- if solar_no_detail and a < sunset_ts -%}{%- set nz.d = nk.k -%}{%- endif -%}
            {%- set to_ev = [nz.o, ns.ev] | min -%}{%- set ns.ev = ns.ev - to_ev -%}
            {%- set ns.e = [ns.e + (nz.o - to_ev) * eff_in * eff_out, emax] | min -%}
            {%- set is_tmrw = x.s >= end_today_ts -%}
            {%- set dip = dip_hold_plan and ((x.v <= dip_threshold_tomorrow and x.v < p_tmrw_avg) if is_tmrw else (x.v <= dip_threshold and x.v < p_day_avg)) -%}
            {%- set vh = sh_plan_active and b <= t_gap_end_ts and x.v < sh_threshold - c_hold_min_difference -%}
            {%- set pd_free = pd_active and x.s < pd_window.s -%}
            {%- set need = [nk.k - nz.d, 0] | max -%}
            {%- if pd_free or not (dip or vh) -%}
              {%- if need >= ns.e and need > 0 -%}{%- set ns.t = a + ns.e / need * (b - a) -%}
              {%- else -%}{%- set ns.e = ns.e - need -%}{%- endif -%}
            {%- endif -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.t if ns.t > 0 else (ns.end + (ns.e / l_hour * 3600 if l_hour > 0 else 172800)) }}

      # ---- Overview for tomorrow --------------------------------------
      tomorrow_direct: "{{ direct_tomorrow_kwh | round(2) }}"
      tomorrow_battery_usage: "{{ ([usage_day - tomorrow_direct, 0] | max) | round(2) }}"
      tomorrow_solar_surplus: "{{ ([solar_tomorrow - direct_tomorrow_kwh - ev_solar_tomorrow_kwh, 0] | max) | round(2) }}"
      tomorrow_solar_dc: "{{ ([tomorrow_solar_surplus * eff_in, s_max] | min) | round(2) }}"
      # Upper limit: the energy balance for tomorrow (battery empty at the start of tomorrow)
      tomorrow_grid_charge_balance: >
        {% set goal = [tomorrow_battery_usage / eff_out + margin_dc, s_max] | min %}
        {{ (([goal - tomorrow_solar_dc, 0] | max) / eff_in) | round(2) }}
      # Estimate with the same rules as the path check: only quarter hours that are more expensive
      # after round-trip loss than tomorrow's cheapest quarter hour count as expensive. Solar surplus
      # that goes into the battery tomorrow covers the least expensive of those first. Then each
      # expensive quarter hour (most expensive first) gets the cheapest charge slots before it that
      # are cheaper after loss.
      tomorrow_expensive: >
        {%- set ns = namespace(l=[], solar=tomorrow_solar_dc * eff_out) -%}
        {%- for x in tmrw | sort(attribute='v') -%}
          {%- if x.v * eff_rt > p_tmrw_min -%}
            {%- set nk = namespace(k=0) -%}{%- for i in range(((x.s - q_s0) // 900) | int, ((x.e - q_s0 - 0.001) // 900) | int + 1) -%}{%- set qa = q_s0 + i * 900 -%}{%- set ov = [qa + 900, x.e] | min - [qa, x.s] | max -%}{%- if ov > 0 -%}{%- set nk.k = nk.k + (q_kw[[i, 0] | max] if i < q_kw | length else l_hour) * ov / 3600 -%}{%- endif -%}{%- endfor -%}{%- set kwh = nk.k -%}
            {%- set off = [ns.solar, kwh] | min -%}
            {%- set ns.solar = ns.solar - off -%}
            {%- if kwh - off > 0.001 -%}{%- set ns.l = ns.l + [{'s': x.s, 'v': x.v, 'kwh': (kwh - off) | round(4)}] -%}{%- endif -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.l }}
      tomorrow_allocation: >
        {%- set ns = namespace(l=[], total=0) -%}
        {%- set max_ac = [tomorrow_grid_charge_balance, (s_max / eff_in) if eff_in > 0 else 0] | min -%}
        {%- if e_slot > 0 and eff_rt > 0 -%}
          {%- set charge_cand = tmrw | sort(attribute='v') -%}
          {%- for q in tomorrow_expensive | sort(attribute='v', reverse=true) -%}
            {%- set nq = namespace(need=q.kwh / eff_rt) -%}
            {%- for x in charge_cand -%}
              {%- if nq.need > 0.001 and ns.total < max_ac and x.e <= q.s -%}
                {%- set sp = (q.v * eff_rt - x.v) / ([x.v | abs, c_price_floor] | max) * 100 -%}
                {%- set sp_gross = (q.v - x.v) / ([x.v | abs, c_price_floor] | max) * 100 -%}
                {%- if sp > 0 and sp_gross >= spread_min -%}
                  {%- set used = ns.l | selectattr('s', 'eq', x.s) | map(attribute='k') | sum -%}
                  {%- set take = [e_slot - used, nq.need, max_ac - ns.total] | min -%}
                  {%- if take > 0.001 -%}
                    {%- set ns.l = ns.l + [{'s': x.s, 'k': take | round(4)}] -%}
                    {%- set ns.total = ns.total + take -%}
                    {%- set nq.need = nq.need - take -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endfor -%}
        {%- endif -%}
        {{ ns.l }}
      tomorrow_grid_charge: "{{ (tomorrow_allocation | map(attribute='k') | sum) | round(2) }}"
      # What that charge delivers tomorrow in the expensive quarter hours (after charge and discharge
      # loss), plus the solar surplus that goes through the battery; the rest of the usage comes
      # directly from the grid
      tomorrow_from_battery: "{{ (tomorrow_grid_charge * eff_rt + tomorrow_solar_dc * eff_out) | round(2) }}"
      tomorrow_direct_grid: "{{ ([tomorrow_battery_usage - tomorrow_from_battery, 0] | max) | round(2) }}"
      tomorrow_charge_slots: "{{ tomorrow_allocation | map(attribute='s') | unique | list }}"
      tomorrow_blocks: >
        {%- set ns = namespace(l=[]) -%}
        {%- for x in tmrw | selectattr('s', 'in', tomorrow_charge_slots) | sort(attribute='s') -%}
          {%- set k = tomorrow_allocation | selectattr('s', 'eq', x.s) | map(attribute='k') | sum -%}
          {%- set b = ns.l[-1] if ns.l | length > 0 else none -%}
          {%- if b is not none and b.e == x.s -%}
            {%- set ns.l = ns.l[:-1] + [{'s': b.s, 'e': x.e, 'kwh': b.kwh + k, 'sum': b.sum + x.v, 'n': b.n + 1}] -%}
          {%- else -%}
            {%- set ns.l = ns.l + [{'s': x.s, 'e': x.e, 'kwh': k, 'sum': x.v, 'n': 1}] -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.l }}

      # ---- Timeline (forecast per price slot, for the dashboard chart) ----
      # Simulates per slot: usage (profile), solar (detailed forecast), grid charging in the
      # planned slots (today) and tomorrow's indicative charge slots, and otherwise
      # zero-on-the-meter: shortfall from the battery, surplus into the battery.
      # Indicative: the cheap-dip hold is not included here.
      tl_slots: "{{ (cand + tmrw) | sort(attribute='s') | selectattr('e', 'gt', now_ts) | list }}"
      tl_end_ts: "{{ (tl_slots | map(attribute='e') | max) if tl_slots | length > 0 else now_ts }}"
      tl_solar: >
        {%- set e1 = states('input_text.forecast_setting_solar_remaining_today_sensor') | trim -%}
        {%- set e2 = states('input_text.forecast_setting_solar_tomorrow_sensor') | trim -%}
        {%- set ns = namespace(l=[], ts=[], ids=[]) -%}
        {%- for e in [e1, e1 | replace('_remaining_today', '_today'), e2] -%}
          {%- if e | lower | regex_match('^sensor\\..+') and e not in ns.ids -%}
            {%- set ns.ids = ns.ids + [e] -%}
            {%- set d = state_attr(e, 'detailedForecast') or state_attr(e, 'detailed_forecast') or [] -%}
            {%- for q in d -%}
              {%- if q is mapping and q.period_start is defined -%}
                {%- set ps = as_timestamp(q.period_start, 0) -%}
                {%- if ps > now_ts - c_detail_period_s and ps < tl_end_ts and ps not in ns.ts -%}
                  {%- set ns.ts = ns.ts + [ps] -%}
                  {%- set ns.l = ns.l + [{'s': ps, 'pv': ((q.pv_estimate | float(0)) * reliab) | round(3)}] -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.l | sort(attribute='s') }}
      tl_charge_s: "{{ (chosen | map(attribute='s') | list) + tomorrow_charge_slots }}"
      p_disch_kw: "{{ [states('input_number.zendure_setting_max_discharge_power') | float(2400), 100] | max / 1000 }}"
      timeline: >
        {%- set ns = namespace(soc=s_now, t=[], p=[], kn=[], ch=[], pv=[], load=[], bat=[], soc_l=[], grid=[]) -%}
        {%- set known_until = end_today_ts + (day_length if tomorrow_known else 0) -%}
        {%- for x in tl_slots -%}
          {%- set a = [x.s, now_ts] | max -%}
          {%- set dur = (x.e - a) / 3600 -%}
          {%- if dur > 0 -%}
            {%- set nk = namespace(k=0) -%}{%- for i in range(((a - q_s0) // 900) | int, ((x.e - q_s0 - 0.001) // 900) | int + 1) -%}{%- set qa = q_s0 + i * 900 -%}{%- set ov = [qa + 900, x.e] | min - [qa, a] | max -%}{%- if ov > 0 -%}{%- set nk.k = nk.k + (q_kw[[i, 0] | max] if i < q_kw | length else l_hour) * ov / 3600 -%}{%- endif -%}{%- endfor -%}{%- set load = nk.k -%}
            {%- set nz = namespace(k=0) -%}
            {%- for q in tl_solar | selectattr('s', 'gt', a - c_detail_period_s) | selectattr('s', 'lt', x.e) -%}
              {%- set ov = [q.s + c_detail_period_s, x.e] | min - [q.s, a] | max -%}
              {%- if ov > 0 -%}{%- set nz.k = nz.k + q.pv * ov / 3600 -%}{%- endif -%}
            {%- endfor -%}
            {%- set pv = nz.k -%}
            {%- set room_ac = ([s_max - ns.soc, 0] | max) / eff_in -%}
            {%- set charging = x.s in tl_charge_s -%}
            {%- if charging -%}
              {%- set bat = [p_max_kw * dur, room_ac] | min -%}
            {%- elif load >= pv -%}
              {%- set bat = 0 - ([load - pv, ns.soc * eff_out, p_disch_kw * dur] | min) -%}
            {%- else -%}
              {%- set bat = [pv - load, room_ac, p_set_kw * dur] | min -%}
            {%- endif -%}
            {%- set grid = load - pv + bat -%}
            {%- set ns.soc = ns.soc + (bat * eff_in if bat > 0 else bat / eff_out) -%}
            {%- set ns.soc = [[ns.soc, 0] | max, s_max] | min -%}
            {%- set ns.t = ns.t + [x.s | int] -%}
            {%- set ns.p = ns.p + [x.v | round(4)] -%}
            {%- set ns.kn = ns.kn + [1 if x.s < known_until else 0] -%}
            {%- set ns.ch = ns.ch + [1 if charging else 0] -%}
            {%- set ns.pv = ns.pv + [(pv / dur) | round(2)] -%}
            {%- set ns.load = ns.load + [(load / dur) | round(2)] -%}
            {%- set ns.bat = ns.bat + [(bat / dur) | round(2)] -%}
            {%- set ns.soc_l = ns.soc_l + [((soc_min + ns.soc / cap * 100) if cap > 0 else 0) | round(1)] -%}
            {%- set ns.grid = ns.grid + [(grid / dur) | round(2)] -%}
          {%- endif -%}
        {%- endfor -%}
        {{ {'t': ns.t, 'price': ns.p, 'known': ns.kn, 'charge': ns.ch, 'solar_kw': ns.pv, 'usage_kw': ns.load,
            'battery_kw': ns.bat, 'soc_pct': ns.soc_l, 'grid_kw': ns.grid, 'soc_now_pct': soc} }}
    sensor:
      - name: "Zendure Forecast Plan"
        unique_id: zendure_forecast_plan
        icon: mdi:calendar-clock
        state: >
          {% if not prices_ok %}
            No prices
          {% elif cap <= 0 or not has_value('sensor.zendure_total_state_of_charge') %}
            No battery data
          {% else %}
            {% set threshold = c_charge_stop_kwh if this.state == 'Charge' else c_charge_start_kwh %}
            {% if grid_total_ac < threshold %}
              Not needed
            {% elif chosen | length == 0 %}
              {{ 'Not needed' if pd_grid_dropped | int > 0 else 'Not favorable' }}
            {% elif slot_now %}
              Charge
            {% else %}
              Waiting
            {% endif %}
          {% endif %}
        attributes:
          # --- Plan today ---
          scenario: >
            {% if not tomorrow_known %}A (tomorrow's prices not yet known, today's pattern assumed)
            {% elif scenario == 'B' %}B (tomorrow more expensive: charge as full as possible)
            {% else %}A (tomorrow cheaper or equal: bridge only){% endif %}
          tomorrow_prices_known: "{{ tomorrow_known }}"
          grid_charge_today_kwh: "{{ grid_total_ac }}"
          grid_charge_energy_balance_kwh: "{{ grid_ac }}"
          planned_grid_charge_kwh: "{{ planned_ac }}"
          target_stored_kwh: "{{ target_dc }}"
          battery_now_kwh: "{{ s_now }}"
          battery_max_kwh: "{{ s_max }}"
          expected_battery_usage_kwh: "{{ need_bridge_ac }}"
          expected_solar_to_battery_kwh: "{{ solar_dc }}"
          solar_surplus_kwh: "{{ solar_surplus_ac }}"
          ev_daytime_from_solar_kwh: "{{ ev_daytime_kwh }}"
          bridge_until: "{{ (t_end_ts | timestamp_custom('%Y-%m-%d %H:%M', true)) }}"
          bridge_hours: "{{ hours_bridge }}"
          solar_sufficient_next_day: "{{ solar_sufficient }}"
          price_today_ref: "{{ p_today_ref }}"
          price_tomorrow_ref: "{{ p_tomorrow_ref }}"
          spread_tomorrow_pct: "{{ spread_tomorrow }}"
          average_charge_price: "{{ p_chosen_avg }}"
          estimated_cost: "{{ cost }}"
          planned_slots: >
            {%- set ns = namespace(l=[]) -%}
            {%- for x in chosen -%}
              {%- set ns.l = ns.l + [{'start': x.s | timestamp_custom('%H:%M', true), 'end': x.e | timestamp_custom('%H:%M', true), 'price': x.v}] -%}
            {%- endfor -%}
            {{ ns.l }}
          # Charge blocks today: adjacent slots with duration, kWh and average price
          # (a running block: running = true, minutes and kWh only what is still to come)
          charge_blocks: >
            {%- set ns = namespace(l=[]) -%}
            {%- for b in blocks_today -%}
              {%- set ns.l = ns.l + [{'day': 'tomorrow' if (b.s | timestamp_custom('%Y-%m-%d', true)) != (now_ts | timestamp_custom('%Y-%m-%d', true)) else 'today', 'start': b.s | timestamp_custom('%H:%M', true), 'end': b.e | timestamp_custom('%H:%M', true), 'minutes': ((b.e - [b.s, now_ts] | max) / 60) | round(0) | int, 'running': b.s <= now_ts, 'kwh': b.kwh | round(2), 'price': (b.sum / b.n) | round(3)}] -%}
            {%- endfor -%}
            {{ ns.l }}
          # --- Plain-language explanation of the plan (for the dashboard) ---
          plan_explanation: >
            {%- macro at(ts) -%}{{ ('tomorrow ' if (ts | timestamp_custom('%Y-%m-%d', true)) != (now_ts | timestamp_custom('%Y-%m-%d', true)) else '') ~ (ts | timestamp_custom('%H:%M', true)) }}{%- endmacro -%}
            {%- macro hm(ts) -%}{{ ts | timestamp_custom('%H:%M', true) }}{%- endmacro -%}
            {%- macro block(b) -%}{{ at(b.s) }}-{{ hm(b.e) }} ({{ ((b.e - b.s) / 60) | round(0) | int }} min, about {{ '%.1f' | format(b.kwh) }} kWh, average €{{ '%.3f' | format(b.sum / b.n) }}){%- endmacro -%}
            {%- set threshold = c_charge_stop_kwh if this.state == 'Charge' else c_charge_start_kwh -%}
            {%- set empty = s_now <= 0.05 -%}
            {%- set tomorrow_line -%}{%- if tomorrow_known and tomorrow_blocks | length > 0 %} Estimate: charge {{ block(tomorrow_blocks | first) }}{% if tomorrow_blocks | length > 1 %} and {{ tomorrow_blocks | length - 1 }} more charge block(s), about {{ '%.1f' | format(tomorrow_grid_charge) }} kWh in total{% endif %}. This is planned for real after midnight.{%- elif tomorrow_known %} Grid charging is not expected to pay off tomorrow.{%- endif -%}{%- endset -%}
            {%- if not prices_ok -%}No prices available, nothing is planned.
            {%- elif grid_total_ac < threshold -%}No grid charging needed: battery and expected solar are enough until {{ at(t_end_ts) }}.{{ tomorrow_line }}
            {%- elif chosen | length == 0 and pd_grid_dropped | int > 0 -%}No grid charging: the battery needs room for the solar surplus at the negative feed-in price (see below).
            {%- elif chosen | length == 0 -%}
              {%- if empty -%}The battery is empty. The house now takes power directly from the grid{% if gap_slots | length > 0 %}, until {{ at(t_gap_end_ts) }} at most €{{ '%.3f' | format(gap_slots | map(attribute='v') | max) }}{% endif %}. Before that there is no charge moment left that is cheaper than buying directly after {{ ((1 - eff_rt) * 100) | round(0) | int }}% charge and discharge loss.
              {%- elif smart_hold and not pd_discharge_now -%}The battery ({{ '%.1f' | format(s_now) }} kWh) does not last until {{ at(t_gap_end_ts) }} and there is no charge moment left. It is therefore saved for the most expensive quarters (€{{ '%.3f' | format(sh_threshold) }} and up); until then the house buys directly at €{{ '%.3f' | format(price_now) }}. Charging from the grid does not pay off now.
              {%- elif dip_hold_plan and not pd_active -%}The battery ({{ '%.1f' | format(s_now) }} kWh) is saved during cheap dips, because buying directly is cheaper there; it only supplies power in more expensive quarter hours and is expected to be empty around {{ at(t_empty_show_ts) }}. Grid charging does not pay off now: no slot is cheaper after loss than the purchase it would replace.
              {%- else -%}The battery ({{ '%.1f' | format(s_now) }} kWh) supplies power until about {{ at(t_empty_show_ts) }}. Grid charging does not pay off now: no slot is cheaper after loss than the purchase it would replace.
              {%- endif -%}
              {%- if not tomorrow_known %} Tomorrow's prices arrive around 14:00, then the plan is recalculated.
              {%- else -%}{{ tomorrow_line }}
              {%- endif -%}
            {%- else -%}
              {%- set first = blocks_today | first -%}
              {%- if slot_now -%}Charging from the grid now until {{ hm(first.e) }}, about {{ '%.1f' | format(first.kwh) }} kWh to go{% if price_now < 999 %} (€{{ '%.3f' | format(price_now) }}){% endif %}.
              {%- else -%}Next charge moment: {{ block(first) }}.{%- endif %}
              {%- if blocks_today | length > 1 %} Then {{ blocks_today | length - 1 }} more charge block(s).{% endif %} About {{ '%.1f' | format(planned_ac) }} kWh in total for €{{ '%.2f' | format(cost) }}{% if extra_slots | length > 0 %}, so the expensive quarter hours until {{ at(t_gap_end_ts) }} (average €{{ '%.3f' | format(p_gap_avg) }}) are supplied by the battery{% endif %}.
              {%- if empty and not slot_now %} Until then the house takes power directly from the grid.{% endif -%}
            {%- endif -%}
            {%- if pd_active %} Pre-discharge: {{ at(pd_window.s) }}-{{ hm(pd_window.e) }} the feed-in price is negative, with about {{ '%.1f' | format(pd_window.kwh) }} kWh solar surplus.
              {%- if pd_threshold is number %} The battery supplies for this mainly in the quarter hours from €{{ '%.3f' | format(pd_threshold) }}{% else %} The battery supplies for this in all quarter hours{% endif %}
              {%- if chosen | selectattr('s', 'lt', pd_window.s) | list | length > 0 %}; the planned grid charging before it fits within the room.
              {%- elif pd_grid_dropped | int > 0 %} and is not charged from the grid until then ({{ pd_grid_dropped }} charge slot(s) dropped).
              {%- else %}.{% endif -%}
              {%- if pd_sim.e > pd_target_dc + 0.05 %} Even then there is probably not room for everything; the inverter limit catches the rest.{% endif -%}
            {%- endif -%}
          # --- Path check (does the battery last until energy comes in again?) ---
          pathcheck_battery_empty_at: "{{ (t_empty_show_ts | timestamp_custom('%Y-%m-%d %H:%M', true)) if t_empty_show_ts < now_ts + 172800 else none }}"
          pathcheck_solar_covers_from: "{{ t_cover_ts | timestamp_custom('%Y-%m-%d %H:%M', true) }}"
          pathcheck_solar_source: "{{ cover_source }}"
          pathcheck_gap_end: "{{ t_gap_end_ts | timestamp_custom('%Y-%m-%d %H:%M', true) }}"
          pathcheck_horizon: "{{ path_horizon_source }}"
          pathcheck_beyond_night: "{{ path_ahead }}"
          pathcheck_over_day: "{{ path_day }}"
          pathcheck_solar_covers_tomorrow_from: "{{ (t_cover_tomorrow_ts | timestamp_custom('%Y-%m-%d %H:%M', true)) if t_cover_tomorrow_ts > 0 else none }}"
          pathcheck_gap_hours: "{{ gap_hours }}"
          pathcheck_solar_in_gap_kwh: "{{ gap_solar_direct }}"
          pathcheck_shortfall_kwh: "{{ gap_shortfall_ac }}"
          pathcheck_shortfall_expensive_slots_kwh: "{{ gap_valuable_ac }}"
          pathcheck_gap_price: "{{ p_gap_avg }}"
          pathcheck_grid_charge_kwh: "{{ path_grid_ac }}"
          pathcheck_extra_slots: "{{ extra_slots | length }}"
          pathcheck_dip_hold: "{{ dip_hold_plan }}"
          # For the "Shortfall until the sun" line: first and last charge slot for it, and the room kept free for the sun
          pathcheck_charge_from: "{{ ((extra_slots | map(attribute='s') | min) | timestamp_custom('%Y-%m-%d %H:%M', true)) if extra_slots | length > 0 else none }}"
          pathcheck_charge_until: "{{ ((extra_slots | map(attribute='e') | max) | timestamp_custom('%Y-%m-%d %H:%M', true)) if extra_slots | length > 0 else none }}"
          pathcheck_solar_room_kwh: "{{ solar_dc if path_day else 0 }}"
          # --- Dip and charge power ---
          price_now: "{{ price_now if price_now < 999 else none }}"
          dip_threshold: "{{ dip_threshold }}"
          in_dip: "{{ in_dip }}"
          hold_discharge: "{{ hold_discharge }}"
          smart_hold: "{{ smart_hold }}"
          between_charge_hold: "{{ between_charge_hold }}"
          hold_threshold_price: "{{ sh_threshold }}"
          # --- Pre-discharge for a negative feed-in price ---
          pre_discharge: "{{ pd_active }}"
          pre_discharge_now: "{{ pd_discharge_now }}"
          pre_discharge_window_start: "{{ (pd_window.s | timestamp_custom('%Y-%m-%d %H:%M', true)) if pd_window is mapping else none }}"
          pre_discharge_window_end: "{{ (pd_window.e | timestamp_custom('%Y-%m-%d %H:%M', true)) if pd_window is mapping else none }}"
          pre_discharge_solar_surplus_kwh: "{{ pd_window.kwh if pd_window is mapping else 0 }}"
          pre_discharge_solar_credit_pct: "{{ (pd_credit * 100) | round(0) | int }}"
          pre_discharge_target_kwh: "{{ pd_target_dc if pd_window is mapping else none }}"
          pre_discharge_expected_kwh: "{{ pd_sim.e if pd_window is mapping else none }}"
          pre_discharge_price_limit: "{{ pd_threshold }}"
          pre_discharge_grid_dropped: "{{ pd_grid_dropped }}"
          charge_power_used_kw: "{{ p_max_kw | round(2) }}"
          charge_power_measured_w: "{{ p_measured_w if p_measured_w >= c_charge_min_w else none }}"
          charge_power_set_kw: "{{ p_set_kw }}"
          efficiency_round_trip_pct: "{{ (eff_rt * 100) | round(1) }}"
          # --- Inputs as used ---
          solar_remaining_today_kwh: "{{ solar_rest }}"
          solar_tomorrow_kwh: "{{ solar_tomorrow }}"
          solar_remaining_today_sensor_ok: "{{ solar_rest_raw >= 0 }}"
          solar_tomorrow_sensor_ok: "{{ solar_tomorrow_raw >= 0 }}"
          reliability_pct: "{{ (reliab * 100) | round(0) }}"
          reliability_source: "{{ reliab_source }}"
          calibration_status: "{{ cal_status }}"
          calibration_days: "{{ cal_days | int if cal_days >= 0 else none }}"
          calibration_threshold: "{{ cal_threshold | int }}"
          calibration_extra_kwh: "{{ cal_extra_ac }}"
          self_consumption_pct: "{{ direct_rest_pct if solar_rest > 0 else direct_tomorrow_pct }}"
          self_consumption_today_pct: "{{ direct_rest_pct }}"
          self_consumption_tomorrow_pct: "{{ direct_tomorrow_pct }}"
          direct_usage_day_kwh: "{{ direct_day_kwh if direct_day_kwh >= 0 else none }}"
          self_consumption_source: "{{ self_consumption_source }}"
          self_consumption_calculated_pct: "{{ self_consumption_calculated if self_consumption_calculated >= 0 else none }}"
          usage_day_kwh: "{{ usage_day }}"
          usage_source: "{{ usage_source }}"
          usage_per_hour_source: "{{ usage_source_hour }}"
          usage_per_quarter_source: "{{ usage_source_quarter }}"
          shape_quarter_share_pct: "{{ shape_share }}"
          usage_next_24h_kwh: "{{ (hour_load[:24] | map(attribute='kw') | sum) | round(2) }}"
          history_days: "{{ hist_days }}"
          history_7_days: "{{ {'prod7': prod7, 'imp7': imp7, 'exp7': exp7, 'exp_solar7': exp_solar7, 'charge7': charge7, 'discharge7': discharge7, 'charge_solar7': charge_solar7, 'ev7': ev7, 'ev_solar7': ev_solar7, 'hvac7': hvac7, 'hvac_solar7': hvac_solar7} }}"
          history_7_days_previous_value: "{{ hist_7_missing }}"
          margin_pct: "{{ margin_pct }}"
          margin_kwh: "{{ margin_dc }}"
          efficiency_charge_pct: "{{ (eff_in * 100) | round(1) }}"
          efficiency_source: "{{ efficiency_source }}"
          efficiency_discharge_pct: "{{ (eff_out * 100) | round(1) }}"
          # --- Tomorrow ---
          tomorrow_solar_direct_kwh: "{{ tomorrow_direct }}"
          tomorrow_battery_usage_kwh: "{{ tomorrow_battery_usage }}"
          tomorrow_solar_to_battery_kwh: "{{ tomorrow_solar_dc }}"
          tomorrow_grid_charge_estimate_kwh: "{{ tomorrow_grid_charge }}"
          tomorrow_grid_charge_balance_kwh: "{{ tomorrow_grid_charge_balance }}"
          tomorrow_from_battery_kwh: "{{ tomorrow_from_battery }}"
          tomorrow_direct_grid_kwh: "{{ tomorrow_direct_grid }}"
          tomorrow_expensive_quarters_kwh: "{{ (tomorrow_expensive | map(attribute='kwh') | sum) | round(2) }}"
          tomorrow_cheapest_start: >
            {% if tomorrow_known %}{{ t_cheap_tomorrow_ts | timestamp_custom('%H:%M', true) }}{% else %}unknown{% endif %}
          # Indicative charging moments tomorrow, adjacent slots merged (duration, kWh, average price per block)
          tomorrow_charge_moments: >
            {%- set uit = namespace(l=[]) -%}
            {%- for b in tomorrow_blocks -%}
              {%- set uit.l = uit.l + [{'start': b.s | timestamp_custom('%H:%M', true), 'end': b.e | timestamp_custom('%H:%M', true), 'minutes': ((b.e - b.s) / 60) | round(0) | int, 'kwh': b.kwh | round(2), 'price': (b.sum / b.n) | round(3)}] -%}
            {%- endfor -%}
            {{ uit.l }}

      # Chart data is in a separate sensor object: together the attributes exceed
      # the 16 kB recorder limit, and this way the history of the plan itself is kept.
      # Tip: exclude this object from the recorder (recorder: exclude: entities).
      - name: "Zendure Forecast Chart"
        unique_id: zendure_forecast_chart
        icon: mdi:chart-bar
        state: "{{ prices_today | length }}"
        attributes:
          # Forecast per price slot: t (start, unix), price, known (0 = today's pattern),
          # charge (1 = planned grid charge), solar_kw, usage_kw, battery_kw (+ charge / - discharge),
          # soc_pct (state of charge at the end of the slot), grid_kw (+ import / - export)
          timeline: "{{ timeline }}"
          # Same structure as sensor.dynamic_lowest_price_period (raw_today / raw_tomorrow)
          raw_today: >
            {%- set chosen_s = chosen | map(attribute='s') | list -%}
            [
            {%- for p in prices_today -%}
              {%- set s = as_timestamp(p.start) -%}
              {"start": "{{ p.start }}", "end": "{{ p.end }}", "value": {{ p.value }},
               "goedkoop": "{{ 'Yes' if s in chosen_s else 'No' }}", "duur": "No"}{{ ',' if not loop.last }}
            {%- endfor -%}
            ]
          raw_tomorrow: >
            {%- set chosen_s = chosen | map(attribute='s') | list -%}
            [
            {%- for p in prices_tomorrow -%}
              {%- set s = as_timestamp(p.start) -%}
              {"start": "{{ p.start }}", "end": "{{ p.end }}", "value": {{ p.value }},
               "goedkoop": "{{ 'Yes' if s in tomorrow_charge_slots or s in chosen_s else 'No' }}", "duur": "No"}{{ ',' if not loop.last }}
            {%- endfor -%}
            ]

      # --- Derived sensors (with unit) for dashboard and history ---
      - name: "Forecast Solar Remaining Today"
        unique_id: forecast_solar_remaining_today
        unit_of_measurement: "kWh"
        device_class: energy
        icon: mdi:solar-power-variant
        availability: "{{ solar_rest_raw >= 0 }}"
        state: "{{ solar_rest_raw | round(2) }}"
        attributes:
          after_reliability_kwh: "{{ solar_rest }}"

      - name: "Forecast Solar Tomorrow"
        unique_id: forecast_solar_tomorrow
        unit_of_measurement: "kWh"
        device_class: energy
        icon: mdi:solar-power-variant-outline
        availability: "{{ solar_tomorrow_raw >= 0 }}"
        state: "{{ solar_tomorrow_raw | round(2) }}"
        attributes:
          after_reliability_kwh: "{{ solar_tomorrow }}"

      - name: "Forecast Solar Self Consumption"
        unique_id: forecast_solar_self_consumption
        unit_of_measurement: "%"
        icon: mdi:home-lightning-bolt
        state: "{{ direct_tomorrow_pct if solar_tomorrow > 0 else self_consumption_pct }}"
        attributes:
          source: "{{ self_consumption_source }}"
          direct_usage_day_kwh: "{{ direct_day_kwh if direct_day_kwh >= 0 else none }}"
          today_pct: "{{ direct_rest_pct }}"
          average_7_days_pct: "{{ self_consumption_calculated if self_consumption_calculated >= 0 else none }}"
          history_days: "{{ hist_days }}"

      - name: "Forecast Charge Margin"
        unique_id: forecast_charge_margin
        unit_of_measurement: "kWh"
        device_class: energy
        icon: mdi:battery-plus-variant
        state: "{{ margin_dc }}"
        attributes:
          percentage: "{{ margin_pct }}"

      - name: "Forecast Average Usage Per Day"
        unique_id: forecast_average_usage_per_day
        unit_of_measurement: "kWh"
        device_class: energy
        icon: mdi:home-lightning-bolt-outline
        state: "{{ usage_day }}"
        attributes:
          source: "{{ usage_source }}"

      - name: "Forecast Grid Charge Today"
        unique_id: forecast_grid_charge_today
        unit_of_measurement: "kWh"
        device_class: energy
        icon: mdi:transmission-tower-import
        state: "{{ grid_total_ac }}"

      - name: "Forecast Expected Battery Usage"
        unique_id: forecast_expected_battery_usage
        unit_of_measurement: "kWh"
        device_class: energy
        icon: mdi:battery-arrow-down
        state: "{{ need_bridge_ac }}"

      - name: "Forecast Expected Solar To Battery"
        unique_id: forecast_expected_solar_to_battery
        unit_of_measurement: "kWh"
        device_class: energy
        icon: mdi:battery-arrow-up
        state: "{{ solar_dc }}"

# ---------------------------------------------------------------------
# 5. Reset usage data (button in Forecasting Configuration (Basic))
#    The usage profile resets itself via the same button (see 3b). This automation clears
#    the stored history of the counters the 7-day statistics are based on and reloads those
#    statistics: solar production, grid, battery, average usage and self-consumption then
#    start over (the planner first uses the start values). The counters themselves keep
#    running; the savings (zendure_savings_global.yaml) keep their own totals and are kept.
#    Forecast Measured Charge Power is kept as well.
# ---------------------------------------------------------------------
automation:
  # Smart hold is on by default: a new input_boolean starts off in HA, and initial: true would
  # reset it on every restart. So turn it on once; after that the user's choice stays.
  - id: forecast_smart_hold_default
    alias: Forecast Smart Hold Default On
    description: >-
      Forecasting 2026.11.5 - Turns Smart hold on once (after installation or upgrade).
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: input_boolean.forecast_setting_smart_hold_set
        to: 'off'
    conditions:
      - condition: state
        entity_id: input_boolean.forecast_setting_smart_hold_set
        state: 'off'
    actions:
      - delay:
          seconds: 5
      - action: input_boolean.turn_on
        target:
          entity_id:
            - input_boolean.forecast_setting_smart_hold
            - input_boolean.forecast_setting_smart_hold_set

  # Clean up input fields with an entity: on a phone autocorrect easily turns them into
  # "Sensor .solcast_..." (capital letter, space). Such a field is then not recognised. This
  # automation converts it to lower case without spaces (also for comma lists).
  - id: forecast_clean_input_fields
    alias: Forecast Clean Input Fields
    description: >-
      Forecasting 2026.11.5 - Converts entered entities to lower case without spaces.
    mode: queued
    max: 5
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id:
          - input_text.forecast_setting_solar_remaining_today_sensor
          - input_text.forecast_setting_solar_tomorrow_sensor
          - input_text.forecast_setting_solar_production_sensor
          - input_text.forecast_setting_grid_import_counter_sensor
          - input_text.forecast_setting_grid_export_counter_sensor
          - input_text.home_energy_setting_meter_sensor
          - input_text.dynamic_setting_nordpool_sensor
          - input_text.dynamic_setting_market_price_sensor
          - input_text.negative_price_inverter_limiter
          - input_text.negative_price_inverter_power_sensor
          - input_text.negative_price_inverter_limiter_secondary
          - input_text.hvac_sensor
          - input_text.hvac_power_sensor
          - input_text.ev_power_sensor
          - input_text.ev_charger_switch
        not_to:
          - unknown
          - unavailable
    conditions: []
    actions:
      - variables:
          velden: >
            {%- set ns = namespace(l=[]) -%}
            {%- for e in ['input_text.forecast_setting_solar_remaining_today_sensor', 'input_text.forecast_setting_solar_tomorrow_sensor', 'input_text.forecast_setting_solar_production_sensor', 'input_text.forecast_setting_grid_import_counter_sensor', 'input_text.forecast_setting_grid_export_counter_sensor', 'input_text.home_energy_setting_meter_sensor', 'input_text.dynamic_setting_nordpool_sensor', 'input_text.dynamic_setting_market_price_sensor', 'input_text.negative_price_inverter_limiter', 'input_text.negative_price_inverter_power_sensor', 'input_text.negative_price_inverter_limiter_secondary', 'input_text.hvac_sensor', 'input_text.hvac_power_sensor', 'input_text.ev_power_sensor', 'input_text.ev_charger_switch'] -%}
              {%- set oud = states(e) -%}
              {%- if oud not in ['unknown', 'unavailable'] -%}
                {%- set nieuw = oud | lower | regex_replace('\\s+', '') -%}
                {%- if nieuw != oud -%}{%- set ns.l = ns.l + [{'e': e, 'oud': oud, 'nieuw': nieuw}] -%}{%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.l }}
      - repeat:
          for_each: "{{ velden }}"
          sequence:
            - action: input_text.set_value
              target:
                entity_id: "{{ repeat.item.e }}"
              data:
                value: "{{ repeat.item.nieuw }}"
            - action: logbook.log
              data:
                name: Zendure Forecasting
                message: "Input field cleaned up: '{{ repeat.item.oud }}' becomes '{{ repeat.item.nieuw }}'"
                entity_id: "{{ repeat.item.e }}"

  # Reliability per month: fill in the measured ratio of the finalised month (for next year)
  - id: forecast_reliability_month_fill
    alias: Forecast Reliability Month Fill
    description: >-
      Forecasting 2026.11.5 - Fills in the measured reliability for a month after it has ended.
    mode: single
    triggers:
      - trigger: state
        entity_id: sensor.forecast_solar_month_measurement
        attribute: finalised
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.to_state.attributes.finalised is mapping and (trigger.to_state.attributes.finalised.pct | int(0)) > 0
             and not is_state('input_boolean.forecast_setting_reliability_no_auto_fill', 'on') }}
    actions:
      - variables:
          a: "{{ trigger.to_state.attributes.finalised }}"
          field: "input_number.forecast_setting_solar_reliability_{{ ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'][(a.month[5:7] | int) - 1] }}"
      - action: input_number.set_value
        target:
          entity_id: "{{ field }}"
        data:
          value: "{{ a.pct }}"
      - action: logbook.log
        data:
          name: Zendure Forecasting
          message: "Reliability {{ a.month }} filled in: {{ a.pct }}% ({{ a.actual_kwh }} kWh solar, {{ a.forecast_kwh }} kWh forecast, {{ a.days }} days)"
          entity_id: "{{ field }}"

  - id: forecast_reset_usage_data
    alias: Forecast Reset Usage Data
    description: >-
      Forecasting 2026.11.3 - Clears the 7-day history (solar, grid, battery and the car if
      zendure_ev_global.yaml is loaded) and reloads the statistics. The usage profile resets
      itself via the same button.
    mode: single
    triggers:
      - trigger: state
        entity_id: input_button.forecast_reset_usage_data
        not_from:
          - unknown
          - unavailable
    conditions: []
    actions:
      - variables:
          counters: >
            {{ ['sensor.forecast_counter_solar_production', 'sensor.forecast_counter_grid_import',
                'sensor.forecast_counter_grid_export', 'sensor.forecast_counter_grid_export_from_solar',
                'sensor.forecast_counter_zendure_charge', 'sensor.forecast_counter_zendure_discharge',
                'sensor.forecast_counter_zendure_charge_from_solar',
                'sensor.ev_counter_charged', 'sensor.ev_counter_charged_from_solar',
                'sensor.hvac_counter_separate', 'sensor.hvac_counter_separate_from_solar']
               | select('in', states.sensor | map(attribute='entity_id') | list) | list }}
      - action: recorder.purge_entities
        target:
          entity_id: "{{ counters }}"
        data:
          keep_days: 0
      # The recorder purges in the background; wait a moment before reloading the statistics
      - delay:
          seconds: 15
      - action: statistics.reload
      - action: input_button.press
        target:
          entity_id: input_button.forecast_recalculate
      - action: logbook.log
        data:
          name: Zendure Forecasting
          message: Usage data reset (usage profile and 7-day history)
          entity_id: input_button.forecast_reset_usage_data
